<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Quest</title>
<meta name="description" content="Digital Quest – Schaltungen bauen, messen, verstehen.">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap">
<style>/* Digital Quest – Stil. Token-Namen wie SCL Quest; Leitfarbe Bernstein (--accent-lead). */
:root {
  --bg-primary: #121212; --bg-secondary: #1a1a1a; --bg-tertiary: #1e1e1e; --bg-panel: #1c1c1c; --bg-editor: #0c0d0a;
  --text-primary: #e0e0e0; --text-dim: #8a8a8a; --text-faint: #5a5a5a; --line: #2c2c2c;
  --accent-lead: #ffb000; --accent-lead-dim: #8a6000;
  --accent-green: #39ff14; --accent-cyan: #1ec8e0; --accent-orange: #ff8c00; --accent-red: #ff3333; --accent-blue: #5b9bff;
  --wire: #d9a441; --sym: #d8d8d8;
  --font-ui: 'Inter', -apple-system, 'Segoe UI', sans-serif; --font-code: 'Fira Code', 'Consolas', 'Courier New', monospace;
  --radius: 8px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg-primary: #eef0e8; --bg-secondary: #ffffff; --bg-tertiary: #e7e9e0; --bg-panel: #ffffff;
  --text-primary: #1f2219; --text-dim: #51564a; --text-faint: #83887a; --line: #d4d6cc;
  --accent-lead: #a86a00; --accent-green: #1d7f08; --accent-cyan: #07788c; --accent-orange: #b35f00; --accent-red: #c41d1d;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font: 15px/1.5 var(--font-ui); }
button, input, select { font: inherit; color: inherit; }
code, kbd, .lcd, .mono { font-family: var(--font-code); }
kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
.dim { color: var(--text-dim); } .small { font-size: 13px; } .tiny { font-size: 11px; }

/* Kopfzeile */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: linear-gradient(#0a0a0a, #141414); border-bottom: 1px solid #2a2a2a; }
:root[data-theme="light"] .top { background: #1b1d17; }
.brand { font-weight: 800; letter-spacing: 3px; color: #eee; display: flex; align-items: center; gap: 10px; }
.brand b { color: var(--accent-lead); font-weight: 800; }
.brand svg { width: 26px; height: 26px; stroke: var(--accent-lead); fill: none; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(255,176,0,.6)); }
.top nav { display: flex; gap: 4px; margin-left: auto; }
.top nav button { background: none; border: 1px solid transparent; color: #bbb; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.top nav button.active, .top nav button:hover { border-color: #333; color: var(--accent-lead); background: #1c1c1c; }
#saveInd { font-size: 12px; color: #777; min-width: 90px; text-align: right; } #saveInd.ok { color: var(--accent-green); } #saveInd.err { color: var(--accent-red); }

.screen { display: none; } .screen.active { display: block; }
.btn { background: var(--bg-tertiary); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; cursor: pointer; display: inline-block; }
.btn:hover { border-color: var(--accent-lead); }
.btn.primary { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); font-weight: 700; }
.btn.danger { border-color: var(--accent-red); color: var(--accent-red); }
.btn.small { padding: 4px 10px; font-size: 13px; } .btn.big { width: 100%; padding: 12px; font-size: 16px; margin-top: 12px; }

/* Karte */
#scr-map { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; }
.map-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.map-head h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
.progress { display: flex; align-items: center; gap: 10px; font-family: var(--font-code); }
.progress .bar { width: 220px; height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent-lead); box-shadow: 0 0 10px var(--accent-lead); }
.chapter { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
.chapter header h2 { margin: 2px 0 4px; } .chapter header p { margin: 0 0 12px; color: var(--text-dim); }
.chno { font-family: var(--font-code); color: var(--accent-lead); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.node { text-align: left; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; }
.node .ic { grid-row: span 2; } .node svg { width: 24px; height: 24px; fill: none; stroke: var(--accent-lead); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.node .nid { font-size: 11px; color: var(--text-dim); font-family: var(--font-code); } .node .nt { font-weight: 600; font-size: 14px; }
.node:hover:not(:disabled) { border-color: var(--accent-lead); box-shadow: 0 0 0 1px var(--accent-lead-dim); }
.node.done svg { stroke: var(--accent-green); } .node.locked { opacity: .45; cursor: not-allowed; } .node.locked svg { stroke: var(--text-faint); }
.node.theory { border-style: dashed; } .node.boss { border-color: var(--accent-red); }

/* Aufgabe */
#scr-task.active { display: grid; grid-template-columns: 320px 1fr 280px; gap: 12px; padding: 12px; min-height: calc(100vh - 56px); }
.panel { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; }
.crumb { font-family: var(--font-code); font-size: 12px; color: var(--accent-lead); letter-spacing: 1px; }
#taskInfo h2 { margin: 4px 0 8px; }
.story { font-style: italic; color: var(--text-dim); border-left: 3px solid var(--accent-lead-dim); padding-left: 10px; }
.brief { margin: 10px 0; } .learn { background: var(--bg-tertiary); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.hints { display: flex; gap: 6px; margin: 10px 0 6px; } .hint { background: rgba(255,176,0,.08); border: 1px solid var(--accent-lead-dim); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 14px; }
.protocol { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.protocol h3, .panel h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin: 6px 0 8px; }
.protocol label, .fld { display: grid; grid-template-columns: 1fr 100px 26px; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 14px; }
.protocol input, .fld input, .fld select { background: var(--bg-editor); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-family: var(--font-code); color: #f0f0f0; width: 100%; }
:root[data-theme="light"] .fld input, :root[data-theme="light"] .protocol input, :root[data-theme="light"] .fld select { background: #fff; color: #111; }
.fld input.bad { border-color: var(--accent-red); } .fld em, .protocol em { font-style: normal; color: var(--text-dim); font-family: var(--font-code); }
.fld input[type=range] { grid-column: span 2; }
.res { list-style: none; padding: 0; margin: 12px 0; font-size: 14px; } .res li { padding: 3px 0; } .res .ok { color: var(--accent-green); } .res .bad { color: var(--accent-red); }
.st { padding: 6px 10px; border-radius: 6px; margin: 4px 0; font-size: 13px; }
.st.ok { color: var(--accent-green); background: rgba(57,255,20,.06); } .st.err { color: #ff8080; background: rgba(255,51,51,.10); border: 1px solid rgba(255,51,51,.35); } .st.info { color: var(--accent-cyan); background: rgba(30,200,224,.08); }

.center { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
#palette { display: flex; gap: 6px; flex-wrap: wrap; }
.palbtn { display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px 3px 4px; cursor: pointer; font-size: 13px; }
.palbtn:hover { border-color: var(--accent-lead); } .palbtn svg { width: 38px; height: 38px; }
.palbtn .sym { stroke-width: 4; }
.toolbar .sep { flex: 1; } .tb { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.tb:hover, .tb.on { border-color: var(--accent-lead); color: var(--accent-lead); }
.boardwrap { background: var(--bg-editor); border: 1px solid #262626; border-radius: 12px; overflow: hidden; flex: 1; min-height: 380px; }
#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; }
/* Werkbank (bench.js) – feste Laborfarben, unabhaengig vom Thema */
#bench { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; background: #1b1612; }
#board.off, #bench.off { display: none; }
.bblock { fill: url(#bBlock); stroke: rgba(0,0,0,.45); stroke-width: 1.5; } .bbevel { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.2; }
.bpart { cursor: grab; } .bsel { fill: none; stroke: #ffb000; stroke-width: 2.5; stroke-dasharray: 7 5; }
.blead { fill: none; stroke: #b9b9b9; stroke-width: 2.6; stroke-linecap: round; }
.bprint { font: 700 12px var(--font-code); fill: #2b2b2b; text-anchor: middle; pointer-events: none; } .bprint.red { fill: #c62828; } .bprint.dark { fill: #222; font-size: 11px; }
.bbig { font: 800 22px var(--font-ui); fill: #fff; text-anchor: middle; pointer-events: none; }
.bchip { font: 600 11px var(--font-code); fill: #cfcfcf; text-anchor: middle; pointer-events: none; }
.blbl { font: 600 13px var(--font-code); fill: #e8f0ec; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px; pointer-events: none; }
.bpart.locked .blbl { fill: #9fe0b8; }
.bwirehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.bwire.pending { fill: none; stroke: #ffb000; stroke-width: 5; stroke-dasharray: 8 6; stroke-linecap: round; opacity: .85; pointer-events: none; }
.bpinhit { fill: transparent; cursor: crosshair; }
.bpin { fill: none; stroke: transparent; stroke-width: 3; pointer-events: none; }
[data-pin]:hover .bpin { stroke: #ffb000; } .bpin.active { stroke: #ffb000; stroke-width: 4; filter: drop-shadow(0 0 4px #ffb000); }
.bprobe { pointer-events: none; }
.bvlabel { font: 600 12px var(--font-code); fill: #7fe6ff; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: 3px; pointer-events: none; }
.blcd { font: 700 10px var(--font-code); fill: #1d2416; text-anchor: middle; pointer-events: none; }
.bsmoke path { fill: none; stroke: rgba(200,200,200,.55); stroke-width: 4; stroke-linecap: round; pointer-events: none; animation: bsmoke 1.6s ease-in-out infinite; }
.bsmoke path + path { animation-delay: .8s; }
@keyframes bsmoke { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px); } }
#statusbar { min-height: 36px; }

/* Schaltplan-Symbole (Arbeitsflaeche bleibt immer dunkel) */
.griddot { fill: #2b2d27; }
.sym { fill: none; stroke: var(--sym); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sym.fillsym { fill: var(--sym); } .sym.thin { stroke-width: 1.5; } .sym.thick { stroke-width: 4; } .sym.thick2 { stroke-width: 7; }
.sym.lever { stroke: var(--accent-lead); stroke-width: 3; } .sym.ledbody { stroke: var(--sym); }
.symtxt { fill: var(--sym); font: 700 16px var(--font-code); text-anchor: middle; } .plus { fill: var(--accent-red); font: 700 16px var(--font-code); }
.lbl { fill: #9aa; font: 600 12px var(--font-code); text-anchor: middle; } .val { fill: var(--accent-lead); font: 12px var(--font-code); text-anchor: middle; }
.hit { fill: transparent; stroke: none; } .part { cursor: grab; } .part.selected .sym { stroke: var(--accent-lead); } .part.selected .hit { fill: rgba(255,176,0,.05); stroke: rgba(255,176,0,.4); stroke-dasharray: 4 4; }
.part.locked .lbl { fill: #6c8; }
.wire { fill: none; stroke: var(--wire); stroke-width: 2.6; stroke-linejoin: round; pointer-events: none; }
.wire.selected { stroke: var(--accent-cyan); stroke-width: 4; } .wire.pending { stroke-dasharray: 6 5; opacity: .8; }
.wirehit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.pin { fill: #111; stroke: #9a9a9a; stroke-width: 1.5; } .pin.used { fill: var(--wire); stroke: var(--wire); } .pin.active { fill: var(--accent-lead); stroke: #fff; }
.pinhit { fill: transparent; cursor: crosshair; } [data-pin]:hover .pin { stroke: var(--accent-lead); stroke-width: 3; }
.vlabel { fill: var(--accent-cyan); font: 11px var(--font-code); pointer-events: none; }
.burnt { stroke: var(--accent-red); stroke-width: 3.5; fill: none; }
.lamp-on { fill: var(--accent-green); filter: drop-shadow(0 0 4px var(--accent-green)); } .lamp-off { fill: #333; }
.probe path { stroke-width: 3; fill: none; } .probe text { font: 700 11px var(--font-code); text-anchor: middle; fill: #fff; pointer-events: none; }
.probe-red path { stroke: #ff3b30; } .probe-red circle { fill: #ff3b30; } .probe-black path { stroke: #bbb; } .probe-black circle { fill: #222; stroke: #bbb; }

/* Messgeraete */
.meter { background: linear-gradient(#2b2a22, #1e1d17); border: 2px solid #3a3625; border-radius: 14px; padding: 10px; margin-bottom: 12px; }
.lcd { background: #9fb28a; color: #1b2413; font-size: 28px; font-weight: 700; text-align: right; padding: 6px 10px; border-radius: 6px; box-shadow: inset 0 2px 6px rgba(0,0,0,.4); min-height: 48px; letter-spacing: 1px; }
.mm-modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 8px 0; }
.mm-modes button { background: #111; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 5px 0; cursor: pointer; font-family: var(--font-code); }
.mm-modes button.on { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); }
#mmProbes { display: flex; justify-content: space-between; font-family: var(--font-code); font-size: 12px; } .pr.red { color: #ff6b61; } .pr.black { color: #bbb; }
#mmHelp { font-size: 12px; color: #aaa; margin: 4px 0 0; } #mmWarn { color: #ff8080; font-size: 12px; }
#inspector { margin-bottom: 12px; } .insp-head { margin-bottom: 8px; } .tag { font-size: 11px; background: #234; color: #8cf; padding: 1px 6px; border-radius: 4px; }
.readout { display: grid; grid-template-columns: 24px 1fr; font-family: var(--font-code); font-size: 13px; margin: 8px 0 2px; } .readout dt { color: var(--text-dim); } .readout dd { margin: 0; } .err { color: var(--accent-red); }
.scopebox canvas { width: 100%; height: 150px; border-radius: 8px; border: 1px solid #333; display: block; }
.scope-ctl { display: flex; gap: 6px; margin: 6px 0; } .scope-ctl select { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 6px; }
#scopeInfo { font-size: 11px; color: var(--text-dim); font-family: var(--font-code); }

/* Theorie / Handbuch / Einstellungen */
.theory, .settings { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
.lesson { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin: 12px 0 16px; }
.formula { font-family: var(--font-code); font-size: 22px; text-align: center; color: var(--accent-lead); padding: 10px; }
.q { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; padding: 10px 14px; background: var(--bg-secondary); }
.q legend { font-weight: 600; padding: 0 6px; } .q label { display: block; padding: 3px 0; cursor: pointer; }
.q.ok { border-color: var(--accent-green); } .q.bad { border-color: var(--accent-red); } .expl { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.manual { display: grid; grid-template-columns: 220px 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 24px 18px; }
.manual nav { display: flex; flex-direction: column; gap: 4px; } .manual nav button { text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.manual nav button.on { border-color: var(--accent-lead); color: var(--accent-lead); } .manual article { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.settings section { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
.settings .fld { grid-template-columns: 140px 1fr; }

/* Modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modal.open { display: flex; } .modal-box { background: var(--bg-secondary); border: 1px solid var(--accent-lead-dim); border-radius: 14px; padding: 20px 24px; max-width: 460px; width: 100%; box-shadow: 0 0 40px rgba(255,176,0,.15); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; } .win { color: var(--accent-lead); margin-top: 0; }

/* Handy / Tablet */
@media (max-width: 1100px) { #scr-task.active { grid-template-columns: 1fr 280px; } #taskInfo { grid-column: 1 / -1; } }
@media (max-width: 760px) {
  #scr-task.active { grid-template-columns: 1fr; padding: 8px; } .boardwrap { min-height: 300px; aspect-ratio: 1000 / 620; flex: none; }
  .top { padding: 8px 10px; gap: 8px; } .brand span { display: none; } .top nav button { padding: 6px 8px; font-size: 13px; } #saveInd { display: none; }
  .manual { grid-template-columns: 1fr; } .progress .bar { width: 140px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 2-6h8"/></svg><span>DIGITAL<b>QUEST</b></span></div>
  <nav><button data-go="map">Karte</button><button data-go="manual">Handbuch</button><button data-go="settings">Einstellungen</button></nav>
  <span id="saveInd"></span>
</header>
<main>
  <section id="scr-map" class="screen"></section>
  <section id="scr-task" class="screen">
    <aside class="panel" id="taskInfo"></aside>
    <div class="center">
      <div class="toolbar">
        <div id="palette"></div><span class="sep"></span>
        <button class="tb" id="btnRot" title="Drehen (R)">⟳ Drehen</button>
        <button class="tb" id="btnDel" title="Loeschen (Entf)">✕ Loeschen</button>
        <button class="tb" id="btnFit" title="Ansicht einpassen">⤢ Einpassen</button>
        <button class="tb" id="btnVolt" title="Knotenspannungen einfaerben">U anzeigen</button>
        <button class="tb" id="btnRepair" title="Defekte Bauteile ersetzen">Reparieren</button>
        <button class="tb" id="btnReset" title="Startzustand">Neu</button>
      </div>
      <div class="boardwrap"><svg id="board" tabindex="0" aria-label="Schaltplan"></svg><svg id="bench" class="off" tabindex="0" aria-label="Werkbank"></svg></div>
      <div id="statusbar"></div>
    </div>
    <aside class="panel">
      <h3>Multimeter</h3>
      <div class="meter">
        <div class="lcd" id="lcd">OFF</div>
        <div class="mm-modes"><button data-mm="OFF">OFF</button><button data-mm="V">V⎓</button><button data-mm="A">A⎓</button><button data-mm="R">Ω</button></div>
        <div id="mmProbes"></div><p id="mmHelp"></p><p id="mmWarn"></p>
        <button class="btn small" id="btnFuse" hidden>Sicherung ersetzen</button>
      </div>
      <h3>Eigenschaften</h3>
      <div id="inspector"></div>
      <h3>Oszilloskop</h3>
      <div class="scopebox">
        <canvas id="scope"></canvas>
        <div class="scope-ctl"><select id="tb"><option value="0.01">10 ms</option><option value="0.1">100 ms</option><option value="1" selected>1 s</option><option value="5">5 s</option></select><button class="btn small" id="btnScope">Aufnahme</button></div>
        <div id="scopeInfo">Kanal = Messspitzen des Multimeters. Aufnahme startet beim Einschalten.</div>
      </div>
    </aside>
  </section>
  <section id="scr-theory" class="screen"></section>
  <section id="scr-manual" class="screen"></section>
  <section id="scr-settings" class="screen"></section>
</main>
<div id="modal"></div>
<script>/* ==== engine.js ==== */
/* Digital Quest – Schaltungs-Engine (window.DQEngine)
 * Knotenanalyse (Nodal Analysis) mit Norton-Ersatz fuer alle Quellen, stueckweise-lineare
 * Dioden/LEDs, Logikgatter (5-V-Logik, implizite Versorgung), Kondensator (Backward Euler),
 * Multimeter (V, A, Ohm) mit realistischen Fehlbedienungen.
 * Einheiten: V, A, Ohm, F, s, Hz. Kein DOM – laeuft in Node und im Browser.
 */
(function (root) {
  'use strict';

  var GMIN = 1e-9;            // Leitwert jedes Knotens gegen Masse (verhindert singulaere Matrix)
  var G_OPEN = 1e-12;         // offener Schalter, gesperrte Diode, Gattereingang
  var G_CLOSED = 1e3;         // geschlossener Schalter (1 mOhm)
  var LOGIC = { vcc: 5, vth: 2.5, rout: 25 };
  var METER = { rV: 1e7, rA: 0.1, fuseA: 10, iOhm: 1e-3, olOhm: 40e6 };

  var LED_COLORS = {
    rot: { vf: 1.8, rgb: '#ff3b30' }, gelb: { vf: 2.0, rgb: '#ffd60a' },
    gruen: { vf: 2.1, rgb: '#32d74b' }, blau: { vf: 3.0, rgb: '#0a84ff' }, weiss: { vf: 3.1, rgb: '#f5f5f7' }
  };

  /* Bauteilkatalog: Pins, Standardwerte, Namenspraefix. Geometrie liegt im Editor. */
  var PARTS = {
    ground:    { label: 'Masse', prefix: 'GND', pins: ['g'], props: {} },
    battery:   { label: 'Spannungsquelle', prefix: 'B', pins: ['p', 'n'], props: { value: 9, ri: 0.05, imax: 3 }, unit: 'V' },
    resistor:  { label: 'Widerstand', prefix: 'R', pins: ['a', 'b'], props: { value: 1000, pmax: 0.25 }, unit: 'Ω' },
    pot:       { label: 'Potentiometer', prefix: 'P', pins: ['a', 'w', 'b'], props: { value: 10000, pos: 0.5, pmax: 0.25 }, unit: 'Ω' },
    lamp:      { label: 'Lampe', prefix: 'H', pins: ['a', 'b'], props: { value: 60, pnom: 1.35 }, unit: 'Ω' },
    switch:    { label: 'Schalter', prefix: 'S', pins: ['a', 'b'], props: { closed: false } },
    button:    { label: 'Taster', prefix: 'T', pins: ['a', 'b'], props: { closed: false } },
    led:       { label: 'LED', prefix: 'D', pins: ['a', 'k'], props: { color: 'rot', rs: 10, imax: 0.03, inom: 0.02 } },
    diode:     { label: 'Diode', prefix: 'V', pins: ['a', 'k'], props: { vf: 0.7, rs: 1, imax: 1 } },
    capacitor: { label: 'Kondensator', prefix: 'C', pins: ['a', 'b'], props: { value: 100e-6 }, unit: 'F' },
    ammeter:   { label: 'Strommesser', prefix: 'A', pins: ['a', 'b'], props: {} },
    clock:     { label: 'Taktgeber', prefix: 'CLK', pins: ['out'], props: { freq: 1 }, unit: 'Hz' },
    not:  { label: 'NICHT', prefix: 'U', pins: ['in', 'out'], props: {}, logic: function (i) { return !i[0]; } },
    and:  { label: 'UND', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] && i[1]; } },
    or:   { label: 'ODER', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] || i[1]; } },
    nand: { label: 'NAND', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return !(i[0] && i[1]); } },
    nor:  { label: 'NOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return !(i[0] || i[1]); } },
    xor:  { label: 'XOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] !== i[1]; } }
  };
  var SOURCES = { battery: 1, clock: 1 };

  function def(type) { var d = PARTS[type]; if (!d) throw new Error('Unbekanntes Bauteil: ' + type); return d; }
  function props(p) { var o = {}, d = def(p.type).props, k; for (k in d) o[k] = d[k]; for (k in (p.props || {})) o[k] = p.props[k]; if (p.value !== undefined) o.value = p.value; return o; }

  /* ---------- Netzliste aus Editor-Layout ----------
   * layout = { parts:[{id,type,value?,props?,x,y,rot}], wires:[{from:'R1.a', to:'B1.p'}] } */
  function buildNetlist(layout, extra) {
    var parent = {};
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function add(x) { if (parent[x] === undefined) parent[x] = x; }
    function union(a, b) { add(a); add(b); var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
    var parts = [], byId = {};
    (layout.parts || []).forEach(function (p) {
      var d = def(p.type);
      if (byId[p.id]) throw new Error('Doppelte Bauteil-ID: ' + p.id);
      d.pins.forEach(function (pin) { add(p.id + '.' + pin); });
      var q = { id: p.id, type: p.type, props: props(p), n: {} };
      parts.push(q); byId[p.id] = q;
    });
    var wires = (layout.wires || []).concat(extra || []);
    wires.forEach(function (w) {
      [w.from, w.to].forEach(function (pid) { if (parent[pid] === undefined) throw new Error('Unbekannter Anschluss: ' + pid); });
      union(w.from, w.to);
    });
    var groundRoots = {}, autoGround = false;
    parts.forEach(function (p) { if (p.type === 'ground') groundRoots[find(p.id + '.g')] = true; });
    if (!Object.keys(groundRoots).length) { // ohne Masse-Symbol: Minuspol der ersten Quelle ist Bezugspunkt 0 V
      var src = parts.filter(function (p) { return p.type === 'battery'; })[0];
      if (src) { groundRoots[find(src.id + '.n')] = true; autoGround = true; }
    }
    var names = {}, count = 0, pinNode = {};
    Object.keys(parent).forEach(function (pid) {
      var r = find(pid);
      if (!names[r]) names[r] = groundRoots[r] ? '0' : 'N' + (++count);
      pinNode[pid] = names[r];
    });
    parts.forEach(function (p) { def(p.type).pins.forEach(function (pin) { p.n[pin] = pinNode[p.id + '.' + pin]; }); });
    var nodes = [];
    Object.keys(names).forEach(function (r) { if (names[r] !== '0') nodes.push(names[r]); });
    nodes.sort(function (a, b) { return +a.slice(1) - +b.slice(1); });
    return { parts: parts, byId: byId, nodes: nodes, pinNode: pinNode, hasGround: Object.keys(groundRoots).length > 0 && !autoGround, autoGround: autoGround };
  }

  /* ---------- Lineares Gleichungssystem (Gauss mit Pivotsuche) ---------- */
  function solveLinear(A, z) {
    var n = z.length, i, j, k;
    for (i = 0; i < n; i++) {
      var max = i;
      for (k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[max][i])) max = k;
      if (Math.abs(A[max][i]) < 1e-18) return null;
      var t = A[i]; A[i] = A[max]; A[max] = t; var tz = z[i]; z[i] = z[max]; z[max] = tz;
      for (k = i + 1; k < n; k++) {
        var f = A[k][i] / A[i][i]; if (f === 0) continue;
        for (j = i; j < n; j++) A[k][j] -= f * A[i][j];
        z[k] -= f * z[i];
      }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) { var s = z[i]; for (j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / A[i][i]; }
    return x;
  }

  function newState() { return { burnt: {}, vC: {}, logic: {}, diode: {}, fuse: false, t: 0 }; }

  /* ---------- Loeser fuer einen Arbeitspunkt / Zeitschritt ----------
   * opts: { state, dt (null = Gleichstrom-Arbeitspunkt), t, meter:{mode,a,b} (Knoten), zeroSources, inject:{a,b,i} } */
  function solve(net, opts) {
    opts = opts || {};
    var st = opts.state || newState();
    var idx = {}; net.nodes.forEach(function (n, i) { idx[n] = i; });
    var N = net.nodes.length;
    var dt = opts.dt || null, t = opts.t || 0;
    var diode = {}, logic = {};
    net.parts.forEach(function (p) {
      if (p.type === 'led' || p.type === 'diode') diode[p.id] = !!st.diode[p.id];
      if (def(p.type).logic) logic[p.id] = st.logic[p.id] !== undefined ? st.logic[p.id] : false;
    });
    var V = null, iter = 0, converged = false, oscillating = false;

    function build() {
      var A = [], z = [], i;
      for (i = 0; i < N; i++) { A.push(new Float64Array(N)); z.push(0); A[i][i] += GMIN; }
      function G(a, b, g) {
        var ia = idx[a], ib = idx[b];
        if (ia !== undefined) A[ia][ia] += g;
        if (ib !== undefined) A[ib][ib] += g;
        if (ia !== undefined && ib !== undefined) { A[ia][ib] -= g; A[ib][ia] -= g; }
      }
      function I(a, b, cur) { // Strom cur wird in Knoten a eingespeist und aus b entnommen
        if (idx[a] !== undefined) z[idx[a]] += cur;
        if (idx[b] !== undefined) z[idx[b]] -= cur;
      }
      function norton(p, n, v, r) { var g = 1 / r; G(p, n, g); I(p, n, v * g); }
      net.parts.forEach(function (p) {
        var q = p.props, n = p.n;
        if (st.burnt[p.id]) { return; }
        switch (p.type) {
          case 'resistor': G(n.a, n.b, 1 / Math.max(q.value, 1e-3)); break;
          case 'lamp': G(n.a, n.b, 1 / Math.max(q.value, 1e-3)); break;
          case 'pot': G(n.a, n.w, 1 / Math.max(q.value * q.pos, 1e-3)); G(n.w, n.b, 1 / Math.max(q.value * (1 - q.pos), 1e-3)); break;
          case 'switch': case 'button': G(n.a, n.b, q.closed ? G_CLOSED : G_OPEN); break;
          case 'ammeter': G(n.a, n.b, 1 / METER.rA); break;
          case 'battery': norton(n.p, n.n, opts.zeroSources ? 0 : q.value, q.ri); break;
          case 'led': case 'diode':
            var vf = p.type === 'led' ? LED_COLORS[q.color].vf : q.vf;
            if (diode[p.id]) norton(n.a, n.k, vf, q.rs); else G(n.a, n.k, G_OPEN);
            break;
          case 'capacitor':
            if (dt) { var gc = q.value / dt; G(n.a, n.b, gc); I(n.a, n.b, gc * (st.vC[p.id] || 0)); }
            else G(n.a, n.b, G_OPEN);
            break;
          case 'clock':
            var high = opts.zeroSources ? false : (Math.floor(t * q.freq * 2) % 2 === 0);
            norton(n.out, '0', high ? LOGIC.vcc : 0, LOGIC.rout);
            break;
          default:
            if (def(p.type).logic) {
              def(p.type).pins.forEach(function (pin) { if (pin !== 'out') G(n[pin], '0', G_OPEN); });
              norton(n.out, '0', (logic[p.id] && !opts.zeroSources) ? LOGIC.vcc : 0, LOGIC.rout);
            }
        }
      });
      if (opts.meter) {
        var m = opts.meter;
        if (m.mode === 'V') G(m.a, m.b, 1 / METER.rV);
        if (m.mode === 'A' && !st.fuse) G(m.a, m.b, 1 / METER.rA);
      }
      if (opts.inject) I(opts.inject.a, opts.inject.b, opts.inject.i);
      return { A: A, z: z };
    }
    function volt(node) { return node === '0' || idx[node] === undefined ? 0 : V[idx[node]]; }

    for (iter = 0; iter < 400; iter++) {
      var sys = build();
      var x = solveLinear(sys.A, sys.z);
      if (!x) throw new Error('Gleichungssystem nicht loesbar');
      V = x;
      var changed = false;
      net.parts.forEach(function (p) {
        if (st.burnt[p.id] || diode[p.id] === undefined) return;
        var q = p.props, vf = p.type === 'led' ? LED_COLORS[q.color].vf : q.vf;
        var vak = volt(p.n.a) - volt(p.n.k);
        if (!diode[p.id] && vak > vf + 1e-9) { diode[p.id] = true; changed = true; }
        else if (diode[p.id] && vak < vf - 1e-9) { diode[p.id] = false; changed = true; }
      });
      if (changed) continue;
      // Gatter einzeln nachfuehren (Gauss-Seidel) – stabil fuer Speicherschaltungen
      var gateChanged = false;
      for (var gi = 0; gi < net.parts.length && !gateChanged; gi++) {
        var g = net.parts[gi], d = def(g.type);
        if (!d.logic || st.burnt[g.id]) continue;
        var ins = d.pins.filter(function (pin) { return pin !== 'out'; }).map(function (pin) { return volt(g.n[pin]) > LOGIC.vth; });
        var out = !!d.logic(ins);
        if (out !== logic[g.id]) { logic[g.id] = out; gateChanged = true; }
      }
      if (!gateChanged) { converged = true; break; }
    }
    if (!converged) oscillating = true;

    // ---------- Auswertung ----------
    var nodeV = { '0': 0 }; net.nodes.forEach(function (n) { nodeV[n] = volt(n); });
    var res = { nodeV: nodeV, parts: {}, faults: [], converged: converged, oscillating: oscillating };
    net.parts.forEach(function (p) {
      var q = p.props, n = p.n, r = { burnt: !!st.burnt[p.id] };
      function across(a, b) { return volt(a) - volt(b); }
      switch (p.type) {
        case 'resistor': case 'lamp': r.v = across(n.a, n.b); r.i = r.burnt ? 0 : r.v / Math.max(q.value, 1e-3); r.p = r.v * r.i; break;
        case 'pot': r.v = across(n.a, n.b); r.vw = across(n.w, n.b); r.i = across(n.a, n.w) / Math.max(q.value * q.pos, 1e-3); r.p = Math.abs(r.v * r.i); break;
        case 'switch': case 'button': r.v = across(n.a, n.b); r.i = r.v * (q.closed ? G_CLOSED : G_OPEN); break;
        case 'ammeter': r.v = across(n.a, n.b); r.i = r.v / METER.rA; break;
        case 'battery': r.v = across(n.p, n.n); r.i = r.burnt ? 0 : (q.value - r.v) / q.ri; r.p = r.v * r.i; break;
        case 'led': case 'diode':
          var vf = p.type === 'led' ? LED_COLORS[q.color].vf : q.vf;
          r.v = across(n.a, n.k);
          r.i = (!r.burnt && diode[p.id]) ? (r.v - vf) / q.rs : 0; r.p = r.v * r.i;
          r.on = r.i > 1e-5; // leitend und mehr als 10 uA
          if (p.type === 'led') r.brightness = r.on ? Math.min(1, r.i / q.inom) : 0;
          break;
        case 'capacitor': r.v = across(n.a, n.b); r.i = dt ? q.value / dt * (r.v - (st.vC[p.id] || 0)) : 0; break;
        case 'clock': r.v = volt(n.out); r.high = r.v > LOGIC.vth; break;
        default: if (def(p.type).logic) { r.out = logic[p.id]; r.v = volt(n.out); }
      }
      res.parts[p.id] = r;
    });
    return { res: res, V: nodeV, diode: diode, logic: logic };
  }

  /* Pruefen auf Schaeden, Zustand fortschreiben. Gibt Ergebnis zurueck (wird ggf. mehrfach geloest). */
  function step(net, state, opts) {
    opts = opts || {};
    state = state || newState();
    var out, guard = 0;
    for (;;) {
      out = solve(net, { state: state, dt: opts.dt, t: state.t, meter: opts.meter });
      var newDamage = false, faults = [];
      net.parts.forEach(function (p) {
        var r = out.res.parts[p.id], q = p.props;
        if (state.burnt[p.id]) { if (p.type === 'led') faults.push({ code: 'LED_BURNT', part: p.id }); return; }
        if (p.type === 'led' && r.i > q.imax) { state.burnt[p.id] = true; newDamage = true; faults.push({ code: 'LED_BURNT', part: p.id, i: r.i }); }
        if (p.type === 'led' && r.v < -5) faults.push({ code: 'LED_REVERSE', part: p.id, v: r.v });
        if (p.type === 'battery' && Math.abs(r.i) > q.imax) faults.push({ code: 'SHORT', part: p.id, i: r.i });
        if ((p.type === 'resistor' || p.type === 'pot') && Math.abs(r.p) > q.pmax) faults.push({ code: 'OVERLOAD', part: p.id, p: r.p });
        if (p.type === 'lamp' && Math.abs(r.p) > q.pnom * 2) { state.burnt[p.id] = true; newDamage = true; faults.push({ code: 'LAMP_BURNT', part: p.id }); }
        if (p.type === 'ammeter' && Math.abs(r.i) > METER.fuseA) faults.push({ code: 'AMMETER_OVERLOAD', part: p.id });
      });
      if (opts.meter && opts.meter.mode === 'A' && !state.fuse) {
        var im = (out.V[opts.meter.a] - out.V[opts.meter.b]) / METER.rA;
        if (Math.abs(im) > METER.fuseA) { state.fuse = true; newDamage = true; }
      }
      if (out.res.oscillating) faults.push({ code: 'UNSTABLE' });
      if (!net.hasGround && !net.autoGround && net.parts.some(function (p) { return def(p.type).logic || p.type === 'clock'; })) faults.push({ code: 'NO_GROUND' });
      out.res.faults = faults;
      if (!newDamage || ++guard > 20) break;
    }
    state.diode = out.diode; state.logic = out.logic;
    if (opts.dt) {
      net.parts.forEach(function (p) { if (p.type === 'capacitor') state.vC[p.id] = out.res.parts[p.id].v; });
      state.t += opts.dt;
    }
    out.res.t = state.t;
    return out.res;
  }

  /* ---------- Multimeter ----------
   * probe: { mode:'V'|'A'|'R', a:'R1.a' (rote Spitze), b:'R1.b' (schwarze Spitze) } */
  function fmt(v, unit) {
    if (!isFinite(v)) return 'OL';
    var a = Math.abs(v), pre = [[1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ']];
    for (var i = 0; i < pre.length; i++) if (a >= pre[i][0] || i === pre.length - 1) {
      var x = v / pre[i][0]; return (Math.abs(x) >= 100 ? x.toFixed(1) : Math.abs(x) >= 10 ? x.toFixed(2) : x.toFixed(3)) + ' ' + pre[i][1] + unit;
    }
  }
  function measure(layout, probe, state) {
    state = state || newState();
    var net = buildNetlist(layout);
    var a = net.pinNode[probe.a], b = net.pinNode[probe.b];
    if (a === undefined || b === undefined) return { ok: false, error: 'Messspitze nicht an einem Anschluss' };
    var mode = probe.mode;
    if (mode === 'V') {
      var r = step(net, state, { meter: { mode: 'V', a: a, b: b } });
      var v = r.nodeV[a] - r.nodeV[b];
      return { ok: true, mode: 'V', value: v, unit: 'V', display: fmt(v, 'V'), res: r };
    }
    if (mode === 'A') {
      var ra = step(net, state, { meter: { mode: 'A', a: a, b: b } });
      if (state.fuse) return { ok: false, mode: 'A', value: NaN, unit: 'A', display: 'FUSE', error: 'Sicherung im Messgeraet durchgebrannt – Strom wird in Reihe gemessen, nie parallel zu einer Quelle!', res: ra };
      var i = (ra.nodeV[a] - ra.nodeV[b]) / METER.rA;
      return { ok: true, mode: 'A', value: i, unit: 'A', display: fmt(i, 'A'), res: ra };
    }
    if (mode === 'R') {
      var live = step(net, state, {});
      var vab = live.nodeV[a] - live.nodeV[b];
      if (Math.abs(vab) > 0.02) return { ok: false, mode: 'R', value: NaN, unit: 'Ω', display: 'Err', error: 'Widerstand nur im spannungsfreien Zustand messen!', res: live };
      var dead = solve(net, { state: { burnt: state.burnt, vC: {}, logic: {}, diode: {} }, zeroSources: true, inject: { a: a, b: b, i: METER.iOhm } });
      var R = (dead.V[a] - dead.V[b]) / METER.iOhm;
      if (R > METER.olOhm) R = Infinity;
      return { ok: true, mode: 'R', value: R, unit: 'Ω', display: fmt(R, 'Ω'), res: live };
    }
    throw new Error('Unbekannter Messbereich: ' + mode);
  }

  /* ---------- Zeitsimulation (Oszilloskop) ----------
   * opts: { dt, tEnd, probes:[{a,b,label}] (Pins), events:[[t, {partId:{prop:value}}]] } */
  function simulate(layout, opts) {
    var lay = clone(layout), state = newState(), dt = opts.dt || 1e-3, tEnd = opts.tEnd || 1;
    var ev = (opts.events || []).slice().sort(function (x, y) { return x[0] - y[0]; }), ei = 0;
    var net = buildNetlist(lay), samples = [];
    // Anfangszustand: Kondensatoren entladen, Gatter aus Gleichstrom-Arbeitspunkt
    step(net, state, {});
    for (var k = 0; state.t <= tEnd + 1e-12; k++) {
      var changed = false;
      while (ei < ev.length && ev[ei][0] <= state.t + 1e-12) { applySet(net, ev[ei][1]); ei++; changed = true; }
      var r = step(net, state, { dt: dt });
      var row = { t: r.t };
      (opts.probes || []).forEach(function (pr, j) {
        row['ch' + j] = r.nodeV[net.pinNode[pr.a]] - (pr.b ? r.nodeV[net.pinNode[pr.b]] : 0);
      });
      row.res = opts.keep ? r : undefined;
      samples.push(row);
      if (k > 200000) break;
    }
    return { samples: samples, state: state };
  }

  function applySet(net, set) {
    Object.keys(set || {}).forEach(function (id) {
      var ps = select(net, id); if (!ps.length) throw new Error('Bauteil fehlt: ' + id);
      ps.forEach(function (p) { Object.keys(set[id]).forEach(function (k) { p.props[k] = set[id][k]; }); });
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- Aufgabenpruefung ----------
   * task.tests: [{ name, set:{S1:{closed:true}}, expect:[...] }]
   * expect-Eintraege:
   *   {sel:'D1'|'@led', on:true}                 LED leuchtet / aus
   *   {sel:'D1', i:[min,max]}                    Strom durch Bauteil
   *   {sel:'R1', v:[min,max]}                    Spannung ueber Bauteil
   *   {a:'B1.p', b:'R1.b', v:[min,max]}          Spannung zwischen zwei Anschluessen
   *   {sel:'U1', out:true}                       Gatterausgang
   *   {noFault:true} / {fault:'SHORT'}           keine Fehler / bestimmter Fehler
   * task.need: {led:1, resistor:1}  Mindestanzahl Bauteile je Typ
   * task.measure: [{id, ask, unit, tol, set?, mode+a+b | truth:{sel,q:'i'|'v'}}] – Messwert, den die lernende Person eintraegt */
  function select(net, sel) {
    if (sel.charAt(0) === '@') return net.parts.filter(function (p) { return p.type === sel.slice(1); });
    return net.byId[sel] ? [net.byId[sel]] : [];
  }
  function inRange(x, r) { return x >= r[0] - 1e-12 && x <= r[1] + 1e-12; }

  function runTask(task, layout, answers) {
    var results = [], allPass = true;
    function push(ok, text, info) { results.push({ ok: ok, text: text, info: info }); if (!ok) allPass = false; }
    var net;
    try { net = buildNetlist(layout); } catch (e) { return { pass: false, results: [{ ok: false, text: e.message }] }; }
    Object.keys(task.need || {}).forEach(function (type) {

    h += '<button class="btn primary big" id="btnCheck">Pruefen</button><div id="results"></div>';
    $('#taskInfo').innerHTML = h;
    $('#hint1').onclick = function () { current.hints = Math.max(current.hints, 1); $('#hintBox').innerHTML = '<div class="hint">' + t.hint + '</div>'; };
    $('#hint2').onclick = function () { current.hints = 2; $('#hintBox').innerHTML = '<div class="hint">' + t.hint + '</div><div class="hint">' + t.hint2 + '</div>'; };
    $$('[data-ans]').forEach(function (inp) { inp.oninput = persistDraft; });
    $('#btnCheck').onclick = check;
    // Bauteil-Palette
    var pal = '';
    t.palette.forEach(function (type) {
      pal += '<button class="palbtn" data-add="' + type + '" title="' + esc(E.PARTS[type].label) + ' hinzufuegen"><svg viewBox="-46 -46 92 92"><g>' + Editor.symbol({ type: type, props: {} }) + '</g></svg><span>' + esc(E.PARTS[type].label) + '</span></button>';
    });
    $('#palette').innerHTML = pal || '<span class="dim small">Keine neuen Bauteile – nur messen.</span>';
    $$('[data-add]').forEach(function (b) { b.onclick = function () { view().addPart(b.dataset.add); renderInspector(); }; });
    void ch;
  }

  function answers() { var a = {}; $$('[data-ans]').forEach(function (i) { a[i.dataset.ans] = i.value; }); return a; }
  function persistDraft() {
    if (!current.task || !ed) return;
    S.drafts[current.task.id] = { layout: ed.layout, answers: answers(), t: Date.now() }; save();
  }

  function rebuild() {
    try { live.net = E.buildNetlist(ed.layout); live.err = null; }
    catch (e) { live.net = null; live.err = e.message; }
    live.dynamic = !!live.net && live.net.parts.some(function (p) { return p.type === 'capacitor' || p.type === 'clock'; });
    tick(0);
    if (live.dynamic) startLoop(); else stopLoop();
  }
  function startLoop() {
    if (live.raf) return;
    live.last = performance.now();
    var f = function (now) {
      var dt = Math.min(0.05, (now - live.last) / 1000); live.last = now;
      tick(dt); live.raf = requestAnimationFrame(f);
    };
    live.raf = requestAnimationFrame(f);
  }
  function stopLoop() { if (live.raf) cancelAnimationFrame(live.raf); live.raf = 0; }

  function meterNodes() {
    if (!live.net || !meter.a || !meter.b) return null;
    var a = live.net.pinNode[meter.a], b = live.net.pinNode[meter.b];
    return a === undefined || b === undefined ? null : { a: a, b: b };
  }
  function tick(dt) {
    if (!live.net) { setSim(null); status([{ cls: 'err', text: live.err }]); return; }
    var mn = meterNodes(), mopt = mn && (meter.mode === 'V' || meter.mode === 'A') ? { mode: meter.mode, a: mn.a, b: mn.b } : null;
    var r = E.step(live.net, live.state, { dt: live.dynamic && dt > 0 ? dt : null, meter: mopt });
    live.res = r;
    setSim({ res: r, pinNode: live.net.pinNode });
    updateMeter(r, mn);
    status(diagnose(r.faults));
  }

  function setSim(sim) { ed.setSim(sim); bench.setSim(sim); }
  function view() { return viewMode === 'bench' ? bench : ed; }
  /* Darstellung wechseln – Schaltung, Auswahl und Messspitzen bleiben (gemeinsamer Kern) */
  function setView(mode) {
    viewMode = mode === 'bench' ? 'bench' : 'schema';
    if (!core) return;
    core.space = viewMode; core.wireStart = null;
    $('#board').classList.toggle('off', viewMode !== 'schema'); $('#bench').classList.toggle('off', viewMode !== 'bench');
    view().fit();
  }

  var FAULT_TEXT = {
    SHORT: function (f) { return 'Kurzschluss an ' + f.part + ': Die Quelle liefert ' + E.fmt(Math.abs(f.i), 'A') + '. Plus und Minus sind ohne Verbraucher verbunden.'; },
    LED_BURNT: function (f) { return 'LED ' + f.part + ' ist durchgebrannt – der Strom war zu gross. Vorwiderstand pruefen, dann „Reparieren“.'; },
    LED_REVERSE: function (f) { return 'LED ' + f.part + ' liegt mit ' + E.fmt(Math.abs(f.v), 'V') + ' in Sperrrichtung – LEDs vertragen nur ca. 5 V Sperrspannung.'; },
    OVERLOAD: function (f) { return 'Widerstand ' + f.part + ' ist ueberlastet (' + E.fmt(Math.abs(f.p), 'W') + ') – er wird heiss.'; },
    LAMP_BURNT: function (f) { return 'Lampe ' + f.part + ' ist durchgebrannt – Ueberspannung.'; },
    AMMETER_OVERLOAD: function (f) { return 'Strommesser ' + f.part + ' misst mehr als 10 A – falsch angeschlossen?'; },
    UNSTABLE: function () { return 'Die Logikschaltung kommt nicht zur Ruhe – sie schwingt.'; },
    NO_GROUND: function () { return 'Logikbausteine und Taktgeber brauchen eine Masse-Verbindung (⏚).'; }
  };
  function diagnose(faults) { return (faults || []).map(function (f) { return { cls: 'err', text: (FAULT_TEXT[f.code] || function () { return f.code; })(f) }; }); }
  function status(items) {
    var el = $('#statusbar'); if (!el) return;
    el.innerHTML = items && items.length ? items.map(function (i) { return '<div class="st ' + i.cls + '">' + esc(i.text) + '</div>'; }).join('')
      : '<div class="st ok">Schaltung laeuft – keine Stoerung.</div>';
  }

  /* ---------- Multimeter ---------- */
  function setMeterMode(mode) {
    meter.mode = mode;
    $$('[data-mm]').forEach(function (b) { b.classList.toggle('on', b.dataset.mm === mode); });
    if (ed) { ed.tool = mode === 'OFF' ? 'wire' : 'probe'; if (mode === 'OFF') { ed.probes = { a: null, b: null }; meter.a = meter.b = null; meter.next = 'a'; } core.redraw(); }
    $('#mmHelp').textContent = mode === 'OFF' ? 'Messgeraet aus. Klick auf Anschluesse verbindet Leitungen.' :
      'Klick auf einen Anschluss setzt die ' + (meter.next === 'a' ? 'rote (+)' : 'schwarze (COM)') + ' Messspitze.';
    if (ed) tick(0);
  }
  function setProbe(pin) {
    meter[meter.next] = pin; ed.probes[meter.next] = pin;
    meter.next = meter.next === 'a' ? 'b' : 'a';
    $('#mmHelp').textContent = 'Naechster Klick setzt die ' + (meter.next === 'a' ? 'rote (+)' : 'schwarze (COM)') + ' Spitze.';
    log('probe', { id: current.task && current.task.id, mode: meter.mode, pin: pin });
    tick(0);
  }
  function updateMeter(r, mn) {
    var lcd = $('#lcd'), txt = '— — —', warn = '';
    if (meter.mode === 'OFF') txt = 'OFF';
    else if (!mn) txt = meter.mode === 'R' ? '0L Ω' : '- - -';
    else if (meter.mode === 'V') txt = E.fmt(r.nodeV[mn.a] - r.nodeV[mn.b], 'V');
    else if (meter.mode === 'A') {
      if (live.state.fuse) { txt = 'FUSE'; warn = 'Sicherung durchgebrannt! Strom misst man in Reihe, nie parallel zu einer Quelle.'; }
      else txt = E.fmt((r.nodeV[mn.a] - r.nodeV[mn.b]) / E.METER.rA, 'A');
    } else if (meter.mode === 'R') {
      var m = E.measure(ed.layout, { mode: 'R', a: meter.a, b: meter.b }, live.state);
      txt = m.ok ? m.display.replace('OL', '0L') : 'Err'; warn = m.ok ? '' : m.error;
    }
    lcd.textContent = txt;
    $('#mmWarn').textContent = warn; $('#btnFuse').hidden = !live.state.fuse;
    $('#mmProbes').innerHTML = '<span class="pr red">+ ' + esc(meter.a || '–') + '</span><span class="pr black">COM ' + esc(meter.b || '–') + '</span>';
  }

  /* ---------- Eigenschaften ---------- */
  function renderInspector() {
    var el = $('#inspector'); if (!ed) return;
    var p = ed.sel && ed.sel.indexOf('w:') !== 0 ? ed.part(ed.sel) : null;
    if (!p) { el.innerHTML = '<p class="dim small">Bauteil anklicken, um Werte zu aendern. <kbd>R</kbd> dreht, <kbd>Entf</kbd> loescht.</p>'; return; }
    var d = E.PARTS[p.type], q = p.props || (p.props = {}), lock = ed.locked[p.id], val = p.value !== undefined ? p.value : (q.value !== undefined ? q.value : d.props.value);
    var r = live.res && live.res.parts[p.id];
    var h = '<div class="insp-head"><b>' + esc(p.id) + '</b> ' + esc(d.label) + (lock ? ' <span class="tag">Aufgabe</span>' : '') + '</div>';
    function field(label, key, v, unit) { return '<label class="fld"><span>' + label + '</span><input data-prop="' + key + '" value="' + esc(v) + '"' + (lock ? ' disabled' : '') + '><em>' + unit + '</em></label>'; }
    if (p.type === 'battery') h += field('Spannung', 'value', Editor.fmtVal(val), 'V');
    if (p.type === 'resistor' || p.type === 'lamp' || p.type === 'pot') h += field('Widerstand', 'value', Editor.fmtVal(val), 'Ω');
    if (p.type === 'capacitor') h += field('Kapazitaet', 'value', Editor.fmtVal(val), 'F');
    if (p.type === 'clock') h += field('Frequenz', 'freq', q.freq || d.props.freq, 'Hz');
    if (p.type === 'pot') h += '<label class="fld"><span>Schleifer</span><input type="range" min="0" max="1" step="0.01" data-prop="pos" value="' + (q.pos !== undefined ? q.pos : 0.5) + '"></label>';
    if (p.type === 'led') {
      h += '<label class="fld"><span>Farbe</span><select data-prop="color"' + (lock ? ' disabled' : '') + '>' + Object.keys(E.LED_COLORS).map(function (c) { return '<option' + ((q.color || 'rot') === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>';
    }
    if (p.type === 'switch') h += '<button class="btn small" id="tgl">' + (q.closed ? 'Oeffnen' : 'Schliessen') + '</button>';
    if (r) {
      h += '<dl class="readout">';
      if (r.v !== undefined) h += '<dt>U</dt><dd>' + E.fmt(Math.abs(r.v), 'V') + '</dd>';
      if (r.i !== undefined) h += '<dt>I</dt><dd>' + E.fmt(Math.abs(r.i), 'A') + '</dd>';
      if (r.p !== undefined) h += '<dt>P</dt><dd>' + E.fmt(Math.abs(r.p), 'W') + '</dd>';
      if (r.burnt) h += '<dt>!</dt><dd class="err">defekt</dd>';
      h += '</dl><p class="dim tiny">Direktanzeige der Simulation – im Protokoll zaehlt, was du mit dem Messgeraet misst.</p>';
    }
    el.innerHTML = h;
    $$('[data-prop]', el).forEach(function (inp) {
      inp.onchange = inp.oninput = function (ev) {
        var k = inp.dataset.prop, v = inp.value;
        if (k === 'value' || k === 'freq') { var n = parseVal(v); if (!(n > 0)) { inp.classList.add('bad'); return; } inp.classList.remove('bad'); if (ev.type !== 'change') return; v = n; if (k === 'value') { p.value = n; delete q.value; } else q[k] = n; }
        else if (k === 'pos') q.pos = +v; else q[k] = v;
        persistDraft(); rebuild(); core.redraw(); if (k !== 'pos') renderInspector();
      };
    });
    var tg = $('#tgl'); if (tg) tg.onclick = function () { q.closed = !q.closed; persistDraft(); rebuild(); renderInspector(); };
  }

  /* ---------- Oszilloskop ---------- */
  function scope() {
    var cv = $('#scope'), ctx = cv.getContext('2d'), T = +$('#tb').value;
    var w = cv.width = cv.clientWidth * (window.devicePixelRatio || 1), h = cv.height = cv.clientHeight * (window.devicePixelRatio || 1);
    ctx.fillStyle = '#07090a'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,176,0,0.12)'; ctx.lineWidth = 1;
    for (var i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(w * i / 10, 0); ctx.lineTo(w * i / 10, h); ctx.stroke(); }
    for (i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, h * i / 8); ctx.lineTo(w, h * i / 8); ctx.stroke(); }
    if (!meter.a) { $('#scopeInfo').textContent = 'Setze zuerst die rote Messspitze (Multimeter V).'; return; }
    var s;
    try { s = E.simulate(ed.layout, { dt: T / 400, tEnd: T, probes: [{ a: meter.a, b: meter.b || undefined }] }).samples; }
    catch (e) { $('#scopeInfo').textContent = e.message; return; }
    var vs = s.map(function (x) { return x.ch0; }), mx = Math.max.apply(null, vs), mn = Math.min.apply(null, vs);
    var top = Math.max(1, Math.ceil(Math.max(mx, 0) * 1.1)), bot = Math.min(0, Math.floor(mn * 1.1));
    ctx.strokeStyle = '#ffb000'; ctx.lineWidth = 2 * (window.devicePixelRatio || 1); ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 6; ctx.beginPath();
    s.forEach(function (x, k) { var px = x.t / T * w, py = h - (x.ch0 - bot) / (top - bot) * h; if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.stroke(); ctx.shadowBlur = 0;
    $('#scopeInfo').textContent = 'Kanal: ' + meter.a + ' gegen ' + (meter.b || 'Masse') + ' · ' + bot + '…' + top + ' V · max ' + E.fmt(mx, 'V') + ' · min ' + E.fmt(mn, 'V');
    log('scope', { id: current.task && current.task.id, T: T });
  }

  /* ---------- Pruefen ---------- */
  function check() {
    var t = current.task; current.tries++;
    var ans = answers(), r = E.runTask(t, ed.layout, ans);
    var h = '<ul class="res">' + r.results.map(function (x) {
      var extra = '';
      if (!x.ok && x.info && typeof x.info.got === 'number') extra = ' <span class="dim">(ist: ' + E.fmt(Math.abs(x.info.got), '') + ')</span>';
      return '<li class="' + (x.ok ? 'ok' : 'bad') + '">' + (x.ok ? '✔' : '✘') + ' ' + esc(x.text) + extra + '</li>';
    }).join('') + '</ul>';
    var an = E.analyze(ed.layout); if (an.faults.length) h += diagnose(an.faults).map(function (d) { return '<div class="st err">' + esc(d.text) + '</div>'; }).join('');
    $('#results').innerHTML = h;
    log(r.pass ? 'task_done' : 'task_try', { id: t.id, tries: current.tries, hints: current.hints, dur: Math.round((Date.now() - current.started) / 1000), tags: t.tags });
    if (r.pass) {
      var first = !S.done[t.id]; S.done[t.id] = true; save();
      var nx = nextOf(t.id);
      modal('<h2 class="win">Geschafft!</h2><p>' + t.take + '</p>' + (first ? '' : '<p class="dim">(bereits geloest)</p>'),
        [{ label: 'Zur Karte', action: function () { renderMap(); show('map'); } }].concat(nx ? [{ label: 'Weiter', primary: true, action: function () { openItem(nx); } }] : []));
    }
  }

  /* ================= Theorie ================= */
  function openTheory(th) {
    show('theory'); current.theory = th; current.started = Date.now();
    var h = '<div class="theory"><div class="crumb">Kapitel ' + th.ch + ' · Theorie ' + th.id.slice(1) + '</div><h2>' + esc(th.title) + '</h2><article class="lesson">' + th.lesson + '</article>' +
      '<button class="btn primary" id="toQuiz">Verstanden – zum Check</button><div id="quiz"></div></div>';
    $('#scr-theory').innerHTML = h;
    $('#toQuiz').onclick = function () { this.hidden = true; renderQuiz(th); };
    log('theory_open', { id: th.id });
  }
  function renderQuiz(th) {
    var h = '<h3>Check – ' + Math.round(th.pass * 100) + ' % zum Bestehen</h3>';
    th.questions.forEach(function (q, i) {
      h += '<fieldset class="q" data-q="' + i + '"><legend>' + (i + 1) + '. ' + q.q + '</legend>' +
        q.options.map(function (o, j) { return '<label><input type="radio" name="q' + i + '" value="' + j + '"> ' + o + '</label>'; }).join('') + '<div class="expl"></div></fieldset>';
    });
    h += '<button class="btn primary" id="evalQuiz">Auswerten</button><div id="quizRes"></div>';
    $('#quiz').innerHTML = h;
    $('#evalQuiz').onclick = function () {
      var right = 0;
      th.questions.forEach(function (q, i) {
        var sel = $('input[name="q' + i + '"]:checked'), fs = $('[data-q="' + i + '"]'), ok = sel && +sel.value === q.correct;
        if (ok) right++;
        fs.className = 'q ' + (ok ? 'ok' : 'bad'); $('.expl', fs).innerHTML = (ok ? '✔ ' : '✘ ') + (q.explain || '');
      });
      var score = right / th.questions.length, pass = score >= th.pass - 1e-9;
      S.theory[th.id] = { best: Math.max(score, (S.theory[th.id] || {}).best || 0) };
      log('theory_check', { id: th.id, score: score, pass: pass, dur: Math.round((Date.now() - current.started) / 1000), tags: th.tags });
      if (pass) S.done[th.id] = true; save();
      var nx = nextOf(th.id);
      $('#quizRes').innerHTML = '<div class="st ' + (pass ? 'ok' : 'err') + '">' + right + ' von ' + th.questions.length + ' richtig – ' + (pass ? 'bestanden!' : 'noch nicht bestanden. Lies die Erklaerungen und versuche es erneut.') + '</div>' +
        (pass && nx ? '<button class="btn primary" id="thNext">Weiter</button>' : '<button class="btn" id="thRetry">Nochmals</button>');
      if ($('#thNext')) $('#thNext').onclick = function () { openItem(nx); };
      if ($('#thRetry')) $('#thRetry').onclick = function () { openTheory(th); };
    };
  }

  /* ================= Handbuch ================= */
  function renderManual(pageId) {
    var pages = DQ.manual || [], p = pages.filter(function (x) { return x.id === pageId; })[0] || pages[0];
    $('#scr-manual').innerHTML = '<div class="manual"><nav>' + pages.map(function (x) { return '<button class="' + (x === p ? 'on' : '') + '" data-man="' + x.id + '">' + esc(x.title) + '</button>'; }).join('') +
      '</nav><article>' + (p ? '<h2>' + esc(p.title) + '</h2>' + p.html : '') + '</article></div>';
    $$('[data-man]').forEach(function (b) { b.onclick = function () { renderManual(b.dataset.man); }; });
  }

  /* ================= Einstellungen ================= */
  function renderSettings() {
    var pr = S.profile;
    $('#scr-settings').innerHTML = '<div class="settings"><h2>Einstellungen</h2>' +
      '<section><h3>Darstellung</h3><label class="fld"><span>Thema</span><select id="setTheme"><option value="dark">Dunkel</option><option value="light">Hell</option></select></label></section>' +
      '<section><h3>Profil (lokal)</h3><p class="dim small">Wird spaeter fuer Klassen und die questuebergreifende Auswertung (Buehler Quest) verwendet. Personen-ID: <code>' + esc(pr.id) + '</code></p>' +
      '<label class="fld"><span>Vorname</span><input id="pfV" value="' + esc(pr.vorname) + '"></label><label class="fld"><span>Nachname</span><input id="pfN" value="' + esc(pr.nachname) + '"></label>' +
      '<label class="fld"><span>Pseudonym</span><input id="pfP" value="' + esc(pr.pseudonym) + '"></label></section>' +
      '<section><h3>Spielstand</h3><button class="btn" id="exp">Exportieren</button> <label class="btn">Importieren<input type="file" id="imp" accept=".json" hidden></label> <button class="btn danger" id="rst">Zuruecksetzen</button></section></div>';
    $('#setTheme').value = S.settings.theme;
    $('#setTheme').onchange = function () { S.settings.theme = this.value; applyTheme(); save(); };
    [['#pfV', 'vorname'], ['#pfN', 'nachname'], ['#pfP', 'pseudonym']].forEach(function (x) { $(x[0]).oninput = function () { S.profile[x[1]] = this.value; save(); }; });
    $('#exp').onclick = function () {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
      a.download = 'digitalquest_spielstand.json'; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    };
    $('#imp').onchange = function () {
      var f = this.files[0]; if (!f) return; var rd = new FileReader();
      rd.onload = function () { try { var d = JSON.parse(rd.result); if (!d.profile || !d.done) throw 0; S = d; save(); renderSettings(); modal('<p>Spielstand geladen.</p>'); } catch (e) { modal('<p>Die Datei ist kein gueltiger Spielstand.</p>'); } };
      rd.readAsText(f);
    };
    $('#rst').onclick = function () {
      modal('<h2>Alles zuruecksetzen?</h2><p>Fortschritt und Entwuerfe werden geloescht. Die Personen-ID bleibt.</p>', [{ label: 'Abbrechen' }, { label: 'Zuruecksetzen', primary: true, action: function () { var id = S.profile; S = fresh(); S.profile = id; save(); renderSettings(); } }]);
    };
  }
  function applyTheme() { document.documentElement.dataset.theme = S.settings.theme; }

  /* ================= Start ================= */
  function init() {
    applyTheme();
    $$('[data-go]').forEach(function (b) {
      b.onclick = function () {
        var g = b.dataset.go;
        if (g === 'map') renderMap(); if (g === 'manual') renderManual(); if (g === 'settings') renderSettings();
        show(g);
      };
    });
    $('#btnRot').onclick = function () { view().rotateSelected(); };
    $('#btnFit').onclick = function () { view().fit(); };
    window.addEventListener('resize', function () { if (ed && current.screen === 'task') view().fit(); });
    $('#btnDel').onclick = function () { ed.removeSelected(); renderInspector(); };
    $('#btnVolt').onclick = function () { ed.showVolt = bench.showVolt = !ed.showVolt; this.classList.toggle('on', ed.showVolt); core.redraw(); };
    $('#btnRepair').onclick = function () { live.state = E.newState(); rebuild(); status([{ cls: 'info', text: 'Defekte Bauteile ersetzt.' }]); };
    $('#btnReset').onclick = function () {
      modal('<h2>Aufgabe zuruecksetzen?</h2><p>Deine Schaltung wird auf den Startzustand gesetzt.</p>', [{ label: 'Abbrechen' }, { label: 'Zuruecksetzen', primary: true, action: function () { delete S.drafts[current.task.id]; save(); openTask(current.task); } }]);
    };
    $('#btnFuse').onclick = function () { live.state.fuse = false; tick(0); };
    $$('[data-mm]').forEach(function (b) { b.onclick = function () { setMeterMode(b.dataset.mm); }; });
    $('#btnScope').onclick = scope;
    document.addEventListener('keydown', function (ev) {
      if (current.screen !== 'task' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      ed && ed.key(ev); renderInspector();
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    renderMap(); show('map');
  }

  window.DigitalQuest = { get state() { return S; }, openItem: openItem, get editor() { return ed; }, get bench() { return bench; }, get core() { return core; }, setView: setView, get view() { return viewMode; }, engine: E, parseVal: parseVal };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
