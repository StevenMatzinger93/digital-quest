<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Quest</title>
<meta name="description" content="Digital Quest – Schaltungen bauen, messen, verstehen.">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap">
<style>/* Digital Quest – Stil. Token-Namen wie SCL Quest; Leitfarbe Bernstein (--accent-lead). */
:root {
  --bg-primary: #121212; --bg-secondary: #1a1a1a; --bg-tertiary: #1e1e1e; --bg-panel: #1c1c1c; --bg-editor: #0c0d0a;
  --text-primary: #e0e0e0; --text-dim: #8a8a8a; --text-faint: #5a5a5a; --line: #2c2c2c;
  --accent-lead: #ffb000; --accent-lead-dim: #8a6000;
  --accent-green: #39ff14; --accent-cyan: #1ec8e0; --accent-orange: #ff8c00; --accent-red: #ff3333; --accent-blue: #5b9bff;
  --wire: #d9a441; --sym: #d8d8d8;
  --font-ui: 'Inter', -apple-system, 'Segoe UI', sans-serif; --font-code: 'Fira Code', 'Consolas', 'Courier New', monospace;
  --radius: 8px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg-primary: #eef0e8; --bg-secondary: #ffffff; --bg-tertiary: #e7e9e0; --bg-panel: #ffffff;
  --text-primary: #1f2219; --text-dim: #51564a; --text-faint: #83887a; --line: #d4d6cc;
  --accent-lead: #a86a00; --accent-green: #1d7f08; --accent-cyan: #07788c; --accent-orange: #b35f00; --accent-red: #c41d1d;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font: 15px/1.5 var(--font-ui); }
button, input, select { font: inherit; color: inherit; }
code, kbd, .lcd, .mono { font-family: var(--font-code); }
kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
.dim { color: var(--text-dim); } .small { font-size: 13px; } .tiny { font-size: 11px; }

/* Kopfzeile */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: linear-gradient(#0a0a0a, #141414); border-bottom: 1px solid #2a2a2a; }
:root[data-theme="light"] .top { background: #1b1d17; }
.brand { font-weight: 800; letter-spacing: 3px; color: #eee; display: flex; align-items: center; gap: 10px; }
.brand b { color: var(--accent-lead); font-weight: 800; }
.brand svg { width: 26px; height: 26px; stroke: var(--accent-lead); fill: none; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(255,176,0,.6)); }
.top nav { display: flex; gap: 4px; margin-left: auto; }
.top nav button { background: none; border: 1px solid transparent; color: #bbb; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.top nav button.active, .top nav button:hover { border-color: #333; color: var(--accent-lead); background: #1c1c1c; }
#saveInd { font-size: 12px; color: #777; min-width: 90px; text-align: right; } #saveInd.ok { color: var(--accent-green); } #saveInd.err { color: var(--accent-red); }

.screen { display: none; } .screen.active { display: block; }
.btn { background: var(--bg-tertiary); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; cursor: pointer; display: inline-block; }
.btn:hover { border-color: var(--accent-lead); }
.btn.primary { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); font-weight: 700; }
.btn.danger { border-color: var(--accent-red); color: var(--accent-red); }
.btn.small { padding: 4px 10px; font-size: 13px; } .btn.big { width: 100%; padding: 12px; font-size: 16px; margin-top: 12px; }

/* Karte */
#scr-map { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; }
.map-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
.map-head h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
.progress { display: flex; align-items: center; gap: 10px; font-family: var(--font-code); }
.progress .bar { width: 220px; height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent-lead); box-shadow: 0 0 10px var(--accent-lead); }
.chapter { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
.chapter header h2 { margin: 2px 0 4px; } .chapter header p { margin: 0 0 12px; color: var(--text-dim); }
.chno { font-family: var(--font-code); color: var(--accent-lead); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.node { text-align: left; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; }
.node .ic { grid-row: span 2; } .node svg { width: 24px; height: 24px; fill: none; stroke: var(--accent-lead); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.node .nid { font-size: 11px; color: var(--text-dim); font-family: var(--font-code); } .node .nt { font-weight: 600; font-size: 14px; }
.node:hover:not(:disabled) { border-color: var(--accent-lead); box-shadow: 0 0 0 1px var(--accent-lead-dim); }
.node.done svg { stroke: var(--accent-green); } .node.locked { opacity: .45; cursor: not-allowed; } .node.locked svg { stroke: var(--text-faint); }
.node.theory { border-style: dashed; } .node.boss { border-color: var(--accent-red); }

/* Aufgabe */
#scr-task.active { display: grid; grid-template-columns: 320px 1fr 280px; gap: 12px; padding: 12px; min-height: calc(100vh - 56px); }
.panel { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; }
.crumb { font-family: var(--font-code); font-size: 12px; color: var(--accent-lead); letter-spacing: 1px; }
#taskInfo h2 { margin: 4px 0 8px; }
.story { font-style: italic; color: var(--text-dim); border-left: 3px solid var(--accent-lead-dim); padding-left: 10px; }
.brief { margin: 10px 0; } .learn { background: var(--bg-tertiary); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.hints { display: flex; gap: 6px; margin: 10px 0 6px; } .hint { background: rgba(255,176,0,.08); border: 1px solid var(--accent-lead-dim); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 14px; }
.protocol { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.protocol h3, .panel h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin: 6px 0 8px; }
.protocol label, .fld { display: grid; grid-template-columns: 1fr 100px 26px; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 14px; }
.protocol input, .fld input, .fld select { background: var(--bg-editor); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-family: var(--font-code); color: #f0f0f0; width: 100%; }
:root[data-theme="light"] .fld input, :root[data-theme="light"] .protocol input, :root[data-theme="light"] .fld select { background: #fff; color: #111; }
.fld input.bad { border-color: var(--accent-red); } .fld em, .protocol em { font-style: normal; color: var(--text-dim); font-family: var(--font-code); }
.fld input[type=range] { grid-column: span 2; }
.res { list-style: none; padding: 0; margin: 12px 0; font-size: 14px; } .res li { padding: 3px 0; } .res .ok { color: var(--accent-green); } .res .bad { color: var(--accent-red); }
.st { padding: 6px 10px; border-radius: 6px; margin: 4px 0; font-size: 13px; }
.st.ok { color: var(--accent-green); background: rgba(57,255,20,.06); } .st.err { color: #ff8080; background: rgba(255,51,51,.10); border: 1px solid rgba(255,51,51,.35); } .st.info { color: var(--accent-cyan); background: rgba(30,200,224,.08); }

.center { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
#palette { display: flex; gap: 6px; flex-wrap: wrap; }
.palbtn { display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px 3px 4px; cursor: pointer; font-size: 13px; }
.palbtn:hover { border-color: var(--accent-lead); } .palbtn svg { width: 38px; height: 38px; }
.palbtn .sym { stroke-width: 4; }
.toolbar .sep { flex: 1; } .tb { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.tb:hover, .tb.on { border-color: var(--accent-lead); color: var(--accent-lead); }
.boardwrap { background: var(--bg-editor); border: 1px solid #262626; border-radius: 12px; overflow: hidden; flex: 1; min-height: 380px; }
#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; }
/* Werkbank (bench.js) – feste Laborfarben, unabhaengig vom Thema */
#bench { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; background: #1b1612; }
#board.off, #bench.off { display: none; }
.bblock { fill: url(#bBlock); stroke: rgba(0,0,0,.45); stroke-width: 1.5; } .bbevel { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.2; }
.bpart { cursor: grab; } .bsel { fill: none; stroke: #ffb000; stroke-width: 2.5; stroke-dasharray: 7 5; }
.blead { fill: none; stroke: #9ea3a6; stroke-width: 2.8; stroke-linecap: round; } .bleadhi { fill: none; stroke: rgba(255,255,255,.55); stroke-width: .9; stroke-linecap: round; }
.bprint { font: 700 12px var(--font-code); fill: #2b2b2b; text-anchor: middle; pointer-events: none; } .bprint.red { fill: #c62828; } .bprint.dark { fill: #222; font-size: 11px; }
.bbig { font: 800 22px var(--font-ui); fill: #fff; text-anchor: middle; pointer-events: none; }
.bchip { font: 600 11px var(--font-code); fill: #cfcfcf; text-anchor: middle; pointer-events: none; }
.blbl { font: 600 13px var(--font-code); fill: #e8f0ec; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px; pointer-events: none; }
.bpart.locked .blbl { fill: #9fe0b8; }
.bwirehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.bwire.pending { fill: none; stroke: #ffb000; stroke-width: 5; stroke-dasharray: 8 6; stroke-linecap: round; opacity: .85; pointer-events: none; }
.bpinhit { fill: transparent; cursor: crosshair; }
.bpin { fill: none; stroke: transparent; stroke-width: 3; pointer-events: none; }
[data-pin]:hover .bpin { stroke: #ffb000; } .bpin.active { stroke: #ffb000; stroke-width: 4; filter: drop-shadow(0 0 4px #ffb000); }
.bprobe { pointer-events: none; }
.bgen { font: 700 10px var(--font-code); fill: #39ff14; text-anchor: middle; pointer-events: none; }
.bdev { cursor: default; } .bdevtxt { font: 700 9px var(--font-code); fill: #d8d8d8; text-anchor: middle; pointer-events: none; }
.bmlcd { font: 700 21px var(--font-code); fill: #1b2413; text-anchor: end; pointer-events: none; } .bmsub { font: 700 8px var(--font-code); fill: #2f3a24; pointer-events: none; }
.bdevwarn { font: 800 11px var(--font-ui); fill: #ff5a3c; text-anchor: middle; pointer-events: none; }
.bdial { cursor: pointer; } .bdial text { font: 700 10px var(--font-code); fill: #e0e0e0; text-anchor: middle; pointer-events: none; }
.bdial.on text { fill: #ffb000; } .bdialhit { fill: transparent; } .bdial:hover .bdialhit { fill: rgba(255,176,0,.18); }
.bscgrid { stroke: rgba(57,255,20,.13); stroke-width: 1; } .bsctrace { fill: none; stroke: #ffb000; stroke-width: 2; filter: drop-shadow(0 0 3px #ffb000); }
.bscinfo { font: 8px var(--font-code); fill: #7fd98a; pointer-events: none; }
.bscrun { cursor: pointer; } .bscrun rect { fill: #2e7d32; stroke: #0f3a12; } .bscrun:hover rect { fill: #43a047; } .bscrun text { font: 700 11px var(--font-code); fill: #fff; text-anchor: middle; pointer-events: none; }
/* Touch: groessere Klickflaechen fuer Buchsen/Anschluesse */
@media (pointer: coarse) { .bpinhit { r: 22px; } .pinhit { r: 17px; } .bdialhit { r: 17px; } }
.bvlabel { font: 600 12px var(--font-code); fill: #7fe6ff; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: 3px; pointer-events: none; }
.blcd { font: 700 10px var(--font-code); fill: #1d2416; text-anchor: middle; pointer-events: none; }
.bsmoke path { fill: none; stroke: rgba(200,200,200,.55); stroke-width: 4; stroke-linecap: round; pointer-events: none; animation: bsmoke 1.6s ease-in-out infinite; }
.bsmoke path + path { animation-delay: .8s; }
@keyframes bsmoke { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px); } }
#statusbar { min-height: 36px; }

/* Schaltplan-Symbole (Arbeitsflaeche bleibt immer dunkel) */
.griddot { fill: #2b2d27; }
.sym { fill: none; stroke: var(--sym); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sym.fillsym { fill: var(--sym); } .sym.thin { stroke-width: 1.5; } .sym.thick { stroke-width: 4; } .sym.thick2 { stroke-width: 7; }
.sym.lever { stroke: var(--accent-lead); stroke-width: 3; } .sym.ledbody { stroke: var(--sym); }
.symtxt { fill: var(--sym); font: 700 16px var(--font-code); text-anchor: middle; } .plus { fill: var(--accent-red); font: 700 16px var(--font-code); }
.lbl { fill: #9aa; font: 600 12px var(--font-code); text-anchor: middle; } .val { fill: var(--accent-lead); font: 12px var(--font-code); text-anchor: middle; }
.hit { fill: transparent; stroke: none; } .part { cursor: grab; } .part.selected .sym { stroke: var(--accent-lead); } .part.selected .hit { fill: rgba(255,176,0,.05); stroke: rgba(255,176,0,.4); stroke-dasharray: 4 4; }
.part.locked .lbl { fill: #6c8; }
.wire { fill: none; stroke: var(--wire); stroke-width: 2.6; stroke-linejoin: round; pointer-events: none; }
.wire.selected { stroke: var(--accent-cyan); stroke-width: 4; } .wire.pending { stroke-dasharray: 6 5; opacity: .8; }
.wirehit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.pin { fill: #111; stroke: #9a9a9a; stroke-width: 1.5; } .pin.used { fill: var(--wire); stroke: var(--wire); } .pin.active { fill: var(--accent-lead); stroke: #fff; }
.pinhit { fill: transparent; cursor: crosshair; } [data-pin]:hover .pin { stroke: var(--accent-lead); stroke-width: 3; }
.vlabel { fill: var(--accent-cyan); font: 11px var(--font-code); pointer-events: none; }
.burnt { stroke: var(--accent-red); stroke-width: 3.5; fill: none; }
.lamp-on { fill: var(--accent-green); filter: drop-shadow(0 0 4px var(--accent-green)); } .lamp-off { fill: #333; }
.probe path { stroke-width: 3; fill: none; } .probe text { font: 700 11px var(--font-code); text-anchor: middle; fill: #fff; pointer-events: none; }
.probe-red path { stroke: #ff3b30; } .probe-red circle { fill: #ff3b30; } .probe-black path { stroke: #bbb; } .probe-black circle { fill: #222; stroke: #bbb; }

/* Messgeraete */
.meter { background: linear-gradient(#2b2a22, #1e1d17); border: 2px solid #3a3625; border-radius: 14px; padding: 10px; margin-bottom: 12px; }
.lcd { background: #9fb28a; color: #1b2413; font-size: 28px; font-weight: 700; text-align: right; padding: 6px 10px; border-radius: 6px; box-shadow: inset 0 2px 6px rgba(0,0,0,.4); min-height: 48px; letter-spacing: 1px; }
.mm-modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; }
.mm-modes button { background: #111; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 5px 0; cursor: pointer; font-family: var(--font-code); }
.mm-modes button.on { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); }
#mmProbes { display: flex; justify-content: space-between; font-family: var(--font-code); font-size: 12px; } .pr.red { color: #ff6b61; } .pr.black { color: #bbb; }
#mmHelp { font-size: 12px; color: #aaa; margin: 4px 0 0; } #mmWarn { color: #ff8080; font-size: 12px; }
#inspector { margin-bottom: 12px; } .insp-head { margin-bottom: 8px; } .tag { font-size: 11px; background: #234; color: #8cf; padding: 1px 6px; border-radius: 4px; }
.readout { display: grid; grid-template-columns: 24px 1fr; font-family: var(--font-code); font-size: 13px; margin: 8px 0 2px; } .readout dt { color: var(--text-dim); } .readout dd { margin: 0; } .err { color: var(--accent-red); }
.scopebox canvas { width: 100%; height: 150px; border-radius: 8px; border: 1px solid #333; display: block; }
.scope-ctl { display: flex; gap: 6px; margin: 6px 0; } .scope-ctl select { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 6px; }
#scopeInfo { font-size: 11px; color: var(--text-dim); font-family: var(--font-code); }

/* Theorie / Handbuch / Einstellungen */
.theory, .settings { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
.lesson { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin: 12px 0 16px; }
.formula { font-family: var(--font-code); font-size: 22px; text-align: center; color: var(--accent-lead); padding: 10px; }
.q { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; padding: 10px 14px; background: var(--bg-secondary); }
.q legend { font-weight: 600; padding: 0 6px; } .q label { display: block; padding: 3px 0; cursor: pointer; }
.q.ok { border-color: var(--accent-green); } .q.bad { border-color: var(--accent-red); } .expl { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.manual { display: grid; grid-template-columns: 220px 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 24px 18px; }
.manual nav { display: flex; flex-direction: column; gap: 4px; } .manual nav button { text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.manual nav button.on { border-color: var(--accent-lead); color: var(--accent-lead); } .manual article { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.settings section { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
.settings .fld { grid-template-columns: 140px 1fr; }

/* Modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modal.open { display: flex; } .modal-box { background: var(--bg-secondary); border: 1px solid var(--accent-lead-dim); border-radius: 14px; padding: 20px 24px; max-width: 460px; width: 100%; box-shadow: 0 0 40px rgba(255,176,0,.15); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; } .win { color: var(--accent-lead); margin-top: 0; }

/* Handy / Tablet */
@media (max-width: 1100px) { #scr-task.active { grid-template-columns: 1fr 280px; } #taskInfo { grid-column: 1 / -1; } }
@media (max-width: 760px) {
  #scr-task.active { grid-template-columns: 1fr; padding: 8px; } .boardwrap { min-height: 300px; aspect-ratio: 1000 / 620; flex: none; }
  .top { padding: 8px 10px; gap: 8px; } .brand span { display: none; } .top nav button { padding: 6px 8px; font-size: 13px; } #saveInd { display: none; }
  .manual { grid-template-columns: 1fr; } .progress .bar { width: 140px; }
}

/* Multimeter-Verfahren, Zeitlupe, Ansichtswechsel */
.mm-type { display: flex; gap: 4px; align-items: center; margin: 0 0 8px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; }
.mm-type button { background: #111; border: 1px solid #444; color: #ccc; border-radius: 6px; padding: 3px 6px; cursor: pointer; font: 11px var(--font-code); }
.mm-type button.on { border-color: var(--accent-cyan); color: var(--accent-cyan); }
#replay { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--bg-secondary); border: 1px solid var(--accent-lead-dim); border-radius: 12px; padding: 6px 8px; }
#replay[hidden] { display: none; } #rpSlider { flex: 1; min-width: 120px; accent-color: var(--accent-lead); }
#rpLabel { font: 12px var(--font-code); color: var(--accent-lead); flex-basis: 100%; }
.tb.view { border-color: var(--accent-lead-dim); }
.map-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Werkbank-Details */
.bside { fill: url(#bSide); stroke: rgba(0,0,0,.45); stroke-width: 1.2; }
.bgloss { fill: rgba(255,255,255,.28); pointer-events: none; }
.bsym .sym { stroke: #46505a; stroke-width: 5; } .bsym .sym.fillsym, .bsym .fillsym { fill: #46505a; } .bsym .symtxt, .bsym .plus { fill: #46505a; font-size: 26px; }
.bsym .hit, .bsym .lamp-on, .bsym .lamp-off { display: none; } .bsym { pointer-events: none; }
.bpart-tiny { font: 700 5.5px var(--font-code); fill: #9a9a9a; text-anchor: middle; pointer-events: none; } .bpart-tiny.w { fill: #f0f0f0; } .bpart-tiny.g { fill: #555; }
.bmatprint { font: 800 14px var(--font-ui); letter-spacing: 3px; fill: rgba(255,255,255,.14); pointer-events: none; }
.bdevtxt.small { font-size: 6.5px; fill: #b9b9b9; }

.symtxt.small { font-size: 10px; }
.seg { fill: none; stroke: #3a1d1d; stroke-width: 4; stroke-linecap: round; } .seg.on { stroke: #ff3b30; filter: drop-shadow(0 0 3px #ff3b30); }

.bdot { fill: #fff6c2; stroke: rgba(120,80,0,.8); stroke-width: 1; filter: drop-shadow(0 0 2px #ffd54a); pointer-events: none; }
.bilabel { font: 700 11px var(--font-code); fill: #ffe9a8; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.8); stroke-width: 3px; pointer-events: none; }
.bprint.w { fill: #e8e8e8; }
/* Wahrheitstabellen in Auftraegen und Lektionen */

table.tt th { background: var(--bg-tertiary); color: var(--text-dim); } table.tt .o { color: var(--accent-lead); font-weight: 700; }
</style>

<body>

<div id="modal"></div>
<script>/* ==== engine.js ==== */
/* Digital Quest – Schaltungs-Engine (window.DQEngine)
 * Knotenanalyse (Nodal Analysis) mit Norton-Ersatz fuer alle Quellen, stueckweise-lineare
 * Dioden/LEDs, Logikgatter (5-V-Logik, implizite Versorgung), Kondensator (Backward Euler),
 * Multimeter (V, A, Ohm, V~ mit AVG/TRMS) mit realistischen Fehlbedienungen und Anzeige wie ein 6000-Digit-DMM,
 * Wechselspannungsquelle (Sinus/Rechteck/Dreieck), Rechenschritt-Verlauf fuer die Zeitlupe.
 * Einheiten: V, A, Ohm, F, s, Hz. Kein DOM – laeuft in Node und im Browser.
 */
(function (root) {
  'use strict';

  var GMIN = 1e-9;            // Leitwert jedes Knotens gegen Masse (verhindert singulaere Matrix)
  var G_OPEN = 1e-12;         // offener Schalter, gesperrte Diode, Gattereingang
  var G_CLOSED = 1e3;         // geschlossener Schalter (1 mOhm)
  var LOGIC = { vcc: 5, vth: 2.5, rout: 25 };
  var METER = { rV: 1e7, rA: 0.1, fuseA: 10, iOhm: 1e-3, olOhm: 40e6, cal: 0.002 }; // cal: Verstaerkungsfehler des Geraets (+0,2 %)
  var TRACE_MAX = 200;        // Zeitlupe: hoechstens so viele Rechenschritte pro Arbeitspunkt speichern

  var LED_COLORS = {
    rot: { vf: 1.8, rgb: '#ff3b30' }, gelb: { vf: 2.0, rgb: '#ffd60a' },
    gruen: { vf: 2.1, rgb: '#32d74b' }, blau: { vf: 3.0, rgb: '#0a84ff' }, weiss: { vf: 3.1, rgb: '#f5f5f7' }
  };

  /* Bauteilkatalog: Pins, Standardwerte, Namenspraefix. Geometrie liegt im Editor. */
  var PARTS = {
    ground:    { label: 'Masse', prefix: 'GND', pins: ['g'], props: {} },
    battery:   { label: 'Spannungsquelle', prefix: 'B', pins: ['p', 'n'], props: { value: 9, ri: 0.05, imax: 3 }, unit: 'V' },
    resistor:  { label: 'Widerstand', prefix: 'R', pins: ['a', 'b'], props: { value: 1000, pmax: 0.25 }, unit: 'Ω' },
    pot:       { label: 'Potentiometer', prefix: 'P', pins: ['a', 'w', 'b'], props: { value: 10000, pos: 0.5, pmax: 0.25 }, unit: 'Ω' },
    lamp:      { label: 'Lampe', prefix: 'H', pins: ['a', 'b'], props: { value: 60, pnom: 1.35 }, unit: 'Ω' },
    switch:    { label: 'Schalter', prefix: 'S', pins: ['a', 'b'], props: { closed: false } },
    button:    { label: 'Taster', prefix: 'T', pins: ['a', 'b'], props: { closed: false } },
    led:       { label: 'LED', prefix: 'D', pins: ['a', 'k'], props: { color: 'rot', rs: 10, imax: 0.03, inom: 0.02 } },
    diode:     { label: 'Diode', prefix: 'V', pins: ['a', 'k'], props: { vf: 0.7, rs: 1, imax: 1 } },
    capacitor: { label: 'Kondensator', prefix: 'C', pins: ['a', 'b'], props: { value: 100e-6 }, unit: 'F' },
    ammeter:   { label: 'Strommesser', prefix: 'A', pins: ['a', 'b'], props: {} },
    clock:     { label: 'Taktgeber', prefix: 'CLK', pins: ['out'], props: { freq: 1 }, unit: 'Hz' },
    acsource:  { label: 'Wechselspannungsquelle', prefix: 'G', pins: ['p', 'n'], props: { value: 10, freq: 50, shape: 'sine', offset: 0, ri: 0.05, imax: 3 }, unit: 'V' }, // value = Scheitelwert Û
    not:  { label: 'NICHT', prefix: 'U', pins: ['in', 'out'], props: {}, logic: function (i) { return !i[0]; } },
    and:  { label: 'UND', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] && i[1]; } },
    or:   { label: 'ODER', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] || i[1]; } },
    nand: { label: 'NAND', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return !(i[0] && i[1]); } },
    nor:  { label: 'NOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return !(i[0] || i[1]); } },
    xor:  { label: 'XOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] !== i[1]; } },
    xnor: { label: 'XNOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] === i[1]; } },
    /* Experimentierboard: Pegelschalter (closed = 1 → 5 V) und Logikanzeige (leuchtet ab 2,5 V); Versorgung implizit wie bei Gattern */
    logicin:  { label: 'Pegelschalter', prefix: 'E', pins: ['out'], props: { closed: false }, digital: true },
    logicled: { label: 'Logikanzeige', prefix: 'L', pins: ['in'], props: { color: 'rot' }, digital: true },
    seg7:     { label: '7-Segment-Anzeige', prefix: 'AZ', pins: ['a', 'b', 'c', 'd', 'e', 'f', 'g'], props: {}, digital: true },
    dec7:     { label: 'BCD-7-Segment-Decoder', prefix: 'IC', pins: ['A', 'B', 'C', 'D', 'a', 'b', 'c', 'd', 'e', 'f', 'g'], ins: ['A', 'B', 'C', 'D'], outs: ['a', 'b', 'c', 'd', 'e', 'f', 'g'], props: {},
      logic: function (i) { var n = (i[0] ? 1 : 0) + (i[1] ? 2 : 0) + (i[2] ? 4 : 0) + (i[3] ? 8 : 0); return (SEG7[n] || '0000000').split('').map(function (c) { return c === '1'; }); } },
    /* Flipflops: uebernehmen bei steigender Flanke an C (ffIns = Dateneingaenge), Ausgaenge Q und /Q */
    dff:  { label: 'D-Flipflop', prefix: 'FF', pins: ['D', 'C', 'Q', 'Qn'], ffIns: ['D'], props: {}, ff: function (q, i) { return i[0]; } },
    jkff: { label: 'JK-Flipflop', prefix: 'FF', pins: ['J', 'K', 'C', 'Q', 'Qn'], ffIns: ['J', 'K'], props: {}, ff: function (q, i) { return i[0] && i[1] ? !q : i[0] ? true : i[1] ? false : q; } },
    tff:  { label: 'T-Flipflop', prefix: 'FF', pins: ['T', 'C', 'Q', 'Qn'], ffIns: ['T'], props: {}, ff: function (q, i) { return i[0] ? !q : q; } },
    /* Halbleiter: NPN-Transistor (sperrt / aktiv: Ic = β·Ib / Saettigung: U_CE ≈ 0,2 V), Z-Diode (Durchbruch bei U_Z in Sperrrichtung) */
    npn:   { label: 'NPN-Transistor', prefix: 'Q', pins: ['b', 'c', 'e'], props: { beta: 100, vbe: 0.7, rbe: 50, vsat: 0.2, pmax: 0.5 } },
    zener: { label: 'Z-Diode', prefix: 'Z', pins: ['a', 'k'], props: { vz: 5.1, vf: 0.7, rs: 5, pmax: 0.5 } },
    motor: { label: 'Motor', prefix: 'M', pins: ['a', 'b'], props: { value: 20, inom: 0.3 }, unit: 'Ω' }
  };
  /* Segmente a…g fuer 0–9 (BCD), darueber dunkel */
  var SEG7 = ['1111110', '0110000', '1101101', '1111001', '0110011', '1011011', '1011111', '1110000', '1111111', '1111011'];
  function dIns(d) { return d.ins || (d.ffIns ? d.ffIns.concat(['C']) : d.pins.filter(function (p) { return p !== 'out'; })); }
  function dOuts(d) { return d.outs || (d.ff ? ['Q', 'Qn'] : ['out']); }
  function isDigital(d) { return !!(d.logic || d.digital || d.ff); }
  var SOURCES = { battery: 1, clock: 1, acsource: 1 };
  /* Momentanwert einer Wechselspannungsquelle zur Zeit t (Kurvenform sine | square | triangle, Scheitelwert value, Gleichanteil offset) */
  function wave(q, t) {
    var ph = ((t * q.freq) % 1 + 1) % 1, w;
    if (q.shape === 'square') w = ph < 0.5 ? 1 : -1;
    else if (q.shape === 'triangle') w = ph < 0.25 ? 4 * ph : ph < 0.75 ? 2 - 4 * ph : 4 * ph - 4;
    else w = Math.sin(2 * Math.PI * ph);
    return (q.offset || 0) + q.value * w;
  }

  function def(type) { var d = PARTS[type]; if (!d) throw new Error('Unbekanntes Bauteil: ' + type); return d; }
  function props(p) { var o = {}, d = def(p.type).props, k; for (k in d) o[k] = d[k]; for (k in (p.props || {})) o[k] = p.props[k]; if (p.value !== undefined) o.value = p.value; return o; }

  /* ---------- Netzliste aus Editor-Layout ----------
   * layout = { parts:[{id,type,value?,props?,x,y,rot}], wires:[{from:'R1.a', to:'B1.p'}] } */
  function buildNetlist(layout, extra) {
    var parent = {};
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function add(x) { if (parent[x] === undefined) parent[x] = x; }
    function union(a, b) { add(a); add(b); var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
    var parts = [], byId = {};
    (layout.parts || []).forEach(function (p) {
      var d = def(p.type);
      if (byId[p.id]) throw new Error('Doppelte Bauteil-ID: ' + p.id);
      d.pins.forEach(function (pin) { add(p.id + '.' + pin); });
      var q = { id: p.id, type: p.type, props: props(p), n: {} };
      parts.push(q); byId[p.id] = q;
    });
    var wires = (layout.wires || []).concat(extra || []);
    wires.forEach(function (w) {
      [w.from, w.to].forEach(function (pid) { if (parent[pid] === undefined) throw new Error('Unbekannter Anschluss: ' + pid); });
      union(w.from, w.to);
    });
    var groundRoots = {}, autoGround = false;
    parts.forEach(function (p) { if (p.type === 'ground') groundRoots[find(p.id + '.g')] = true; });
    if (!Object.keys(groundRoots).length) { // ohne Masse-Symbol: Minuspol der ersten Quelle ist Bezugspunkt 0 V
      var src = parts.filter(function (p) { return p.type === 'battery' || p.type === 'acsource'; })[0];
      if (src) { groundRoots[find(src.id + '.n')] = true; autoGround = true; }
    }
    var names = {}, count = 0, pinNode = {};
    Object.keys(parent).forEach(function (pid) {
      var r = find(pid);
      if (!names[r]) names[r] = groundRoots[r] ? '0' : 'N' + (++count);
      pinNode[pid] = names[r];
    });
    parts.forEach(function (p) { def(p.type).pins.forEach(function (pin) { p.n[pin] = pinNode[p.id + '.' + pin]; }); });
    var nodes = [];
    Object.keys(names).forEach(function (r) { if (names[r] !== '0') nodes.push(names[r]); });
    nodes.sort(function (a, b) { return +a.slice(1) - +b.slice(1); });
    return { parts: parts, byId: byId, nodes: nodes, pinNode: pinNode, hasGround: Object.keys(groundRoots).length > 0 && !autoGround, autoGround: autoGround };
  }

  /* ---------- Lineares Gleichungssystem (Gauss mit Pivotsuche) ---------- */
  function solveLinear(A, z) {
    var n = z.length, i, j, k;
    for (i = 0; i < n; i++) {
      var max = i;
      for (k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[max][i])) max = k;
      if (Math.abs(A[max][i]) < 1e-18) return null;
      var t = A[i]; A[i] = A[max]; A[max] = t; var tz = z[i]; z[i] = z[max]; z[max] = tz;
      for (k = i + 1; k < n; k++) {
        var f = A[k][i] / A[i][i]; if (f === 0) continue;
        for (j = i; j < n; j++) A[k][j] -= f * A[i][j];
        z[k] -= f * z[i];
      }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) { var s = z[i]; for (j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / A[i][i]; }
    return x;
  }

  /* burnInfo: Werte im Moment des Durchbrennens (fuer die Diagnose), fuseInfo: Strom beim Ausloesen der Multimeter-Sicherung */
  /* tr: Transistor-Zustand ('off'|'on'|'sat'), zen: Z-Dioden-Zustand ('off'|'f'|'z'), ff: Flipflops {q, c (letzter Taktpegel)} */
  function newState() { return { burnt: {}, vC: {}, logic: {}, diode: {}, tr: {}, zen: {}, ff: {}, fuse: false, t: 0, burnInfo: {}, fuseInfo: null }; }

  /* ---------- Loeser fuer einen Arbeitspunkt / Zeitschritt ----------
   * opts: { state, dt (null = Gleichstrom-Arbeitspunkt), t, meter:{mode,a,b} (Knoten), zeroSources, inject:{a,b,i},
   *         trace: [] – nimmt jeden Rechenschritt auf: {iter, kind:'diode'|'gate'|'done'|'unstable', changed:[{id,to}], res} (max. TRACE_MAX) } */
  function solve(net, opts) {
    opts = opts || {};
    var st = opts.state || newState();
    var idx = {}; net.nodes.forEach(function (n, i) { idx[n] = i; });
    var N = net.nodes.length;
    var dt = opts.dt || null, t = opts.t || 0;
    var diode = {}, logic = {}, tr = {}, zen = {};
    net.parts.forEach(function (p) {
      var d = def(p.type);
      if (p.type === 'led' || p.type === 'diode') diode[p.id] = !!st.diode[p.id];
      if (p.type === 'npn') tr[p.id] = (st.tr || {})[p.id] || 'off';
      if (p.type === 'zener') zen[p.id] = (st.zen || {})[p.id] || 'off';
      if (d.logic) logic[p.id] = st.logic[p.id] !== undefined ? st.logic[p.id] : (dOuts(d).length > 1 ? dOuts(d).map(function () { return false; }) : false);
    });
    function outVal(p, k) { var v = logic[p.id]; return Array.isArray(v) ? !!v[k] : !!v; }
    function ffQ(p) { return !!((st.ff || {})[p.id] || {}).q; }
    var V = null, iter = 0, converged = false, oscillating = false;

    function build() {
      var A = [], z = [], i;
      for (i = 0; i < N; i++) { A.push(new Float64Array(N)); z.push(0); A[i][i] += GMIN; }
      function G(a, b, g) {
        var ia = idx[a], ib = idx[b];
        if (ia !== undefined) A[ia][ia] += g;
        if (ib !== undefined) A[ib][ib] += g;
        if (ia !== undefined && ib !== undefined) { A[ia][ib] -= g; A[ib][ia] -= g; }
      }
      function I(a, b, cur) { // Strom cur wird in Knoten a eingespeist und aus b entnommen
        if (idx[a] !== undefined) z[idx[a]] += cur;
        if (idx[b] !== undefined) z[idx[b]] -= cur;
      }
      function norton(p, n, v, r) { var g = 1 / r; G(p, n, g); I(p, n, v * g); }
      function vccs(op, on, cp, cn, gm, voff) { // Strom gm·(V(cp) − V(cn) − voff) fliesst von op durch das Bauteil nach on
        var io = idx[op], jo = idx[on], ic = idx[cp], jc = idx[cn];
        if (io !== undefined) { if (ic !== undefined) A[io][ic] += gm; if (jc !== undefined) A[io][jc] -= gm; z[io] += gm * voff; }
        if (jo !== undefined) { if (ic !== undefined) A[jo][ic] -= gm; if (jc !== undefined) A[jo][jc] += gm; z[jo] -= gm * voff; }
      }
      function drive(node, high) { norton(node, '0', high && !opts.zeroSources ? LOGIC.vcc : 0, LOGIC.rout); }
      net.parts.forEach(function (p) {
        var q = p.props, n = p.n;
        if (st.burnt[p.id]) { return; }
        switch (p.type) {
          case 'resistor': case 'lamp': case 'motor': // props.defect: verdeckte Unterbrechung (Fehlersuche) – von aussen nicht sichtbar
            G(n.a, n.b, q.defect ? G_OPEN : 1 / Math.max(q.value, 1e-3)); break;
          case 'npn':
            if (tr[p.id] === 'off') { G(n.b, n.e, G_OPEN); G(n.c, n.e, G_OPEN); break; }
            norton(n.b, n.e, q.vbe, q.rbe);
            if (tr[p.id] === 'sat') norton(n.c, n.e, q.vsat, 1);
            else { G(n.c, n.e, G_OPEN); vccs(n.c, n.e, n.b, n.e, q.beta / q.rbe, q.vbe); }
            break;
          case 'zener':
            if (zen[p.id] === 'f') norton(n.a, n.k, q.vf, q.rs); else if (zen[p.id] === 'z') norton(n.k, n.a, q.vz, q.rs); else G(n.a, n.k, G_OPEN);
            break;
          case 'logicin': drive(n.out, !!q.closed); break;
          case 'pot': G(n.a, n.w, 1 / Math.max(q.value * q.pos, 1e-3)); G(n.w, n.b, 1 / Math.max(q.value * (1 - q.pos), 1e-3)); break;
          case 'switch': case 'button': G(n.a, n.b, q.closed ? G_CLOSED : G_OPEN); break;
          case 'ammeter': G(n.a, n.b, 1 / METER.rA); break;
          case 'battery': norton(n.p, n.n, opts.zeroSources ? 0 : q.value, q.ri); break;
          case 'acsource': norton(n.p, n.n, opts.zeroSources ? 0 : wave(q, t), q.ri); break;
          case 'led': case 'diode':
            var vf = p.type === 'led' ? LED_COLORS[q.color].vf : q.vf;
            if (diode[p.id]) norton(n.a, n.k, vf, q.rs); else G(n.a, n.k, G_OPEN);
            break;
          case 'capacitor':
            if (dt) { var gc = q.value / dt; G(n.a, n.b, gc); I(n.a, n.b, gc * (st.vC[p.id] || 0)); }
            else G(n.a, n.b, G_OPEN);
            break;
          case 'clock':

      '<p><b>Spannung U</b> (Volt, V) ist der Antrieb fuer die Ladungen. Sie liegt immer <i>zwischen zwei Punkten</i> an – zum Beispiel zwischen Plus- und Minuspol der Batterie.</p>' +
      '<p><b>Strom I</b> (Ampere, A) ist die Ladung, die pro Sekunde durch den Leiter fliesst. Er fliesst nur, wenn der Kreis <i>geschlossen</i> ist – und dann durch jedes Bauteil einer Reihe gleich stark.</p>' +
      '<p>Zwei Schalter <b>in Reihe</b>: Die Lampe leuchtet nur, wenn <i>beide</i> geschlossen sind (UND). Zwei Schalter <b>parallel</b>: Es genuegt <i>einer</i> (ODER).</p>' +
      '<p><b>Messen:</b> Das Voltmeter kommt <i>parallel</i> an die zwei Punkte, zwischen denen du die Spannung wissen willst. Das Amperemeter kommt <i>in Reihe</i> – dazu wird der Kreis aufgetrennt und das Messgeraet in die Luecke gesetzt.</p>',
    questions: [
      { q: 'Was braucht ein Stromkreis mindestens?', options: ['Eine Quelle und einen Schalter', 'Eine Quelle, einen Verbraucher und einen geschlossenen Leiterweg', 'Einen Verbraucher und ein Messgeraet', 'Zwei Leitungen und einen Schalter'], correct: 1, explain: 'Ohne Quelle kein Antrieb, ohne Verbraucher nichts, das die Energie nutzt, ohne geschlossenen Weg kein Strom.' },
      { q: 'Zwei Schalter liegen in Reihe mit einer Lampe. Wann leuchtet die Lampe?', options: ['Wenn mindestens ein Schalter zu ist', 'Nur wenn beide Schalter zu sind', 'Immer', 'Nur wenn beide offen sind'], correct: 1, explain: 'In Reihe muss der Strom durch beide Schalter – jeder offene Schalter unterbricht den Kreis (UND-Funktion).' },
      { q: 'Batterie 9 V, Schalter offen, Lampe. Welche Spannung misst du ueber dem offenen Schalter?', options: ['0 V', '4,5 V', '9 V', '18 V'], correct: 2,

      { q: 'Wie schliesst du ein Amperemeter an?', options: ['Parallel zum Verbraucher', 'In Reihe: Kreis auftrennen, Messgeraet in die Luecke', 'Direkt an die Batteriepole', 'Gar nicht – Strom kann man nur rechnen'], correct: 1, explain: 'Der Strom muss durch das Messgeraet fliessen. Direkt an die Batterie waere ein Kurzschluss.' },
      { q: 'Die Lampe (60 Ω) haengt ueber den geschlossenen Schalter an 9 V. Welcher Strom fliesst?', options: ['15 mA', '150 mA', '540 mA', '1,5 A'], correct: 1,

  defTheory({
    id: 'T1B', ch: 1, title: 'Ohmsches Gesetz und Vorwiderstand', tags: ['elektro.ohm', 'bauteil.led', 'elektro.leistung'],
    lesson:
      '<p>Der <b>Widerstand R</b> (Ohm, Ω) bremst den Strom. Spannung, Strom und Widerstand haengen fest zusammen – das <b>Ohmsche Gesetz</b>:</p>' +
      '<div class="formula">U = R · I &nbsp;&nbsp; I = U / R &nbsp;&nbsp; R = U / I</div>' +
      '<p>Doppelte Spannung am gleichen Widerstand → doppelter Strom. Doppelter Widerstand bei gleicher Spannung → halber Strom.</p>' +
      '<p><b>Leistung:</b> P = U · I (Watt, W). Ein Widerstand wird warm; ueberschreitet P seine Belastbarkeit (hier 0,25 W), wird er zu heiss.</p>' +
      '<p><b>LED und Vorwiderstand:</b> Eine LED leitet ab ihrer Flussspannung U<sub>F</sub> (rot ≈ 1,8 V, gruen ≈ 2,1 V, blau ≈ 3 V) und begrenzt den Strom selbst kaum. Deshalb braucht sie einen <b>Vorwiderstand</b>, der die restliche Spannung „aufnimmt“:</p>' +
      '<div class="formula">R<sub>V</sub> = (U<sub>B</sub> − U<sub>F</sub>) / I<sub>LED</sub></div>' +
      '<p>Ueblich sind 10–20 mA. Die LED hat eine Richtung: Strom nur von der <b>Anode</b> (+, langes Bein) zur <b>Kathode</b> (−, abgeflachte Seite).</p>',
    questions: [
      { q: 'An 10 V liegt ein Widerstand von 470 Ω. Welcher Strom fliesst?', options: ['2,13 mA', '21,3 mA', '47 mA', '4,7 A'], correct: 1,

      { q: 'Bei 10 V sollen genau 10 mA fliessen. Wie gross muss R sein?', options: ['100 Ω', '1 kΩ', '10 kΩ', '0,1 Ω'], correct: 1, explain: 'R = U / I = 10 V / 0,01 A = 1000 Ω.' },
      { q: 'Rote LED (U_F = 1,8 V) an 9 V, gewuenscht 20 mA. Welcher Vorwiderstand?', options: ['90 Ω', '360 Ω', '450 Ω', '1,8 kΩ'], correct: 1, explain: 'R = (9 V − 1,8 V) / 0,02 A = 360 Ω.' },
      { q: 'Was passiert, wenn du eine LED ohne Vorwiderstand direkt an 9 V anschliesst?', options: ['Sie leuchtet besonders schoen', 'Nichts, sie sperrt', 'Der Strom wird sehr gross – sie brennt durch', 'Die Batterie laedt sich auf'], correct: 2, explain: 'Oberhalb von U_F begrenzt fast nur der kleine Bahnwiderstand den Strom.' },
      { q: 'Welche Leistung setzt ein 1-kΩ-Widerstand an 10 V um?', options: ['0,01 W', '0,1 W', '1 W', '10 W'], correct: 1, explain: 'P = U² / R = 100 V² / 1000 Ω = 0,1 W.' }
    ]
  });

/* Kapitel 3 – Gleich- und Wechselgroessen
 * Quelle: Gleich- & Wechselgroessen (Gleich-/Wechselgroessen, Periode, Frequenz, linearer Mittelwert, Gleichrichtwert,
 * Effektivwert bei Sinus/Dreieck/Rechteck, harmonische Schwingung), Messtechnik Erweiterung (Kap. 4 AVG/RMS/TRMS,
 * Kap. 6.3/6.4/6.6 Kurvenformen, DC-Anteil, Gleichrichterschaltungen). */
(function () {
  'use strict';

  defChapter({
    id: 3, title: 'Gleich- und Wechselgroessen',
    intro: 'Der Funktionsgenerator liefert Sinus, Rechteck und Dreieck. Du misst Scheitelwert, Mittelwert und Effektivwert – und findest heraus, warum ein billiges Multimeter bei Rechteckspannung luegt.',
    sequence: ['T3A', '3.1', '3.2', '3.3', '3.4', '3.5', 'T3B', '3.6', '3.7', '3.8', '3.9', '3.10']
  });

  var gen = function (props) { return { id: 'G1', type: 'acsource', value: 10, props: Object.assign({ freq: 50, shape: 'sine', offset: 0 }, props || {}), x: 160, y: 300, rot: 0 }; };
  var R1 = { id: 'R1', type: 'resistor', value: 1000, x: 420, y: 300, rot: 90 };
  var bG1 = { id: 'G1', x: 250, y: 460, rot: 0 }, bR1 = { id: 'R1', x: 700, y: 440, rot: 90 };
  var genR = function (props) { return { parts: [gen(props), R1], wires: [W('G1.p', 'R1.a'), W('R1.b', 'G1.n')] }; };
  var named = function (name, l) { l.name = name; return l; };

  /* ================= Theorie A ================= */
  defTheory({
    id: 'T3A', ch: 3, title: 'Gleich- und Wechselgroessen', tags: ['elektro.wechselgroessen', 'elektro.frequenz'],
    lesson:
      '<p><b>Gleichgroessen</b> (Gleichspannung, Gleichstrom) sind ueber die Zeit konstant – wie bei der Batterie.</p>' +
      '<p><b>Wechselgroessen</b> aendern sich mit der Zeit. Wiederholt sich der Verlauf immer gleich, ist sie <b>periodisch</b> mit der <b>Periodendauer T</b>. Die <b>Frequenz</b> f gibt an, wie viele Perioden pro Sekunde ablaufen:</p>' +
      '<div class="formula">f = 1 / T &nbsp;&nbsp; [Hz = 1/s]</div>' +
      '<p>Nicht periodisch ist z. B. das einmalige Laden eines Kondensators.</p>' +
      '<p>Der <b>lineare Mittelwert</b> ist der Gleichanteil U<sub>DC</sub> – die Flaeche ueber der Nulllinie minus die Flaeche darunter, geteilt durch T. Bei einer <b>reinen Wechselgroesse</b> ist er <b>0 V</b>. Ist er ungleich null, spricht man von einer <b>Mischgroesse</b> (Wechselanteil + Gleichanteil).</p>' +
      '<p>Die Sinusform heisst <b>harmonische Schwingung</b> – so sieht die Netzspannung aus:</p>' +
      '<div class="formula">u(t) = Û · sin(ω·t + φ) + U<sub>DC</sub> &nbsp;&nbsp; ω = 2·π·f</div>' +
      '<p><b>Û</b> ist der Scheitelwert (Spitze), <b>U<sub>ss</sub></b> der Spitze-Spitze-Wert (bei reinem Sinus 2·Û), φ der Nullphasenwinkel. Am <b>Oszilloskop</b> siehst du den Verlauf direkt; ein Multimeter auf V⎓ zeigt bei schneller Wechselspannung nur den Mittelwert.</p>',
    questions: [
      { q: 'Eine Wechselspannung hat die Periodendauer T = 20 ms. Wie gross ist die Frequenz?', options: ['20 Hz', '50 Hz', '200 Hz', '500 Hz'], correct: 1, explain: 'f = 1 / T = 1 / 0,02 s = 50 Hz.' },
      { q: 'Welchen linearen Mittelwert hat eine reine Sinusspannung mit Û = 10 V?', options: ['0 V', '6,37 V', '7,07 V', '10 V'], correct: 0, explain: 'Die positive und die negative Halbwelle sind gleich gross – sie heben sich auf.' },
      { q: 'Ein Sinus hat Û = 10 V. Wie gross ist der Spitze-Spitze-Wert U_ss?', options: ['5 V', '10 V', '14,1 V', '20 V'], correct: 3, explain: 'Von −10 V bis +10 V sind es 20 V.' },
      { q: 'Was ist eine Mischgroesse?', options: ['Eine Wechselgroesse mit Gleichanteil ≠ 0', 'Eine Spannung aus zwei Batterien', 'Ein Rechteck mit 50 % Tastgrad', 'Eine Spannung ohne Frequenz'], correct: 0, explain: 'Mischgroesse = Wechselanteil + Gleichanteil; ihr linearer Mittelwert ist nicht null.' },
      { q: 'Wie gross ist die Kreisfrequenz ω bei 50 Hz?', options: ['50 1/s', '100 1/s', '314 1/s', '3140 1/s'], correct: 2, explain: 'ω = 2 · π · 50 Hz ≈ 314 1/s.' }
    ]
  });

  /* ================= Aufgaben 1–5 ================= */
  defTask({
    id: '3.1', ch: 3, title: 'Der Funktionsgenerator', tags: ['elektro.wechselgroessen', 'messen.oszilloskop'],
    story: 'Neues Geraet im Labor: ein Funktionsgenerator. Die Werkmeisterin will sehen, ob du ihn ablesen kannst.',
    brief: 'Schliesse den Widerstand R1 (1 kΩ) an den Funktionsgenerator an (Sinus, Û = 10 V, 50 Hz). Nimm die Spannung an R1 mit dem <b>Oszilloskop</b> auf und lies den <b>Scheitelwert Û</b> und den <b>Spitze-Spitze-Wert U<sub>ss</sub></b> ab.',
    learn: 'Am Oszilloskop liest du Scheitelwert und Spitze-Spitze-Wert direkt ab.',
    take: 'U_ss = 2 · Û bei einer reinen Wechselspannung.',
    hint: 'Multimeter auf V⎓, Spitzen an R1.a (rot) und R1.b (schwarz) – das Oszilloskop nutzt dieselben Spitzen. Zeitbasis 50 ms, dann „Aufnahme“ (auf der Werkbank: RUN).',
    hint2: 'Unter dem Bild stehen max und min. Û = max, U_ss = max − min.',
    palette: [], need: {},
    start: { parts: [gen(), R1], wires: [] }, ref: genR(),
    bench: { parts: [bG1, bR1] },
    tests: [{ name: 'Anschluss', expect: [{ a: 'R1.a', b: 'R1.b', ac: 'peak', range: [9.8, 10.2] }, { noFault: true }] }],
    measure: [
      { id: 'up', ask: 'Scheitelwert Û an R1', unit: 'V', mode: 'AC', q: 'peak', a: 'R1.a', b: 'R1.b', tol: 0.03 },
      { id: 'upp', ask: 'Spitze-Spitze-Wert U_ss an R1', unit: 'V', mode: 'AC', q: 'pp', a: 'R1.a', b: 'R1.b', tol: 0.03 }
    ]
  });

  defTask({
    id: '3.2', ch: 3, title: 'Das Multimeter zeigt null?', tags: ['elektro.wechselgroessen', 'elektro.mittelwert', 'messen.spannung'],
    story: 'Ein Lernender meldet: „Am Widerstand liegt keine Spannung, das Multimeter zeigt 0 V.“ Das Oszilloskop sagt etwas anderes.',
    brief: 'Miss an R1 mit dem Multimeter auf <b>V⎓</b> (Gleichspannung) und mit dem Oszilloskop. Trage den angezeigten <b>Gleichanteil</b> und den <b>Spitze-Spitze-Wert</b> ein.',
    learn: 'V⎓ zeigt den linearen Mittelwert – bei reiner Wechselspannung 0 V.',
    take: 'Eine reine Wechselgroesse hat den Mittelwert null. Fuer Wechselspannung braucht es den Bereich V~ oder das Oszilloskop.',
    hint: 'V⎓ waehlen, Spitzen an R1.a und R1.b. Danach „Aufnahme“ am Oszilloskop.',
    hint2: 'Das Multimeter mittelt ueber viele Perioden – positive und negative Halbwelle heben sich auf.',
    palette: [], start: genR(), ref: genR(), bench: { parts: [bG1, bR1] },
    tests: [{ name: 'Anlage', expect: [{ noFault: true }] }],
    measure: [
      { id: 'udc', ask: 'Anzeige V⎓ an R1 (Gleichanteil)', unit: 'V', mode: 'AC', q: 'dc', a: 'R1.a', b: 'R1.b', tol: 0.03, abs: 0.1 },
      { id: 'upp', ask: 'Spitze-Spitze-Wert U_ss (Oszilloskop)', unit: 'V', mode: 'AC', q: 'pp', a: 'R1.a', b: 'R1.b', tol: 0.03 }
    ]
  });

  defTask({
    id: '3.3', ch: 3, title: 'Mischgroesse einstellen', tags: ['elektro.wechselgroessen', 'elektro.mittelwert'],
    story: 'Ein Sensor braucht eine Sinusspannung, die um 5 V herum schwingt – nie ganz auf null.',
    brief: 'Hole den Funktionsgenerator, schliesse ihn an R1 an und stelle einen <b>Gleichanteil von 5 V</b> ein (Sinus, Û = 10 V). Miss den Mittelwert mit V⎓.',
    learn: 'Mischgroesse = Wechselanteil + Gleichanteil.',
    take: 'Der Gleichanteil verschiebt die Kurve nach oben – V⎓ zeigt genau diesen Anteil.',
    hint: 'Im Eigenschaften-Panel des Generators gibt es das Feld „Gleichanteil“.',
    hint2: 'Gleichanteil 5 → Enter. Die Kurve laeuft dann von −5 V bis +15 V.',
    palette: ['acsource'], need: { acsource: 1 },
    start: { parts: [R1], wires: [] }, ref: genR({ offset: 5 }),
    bench: { parts: [bG1, bR1] },
    wrong: [named('ohne Gleichanteil', genR())],
    tests: [{ name: 'Mischgroesse', expect: [{ a: 'R1.a', b: 'R1.b', ac: 'dc', range: [4.9, 5.1] }, { a: 'R1.a', b: 'R1.b', ac: 'pp', range: [19.5, 20.5] }, { noFault: true }] }],
    measure: [{ id: 'udc', ask: 'Gleichanteil an R1 (V⎓)', unit: 'V', mode: 'AC', q: 'dc', a: 'R1.a', b: 'R1.b', tol: 0.03 }]
  });

  var half = { parts: [gen(), R1, { id: 'V1', type: 'diode', x: 290, y: 200, rot: 0 }], wires: [W('G1.p', 'V1.a'), W('V1.k', 'R1.a'), W('R1.b', 'G1.n')] };
  defTask({
    id: '3.4', ch: 3, title: 'Einweggleichrichter', tags: ['bauteil.diode', 'elektro.gleichrichter', 'elektro.mittelwert'],
    story: 'Aus der Wechselspannung soll eine Spannung werden, die nur noch in eine Richtung zeigt.',
    brief: 'Setze eine <b>Diode</b> zwischen Generator und R1, sodass nur die positiven Halbwellen durchkommen. Miss an R1 den <b>Gleichanteil</b> (V⎓) und den <b>Scheitelwert</b> (Oszilloskop).',
    learn: 'Eine Diode laesst den Strom nur in eine Richtung durch – der Einweggleichrichter.',
    take: 'Nur jede zweite Halbwelle kommt durch: der Gleichanteil ist ≈ (Û − U_F) / π – deutlich kleiner als Û.',
    hint: 'Die Anode (V1.a) an den Generator (G1.+), die Kathode (V1.k) an R1.',
    hint2: 'Erwartet: Û an R1 ≈ 10 V − 0,7 V ≈ 9,3 V, Gleichanteil ≈ 2,8 V.',
    palette: ['diode'], need: { diode: 1 },
    start: genR(), ref: half,
    bench: { parts: [bG1, { id: 'V1', x: 480, y: 290, rot: 0 }, bR1] },
    wrong: [named('Diode verkehrt (negative Halbwellen)', { parts: half.parts, wires: [W('G1.p', 'V1.k'), W('V1.a', 'R1.a'), W('R1.b', 'G1.n')] })],
    tests: [{ name: 'gleichgerichtet', expect: [{ a: 'R1.a', b: 'R1.b', ac: 'dc', range: [2.6, 3.1] }, { noFault: true }] }],
    measure: [
      { id: 'udc', ask: 'Gleichanteil an R1 (V⎓)', unit: 'V', mode: 'AC', q: 'dc', a: 'R1.a', b: 'R1.b', tol: 0.04 },
      { id: 'up', ask: 'Scheitelwert an R1 (Oszilloskop)', unit: 'V', mode: 'AC', q: 'peak', a: 'R1.a', b: 'R1.b', tol: 0.03 }
    ]
  });

  var d = function (id, x, y, rot) { return { id: id, type: 'diode', x: x, y: y, rot: rot }; };
  var bridge = { parts: [gen(), R1, d('V1', 280, 200, 0), d('V2', 280, 400, 0), d('V3', 540, 200, 180), d('V4', 540, 400, 180)],
    wires: [W('G1.p', 'V1.a'), W('G1.p', 'V3.k'), W('G1.n', 'V2.a'), W('G1.n', 'V4.k'), W('V1.k', 'R1.a'), W('V2.k', 'R1.a'), W('V3.a', 'R1.b'), W('V4.a', 'R1.b')] };
  defTask({
    id: '3.5', ch: 3, title: 'Brueckengleichrichter', tags: ['bauteil.diode', 'elektro.gleichrichter', 'elektro.mittelwert'],
    story: 'Der Einweggleichrichter verschenkt die Haelfte. Mit vier Dioden geht es besser.',
    brief: 'Baue einen <b>Brueckengleichrichter</b> (Graetz-Bruecke) aus vier Dioden: Durch R1 soll in <b>beiden</b> Halbwellen Strom in dieselbe Richtung fliessen (R1.a positiv). Miss den Gleichanteil an R1.',
    learn: 'Die Graetz-Bruecke nutzt beide Halbwellen.',
    take: 'Zweiweg-Gleichrichtung: etwa doppelter Gleichanteil wie beim Einweggleichrichter – dafuer zwei Diodenspannungen Verlust.',
    hint: 'R1.a bekommt die Kathoden von zwei Dioden (deren Anoden an G1.+ und G1.–). R1.b bekommt die Anoden der anderen zwei (deren Kathoden an G1.+ und G1.–).',
    hint2: 'V1: G1.+ → R1.a · V2: G1.– → R1.a · V3: R1.b → G1.+ · V4: R1.b → G1.– (jeweils Anode → Kathode).',

    measure: [{ id: 'udc', ask: 'Gleichanteil an R1 (V⎓)', unit: 'V', mode: 'AC', q: 'dc', a: 'R1.a', b: 'R1.b', tol: 0.04 }]
  });

  /* ================= Theorie B ================= */
  defTheory({
    id: 'T3B', ch: 3, title: 'Gleichrichtwert, Effektivwert, AVG und TRMS', tags: ['elektro.effektivwert', 'messen.trms', 'elektro.gleichrichtwert'],
    lesson:
      '<p>Der <b>Gleichrichtwert</b> |Ū| (engl. average, AVG) ist der Mittelwert des <i>Betrags</i> – alle Halbwellen nach oben geklappt. Beim Sinus: <b>|Ū| = 2·Û/π ≈ 0,637·Û</b>.</p>' +
      '<p>Der <b>Effektivwert</b> (RMS, root mean square) ist die Gleichspannung, die an einem Widerstand <i>dieselbe Leistung</i> umsetzt. Die 230 V im Haushalt sind ein Effektivwert.</p>' +
      '<div class="formula">Sinus: U = Û/√2 &nbsp; Dreieck: U = Û/√3 &nbsp; Rechteck (±Û): U = Û</div>' +
      '<p>Leistung am Widerstand mit Effektivwerten: <b>P = U² / R</b>.</p>' +
      '<p><b>Wie Multimeter messen:</b> Ein <b>AVG-Geraet</b> misst den Gleichrichtwert und multipliziert mit dem <b>Formfaktor 1,11</b> (= Effektivwert/Gleichrichtwert beim Sinus). Beim Sinus stimmt das – bei Rechteck zeigt es 11 % zu viel, beim Dreieck 4 % zu wenig, bei verzerrten Kurven bis 40 % daneben. Ein <b>TRMS-Geraet</b> („true RMS“) rechnet den echten Effektivwert und stimmt bei jeder Kurvenform.</p>' +
      '<p>V~ misst nur den <b>Wechselanteil</b>. Bei einer Mischgroesse gilt fuer den gesamten Effektivwert: U<sub>ges</sub> = √(U<sub>DC</sub>² + U<sub>AC</sub>²).</p>',

  function row(n, value, wired, ledsWired) {
    var parts = [{ id: 'GND1', type: 'ground', x: 120 + 100 * n, y: 440, rot: 0 }], wires = [];

      if (value >> b & 1) e.props = { closed: true };
      parts.push(e, { id: 'L' + (b + 1), type: 'logicled', x: x, y: 200, rot: 270 });
      if (wired !== false && (ledsWired === undefined || ledsWired)) wires.push(W('E' + (b + 1) + '.out', 'L' + (b + 1) + '.in'));
    }
    return { parts: parts, wires: wires };
  }

  defTheory({

    lesson:
      '<p>In einem <b>Stellenwertsystem</b> haengt der Wert einer Ziffer von ihrer Stelle ab: <b>Wert = Ziffer · Basis<sup>Stelle</sup></b>, gelesen von rechts (Stelle 0) nach links. Die Basis bestimmt die Ziffern: dezimal (Basis 10) 0–9, dual/binaer (Basis 2) nur 0 und 1.</p>' +
      '<div class="formula">125₁₀ = 1·10² + 2·10¹ + 5·10⁰</div>' +
      '<p>Ein <b>Bit</b> ist eine Binaerstelle. Die <b>Bitbreite</b> ist die Anzahl Stellen. Das Bit ganz rechts ist das <b>niederwertigste Bit</b> (LSB, Wert 2⁰ = 1), das ganz links das <b>hoechstwertige</b> (MSB). Mit n Bits lassen sich die Zahlen 0 … 2ⁿ − 1 darstellen (4 Bit: 0 … 15).</p>' +

  defTheory({

    lesson:
      '<p>Ein <b>Gatter</b> verknuepft logische Eingaenge (0/1) zu einem Ausgang. Seine Funktion beschreibt die <b>Wahrheitstabelle</b>: jede Eingangskombination mit dem zugehoerigen Ausgang.</p>' +
      '<table class="tt"><tr><th>Gatter</th><th>Symbol (DIN)</th><th>Ausdruck</th><th>Ausgang = 1, wenn …</th></tr>' +
      '<tr><td>UND (AND)</td><td>&amp;</td><td>a = e1 ∧ e2 = e1·e2</td><td>alle Eingaenge 1</td></tr>' +
      '<tr><td>ODER (OR)</td><td>≥1</td><td>a = e1 ∨ e2 = e1 + e2</td><td>mindestens ein Eingang 1</td></tr>' +
      '<tr><td>NICHT (NOT)</td><td>1 mit Kreis</td><td>a = ē</td><td>der Eingang 0 ist</td></tr></table>' +
      '<p><b>Postulate:</b> 1 ∧ e = e · 0 ∧ e = 0 · e ∧ e = e · e ∧ ē = 0 · 1 ∨ e = 1 · 0 ∨ e = e · e ∨ ē = 1.</p>' +
      '<p><b>Beschaltungsregeln:</b> Keine offenen Eingaenge (undefinierter Pegel) – unbenutzte Eingaenge fest auf 0 oder 1 legen. Und <b>nie Ausgang gegen Ausgang</b>: Treiben zwei Ausgaenge verschiedene Pegel auf dieselbe Leitung, fliesst ein grosser Ausgleichsstrom und die Bausteine gehen kaputt.</p>',
    questions: [
      { q: 'Wann liefert ein UND-Gatter mit zwei Eingaengen eine 1?', options: ['Wenn ein Eingang 1 ist', 'Wenn beide Eingaenge 1 sind', 'Wenn beide 0 sind', 'Wenn die Eingaenge verschieden sind'], correct: 1, explain: 'UND: alle Eingaenge muessen 1 sein.' },
      { q: 'Welches Symbol steht im DIN-Kasten des ODER-Gatters?', options: ['&', '≥1', '=1', '1'], correct: 1, explain: '≥1: mindestens ein Eingang muss 1 sein.' },
      { q: 'Was ergibt e ∧ ē?', options: ['e', 'ē', '0', '1'], correct: 2, explain: 'Etwas kann nicht gleichzeitig 1 und 0 sein – das UND ist immer 0.' },
      { q: 'Was ergibt 0 ∨ e?', options: ['0', '1', 'e', 'ē'], correct: 2, explain: 'Eine 0 am ODER aendert nichts – der Ausgang folgt e.' },
      { q: 'Warum darf man zwei Gatter-Ausgaenge nicht direkt verbinden?', options: ['Weil dann nichts leuchtet', 'Weil bei verschiedenen Pegeln ein grosser Ausgleichsstrom fliesst', 'Weil das Signal zu schwach wird', 'Das ist erlaubt'], correct: 1, explain: 'Ein Ausgang zieht nach 5 V, der andere nach 0 V – Kurzschluss zwischen den Ausgangsstufen.' }
    ]
  });

  gateTask({ id: '6.1', n: 2, title: 'Das UND-Gatter', tags: ['digital.und', 'digital.gatter'], f: function (b) { return b[0] & b[1]; },
    story: 'Die Stanzmaschine darf nur stanzen, wenn beide Haende auf den Zweihandtastern liegen.',
    brief: 'Baue mit einem <b>UND-Gatter</b> die Zweihandsicherung: L1 soll nur leuchten, wenn E1 <b>und</b> E2 auf 1 stehen. Pruefe alle vier Kombinationen.',
    learn: 'UND: nur wenn alle Eingaenge 1 sind, ist der Ausgang 1.', take: 'a = e1 ∧ e2 – die Zweihandsicherung ist ein UND.',
    hint: 'E1.out → U1.in1, E2.out → U1.in2, U1.out → L1.in.', hint2: 'Das UND-Gatter liegt als Chip 74HC08 auf dem Board.',

  gateTask({ id: '6.2', n: 2, title: 'Das ODER-Gatter', tags: ['digital.oder', 'digital.gatter'], f: function (b) { return b[0] | b[1]; },
    story: 'Die Hupe soll ertoenen, wenn die Tuer offen ist oder das Fenster.',
    brief: 'Baue mit einem <b>ODER-Gatter</b> die Warnung: L1 leuchtet, sobald E1 <b>oder</b> E2 (oder beide) auf 1 stehen.',
    learn: 'ODER: mindestens ein Eingang 1 → Ausgang 1.', take: 'a = e1 ∨ e2.',
    hint: 'Gleiche Verdrahtung wie beim UND, nur mit dem ODER-Chip (74HC32).', hint2: 'E1 → in1, E2 → in2, out → L1.',

  gateTask({ id: '6.3', n: 1, title: 'Das NICHT-Gatter', tags: ['digital.nicht', 'digital.gatter'], f: function (b) { return 1 - b[0]; },
    story: 'Die Kontrolllampe „Band steht“ soll leuchten, solange der Motor-Schalter aus ist.',
    brief: 'Baue mit einem <b>NICHT-Gatter</b> (Inverter) die Anzeige: L1 leuchtet, wenn E1 = 0.',
    learn: 'NICHT kehrt um: aus 0 wird 1 und umgekehrt.', take: 'a = ē – der Kreis am Symbol bedeutet Negation.',
    hint: 'E1.out → U1.in, U1.out → L1.in.', hint2: 'Der Inverter-Chip heisst 74HC04.',
    palette: ['not'], need: { not: 1 }, gates: [['U1', 'not', ['E1']]] });

  var inhib = LG.net(2, [['U1', 'not', ['E2']], ['U2', 'and', ['E1', 'U1']]], { L1: 'U2' });
  var fInh = function (b) { return b[0] & (1 - b[1]); };
  defTask({

    story: 'Eine fremde Schaltung auf dem Board. Was macht sie? Die Werkmeisterin: „Nicht raten – alle Kombinationen durchschalten.“',
    brief: 'Schalte E1 und E2 durch alle vier Kombinationen und notiere den Ausgang L1 (0 oder 1) im Protokoll.',
    learn: 'Die Wahrheitstabelle beschreibt eine Schaltung vollstaendig.', take: 'Diese Schaltung ist eine Sperre (Inhibition): a = e1 ∧ ē2 – E2 verbietet E1.',

  });

  defTask({

  defTheory({
    id: 'T6B', ch: 6, title: 'NAND, NOR, XOR, XNOR', tags: ['digital.nand', 'digital.nor', 'digital.xor', 'digital.gatter'],
    lesson:
      '<p><b>NAND</b> = NICHT-UND: a = ¬(e1 ∧ e2) – nur bei 1/1 ist der Ausgang 0. <b>NOR</b> = NICHT-ODER: a = ¬(e1 ∨ e2) – nur bei 0/0 ist der Ausgang 1. Im Symbol steht der Negationskreis am Ausgang.</p>' +
      '<p><b>XOR</b> (Antivalenz, =1): a = e1·ē2 ∨ ē1·e2 – Ausgang 1, wenn die Eingaenge <i>verschieden</i> sind. <b>XNOR</b> (Aequivalenz): Ausgang 1, wenn die Eingaenge <i>gleich</i> sind – ein 1-Bit-Vergleicher.</p>' +
      '<p>Postulate XOR: 0 ⊕ e = e · 1 ⊕ e = ē · e ⊕ e = 0 · e ⊕ ē = 1. Mit XOR laesst sich also ein Signal wahlweise durchlassen oder invertieren.</p>' +
      '<p>NAND und NOR heissen <b>Universalgatter</b>: Aus ihnen allein laesst sich jede andere Funktion aufbauen (Kapitel 7).</p>' +
      '<p><b>Positive Logik</b>: High = 1. Bei negativer Logik waere Low = 1 – ein UND wird dann zum ODER. In diesem Kurs gilt positive Logik.</p>',
    questions: [
      { q: 'Wann ist der Ausgang eines NAND-Gatters 0?', options: ['Wenn ein Eingang 0 ist', 'Nur wenn beide Eingaenge 1 sind', 'Wenn beide 0 sind', 'Nie'], correct: 1, explain: 'NAND ist das invertierte UND.' },
      { q: 'Wann ist der Ausgang eines NOR-Gatters 1?', options: ['Nur wenn beide Eingaenge 0 sind', 'Wenn ein Eingang 1 ist', 'Wenn beide 1 sind', 'Immer'], correct: 0, explain: 'NOR ist das invertierte ODER.' },
      { q: 'Welches Gatter liefert 1, wenn die beiden Eingaenge verschieden sind?', options: ['UND', 'ODER', 'XOR', 'XNOR'], correct: 2, explain: 'XOR = Antivalenz: verschieden → 1.' },
      { q: 'Was ergibt 1 ⊕ e (XOR mit 1)?', options: ['0', '1', 'e', 'ē'], correct: 3, explain: 'XOR mit 1 invertiert das Signal.' },
      { q: 'Warum heissen NAND und NOR Universalgatter?', options: ['Sie sind am billigsten', 'Aus ihnen allein laesst sich jede Logikfunktion bauen', 'Sie haben mehr Eingaenge', 'Sie funktionieren mit jeder Spannung'], correct: 1, explain: 'NICHT, UND und ODER lassen sich nur aus NAND (oder nur aus NOR) zusammensetzen.' }
    ]
  });

  gateTask({ id: '6.6', n: 2, title: 'Das NAND-Gatter', tags: ['digital.nand', 'digital.gatter'], f: function (b) { return 1 - (b[0] & b[1]); },
    story: 'Die Stoermeldung „Nicht beide Pumpen bereit“ soll leuchten, ausser beide sind bereit.',
    brief: 'Baue die Meldung mit einem <b>NAND-Gatter</b>: L1 leuchtet, ausser E1 und E2 sind beide 1.',
    learn: 'NAND = NICHT-UND.', take: 'a = ¬(e1 ∧ e2): nur 1/1 ergibt 0.',
    hint: 'NAND-Chip 74HC00.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['nand'], need: { nand: 1 }, gates: [['U1', 'nand', ['E1', 'E2']]], wrong: [['UND statt NAND', [['U1', 'and', ['E1', 'E2']]]]] });
  gateTask({ id: '6.7', n: 2, title: 'Das NOR-Gatter', tags: ['digital.nor', 'digital.gatter'], f: function (b) { return 1 - (b[0] | b[1]); },
    story: 'Die Anzeige „Alles ruhig“ leuchtet nur, wenn weder Sensor 1 noch Sensor 2 anspricht.',
    brief: 'Baue die Ruhe-Anzeige mit einem <b>NOR-Gatter</b>.',
    learn: 'NOR = NICHT-ODER.', take: 'a = ¬(e1 ∨ e2): nur 0/0 ergibt 1.',
    hint: 'NOR-Chip 74HC02.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['nor'], need: { nor: 1 }, gates: [['U1', 'nor', ['E1', 'E2']]], wrong: [['ODER statt NOR', [['U1', 'or', ['E1', 'E2']]]]] });
  gateTask({ id: '6.8', n: 2, title: 'Die Treppenhausschaltung', tags: ['digital.xor', 'digital.gatter'], f: function (b) { return b[0] ^ b[1]; },
    story: 'Unten und oben an der Treppe ein Schalter. Jeder soll das Licht umschalten koennen – egal, wie der andere steht.',
    brief: 'Baue die Wechselschaltung mit einem <b>XOR-Gatter</b>. Pruefe: Jedes Umlegen eines Schalters wechselt den Zustand von L1.',
    learn: 'XOR: verschiedene Eingaenge → 1.', take: 'Jede Aenderung eines Eingangs kehrt den XOR-Ausgang um – genau die Wechselschaltung.',
    hint: 'XOR-Chip 74HC86.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['xor'], need: { xor: 1 }, gates: [['U1', 'xor', ['E1', 'E2']]], wrong: [['ODER statt XOR', [['U1', 'or', ['E1', 'E2']]]]] });
  gateTask({ id: '6.9', n: 2, title: 'Sind beide gleich?', tags: ['digital.xnor', 'digital.vergleicher'], f: function (b) { return b[0] === b[1] ? 1 : 0; },
    story: 'Zwei Endschalter muessen immer gleich stehen. Stimmt etwas nicht, soll die Gut-Anzeige erloeschen.',
    brief: 'Baue einen <b>1-Bit-Vergleicher</b> mit dem XNOR-Gatter: L1 leuchtet, wenn E1 und E2 gleich sind.',
    learn: 'XNOR (Aequivalenz): gleiche Eingaenge → 1.', take: 'Das XNOR ist der einfachste Vergleicher.',
    hint: 'XNOR-Chip 74HC7266.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['xnor', 'xor'], need: {}, gates: [['U1', 'xnor', ['E1', 'E2']]], wrong: [['XOR statt XNOR', [['U1', 'xor', ['E1', 'E2']]]]] });
  gateTask({ id: '6.10', n: 3, title: 'Die Alarmanlage', tags: ['digital.gatter', 'digital.entwurf'], f: function (b) { return (b[0] | b[1]) & b[2]; },
    story: 'Die Alarmanlage: Tuerkontakt (E1) oder Fensterkontakt (E2) loesen aus – aber nur, wenn die Anlage scharf geschaltet ist (E3).',
    brief: 'Baue die Alarmanlage aus Grundgattern: <b>A = (E1 ∨ E2) ∧ E3</b>.',
    learn: 'Mehrere Gatter hintereinander ergeben zusammengesetzte Funktionen.', take: 'Klammern zuerst: erst ODER, dann UND.',
    hint: 'U1 = ODER aus E1 und E2, U2 = UND aus U1 und E3.', hint2: 'U1.out → U2.in1, E3.out → U2.in2, U2.out → L1.',
    palette: ['and', 'or', 'not'], need: {}, gates: [['U1', 'or', ['E1', 'E2']], ['U2', 'and', ['U1', 'E3']]],
    wrong: [['ohne Scharfschaltung', [['U1', 'or', ['E1', 'E2']]]]] });
})();

/* Kapitel 7 – Boolesche Algebra
 * Quelle: Digitaltechnik stationaere Vorgaenge Kap. 5 (Kommutativ-, Assoziativ-, Distributivgesetze, De Morgan, Uebungsserie,
 * normierte Schaltungen), Zusammenfassung Gesetze der Booleschen Algebra (inkl. Bindungsregel, Absorption). */
(function () {
  'use strict';
  defChapter({
    id: 7, title: 'Boolesche Algebra',
    intro: 'Rechnen mit 0 und 1: Mit den Gesetzen der Booleschen Algebra machst du Schaltungen kleiner – und baust aus einem einzigen Gattertyp jede beliebige Funktion.',
    sequence: ['T7A', '7.1', '7.2', '7.3', '7.4', '7.5', 'T7B', '7.6', '7.7', '7.8', '7.9', '7.10']
  });
  var named = function (name, l) { l.name = name; return l; };
  function algTask(o) {
    var ref = LG.net(o.n, o.gates, { L1: o.gates.length ? o.gates[o.gates.length - 1][0] : o.src });
    defTask({
      id: o.id, ch: 7, title: o.title, tags: o.tags, story: o.story,
      brief: o.brief + (o.limit ? '<p class="limit">Erlaubt: hoechstens <b>' + o.limit.gates + '</b> Gatter' + (o.only ? ' – nur ' + o.only : '') + '.</p>' : '') + LG.table(o.n, o.f),
      learn: o.learn, take: o.take, hint: o.hint, hint2: o.hint2,
      palette: o.palette, need: o.need || {}, limit: o.limit,
      start: LG.io(o.n), ref: ref, bench: LG.bench(ref),
      wrong: (o.wrong || []).map(function (w) { return named(w[0], LG.net(o.n, w[1], { L1: w[1].length ? w[1][w[1].length - 1][0] : w[2] })); }),
      tests: LG.truth(o.n, o.f)
    });
  }

  defTheory({
    id: 'T7A', ch: 7, title: 'Gesetze der Booleschen Algebra', tags: ['digital.boolesche_algebra'],
    lesson:
      '<p>Mit 0 und 1 laesst sich rechnen wie mit Zahlen – nach eigenen Gesetzen. <b>Bindungsregel:</b> UND bindet staerker als ODER (wie · vor +).</p>' +
      '<table class="tt"><tr><th>Gesetz</th><th>ODER</th><th>UND</th></tr>' +
      '<tr><td>Kommutativ (vertauschen)</td><td>e1 ∨ e2 = e2 ∨ e1</td><td>e1·e2 = e2·e1</td></tr>' +
      '<tr><td>Assoziativ (verbinden)</td><td>(e1 ∨ e2) ∨ e3 = e1 ∨ (e2 ∨ e3)</td><td>(e1·e2)·e3 = e1·(e2·e3)</td></tr>' +
      '<tr><td>Distributiv (ausklammern)</td><td>e1 ∨ e2·e3 = (e1 ∨ e2)(e1 ∨ e3)</td><td>e1(e2 ∨ e3) = e1·e2 ∨ e1·e3</td></tr></table>' +
      '<p>Dazu die <b>Postulate</b> aus Kapitel 6 (e ∨ ē = 1, e·ē = 0, e ∨ 1 = 1, e·0 = 0 …) und die <b>Absorption</b>: e1 ∨ e1·e2 = e1 · e1(e1 ∨ e2) = e1 · e1 ∨ ē1·e2 = e1 ∨ e2.</p>' +
      '<p><b>Vereinfachen</b> heisst: dieselbe Wahrheitstabelle mit weniger Gattern. Beispiel: e1·e2 ∨ e1·ē2 = e1·(e2 ∨ ē2) = e1·1 = e1 – kein einziges Gatter noetig.</p>' +
      '<p>Assoziativ bedeutet praktisch: Ein UND mit drei Eingaengen baust du aus zwei UND mit je zwei Eingaengen.</p>',
    questions: [
      { q: 'Was ist nach der Bindungsregel mit e1 ∨ e2·e3 gemeint?', options: ['(e1 ∨ e2)·e3', 'e1 ∨ (e2·e3)', 'e1·e2 ∨ e3', 'Das ist nicht eindeutig'], correct: 1, explain: 'UND bindet staerker – zuerst e2·e3, dann ODER.' },
      { q: 'Vereinfache e1·e2 ∨ e1·e3.', options: ['e1 ∨ e2·e3', 'e1·(e2 ∨ e3)', 'e2·e3', 'e1'], correct: 1, explain: 'e1 ausklammern (Distributivgesetz).' },
      { q: 'Was ergibt e1 ∨ e1·e2 (Absorption)?', options: ['e1', 'e2', 'e1·e2', '1'], correct: 0, explain: 'Ist e1 = 1, ist alles 1; ist e1 = 0, ist auch e1·e2 = 0 – also bleibt e1.' },
      { q: 'Vereinfache e1·e2 ∨ e1·ē2.', options: ['e2', 'e1', '1', 'e1·e2'], correct: 1, explain: 'e1·(e2 ∨ ē2) = e1·1 = e1.' },
      { q: 'Wie viele UND-Gatter mit zwei Eingaengen brauchst du fuer e1·e2·e3·e4?', options: ['1', '2', '3', '4'], correct: 2, explain: 'Assoziativ: ((e1·e2)·e3)·e4 – drei Gatter.' }
    ]
  });

  algTask({ id: '7.1', n: 3, title: 'Drei Bedingungen', tags: ['digital.boolesche_algebra', 'digital.und'], f: function (b) { return b[0] & b[1] & b[2]; },
    story: 'Die Presse startet nur, wenn Schutztuer zu (E1), Werkstueck eingelegt (E2) und Start gedrueckt (E3).',
    brief: 'Baue <b>A = E1 · E2 · E3</b>. Es gibt nur UND-Gatter mit zwei Eingaengen.',
    learn: 'Assoziativgesetz: (e1·e2)·e3 = e1·(e2·e3).', take: 'Zwei Zweier-UND ergeben ein Dreier-UND – egal, welche beiden zuerst.',
    hint: 'Erst E1 und E2 verunden, das Ergebnis mit E3.', hint2: 'U1 = E1·E2, U2 = U1·E3.',
    palette: ['and'], limit: { gates: 2 }, gates: [['U1', 'and', ['E1', 'E2']], ['U2', 'and', ['U1', 'E3']]], wrong: [['E3 vergessen', [['U1', 'and', ['E1', 'E2']]]]] });

  algTask({ id: '7.2', n: 3, title: 'Ausklammern spart Gatter', tags: ['digital.boolesche_algebra', 'digital.vereinfachen'], f: function (b) { return (b[0] & b[1]) | (b[0] & b[2]); },
    story: 'Der Entwurf aus dem Buero: A = E1·E2 ∨ E1·E3 – drei Gatter. Der Einkauf fragt, ob es billiger geht.',
    brief: 'Baue <b>A = E1·E2 ∨ E1·E3</b> mit nur zwei Gattern.', limit: { gates: 2 },
    learn: 'Distributivgesetz: e1·e2 ∨ e1·e3 = e1·(e2 ∨ e3).', take: 'Ausklammern spart ein Gatter – gleiche Wahrheitstabelle, weniger Bauteile.',
    hint: 'Was haben beide Terme gemeinsam?', hint2: 'U1 = E2 ∨ E3, U2 = E1 · U1.',
    palette: ['and', 'or'], gates: [['U1', 'or', ['E2', 'E3']], ['U2', 'and', ['E1', 'U1']]] });

  algTask({ id: '7.3', n: 2, title: 'De Morgan I', tags: ['digital.demorgan', 'digital.boolesche_algebra'], f: function (b) { return 1 - (b[0] & b[1]); },
    story: 'Kein NAND-Chip mehr im Lager. Es gibt nur ODER- und NICHT-Gatter.',
    brief: 'Baue <b>A = ¬(E1 · E2)</b> nur mit <b>ODER und NICHT</b>.', limit: { gates: 3 }, only: 'ODER und NICHT',
    learn: 'De Morgan: ¬(e1·e2) = ē1 ∨ ē2.', take: 'Negation ueber den ganzen Term: UND wird zu ODER, jede Variable wird negiert.',
    hint: 'Beide Eingaenge einzeln invertieren, dann verodern.', hint2: 'U1 = ¬E1, U2 = ¬E2, U3 = U1 ∨ U2.',
    palette: ['or', 'not'], gates: [['U1', 'not', ['E1']], ['U2', 'not', ['E2']], ['U3', 'or', ['U1', 'U2']]],
    wrong: [['nur ein Eingang invertiert', [['U1', 'not', ['E1']], ['U3', 'or', ['U1', 'E2']]]]] });

  algTask({ id: '7.4', n: 2, title: 'De Morgan II', tags: ['digital.demorgan', 'digital.boolesche_algebra'], f: function (b) { return 1 - (b[0] | b[1]); },
    story: 'Jetzt fehlt der NOR-Chip. Im Lager: UND und NICHT.',
    brief: 'Baue <b>A = ¬(E1 ∨ E2)</b> nur mit <b>UND und NICHT</b>.', limit: { gates: 3 }, only: 'UND und NICHT',
    learn: 'De Morgan: ¬(e1 ∨ e2) = ē1 · ē2.', take: 'Auch umgekehrt: ODER wird zu UND, jede Variable wird negiert.',
    hint: 'Beide Eingaenge invertieren, dann verunden.', hint2: 'U1 = ¬E1, U2 = ¬E2, U3 = U1 · U2.',
    palette: ['and', 'not'], gates: [['U1', 'not', ['E1']], ['U2', 'not', ['E2']], ['U3', 'and', ['U1', 'U2']]] });

  algTask({ id: '7.5', n: 2, title: 'Die Nullgatter-Loesung', tags: ['digital.vereinfachen', 'digital.boolesche_algebra'], f: function (b) { return b[0]; },
    story: 'Im alten Schaltplan steht A = E1·E2 ∨ E1·Ē2. Der Chef fragt: „Wie viele Gatter brauchen wir dafuer?“',
    brief: 'Vereinfache <b>A = E1·E2 ∨ E1·Ē2</b> so weit wie moeglich und baue das Ergebnis auf.', limit: { gates: 0 },
    learn: 'e2 ∨ ē2 = 1 – eine Variable, die in beiden Zustaenden vorkommt, faellt weg.', take: 'Manchmal braucht es gar kein Gatter: A = E1.',
    hint: 'Klammere E1 aus. Was ergibt E2 ∨ Ē2?', hint2: 'A = E1 – eine Leitung von E1 zu L1 genuegt.',
    palette: ['and', 'or', 'not'], gates: [], src: 'E1', wrong: [['E2 durchgeschaltet', [], 'E2']] });

  defTheory({
    id: 'T7B', ch: 7, title: 'De Morgan und normierte Schaltungen', tags: ['digital.demorgan', 'digital.nand', 'digital.nor'],
    lesson:
      '<p><b>De Morgan:</b> Eine Negation ueber einem ganzen Term wird aufgeteilt, indem man UND und ODER vertauscht und jede Variable negiert:</p>' +
      '<div class="formula">¬(e1·e2) = ē1 ∨ ē2 &nbsp;&nbsp; ¬(e1 ∨ e2) = ē1·ē2</div>' +
      '<p><b>Normierte Schaltungen</b> bestehen aus nur einem Gattertyp – praktisch, weil man dann nur einen Chip lagern muss.</p>' +
      '<ul><li><b>NICHT aus NAND:</b> beide Eingaenge verbinden: ¬(e·e) = ē.</li>' +
      '<li><b>UND aus NAND:</b> NAND und dahinter ein NAND als Inverter.</li>' +
      '<li><b>ODER aus NAND:</b> beide Eingaenge invertieren (NAND als Inverter), dann NAND: ¬(ē1·ē2) = e1 ∨ e2.</li>' +
      '<li><b>ODER aus NOR:</b> NOR und dahinter ein NOR als Inverter.</li></ul>' +
      '<p>Ein <b>XOR aus vier NAND</b>: N1 = ¬(e1·e2), dann N2 = ¬(e1·N1), N3 = ¬(e2·N1), a = ¬(N2·N3).</p>',
    questions: [
      { q: 'Was ist ¬(e1 ∨ e2) nach De Morgan?', options: ['ē1 ∨ ē2', 'ē1 · ē2', 'e1 · e2', '¬e1 ∨ e2'], correct: 1, explain: 'ODER wird zu UND, jede Variable negiert.' },
      { q: 'Wie wird ein NAND zum Inverter?', options: ['Einen Eingang auf 0 legen', 'Beide Eingaenge verbinden', 'Den Ausgang auf 1 legen', 'Geht nicht'], correct: 1, explain: '¬(e·e) = ē.' },
      { q: 'Wie viele NAND braucht ein ODER?', options: ['1', '2', '3', '4'], correct: 2, explain: 'Zwei als Inverter fuer die Eingaenge, eines fuer die Verknuepfung.' },
      { q: 'Wie viele NAND braucht ein UND?', options: ['1', '2', '3', '4'], correct: 1, explain: 'NAND plus NAND als Inverter.' },
      { q: 'Warum baut man Schaltungen nur aus NAND?', options: ['NAND ist schneller als alle anderen', 'Ein einziger Chiptyp genuegt fuer jede Funktion', 'NAND braucht keine Versorgung', 'Weil UND verboten ist'], correct: 1, explain: 'NAND ist ein Universalgatter – weniger Lagerhaltung, einheitliche Technik.' }
    ]
  });

  var nandOnly = { limit: { gates: 1 } };
  algTask({ id: '7.6', n: 1, title: 'NICHT aus NAND', tags: ['digital.nand', 'digital.normiert'], f: function (b) { return 1 - b[0]; },
    story: 'Auf der Platine ist noch ein NAND frei. Gebraucht wird ein Inverter.',
    brief: 'Baue einen <b>Inverter nur aus einem NAND</b>.', limit: nandOnly.limit, only: 'NAND',
    learn: '¬(e·e) = ē.', take: 'Beide Eingaenge an dasselbe Signal – das NAND invertiert.',
    hint: 'Verbinde E1 mit beiden Eingaengen.', hint2: 'E1 → U1.in1 und E1 → U1.in2.',
    palette: ['nand'], gates: [['U1', 'nand', ['E1', 'E1']]] });
  algTask({ id: '7.7', n: 2, title: 'UND aus NAND', tags: ['digital.nand', 'digital.normiert'], f: function (b) { return b[0] & b[1]; },
    story: 'Nur NAND im Lager – gebraucht wird ein UND.',
    brief: 'Baue <b>A = E1 · E2</b> nur aus NAND-Gattern.', limit: { gates: 2 }, only: 'NAND',
    learn: 'UND = NAND + Inverter.', take: 'Das zweite NAND hebt die Negation des ersten wieder auf.',
    hint: 'Ein NAND verknuepft, ein zweites invertiert.', hint2: 'U1 = NAND(E1, E2), U2 = NAND(U1, U1).',
    palette: ['nand'], gates: [['U1', 'nand', ['E1', 'E2']], ['U2', 'nand', ['U1', 'U1']]], wrong: [['nur ein NAND', [['U1', 'nand', ['E1', 'E2']]]]] });
  algTask({ id: '7.8', n: 2, title: 'ODER aus NAND', tags: ['digital.nand', 'digital.normiert', 'digital.demorgan'], f: function (b) { return b[0] | b[1]; },
    story: 'Die naechste Bestellung: ein ODER. Wieder nur NAND.',
    brief: 'Baue <b>A = E1 ∨ E2</b> nur aus NAND-Gattern.', limit: { gates: 3 }, only: 'NAND',
    learn: 'De Morgan: e1 ∨ e2 = ¬(ē1 · ē2).', take: 'Eingaenge invertieren und NAND – das ist ein ODER.',
    hint: 'Zwei NAND als Inverter fuer E1 und E2, dann ein NAND.', hint2: 'U1 = NAND(E1,E1), U2 = NAND(E2,E2), U3 = NAND(U1,U2).',
    palette: ['nand'], gates: [['U1', 'nand', ['E1', 'E1']], ['U2', 'nand', ['E2', 'E2']], ['U3', 'nand', ['U1', 'U2']]] });
  algTask({ id: '7.9', n: 2, title: 'XOR aus vier NAND', tags: ['digital.nand', 'digital.normiert', 'digital.xor'], f: function (b) { return b[0] ^ b[1]; },
    story: 'Die Profiaufgabe der Werkmeisterin: „Ein XOR. Nur NAND. Hoechstens vier.“',
    brief: 'Baue <b>A = E1 ⊕ E2</b> aus hoechstens vier NAND-Gattern.', limit: { gates: 4 }, only: 'NAND',
    learn: 'Das klassische XOR aus vier NAND.', take: 'N1 = ¬(e1·e2); dann ¬(e1·N1) und ¬(e2·N1); zum Schluss NAND beider.',
    hint: 'Das erste NAND verknuepft E1 und E2; sein Ausgang geht in zwei weitere NAND.', hint2: 'U1 = NAND(E1,E2), U2 = NAND(E1,U1), U3 = NAND(E2,U1), U4 = NAND(U2,U3).',
    palette: ['nand'], gates: [['U1', 'nand', ['E1', 'E2']], ['U2', 'nand', ['E1', 'U1']], ['U3', 'nand', ['E2', 'U1']], ['U4', 'nand', ['U2', 'U3']]] });
  algTask({ id: '7.10', n: 2, title: 'ODER aus NOR', tags: ['digital.nor', 'digital.normiert'], f: function (b) { return b[0] | b[1]; },
    story: 'Ein anderes Lager, ein anderer Chip: nur NOR.',
    brief: 'Baue <b>A = E1 ∨ E2</b> nur aus NOR-Gattern.', limit: { gates: 2 }, only: 'NOR',
    learn: 'ODER = NOR + Inverter.', take: 'Ein NOR mit verbundenen Eingaengen ist ein Inverter.',
    hint: 'NOR verknuepft, zweites NOR invertiert.', hint2: 'U1 = NOR(E1,E2), U2 = NOR(U1,U1).',
    palette: ['nor'], gates: [['U1', 'nor', ['E1', 'E2']], ['U2', 'nor', ['U1', 'U1']]], wrong: [['nur ein NOR', [['U1', 'nor', ['E1', 'E2']]]]] });
})();

/* Kapitel 8 – Schaltungsentwurf und KV-Diagramm
 * Quelle: Digitaltechnik stationaere Vorgaenge Kap. 4.3.1 (Foerderband: Schaltung aus Wahrheitstabelle, DNF/KNF), Kap. 6
 * (KV-Diagramm, Uebungsserie Σm4(…) + X(…), a = niederwertigstes Bit), Pruefung KV-Diagramme. */
(function () {
  'use strict';
  defChapter({
    id: 8, title: 'Schaltungsentwurf und KV-Diagramm',
    intro: 'Vom Auftrag zur Schaltung: Wahrheitstabelle aufstellen, Ausdruck ablesen, mit dem KV-Diagramm vereinfachen – und die kleinste Schaltung bauen, die das Verlangte leistet.',
    sequence: ['T8A', '8.1', '8.2', '8.3', '8.4', '8.5', 'T8B', '8.6', '8.7', '8.8', '8.9', '8.10']
  });
  var named = function (name, l) { l.name = name; return l; };
  function designTask(o) {
    var outSrc = o.gates.length ? o.gates[o.gates.length - 1][0] : o.src;
    var ref = LG.net(o.n, o.gates, { L1: outSrc });

      '<p><b>DNF</b> (disjunktive Normalform, positive Logik): Fuer jede Zeile mit <b>A = 1</b> die Eingaenge verunden (Eingang 0 → negiert) – das ist ein <b>Minterm</b>. Alle Minterme verodern.</p>' +
