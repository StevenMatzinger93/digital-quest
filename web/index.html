  defTheory({
    id: 'T9A', ch: 9, title: 'Codes und Paritaet', tags: ['digital.codes', 'digital.paritaet'],
    lesson:
      '<p>Ein <b>Code</b> ordnet Zeichen oder Zahlen Bitmuster zu. <b>BCD</b> codiert jede Dezimalziffer mit 4 Bit. Der <b>3-Exzess-Code</b> ist BCD + 3 (0 → 0011) – praktisch fuer Rechenwerke, weil das Neunerkomplement einfach durch Invertieren entsteht. Beim <b>Gray-Code</b> aendert sich von einer Zahl zur naechsten <b>genau ein Bit</b> – wichtig fuer Drehgeber, damit beim Uebergang keine falschen Zwischenwerte entstehen.</p>' +
      '<p><b>Binaer → Gray:</b> G<sub>n</sub> = B<sub>n</sub> (hoechstes Bit bleibt), jedes weitere G<sub>i</sub> = B<sub>i+1</sub> ⊕ B<sub>i</sub>. <b>Gray → binaer:</b> B<sub>n</sub> = G<sub>n</sub>, dann B<sub>i</sub> = B<sub>i+1</sub> ⊕ G<sub>i</sub>.</p>' +
      '<p>Ein <b>Codewandler</b> wird wie jede Schaltung entworfen: Tabelle Eingangscode → Ausgangscode, fuer jedes Ausgangsbit vereinfachen.</p>' +
      '<p><b>Paritaet:</b> Ein zusaetzliches Bit macht die Anzahl Einsen gerade (gerade Paritaet). Der <b>Paritaetsbitersteller</b> (PE) beim Sender ist eine XOR-Kette ueber alle Datenbits. Der <b>Paritaetspruefer</b> (PA) beim Empfaenger rechnet das XOR ueber Daten und Paritaetsbit: Ergebnis 1 = Fehler. Ein einzelnes gekipptes Bit wird immer erkannt, zwei gleichzeitig nicht.</p>',
    questions: [
      { q: 'Was ist das Besondere am Gray-Code?', options: ['Er braucht weniger Bits', 'Benachbarte Zahlen unterscheiden sich in genau einem Bit', 'Er ist BCD + 3', 'Er hat ein Paritaetsbit'], correct: 1, explain: 'Beim Uebergang kippt nur ein Bit – keine falschen Zwischenwerte.' },
      { q: 'Wie lautet 5 im 3-Exzess-Code?', options: ['0101', '1000', '0110', '1010'], correct: 1, explain: '5 + 3 = 8 = 1000.' },
      { q: 'Datenbits 1011, gerade Paritaet. Welches Paritaetsbit?', options: ['0', '1'], correct: 1, explain: 'Drei Einsen – das Paritaetsbit 1 macht die Anzahl gerade.' },
      { q: 'Mit welchem Gatter baut man einen Paritaetsbitersteller?', options: ['UND', 'ODER', 'XOR', 'NAND'], correct: 2, explain: 'XOR ist 1 bei ungerader Anzahl Einsen.' },
      { q: 'Zwei Bits kippen bei der Uebertragung. Erkennt die Paritaetspruefung den Fehler?', options: ['Ja, immer', 'Nein – die Paritaet stimmt wieder', 'Nur beim ersten Bit', 'Nur bei Gray-Code'], correct: 1, explain: 'Zwei Fehler heben sich in der Paritaet auf.' }
    ]
  });

  task({ id: '9.1', n: 3, title: 'Paritaetsbitersteller', tags: ['digital.paritaet', 'digital.xor'], f: function (b) { return b[0] ^ b[1] ^ b[2]; },

    learn: 'P = e1 ⊕ e2 ⊕ e3 – die XOR-Kette.', take: 'XOR zaehlt modulo 2: 1 bei ungerader Anzahl Einsen.',
    hint: 'Zwei XOR hintereinander.', hint2: 'U1 = E1 ⊕ E2, U2 = U1 ⊕ E3.', names: ['P'],
    gates: [['U1', 'xor', ['E1', 'E2']], ['U2', 'xor', ['U1', 'E3']]], wrong: [['nur E1 ⊕ E2', [['U1', 'xor', ['E1', 'E2']]]]] });
  task({ id: '9.2', n: 4, title: 'Paritaetspruefer', tags: ['digital.paritaet', 'digital.xor'], f: function (b) { return b[0] ^ b[1] ^ b[2] ^ b[3]; },
    story: 'Beim Empfaenger kommen drei Datenbits (E1…E3) und das Paritaetsbit (E4) an.',
    brief: 'Baue den <b>Paritaetspruefer</b>: L1 = Fehler leuchtet, wenn die Anzahl Einsen ungerade ist.', limit: { gates: 3 },

    brief: 'Schalte einen <b>Entladewiderstand R2 = 10 kΩ</b> parallel zu C1. Nach dem Oeffnen des Schalters soll die Spannung mit τ = R2 · C = 1 s abklingen.',
    learn: 'Entladen: u(t) = U₀ · e^(−t/τ).', take: 'Nach 1 τ bleiben 37 % – nach 5 τ ist der Kondensator praktisch leer.',
    hint: 'R2 oben an C1.a, unten an C1.b.', hint2: 'Beim Laden teilt sich die Spannung (R1 : R2) – C laedt auf 10/11 · 5 V ≈ 4,55 V.',
    palette: ['resistor'], need: { resistor: 2 }, start: dis(false), ref: dis(true),
    bench: { parts: [bB1, { id: 'S1', x: 440, y: 290, rot: 0 }, { id: 'R1', x: 620, y: 290, rot: 0 }, { id: 'C1', x: 700, y: 480, rot: 90 }, { id: 'R2', x: 860, y: 480, rot: 90 }] },
    tests: [{ name: 'Laden und Entladen', steps: [
      { name: 'laden', set: { S1: { closed: true } }, run: 2, expect: [{ sel: 'C1', v: [4.4, 4.6] }] },
      { name: '1 s nach dem Ausschalten', set: { S1: { closed: false } }, run: 1, expect: [{ sel: 'C1', v: [1.5, 1.8] }] }] }]
  });

  var blink = function (f, r, withClock) {
    var l = { parts: [GND(560, 460), R('R1', r || 150, 380, 300), { id: 'D1', type: 'led', props: { color: 'gruen' }, x: 560, y: 380, rot: 90 }], wires: [W('R1.b', 'D1.a'), W('D1.k', 'GND1.g')] };
    if (withClock !== false) { l.parts.push({ id: 'CLK1', type: 'clock', props: { freq: f }, x: 200, y: 300, rot: 0 }); l.wires.push(W('CLK1.out', 'R1.a')); }
    return l;
  };
  var bBlink = { parts: [{ id: 'CLK1', x: 260, y: 380, rot: 0 }, { id: 'R1', x: 500, y: 380, rot: 0 }, { id: 'D1', x: 740, y: 480, rot: 90 }, { id: 'GND1', x: 740, y: 680, rot: 0 }] };
  var blinkStart = { parts: [{ id: 'CLK1', type: 'clock', props: { freq: 2 }, x: 200, y: 300, rot: 0 }, GND(560, 460)], wires: [] };
  defTask({
    id: '11.4', ch: 11, title: 'Die Blinkleuchte', tags: ['digital.takt', 'bauteil.led'],
    story: 'Die Warnleuchte an der Rampe soll zweimal pro Sekunde blinken. Der Taktgeber ist schon da.',
    brief: 'Schliesse eine gruene LED mit <b>Vorwiderstand</b> an den Taktgeber (2 Hz) an. Der Taktgeber liefert 5 V (High) bzw. 0 V (Low); die LED soll mit 10–20 mA leuchten.',
    learn: 'Ein Taktgeber liefert eine Rechteckspannung: T = 1/f, High und Low je halb so lang.', take: 'Bei 2 Hz ist die LED 0,25 s an und 0,25 s aus.',
    hint: 'LED-Kathode an Masse (GND1). Vorwiderstand fuer ca. 17 mA: (5 V − 2,1 V) / 0,017 A ≈ 170 Ω.', hint2: 'CLK1.out → R1 (150 Ω) → D1.a, D1.k → GND1.g.',
    palette: ['resistor', 'led'], need: { resistor: 1, led: 1 }, start: blinkStart, ref: blink(2, 150), bench: bBlink,
    wrong: [named('ohne Vorwiderstand', { parts: blink(2).parts.filter(function (p) { return p.id !== 'R1'; }), wires: [W('CLK1.out', 'D1.a'), W('D1.k', 'GND1.g')] })],
    tests: [{ name: 'Takt', steps: [
      { name: '0,1 s', run: 0.1, expect: [{ sel: 'D1', on: true, i: [0.01, 0.02] }] },
      { name: '0,4 s', run: 0.3, expect: [{ sel: 'D1', on: false }] },
      { name: '0,7 s', run: 0.3, expect: [{ sel: 'D1', on: true }, { noFault: true }] }] }]

  defTask({

    brief: 'Setze einen neuen <b>Taktgeber</b> ein und stelle <b>5 Hz</b> ein. Berechne die Periodendauer.',

    palette: ['clock'], need: { clock: 1 }, start: blink(5, 150, false), ref: blink(5, 150), bench: bBlink,

  defTheory({
    id: 'T11B', ch: 11, title: 'RC-Glieder in Schaltungen', tags: ['elektro.rc', 'elektro.filter', 'digital.takt'],
    lesson:
      '<p><b>Verzoegerung:</b> Ein RC-Glied vor einem Logikeingang verzoegert das Einschalten: Der Eingang sieht erst eine 1, wenn u<sub>C</sub> die Schaltschwelle (2,5 V bei 5 V) erreicht – nach t = τ · ln 2 ≈ 0,69 τ.</p>' +
      '<p><b>Glaettung:</b> Ein grosser Kondensator parallel zur Last nach dem Gleichrichter (Ladekondensator) wird in den Spannungsspitzen geladen und versorgt die Last dazwischen. Uebrig bleibt eine kleine <b>Brummspannung</b> – je groesser C, desto kleiner.</p>' +
      '<p><b>Tiefpass</b> (R in Reihe, C gegen Masse): laesst tiefe Frequenzen durch, daempft hohe. <b>Hochpass</b> (C in Reihe, R gegen Masse): umgekehrt. Grenzfrequenz:</p>' +
      '<div class="formula">f<sub>g</sub> = 1 / (2·π·R·C)</div>' +
      '<p>Bei f<sub>g</sub> ist die Ausgangsspannung auf 70,7 % gesunken (−3 dB).</p>' +
      '<p><b>Taktgeber</b> liefern Rechteckspannung mit Frequenz f und Periodendauer T = 1/f. Mit einem Inverter erhaelt man das Gegentaktsignal – zwei LEDs blinken abwechselnd.</p>',
    questions: [
      { q: 'Nach welcher Zeit schaltet ein Logikeingang hinter einem RC-Glied (τ = 1 s) auf 1?', options: ['0,1 s', '0,69 s', '1 s', '5 s'], correct: 1, explain: 'Die Schwelle 2,5 V ist bei 50 % erreicht: t = τ · ln 2 ≈ 0,69 s.' },
      { q: 'Wie verkleinert man die Brummspannung eines Gleichrichters?', options: ['Kleineren Ladekondensator', 'Groesseren Ladekondensator', 'Kleineren Lastwiderstand', 'Gar nicht'], correct: 1, explain: 'Ein groesserer Kondensator verliert zwischen den Spitzen weniger Spannung.' },
      { q: 'Grenzfrequenz bei R = 1 kΩ, C = 10 µF?', options: ['1,6 Hz', '15,9 Hz', '159 Hz', '1,59 kHz'], correct: 1, explain: 'f_g = 1 / (2π · 1000 · 0,00001) ≈ 15,9 Hz.' },
      { q: 'Welches Filter laesst tiefe Frequenzen durch?', options: ['Hochpass', 'Tiefpass', 'Bandsperre', 'Keines'], correct: 1, explain: 'Tiefpass: tiefe Frequenzen passieren.' },
      { q: 'Auf wie viel Prozent ist die Ausgangsspannung bei der Grenzfrequenz gesunken?', options: ['50 %', '63 %', '70,7 %', '90 %'], correct: 2, explain: '1/√2 ≈ 0,707 – das sind −3 dB.' }
    ]
  });

  var delay = function (withC) {
    var l = { parts: [{ id: 'E1', type: 'logicin', x: 160, y: 200, rot: 0 }, GND(160, 460), R('R1', 10000, 360, 200), { id: 'L1', type: 'logicled', x: 700, y: 200, rot: 0 }], wires: [W('E1.out', 'R1.a'), W('R1.b', 'L1.in')] };

  var delayStart = { parts: delay(false).parts.filter(function (p) { return p.id !== 'R1'; }), wires: [] };
  defTask({
    id: '11.6', ch: 11, title: 'Einschaltverzoegerung', tags: ['elektro.rc', 'digital.pegel', 'elektro.zeitkonstante'],
    story: 'Die Anzeige „Anlage bereit“ soll erst leuchten, wenn nach dem Einschalten alles eingeschwungen ist – etwa 0,7 s spaeter.',
    brief: 'Baue ein <b>RC-Glied</b> (R = 10 kΩ, C = 100 µF gegen Masse) zwischen Pegelschalter E1 und Logikanzeige L1. Nach dem Umschalten auf 1 soll L1 erst nach etwa 0,7 s leuchten.',

    hint: 'E1 → R1 → Knoten → L1; vom Knoten C1 gegen Masse.', hint2: 'E1.out → R1.a, R1.b → L1.in und C1.a, C1.b → GND1.g.',
    palette: ['resistor', 'capacitor'], need: { resistor: 1, capacitor: 1 }, start: delayStart, ref: delay(true),
    bench: { parts: [{ id: 'E1', x: 200, y: 300, rot: 0 }, { id: 'R1', x: 440, y: 300, rot: 0 }, { id: 'C1', x: 640, y: 480, rot: 90 }, { id: 'L1', x: 820, y: 300, rot: 0 }, { id: 'GND1', x: 640, y: 680, rot: 0 }] },
    wrong: [named('ohne Kondensator (sofort)', delay(false))],
    tests: [{ name: 'Verzoegerung', steps: [
      { name: '0,4 s nach Ein', set: { E1: { closed: true } }, run: 0.4, expect: [{ sel: 'L1', on: false }] },
      { name: '1 s nach Ein', run: 0.6, expect: [{ sel: 'L1', on: true }, { noFault: true }] }] }]
  });

    if (withC) { l.parts.push(C('C1', 470e-6, 620, 300)); l.wires.push(W('C1.a', 'R1.a'), W('C1.b', 'R1.b')); }
    return l;
  };
  defTask({
    id: '11.7', ch: 11, title: 'Der Ladekondensator', tags: ['elektro.gleichrichter', 'elektro.kondensator', 'messen.oszilloskop'],
    story: 'Der Einweggleichrichter liefert nur Buckel. Die Elektronik dahinter braucht aber eine ruhige Gleichspannung.',
    brief: 'Setze einen <b>Ladekondensator 470 µF</b> parallel zu R1. Pruefe am Oszilloskop: Die Spannung soll nahe am Scheitelwert liegen und nur wenig schwanken (Brummspannung unter 1,2 V).',
    learn: 'Der Kondensator ueberbrueckt die Luecken zwischen den Halbwellen.', take: 'Aus 2,8 V Mittelwert werden fast 9 V – mit kleiner Brummspannung.',
    hint: 'C1 oben an R1.a, unten an R1.b.', hint2: 'Oszilloskop mit Zeitbasis 50 ms: fast gerade Linie mit kleinen Zacken.',
    palette: ['capacitor'], need: { capacitor: 1 }, start: smooth(false), ref: smooth(true),
    bench: { parts: [{ id: 'G1', x: 250, y: 460, rot: 0 }, { id: 'V1', x: 480, y: 290, rot: 0 }, { id: 'R1', x: 660, y: 460, rot: 90 }, { id: 'C1', x: 820, y: 460, rot: 90 }] },
    tests: [{ name: 'geglaettet', expect: [{ a: 'R1.a', b: 'R1.b', ac: 'dc', range: [8.2, 9.4] }, { a: 'R1.a', b: 'R1.b', ac: 'pp', range: [0, 1.2] }, { noFault: true }] }],
    measure: [{ id: 'udc', ask: 'Gleichanteil an R1 (V⎓)', unit: 'V', mode: 'AC', q: 'dc', a: 'R1.a', b: 'R1.b', tol: 0.04 }, { id: 'upp', ask: 'Brummspannung (Spitze-Spitze)', unit: 'V', mode: 'AC', q: 'pp', a: 'R1.a', b: 'R1.b', tol: 0.15 }]
  });

  var lowpass = function (hp) {
    return hp ? { parts: [gen(), C('C1', 10e-6, 320, 200, 0), R('R1', 1000, 480, 300, 90)], wires: [W('G1.p', 'C1.a'), W('C1.b', 'R1.a'), W('R1.b', 'G1.n')] }
      : { parts: [gen(), R('R1', 1000, 320, 200), C('C1', 10e-6, 480, 300)], wires: [W('G1.p', 'R1.a'), W('R1.b', 'C1.a'), W('C1.b', 'G1.n')] };

  defTask({
    id: '11.8', ch: 11, title: 'Der Tiefpass', tags: ['elektro.filter', 'elektro.rc', 'messen.wechselspannung'],
    story: 'Ein Sensorsignal ist von 50-Hz-Brumm ueberlagert. Ein RC-Tiefpass soll daempfen.',
    brief: 'Baue einen <b>RC-Tiefpass</b>: R1 = 1 kΩ in Reihe, C1 = 10 µF gegen den Rueckleiter. Miss die Ausgangsspannung am Knoten zwischen R1 und C1 gegen den Rueckleiter G1.– (V~ TRMS).',
    learn: 'Tiefpass: f_g = 1/(2πRC) = 15,9 Hz – 50 Hz liegen weit darueber.', take: 'Bei 50 Hz bleiben nur rund 30 % uebrig (7,07 V → 2,1 V).',
    hint: 'G1.+ → R1 → Knoten → C1 → G1.–. Gemessen wird an C1.', hint2: 'U_a/U_e = 1/√(1 + (f/f_g)²) = 1/√(1 + 9,9) ≈ 0,30.',
    palette: ['resistor', 'capacitor'], need: { resistor: 1, capacitor: 1 }, start: { parts: [gen()], wires: [] }, ref: lowpass(false),
    bench: { parts: [{ id: 'G1', x: 250, y: 460, rot: 0 }, { id: 'R1', x: 520, y: 290, rot: 0 }, { id: 'C1', x: 760, y: 460, rot: 90 }] },
    wrong: [named('Hochpass statt Tiefpass', lowpass(true))],
    tests: [{ name: '50 Hz', expect: [{ a: 'C1.a', b: 'G1.n', ac: 'rms', range: [1.9, 2.4] }] }],
    measure: [{ id: 'ua', ask: 'Ausgangsspannung (C1.a gegen G1.–, V~)', unit: 'V', mode: 'VAC', meterType: 'trms', a: 'C1.a', b: 'G1.n', tol: 0.04 }]
  });
  defTask({
    id: '11.9', ch: 11, title: 'Der Hochpass', tags: ['elektro.filter', 'elektro.rc', 'messen.wechselspannung'],
    story: 'Jetzt umgekehrt: Ein Gleichanteil soll weg, das 50-Hz-Signal soll bleiben.',
    brief: 'Baue einen <b>RC-Hochpass</b>: C1 = 10 µF in Reihe, R1 = 1 kΩ gegen den Rueckleiter. Miss die Ausgangsspannung am Knoten zwischen C1 und R1 gegen den Rueckleiter G1.– (V~ TRMS).',
    learn: 'Hochpass: laesst Frequenzen weit ueber f_g fast ungedaempft durch.', take: 'Bei 50 Hz (≈ 3 · f_g) kommen 95 % durch: 7,07 V → 6,7 V.',
    hint: 'Nur die Reihenfolge von R und C tauschen.', hint2: 'G1.+ → C1 → Knoten → R1 → G1.–. Gemessen an R1.',
    palette: ['resistor', 'capacitor'], need: { resistor: 1, capacitor: 1 }, start: { parts: [gen()], wires: [] }, ref: lowpass(true),
    bench: { parts: [{ id: 'G1', x: 250, y: 460, rot: 0 }, { id: 'C1', x: 520, y: 290, rot: 0 }, { id: 'R1', x: 760, y: 460, rot: 90 }] },
    wrong: [named('Tiefpass statt Hochpass', lowpass(false))],
    tests: [{ name: '50 Hz', expect: [{ a: 'R1.a', b: 'G1.n', ac: 'rms', range: [6.4, 7.0] }] }],
    measure: [{ id: 'ua', ask: 'Ausgangsspannung (R1.a gegen G1.–, V~)', unit: 'V', mode: 'VAC', meterType: 'trms', a: 'R1.a', b: 'G1.n', tol: 0.04 }]
  });

  var alt = function (withNot) {
    var l = { parts: [{ id: 'CLK1', type: 'clock', props: { freq: 1 }, x: 160, y: 200, rot: 0 }, GND(160, 460), R('R1', 150, 400, 160), R('R2', 150, 400, 320),
      { id: 'D1', type: 'led', props: { color: 'rot' }, x: 560, y: 160, rot: 0 }, { id: 'D2', type: 'led', props: { color: 'gelb' }, x: 560, y: 320, rot: 0 }],
      wires: [W('CLK1.out', 'R1.a'), W('R1.b', 'D1.a'), W('D1.k', 'GND1.g'), W('R2.b', 'D2.a'), W('D2.k', 'GND1.g')] };
    if (withNot) { l.parts.push({ id: 'U1', type: 'not', x: 280, y: 320, rot: 0 }); l.wires.push(W('CLK1.out', 'U1.in'), W('U1.out', 'R2.a')); }
    else l.wires.push(W('CLK1.out', 'R2.a'));
    return l;
  };
  var altStart = { parts: alt(true).parts.filter(function (p) { return p.id !== 'U1'; }), wires: [W('CLK1.out', 'R1.a'), W('R1.b', 'D1.a'), W('D1.k', 'GND1.g'), W('R2.b', 'D2.a'), W('D2.k', 'GND1.g')] };
  defTask({
    id: '11.10', ch: 11, title: 'Der Wechselblinker', tags: ['digital.takt', 'digital.nicht'],
    story: 'Am Bahnuebergang blinken zwei Lampen abwechselnd. Rot ist angeschlossen – Gelb soll genau dann leuchten, wenn Rot aus ist.',

    learn: 'Ein Inverter erzeugt das Gegentaktsignal.', take: 'CLK und ¬CLK: immer genau eine LED an.',
    hint: 'Zwischen Taktgeber und R2 gehoert ein NICHT-Gatter.', hint2: 'CLK1.out → U1.in, U1.out → R2.a.',
    palette: ['not', 'and', 'or'], need: { not: 1 }, start: altStart, ref: alt(true),
    bench: { parts: [{ id: 'CLK1', x: 240, y: 260, rot: 0 }, { id: 'GND1', x: 240, y: 680, rot: 0 }, { id: 'R1', x: 560, y: 200, rot: 0 }, { id: 'R2', x: 560, y: 440, rot: 0 }, { id: 'D1', x: 790, y: 200, rot: 0 }, { id: 'D2', x: 790, y: 440, rot: 0 }, { id: 'U1', x: 380, y: 440, rot: 0 }] },
    wrong: [named('beide im Gleichtakt', alt(false))],
    tests: [{ name: 'Gegentakt', steps: [
      { name: '0,2 s', run: 0.2, expect: [{ sel: 'D1', on: true }, { sel: 'D2', on: false }] },
      { name: '0,7 s', run: 0.5, expect: [{ sel: 'D1', on: false }, { sel: 'D2', on: true }, { noFault: true }] }] }]
  });
})();

/* ==== content/ch12.js ==== */
/* Kapitel 12 – Flipflops und Zaehler
 * Quelle: Digitaltechnik zeitabhaengige Vorgaenge (NOR-Flip-Flop mit Analyse-/Ansteuertabelle, NOR-AND-Flip-Flop,
 * Steuerungsarten, T-, D-, R-S-, J-K-Flip-Flop, asynchrone Zaehler, synchrone Zaehler, Johnson-Zaehler). */
(function () {
  'use strict';
  defChapter({
    id: 12, title: 'Flipflops und Zaehler',
    intro: 'Schaltungen mit Gedaechtnis: Ein Flipflop merkt sich ein Bit, mehrere Flipflops zaehlen. Den Takt gibst du selbst mit einem Pegelschalter – Schritt fuer Schritt, wie im Praktikum.',
    sequence: ['T12A', '12.1', '12.2', '12.3', '12.4', '12.5', 'T12B', '12.6', '12.7', '12.8', '12.9', '12.10']
  });
  var named = function (name, l) { l.name = name; return l; };
  var G = { id: 'GND1', type: 'ground', x: 120, y: 560, rot: 0 };
  var E = function (i, x, y, on) { var e = { id: 'E' + i, type: 'logicin', x: x || 160, y: y, rot: 0 }; if (on) e.props = { closed: true }; return e; };
  var L = function (i, x, y) { return { id: 'L' + i, type: 'logicled', x: x || 860, y: y, rot: 0 }; };
  var P = function (id, type, x, y) { return { id: id, type: type, x: x, y: y, rot: 0 }; };
  /* Takt per Pegelschalter: n Pulse (0 → 1 → 0), optional mit Erwartung nach dem letzten Puls */
  function pulses(key, n, expect) { var s = []; for (var k = 0; k < n; k++) s.push({ set: (function () { var o = {}; o[key] = { closed: true }; return o; })() }, { set: (function () { var o = {}; o[key] = { closed: false }; return o; })() }); if (expect) s[s.length - 1].expect = expect; return s; }
  var on = function (id, v) { return { sel: id, on: !!v }; };

  defTheory({
    id: 'T12A', ch: 12, title: 'Das Flipflop – ein Bit Gedaechtnis', tags: ['digital.flipflop', 'digital.speicher'],
    lesson:
      '<p>Zwei <b>NOR-Gatter</b>, deren Ausgaenge jeweils auf einen Eingang des anderen zurueckgefuehrt sind, bilden das <b>RS-Flipflop</b>. S = 1 <b>setzt</b> (Q = 1), R = 1 <b>setzt zurueck</b> (Q = 0), S = R = 0 <b>speichert</b> den letzten Zustand. S = R = 1 ist der <b>verbotene Zustand</b> (Q und Q̄ beide 0).</p>' +
      '<p>Die <b>Analysetabelle</b> zeigt den neuen Zustand A abhaengig vom alten Zustand A<sub>V</sub>; die <b>Ansteuertabelle</b> sagt, welche Eingaenge noetig sind, um von A<sub>V</sub> nach A zu kommen (X = egal).</p>' +
      '<p><b>Steuerungsarten:</b> <i>Zustandsgesteuert</i> – der Takteingang C gibt die Eingaenge frei, solange C = 1 ist (getaktetes RS mit UND-Gattern davor). <i>Flankengesteuert</i> – nur im Moment der steigenden Taktflanke (0 → 1) wird uebernommen.</p>' +
      '<p><b>D-Flipflop:</b> uebernimmt D bei der Taktflanke. <b>T-Flipflop:</b> kippt bei jeder Flanke, wenn T = 1 (Frequenzteiler durch 2). <b>JK-Flipflop:</b> J = 1 setzt, K = 1 setzt zurueck, J = K = 1 kippt, J = K = 0 speichert.</p>',
    questions: [
      { q: 'RS-Flipflop: Was passiert bei S = 0 und R = 0?', options: ['Q = 0', 'Q = 1', 'Q behaelt seinen Zustand', 'verbotener Zustand'], correct: 2, explain: 'Keine Ansteuerung – das Flipflop speichert.' },
      { q: 'Welche Kombination ist beim NOR-RS-Flipflop verboten?', options: ['S = 0, R = 0', 'S = 1, R = 0', 'S = 0, R = 1', 'S = 1, R = 1'], correct: 3, explain: 'Beide Ausgaenge werden 0 – Q und Q̄ sind nicht mehr invers.' },

  defTheory({
    id: 'T12B', ch: 12, title: 'Zaehler', tags: ['digital.zaehler', 'digital.flipflop'],
    lesson:
      '<p>Mehrere T-Flipflops (T = 1) hintereinander bilden einen <b>Dualzaehler</b>: Jede Stufe teilt die Frequenz durch 2 und stellt ein Bit dar (FF1 = Bit 0 = Wert 1, FF2 = Bit 1 = Wert 2 …).</p>' +
      '<p><b>Asynchroner Zaehler</b> (Ripple Counter): Nur FF1 bekommt den Takt, jede weitere Stufe wird vom <b>Q̄-Ausgang</b> der vorherigen getaktet (steigende Flanke an Q̄ = fallende an Q → Aufwaertszaehler). Einfach, aber die Stufen schalten nacheinander – kurze falsche Zwischenwerte.</p>' +
      '<p><b>Synchroner Zaehler:</b> Alle Flipflops haengen am <b>selben Takt</b>. Die Logik an J/K bestimmt, wer kippt: FF1 immer (J = K = 1), FF2 wenn Q1 = 1, FF3 wenn Q1·Q2 = 1 … Alle Stufen schalten gleichzeitig.</p>' +
      '<p>Ein n-Bit-Zaehler zaehlt von 0 bis 2ⁿ − 1 und beginnt dann von vorn. Ein <b>BCD-Zaehler</b> springt nach 9 auf 0 zurueck.</p>' +
      '<p><b>Johnson-Zaehler:</b> Schieberegister, dessen invertierter letzter Ausgang auf den Eingang zurueckgefuehrt ist. 2 Stufen: 00 → 10 → 11 → 01 → 00 – pro Takt aendert sich genau ein Bit.</p>',
    questions: [
      { q: 'Bis zu welcher Zahl zaehlt ein 3-Bit-Dualzaehler?', options: ['3', '6', '7', '8'], correct: 2, explain: '2³ − 1 = 7, dann wieder 0.' },
      { q: 'Woher bekommt beim asynchronen Aufwaertszaehler das zweite Flipflop seinen Takt?', options: ['Vom gemeinsamen Takt', 'Vom Q̄-Ausgang der ersten Stufe', 'Von J', 'Gar nicht'], correct: 1, explain: 'Die Stufen takten sich nacheinander – daher „asynchron“.' },
      { q: 'Was ist der Vorteil des synchronen Zaehlers?', options: ['Weniger Flipflops', 'Alle Stufen schalten gleichzeitig', 'Er braucht keinen Takt', 'Er zaehlt rueckwaerts'], correct: 1, explain: 'Kein Durchlaufen der Stufen – keine falschen Zwischenwerte.' },
      { q: 'Wann kippt beim synchronen 2-Bit-Zaehler das zweite JK-Flipflop?', options: ['Bei jedem Takt', 'Wenn Q1 = 1', 'Wenn Q1 = 0', 'Nie'], correct: 1, explain: 'J2 = K2 = Q1.' },
      { q: 'Wie viele Zustaende durchlaeuft ein 2-stufiger Johnson-Zaehler?', options: ['2', '3', '4', '8'], correct: 2, explain: '00, 10, 11, 01 – vier Zustaende (2·n).' }
    ]
  });

  function counter(n, withLeds, sync) {

      if (withLeds !== false) parts.push(L(i, 860, 120 + 110 * i));

    return { parts: parts, wires: wires };
  }

    return l;
  }

  defTheory({
    id: 'T14B', ch: 14, title: 'Bandpass, Bandsperre, Signalformung', tags: ['elektro.filter', 'elektro.rc'],
    lesson:
      '<p>Ein <b>Bandpass</b> entsteht aus Hochpass und Tiefpass hintereinander: Er laesst nur einen Frequenzbereich um die <b>Mittenfrequenz</b> durch. Eine <b>Bandsperre</b> unterdrueckt einen Bereich. Ein RC-Bandpass aus je einer Stufe ist ein Filter 1. Ordnung auf beiden Seiten.</p>' +
      '<p>RC-Glieder <b>formen Signale</b>: Ist τ viel kleiner als die Periodendauer, wirkt ein Hochpass als <b>Differenzierglied</b> – aus einem Rechteck werden Nadelimpulse an den Flanken. Ist τ viel groesser, wirkt ein Tiefpass als <b>Integrierglied</b> – aus einem Rechteck wird ein Dreieck, bei sehr grossem τ nahezu der Mittelwert (so wird aus einem Taktsignal eine Gleichspannung).</p>' +

  defTheory({
    id: 'T15B', ch: 15, title: 'Steuerung und Sicherheit', tags: ['steuerung.selbsthaltung', 'sicherheit.nothalt', 'messen.drehzahl'],
    lesson:
      '<p><b>Start/Stopp mit Selbsthaltung:</b> Der Start-Taster wird nur kurz gedrueckt. Damit der Motor weiterlaeuft, fuehrt man den Ausgang zurueck auf den Eingang – er <b>haelt sich selbst</b>:</p>' +
      '<div class="formula">Q = (Start ∨ Q) ∧ Stopp</div>' +
      '<p>Der <b>Stopp-Taster ist ein Oeffner</b> (im Ruhezustand 1). Das ist <b>drahtbruchsicher</b>: Reisst die Leitung, ist das Signal 0 – die Anlage stoppt, statt unkontrollierbar weiterzulaufen. Werden Start und Stopp gleichzeitig gedrueckt, gewinnt Stopp (<b>stoppdominant</b>).</p>' +
      '<p>Der <b>Not-Halt</b> ist ebenfalls ein Oeffner und <b>uebersteuert alles</b>. Wichtig: Nach dem Entriegeln darf die Anlage <b>nicht von selbst wieder anlaufen</b> – der Not-Halt muss deshalb die Selbsthaltung loeschen, nicht nur den Ausgang sperren. Erst ein neuer Start setzt die Anlage wieder in Gang.</p>' +
      '<p><b>Drehzahlmessung:</b> Ein Impulsgeber (Lochscheibe + Lichtschranke) liefert pro Umdrehung eine feste Zahl Impulse. Ein Zaehler zaehlt nur waehrend der <b>Torzeit</b> (UND-Verknuepfung von Impulsen und Tor). Drehzahl = Impulse / (Torzeit · Impulse pro Umdrehung), mal 60 fuer 1/min.</p>' +
      '<p><b>Fehlersuche an der Anlage:</b> Den Signalweg vom Taster bis zum Motor Block fuer Block verfolgen und an jedem Uebergang messen. Liegt an einem Bauteil die volle Spannung, aber es fliesst kein Strom, ist es unterbrochen.</p>',
    questions: [
      { q: 'Warum ist der Stopp-Taster ein Oeffner?', options: ['Weil er billiger ist', 'Drahtbruchsicher: Leitungsbruch wirkt wie Stopp', 'Damit der Motor schneller startet', 'Das ist egal'], correct: 1, explain: 'Ein Bruch der Leitung ergibt 0 = Stopp.' },
      { q: 'Was bewirkt die Selbsthaltung?', options: ['Der Motor laeuft nur, solange Start gedrueckt ist', 'Der Motor laeuft nach dem Loslassen von Start weiter', 'Der Motor laeuft rueckwaerts', 'Sie ersetzt den Not-Halt'], correct: 1, explain: 'Der Ausgang haelt sich ueber die Rueckfuehrung selbst.' },

      { q: 'Ein Impulsgeber liefert 1 Impuls pro Umdrehung. In 0,5 s Torzeit werden 5 Impulse gezaehlt. Drehzahl?', options: ['5 1/min', '10 1/min', '300 1/min', '600 1/min'], correct: 3, explain: '5 / 0,5 s = 10 1/s = 600 1/min.' },
      { q: 'Start und Stopp werden gleichzeitig gedrueckt. Was macht Q = (Start ∨ Q) ∧ Stopp?', options: ['Motor laeuft', 'Motor steht (stoppdominant)', 'Motor wechselt die Richtung', 'Unbestimmt'], correct: 1, explain: 'Gedrueckter Oeffner = 0, das UND sperrt.' }

  /* ---------- Multimeter ---------- */
  function setMeterMode(mode) {
    meter.mode = mode;
    $$('[data-mm]').forEach(function (b) { b.classList.toggle('on', b.dataset.mm === mode); });
    if (ed) { ed.tool = mode === 'OFF' ? 'wire' : 'probe'; if (mode === 'OFF') { ed.probes = { a: null, b: null }; meter.a = meter.b = null; meter.next = 'a'; } core.redraw(); }
    log('meter_mode', { id: current.task && current.task.id, mode: mode });
    $('#mmHelp').textContent = mode === 'OFF' ? 'Messgeraet aus. Klick auf Anschluesse verbindet Leitungen.' :
      'Klick auf einen Anschluss setzt die ' + (meter.next === 'a' ? 'rote (+)' : 'schwarze (COM)') + ' Messspitze.';
    if (ed) tick(0);
  }
  function setProbe(pin) {
    meter[meter.next] = pin; ed.probes[meter.next] = pin;
    meter.next = meter.next === 'a' ? 'b' : 'a';
    $('#mmHelp').textContent = 'Naechster Klick setzt die ' + (meter.next === 'a' ? 'rote (+)' : 'schwarze (COM)') + ' Spitze.';
    log('probe', { id: current.task && current.task.id, mode: meter.mode, pin: pin });
    tick(0);
  }
  /* Wechselgroessen (V~, und V⎓ bei schnellen Wechselquellen = Mittelwert) – nur neu rechnen, wenn sich Aufbau oder Spitzen aendern */
  function acReading() {
    var key = JSON.stringify(ed.layout) + '|' + meter.a + '|' + meter.b;
    if (meter.acKey !== key) { meter.acKey = key; meter.ac = E.acMeasure(ed.layout, { a: meter.a, b: meter.b }); }
    return meter.ac;
  }
  function slowestFreq() {
    var f = Infinity; (live.net ? live.net.parts : []).forEach(function (p) { if ((p.type === 'acsource' || p.type === 'clock') && p.props.freq > 0) f = Math.min(f, p.props.freq); }); return f;
  }
  /* Anzeige wie ein 6000-Digit-DMM (Bereichswahl, +0,2 % Kalibrierfehler, letzte Stelle flackert) */
  function updateMeter(r, mn) {
    var lcd = $('#lcd'), txt = '— — —', warn = '', sub = meter.mode === 'VAC' ? 'AC ' + (meterType() === 'avg' ? 'AVG' : 'TRMS') : meter.mode === 'V' || meter.mode === 'A' ? 'DC' : '';
    if (meter.mode === 'OFF') txt = 'OFF';
    else if (!mn) txt = meter.mode === 'R' ? '0L Ω' : '- - -';
    else if (meter.mode === 'V') {
      var vdc = r.nodeV[mn.a] - r.nodeV[mn.b];
      var fs = slowestFreq(); if (isFinite(fs) && fs >= 5) { var ac1 = acReading(); if (ac1.ok) vdc = ac1.dc; } // DMM zeigt bei schnellem Wechsel den Mittelwert (ohne Wechselquelle: Momentanwert mit Eigenverbrauch)
      txt = E.dmm(vdc, 'V').text;
    } else if (meter.mode === 'VAC') {
      var ac = acReading();
      if (!ac.ok) { txt = 'Err'; warn = ac.error; }
      else { txt = E.dmm(meterType() === 'avg' ? ac.avg : ac.rms, 'V').text; if (ac.static) warn = 'Keine Wechselquelle im Aufbau – V~ zeigt nur den Wechselanteil (hier 0).'; }
    } else if (meter.mode === 'A') {
      if (live.state.fuse) {
        txt = 'FUSE';
        var fi = live.state.fuseInfo;
        warn = 'Sicherung durchgebrannt' + (fi ? ': Durch das Messgeraet waeren ' + E.fmt(Math.abs(fi.i), 'A') + ' geflossen (Sicherung ' + E.fmt(fi.imax, 'A') + ')' : '') + '. Das Amperemeter hat fast 0 Ω – es gehoert in Reihe, nie parallel zu einer Quelle.';
      } else txt = E.dmm((r.nodeV[mn.a] - r.nodeV[mn.b]) / E.METER.rA, 'A').text;
    } else if (meter.mode === 'R') {
      var m = E.measure(ed.layout, { mode: 'R', a: meter.a, b: meter.b }, live.state);
      txt = m.ok ? E.dmm(m.value, 'Ω').text.replace('OL', '0L') : 'Err'; warn = m.ok ? '' : m.error;
    }
    lcd.textContent = txt;
    if (bench) bench.meter = { mode: meter.mode, text: txt, fuse: live.state.fuse, sub: sub };
    $('#mmWarn').textContent = warn; $('#btnFuse').hidden = !live.state.fuse;
    $('#mmProbes').innerHTML = '<span class="pr red">+ ' + esc(meter.a || '–') + '</span><span class="pr black">COM ' + esc(meter.b || '–') + '</span>';
  }

  /* ---------- Eigenschaften ---------- */
  function renderInspector() {

    if (!p) { el.innerHTML = '<p class="dim small">Bauteil anklicken, um Werte zu aendern. <kbd>R</kbd> dreht, <kbd>Entf</kbd> loescht.</p>'; return; }
    var d = E.PARTS[p.type], q = p.props || (p.props = {}), lock = ed.locked[p.id] && p.type !== 'acsource' && p.type !== 'clock', val = p.value !== undefined ? p.value : (q.value !== undefined ? q.value : d.props.value);
    var r = live.res && live.res.parts[p.id];
    var h = '<div class="insp-head"><b>' + esc(p.id) + '</b> ' + esc(d.label) + (lock ? ' <span class="tag">Aufgabe</span>' : '') + '</div>';
    function field(label, key, v, unit) { return '<label class="fld"><span>' + label + '</span><input data-prop="' + key + '" value="' + esc(v) + '"' + (lock ? ' disabled' : '') + '><em>' + unit + '</em></label>'; }

    if (p.type === 'resistor' || p.type === 'lamp' || p.type === 'pot' || p.type === 'motor') h += field('Widerstand', 'value', Editor.fmtVal(val), 'Ω');
    if (p.type === 'zener') h += field('Z-Spannung', 'vz', q.vz || d.props.vz, 'V');
    if (p.type === 'npn') h += field('Stromverstaerkung β', 'beta', q.beta || d.props.beta, '');
    if (p.type === 'capacitor') h += field('Kapazitaet', 'value', Editor.fmtVal(val), 'F');
    if (p.type === 'clock') h += field('Frequenz', 'freq', q.freq || d.props.freq, 'Hz');
    if (p.type === 'acsource') {
      h += field('Scheitelwert Û', 'value', Editor.fmtVal(val), 'V') + field('Frequenz', 'freq', q.freq || d.props.freq, 'Hz');
      h += '<label class="fld"><span>Gleichanteil</span><input data-prop="offset" value="' + esc(q.offset || 0) + '"' + (lock ? ' disabled' : '') + '><em>V</em></label>';
      h += '<label class="fld"><span>Kurvenform</span><select data-prop="shape"' + (lock ? ' disabled' : '') + '>' + [['sine', 'Sinus'], ['square', 'Rechteck'], ['triangle', 'Dreieck']].map(function (o) {
        return '<option value="' + o[0] + '"' + ((q.shape || 'sine') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>';
    }
    if (p.type === 'pot') h += '<label class="fld"><span>Schleifer</span><input type="range" min="0" max="1" step="0.01" data-prop="pos" value="' + (q.pos !== undefined ? q.pos : 0.5) + '"></label>';
    if (p.type === 'led') {
      h += '<label class="fld"><span>Farbe</span><select data-prop="color"' + (lock ? ' disabled' : '') + '>' + Object.keys(E.LED_COLORS).map(function (c) { return '<option' + ((q.color || 'rot') === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>';
    }
    if (p.type === 'switch') h += '<button class="btn small" id="tgl">' + (q.closed ? 'Oeffnen' : 'Schliessen') + '</button>';
    if (p.type === 'logicin') h += '<button class="btn small" id="tgl">Pegel auf ' + (q.closed ? '0' : '1') + ' schalten</button>';
    if (r) {
      h += '<dl class="readout">';
      if (r.v !== undefined) h += '<dt>U</dt><dd>' + E.fmt(Math.abs(r.v), 'V') + '</dd>';
      if (r.i !== undefined) h += '<dt>I</dt><dd>' + E.fmt(Math.abs(r.i), 'A') + '</dd>';
      if (r.p !== undefined) h += '<dt>P</dt><dd>' + E.fmt(Math.abs(r.p), 'W') + '</dd>';
      if (r.burnt) h += '<dt>!</dt><dd class="err">defekt</dd>';
      h += '</dl><p class="dim tiny">Direktanzeige der Simulation – im Protokoll zaehlt, was du mit dem Messgeraet misst.</p>';
    }
    el.innerHTML = h;
    $$('[data-prop]', el).forEach(function (inp) {
      inp.onchange = inp.oninput = function (ev) {
        var k = inp.dataset.prop, v = inp.value;
        if (k === 'offset') { var o = parseFloat(String(v).replace(',', '.')); if (!isFinite(o)) { inp.classList.add('bad'); return; } inp.classList.remove('bad'); if (ev.type !== 'change') return; q.offset = o; }
        else if (k === 'value' || k === 'freq' || k === 'vz' || k === 'beta') { var n = parseVal(v); if (!(n > 0)) { inp.classList.add('bad'); return; } inp.classList.remove('bad'); if (ev.type !== 'change') return; v = n; if (k === 'value') { p.value = n; delete q.value; } else q[k] = n; }
        else if (k === 'pos') q.pos = +v; else q[k] = v;
        persistDraft(); rebuild(); core.redraw(); if (k !== 'pos') renderInspector();
      };
    });
    var tg = $('#tgl'); if (tg) tg.onclick = function () { q.closed = !q.closed; persistDraft(); rebuild(); renderInspector(); };
  }

  /* ---------- Oszilloskop ---------- */
  function scope() {
    var cv = $('#scope'), ctx = cv.getContext('2d'), T = +$('#tb').value;
    var w = cv.width = cv.clientWidth * (window.devicePixelRatio || 1), h = cv.height = cv.clientHeight * (window.devicePixelRatio || 1);
    ctx.fillStyle = '#07090a'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,176,0,0.12)'; ctx.lineWidth = 1;
    for (var i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(w * i / 10, 0); ctx.lineTo(w * i / 10, h); ctx.stroke(); }
    for (i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, h * i / 8); ctx.lineTo(w, h * i / 8); ctx.stroke(); }
    if (!meter.a) { $('#scopeInfo').textContent = 'Setze zuerst die rote Messspitze (Multimeter V).'; bench.scope = { pts: [], info: 'Zuerst rote Messspitze setzen (V)' }; bench.render(); return; }
    var s;
    try { s = E.simulate(ed.layout, { dt: T / 400, tEnd: T, probes: [{ a: meter.a, b: meter.b || undefined }] }).samples; }
    catch (e) { $('#scopeInfo').textContent = e.message; return; }
    var vs = s.map(function (x) { return x.ch0; }), mx = Math.max.apply(null, vs), mn = Math.min.apply(null, vs);
    var top = Math.max(1, Math.ceil(Math.max(mx, 0) * 1.1)), bot = Math.min(0, Math.floor(mn * 1.1));
    ctx.strokeStyle = '#ffb000'; ctx.lineWidth = 2 * (window.devicePixelRatio || 1); ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 6; ctx.beginPath();
    s.forEach(function (x, k) { var px = x.t / T * w, py = h - (x.ch0 - bot) / (top - bot) * h; if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
    ctx.stroke(); ctx.shadowBlur = 0;
    $('#scopeInfo').textContent = 'Kanal: ' + meter.a + ' gegen ' + (meter.b || 'Masse') + ' · ' + bot + '…' + top + ' V · max ' + E.fmt(mx, 'V') + ' · min ' + E.fmt(mn, 'V');
    var stepN = Math.max(1, Math.floor(s.length / 150));
    bench.scope = { pts: s.filter(function (x, k) { return k % stepN === 0; }).map(function (x) { return [x.t / T, (x.ch0 - bot) / (top - bot)]; }),
      info: 'CH1 ' + meter.a + (meter.b ? '–' + meter.b : '') + ' · ' + bot + '…' + top + ' V · ' + $('#tb').selectedOptions[0].textContent };
    bench.render();
    log('scope', { id: current.task && current.task.id, T: T });
  }

    setView(viewMode, true);
    $('#btnFlow').onclick = function () { S.settings.flow = !S.settings.flow; save(); if (ed) { ed.showFlow = bench.showFlow = S.settings.flow; core.redraw(); } this.classList.toggle('on', S.settings.flow); log('flow', { on: S.settings.flow }); };
    $('#btnReplay').onclick = function () { if (live.replay) closeReplay(); else openReplay(); };
    $('#rpSlider').oninput = function () { showStep(+this.value); };
    $('#rpPrev').onclick = function () { if (live.replay) showStep(live.replay.i - 1); };
    $('#rpNext').onclick = function () { if (live.replay) showStep(live.replay.i + 1); };
    $('#rpPlay').onclick = playReplay;
    $('#rpClose').onclick = function () { closeReplay(); };
    $$('[data-mt]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.mt === meterType());
      b.onclick = function () { S.settings.meterType = b.dataset.mt; save(); $$('[data-mt]').forEach(function (x) { x.classList.toggle('on', x.dataset.mt === meterType()); }); if (ed) tick(0); };
    });
    $('#btnVolt').onclick = function () { ed.showVolt = bench.showVolt = !ed.showVolt; this.classList.toggle('on', ed.showVolt); core.redraw(); };
    $('#btnRepair').onclick = function () { live.state = E.newState(); rebuild(); status([{ cls: 'info', text: 'Defekte Bauteile ersetzt.' }]); };
    $('#btnReset').onclick = function () {
      modal('<h2>Aufgabe zuruecksetzen?</h2><p>Deine Schaltung wird auf den Startzustand gesetzt.</p>', [{ label: 'Abbrechen' }, { label: 'Zuruecksetzen', primary: true, action: function () { delete S.drafts[current.task.id]; save(); openTask(current.task); } }]);
    };
    $('#btnFuse').onclick = function () { live.state.fuse = false; tick(0); };
    $$('[data-mm]').forEach(function (b) { b.onclick = function () { setMeterMode(b.dataset.mm); }; });
    $('#btnScope').onclick = scope;
    document.addEventListener('keydown', function (ev) {
      if (current.screen !== 'task' || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      if (live.replay) { if (ev.key === 'ArrowLeft') showStep(live.replay.i - 1); else if (ev.key === 'ArrowRight') showStep(live.replay.i + 1); else if (ev.key === 'Escape') closeReplay(); return; }
      ed && ed.key(ev); renderInspector();
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    renderMap(); show('map');
  }

  window.DigitalQuest = { get state() { return S; }, openItem: openItem, get editor() { return ed; }, get bench() { return bench; }, get core() { return core; }, setView: setView, get view() { return viewMode; }, get live() { return live; }, engine: E, parseVal: parseVal };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
