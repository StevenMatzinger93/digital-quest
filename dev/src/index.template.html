<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Quest</title>
<meta name="description" content="Digital Quest – Schaltungen bauen, messen, verstehen.">
<meta name="theme-color" content="#121212">
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap">
<style>/*CSS*/</style>
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="#/karte" title="Zur Startseite"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 2-6h8"/></svg><span>DIGITAL<b>QUEST</b></span></a>
  <span id="modeTag" class="mode-tag" hidden title="Dozentenmodus: mit einem Dozenten-Konto angemeldet – alle Stationen offen">DOZENT</span>
  <nav><button data-go="map">Karte</button><button data-go="manual">Handbuch</button><button data-go="tutorial" title="Bedienung der Messgeräte auf der Werkbank üben"><span class="long">Werkbank-</span>Tutorial</button><button data-go="settings">Einstellungen</button></nav>
  <button class="calc-btn" id="btnCalc" title="Taschenrechner (Strg+Alt+R)" aria-label="Taschenrechner"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h2M8 16h2M12 16h2M16 16v1"/></svg></button>
  <a id="acctChip" class="acct-chip" href="../" hidden></a>
  <span id="saveInd"></span>
</header>
<main>
  <section id="scr-map" class="screen"></section>
  <section id="scr-task" class="screen">
    <aside class="panel" id="taskInfo"></aside>
    <div class="center">
      <div class="toolbar">
        <div id="palette"></div><span class="sep"></span>
        <button class="tb" id="btnRot" title="Drehen (R)">⟳ Drehen</button>
        <button class="tb" id="btnDel" title="Löschen (Entf)">✕ Löschen</button>
        <button class="tb" id="btnFit" data-tip="Werkbank: Zoom mit Strg + Mausrad, Verschieben durch Ziehen auf der leeren Tischfläche" title="Ansicht einpassen">⤢ Einpassen</button>
        <button class="tb" id="btnVolt" title="Knotenspannungen einfärben">U anzeigen</button>
        <button class="tb" id="btnFlow" title="Stromfluss zeigen: Punkte wandern in technischer Stromrichtung (+ → −), je schneller, desto mehr Strom; Stromwert an jedem Kabel">⇢ Strom</button>
        <button class="tb" id="btnReplay" title="Rechenschritte bzw. Zeitverlauf Schritt für Schritt ansehen">⏱ Zeitlupe</button>
        <button class="tb view" id="btnView" title="Darstellung wechseln: Schaltplan oder Werkbank">Werkbank</button>
        <button class="tb" id="btnRepair" title="Defekte Bauteile ersetzen">Reparieren</button>
        <button class="tb" id="btnReset" title="Startzustand">Neu</button>
      </div>
      <div class="boardwrap"><svg id="board" tabindex="0" aria-label="Schaltplan"></svg><svg id="bench" class="off" tabindex="0" aria-label="Werkbank"></svg></div>
      <div id="replay" hidden><button class="tb" id="rpPrev" title="Schritt zurück">◀</button><button class="tb" id="rpPlay" title="Abspielen">▶</button><button class="tb" id="rpNext" title="Schritt vor">▶|</button>
        <input type="range" id="rpSlider" min="0" max="0" value="0" aria-label="Schritt"><span id="rpLabel"></span><button class="tb" id="rpClose">✕ Live</button></div>
      <div id="statusbar"></div>
    </div>
    <aside class="panel">
      <h3>Multimeter</h3>
      <div class="meter">
        <div class="lcd" id="lcd">OFF</div>
        <div class="mm-modes"><button data-mm="OFF">OFF</button><button data-mm="V">V⎓</button><button data-mm="VAC">V~</button><button data-mm="A">A⎓</button><button data-mm="R">Ω</button></div>
        <div class="mm-type" title="Wie das Gerät Wechselspannung auswertet"><span>V~ misst</span><button data-mt="avg">Mittelwert (AVG)</button><button data-mt="trms">Echt-Effektivwert (TRMS)</button></div>
        <div class="mm-range" id="mmRange" hidden title="Messbereich von Hand wählen – zu kleiner Bereich zeigt OL"></div><div id="mmProbes"></div><p id="mmHelp"></p><p id="mmWarn"></p>
        <button class="btn small" id="btnFuse" hidden>Sicherung ersetzen</button>
      </div>
      <h3>Eigenschaften</h3>
      <div id="inspector"></div>
      <h3>Oszilloskop</h3>
      <div class="scopebox">
        <canvas id="scope"></canvas>
        <div class="scope-ctl"><button class="btn small" id="btnScopeBig" title="Oszilloskop gross anzeigen" aria-label="Oszilloskop vergrössern">⤢</button><select id="tb" aria-label="Zeitbasis (ganze Bildbreite)"><option value="0.005">5 ms</option><option value="0.01">10 ms</option><option value="0.02">20 ms</option><option value="0.05">50 ms</option><option value="0.1">100 ms</option><option value="1" selected>1 s</option><option value="5">5 s</option></select><button class="btn small" id="btnScope">Aufnahme</button></div>
        <div id="scopeInfo">Kanal 1 = Messspitzen des Multimeters (neue Messtechnik-Aufgaben: eigener Tastkopf auf der Werkbank). Aufnahme mit „Aufnahme“ bzw. RUN.</div>
      </div>
    </aside>
  </section>
  <section id="scr-theory" class="screen"></section>
  <section id="scr-manual" class="screen"></section>
  <section id="scr-tutorial" class="screen"></section>
  <section id="scr-settings" class="screen"></section>
  <section id="scr-award" class="screen"></section>
</main>
<footer class="lab-foot"><a id="footImp" href="../impressum.html">Impressum</a><a id="footDs" href="../datenschutz.html">Datenschutz</a></footer>
<div id="modal"></div>
<script>/*JS*/</script>
</body>
</html>
