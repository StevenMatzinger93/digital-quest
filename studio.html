<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Quest Studio</title>
<meta name="description" content="Digital Quest Studio – Schaltungen frei bauen, simulieren und messen: Gleichstrom, Zeitbereich, Oszilloskop, Digitaltechnik bis Zähler.">
<meta name="theme-color" content="#0f2d3a">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%23121212%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%2236%22%20width%3D%22440%22%20height%3D%22440%22%20rx%3D%2272%22%20fill%3D%22none%22%20stroke%3D%22%232c2c2c%22%20stroke-width%3D%228%22%2F%3E%3Cpath%20d%3D%22M70%20270h90l40-120%2080%20240%2040-120h122%22%20fill%3D%22none%22%20stroke%3D%22%23ffb000%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%22270%22%20r%3D%2222%22%20fill%3D%22%23ffb000%22%2F%3E%3Ccircle%20cx%3D%22442%22%20cy%3D%22270%22%20r%3D%2222%22%20fill%3D%22%23ffb000%22%2F%3E%3C%2Fsvg%3E%0A">
<style>/* Digital Quest Studio – Oberfläche (Entwurf vom 14.10.2026, docs/AUFTRAG_STUDIO.md Abschnitt 4)
 * Farben aus der «FlipFlop Lernwelt», Blau für Text abgedunkelt (Kontrast ≥ 4,5:1). Schrift: IBM Plex, mit Rückfall auf die Systemschrift
 * (keine Netzabhängigkeit: die Offline-Fassung bettet keine Schriften ein). */
:root {
  --bg: #f6fbfc; --karte: #ffffff; --rand: #e2eef0; --dunkel: #0f2d3a; --grau: #5b6b73;
  --hellblau: #4fc3f7; --blau-text: #0b6e94; --gut: #22b573; --gut-text: #11864f; --schlecht: #e2574c; --sch-text: #b23a30;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace;
  /* Variablen, die die Schaltplan-Symbole (editor.js) erwarten */
  --sym: var(--dunkel); --wire: var(--blau-text); --accent-lead: #b86e00; --accent-cyan: var(--blau-text); --accent-green: var(--gut); --accent-red: var(--sch-text);
  --font-code: var(--font-mono);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--dunkel); font: 15px/1.45 var(--font-ui); display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr) auto auto; overflow: hidden; }
/* feste Zeilen: die ausgeblendete Schieberegler-Leiste darf die Zeilen nicht verschieben (sonst rutscht der Zeitverlauf aus dem Bild) */
.menubar { grid-row: 1; } .toolbar { grid-row: 2; } .palettebar { grid-row: 3; } .sliderbar { grid-row: 4; } .main { grid-row: 5; } .timing { grid-row: 6; } .statusbar { grid-row: 7; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--hellblau); outline-offset: 1px; }
.mono { font-family: var(--font-mono); }
[hidden] { display: none !important; }

/* ---- Menüleiste ---- */
.menubar { background: var(--dunkel); color: #fff; display: flex; align-items: center; gap: 2px; padding: 0 8px; min-height: 44px; position: relative; z-index: 60; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .02em; margin-right: 12px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; stroke: var(--hellblau); fill: none; stroke-width: 2; }
.brand b { color: var(--hellblau); font-weight: 700; }
.menu { position: relative; }
.menu > button { background: none; border: 0; color: #fff; min-height: 44px; padding: 0 12px; border-radius: 0; }
.menu > button:hover, .menu.open > button { background: rgba(255,255,255,.14); }
.menu .drop { display: none; position: absolute; left: 0; top: 100%; min-width: 230px; background: var(--karte); color: var(--dunkel); border: 1px solid var(--rand); border-radius: 0 0 8px 8px; box-shadow: 0 8px 24px rgba(15,45,58,.22); padding: 4px 0; z-index: 70; }
.menu.open .drop { display: block; }
.drop button { display: flex; justify-content: space-between; gap: 18px; width: 100%; text-align: left; background: none; border: 0; padding: 0 14px; min-height: 44px; align-items: center; }
.drop button:hover { background: var(--bg); }
.drop button small { color: var(--grau); font-family: var(--font-mono); }
.drop hr { border: 0; border-top: 1px solid var(--rand); margin: 4px 0; }
.drop .ex-text { display: block; color: var(--grau); font-size: 13px; padding: 0 14px 6px; }
.menubar .spacer { flex: 1; }
.menubar .ver { color: #9fc4d3; font-size: 13px; padding-right: 6px; }

/* ---- Werkzeugleiste ---- */
.toolbar { background: var(--karte); border-bottom: 1px solid var(--rand); display: flex; flex-wrap: nowrap; overflow-x: auto; align-items: center; gap: 4px 8px; padding: 3px 8px; }
.tgroup { display: flex; align-items: center; gap: 4px; padding-right: 12px; border-right: 1px solid var(--rand); }
.tgroup:last-child { border-right: 0; }
.tgroup > .tl { color: var(--grau); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.tb { background: var(--bg); border: 1px solid var(--rand); border-radius: 8px; min-height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--dunkel); }
.tb:hover { border-color: var(--hellblau); }
.tb.on { background: var(--dunkel); color: #fff; border-color: var(--dunkel); }
.tb.run { background: var(--gut); border-color: var(--gut); color: var(--dunkel); font-weight: 600; }
.tb.run.is-running { background: var(--dunkel); border-color: var(--dunkel); color: #fff; }
.tb:disabled { opacity: .45; cursor: default; }
.tsel, .tin { min-height: 44px; border: 1px solid var(--rand); border-radius: 8px; background: var(--karte); padding: 0 8px; }
.tin { width: 96px; font-family: var(--font-mono); }

/* ---- Hauptbereich ---- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 22px 300px; min-height: 0; }
.main > .canvas { grid-column: 1; } .main > .inspfold { grid-column: 2; } .main > .inspector { grid-column: 3; }
body.inspfolded .main { grid-template-columns: minmax(0, 1fr) 22px; } body.inspfolded .inspector { display: none; }
.inspfold { border: 0; border-left: 1px solid var(--rand); background: var(--bg); color: var(--blau-text); font-size: 18px; line-height: 1; padding: 0; cursor: pointer; } .inspfold:hover { background: #e3f2f7; }
.inspector { background: var(--karte); overflow: auto; min-height: 0; }
/* Bauteilleiste: eine Zeile über der Zeichenfläche, links die Registerkarten, rechts die Bauteile (scrollt waagrecht) */
.palettebar { background: var(--karte); border-bottom: 1px solid var(--rand); display: flex; align-items: stretch; gap: 8px; min-width: 0; }
.ptabs { display: flex; flex: none; align-items: stretch; } .ptab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 0 10px; min-height: 44px; font-weight: 600; color: var(--grau); white-space: nowrap; } .ptab:hover { color: var(--dunkel); background: var(--bg); } .ptab.on { color: var(--dunkel); border-bottom-color: var(--hellblau); }
.palettebar .plist { display: flex; flex: 1; gap: 6px; padding: 3px 6px; overflow-x: auto; overflow-y: hidden; min-width: 0; border-left: 1px solid var(--rand); }
.palettebar .pitem { flex: none; min-height: 52px; min-width: 64px; padding: 2px 6px; flex-direction: row; gap: 6px; } .palettebar .pitem .symicon { width: 44px; height: 28px; } .palettebar .pitem .nm { white-space: nowrap; } .pitem.armed { background: var(--dunkel); color: #fff; border-color: var(--dunkel); }
.inspector { border-left: 1px solid var(--rand); padding: 10px 12px 16px; }
.pitem { background: var(--bg); border: 1px solid var(--rand); border-radius: 8px; min-height: 64px; padding: 4px 2px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-size: 12px; line-height: 1.2; text-align: center; color: var(--dunkel); }
.pitem:hover { border-color: var(--hellblau); }
.pitem .symicon { width: 54px; height: 34px; }
.pitem .nm { padding: 0 2px; overflow-wrap: anywhere; hyphens: auto; }
.pempty { color: var(--grau); font-size: 13px; padding: 0 12px 10px; }
.symicon { --sym: var(--dunkel); }

.canvas { position: relative; min-width: 0; min-height: 0; background: var(--karte); display: flex; flex-direction: column; }
#board { width: 100%; flex: 1 1 0; min-height: 0; display: block; touch-action: none; user-select: none; background: var(--karte); }

/* ---- Schaltplan-Symbole (editor.js) auf weissem Grund ---- */
.griddot { fill: #c9dde1; }
.sym { fill: none; stroke: var(--sym); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sym.fillsym { fill: var(--sym); } .sym.thin { stroke-width: 1.5; } .sym.thick { stroke-width: 4; } .sym.thick2 { stroke-width: 7; }
.sym.lever { stroke: var(--blau-text); stroke-width: 3; } .sym.ledbody { stroke: var(--sym); }
.symtxt { fill: var(--sym); font: 700 16px var(--font-mono); text-anchor: middle; } .symtxt.small { font-size: 10px; } .plus { fill: var(--sch-text); font: 700 16px var(--font-mono); }
.lbl { fill: var(--grau); font: 600 12px var(--font-mono); text-anchor: middle; } .val { fill: var(--blau-text); font: 12px var(--font-mono); text-anchor: middle; }
.hit { fill: transparent; stroke: none; } .part { cursor: grab; }
.part.selected .sym { stroke: var(--blau-text); } .part.selected .hit { fill: rgba(79,195,247,.10); stroke: var(--hellblau); stroke-dasharray: 4 4; }
.wire { fill: none; stroke: var(--wire); stroke-width: 2.6; stroke-linejoin: round; pointer-events: none; }
.wire.selected { stroke: var(--hellblau); stroke-width: 4; } .wire.pending { stroke-dasharray: 6 5; opacity: .8; }
.wirehit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.pin { fill: var(--karte); stroke: var(--grau); stroke-width: 1.5; } .pin.used { fill: var(--wire); stroke: var(--wire); } .pin.active { fill: var(--hellblau); stroke: var(--dunkel); }
.nodedot { fill: var(--wire); stroke: none; } .part.selected .nodedot { fill: var(--hellblau); r: 5; } .nodehit { fill: transparent; stroke: none; cursor: move; }
.snapdot { fill: var(--hellblau); fill-opacity: .35; stroke: var(--hellblau); stroke-width: 1.5; }
.pinhit { fill: transparent; cursor: crosshair; } [data-pin]:hover .pin { stroke: var(--hellblau); stroke-width: 3; }
.ilabel { fill: #8a5200; font: 11px var(--font-mono); pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.vlabel { fill: var(--blau-text); font: 11px var(--font-mono); pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
.burnt { stroke: var(--schlecht); stroke-width: 3.5; fill: none; }
.lamp-on { fill: var(--gut); filter: drop-shadow(0 0 4px var(--gut)); } .lamp-off { fill: #cdd9dc; }
.probe path { stroke-width: 3; fill: none; } .probe text { font: 700 11px var(--font-mono); text-anchor: middle; fill: #fff; pointer-events: none; }
.probe-red path { stroke: var(--schlecht); } .probe-red circle { fill: var(--schlecht); } .probe-black path { stroke: var(--dunkel); } .probe-black circle { fill: var(--dunkel); }
.seg { fill: none; stroke: #d9e4e7; stroke-width: 4; stroke-linecap: round; } .seg.on { stroke: var(--schlecht); filter: drop-shadow(0 0 3px var(--schlecht)); }
.part.locked .lbl { fill: var(--gut-text); }
.wire.lvl-hi { stroke: var(--gut); } .wire.lvl-lo { stroke: #5b8196; }
.refmark { fill: var(--blau-text); font: 700 11px var(--font-mono); }

/* ---- Eigenschaften ---- */
.inspector h2 { font-size: 16px; margin: 4px 0 2px; }
.inspector h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--grau); margin: 16px 0 6px; font-weight: 600; }
.inspector .sub { color: var(--grau); font-size: 13px; margin: 0 0 8px; }
.ins-icon { float: right; width: 70px; height: 46px; margin: 0 0 6px 8px; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 8px; margin: 6px 0; }
.field label { color: var(--dunkel); }
.field input[type="text"], .field select { width: 150px; min-height: 44px; border: 1px solid var(--rand); border-radius: 8px; padding: 0 8px; background: var(--bg); font-family: var(--font-mono); }
.field input.bad { border-color: var(--schlecht); background: #fdeeed; }
.field .unit { color: var(--grau); font-size: 13px; margin-left: 4px; }
.field.wide { grid-template-columns: 1fr; }
.field input[type="range"] { width: 100%; min-height: 44px; }
.live { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-family: var(--font-mono); font-size: 13px; }
.live dt { color: var(--grau); } .live dd { margin: 0; text-align: right; }
.hint { color: var(--grau); font-size: 13px; }
.bigon { color: var(--gut-text); font-weight: 600; } .bigoff { color: var(--grau); }

/* ---- Zeitverlauf (fest unten) ---- */
.timing { background: var(--karte); border-top: 1px solid var(--rand); min-height: 0; height: 230px; display: flex; flex-direction: column; }
.timing.collapsed { display: none; } /* eingeklappt: keine Zeile, die der Zeichenfläche Höhe nimmt; aufklappen über «Zeitverlauf» (Werkzeugleiste, Menü) oder mit dem ersten Signal */
.timing .th { display: flex; align-items: center; gap: 8px; padding: 2px 10px; min-height: 40px; flex: none; flex-wrap: wrap; }
.timing .th b { font-weight: 600; }
.tl-btn { background: var(--bg); border: 1px solid var(--rand); border-radius: 6px; min-height: 32px; padding: 0 10px; color: var(--dunkel); }
.tl-btn.on { background: var(--dunkel); color: #fff; border-color: var(--dunkel); }
.tl-body { flex: 1; min-height: 0; display: flex; flex-direction: column; } .tl-rows { flex: 1; min-height: 0; overflow: auto; }
.tl-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); border-top: 1px solid var(--rand); }
.tl-lab { display: flex; align-items: center; gap: 2px; padding: 0 4px; min-width: 0; }
.tl-lab input { width: 18px; height: 18px; margin: 0 4px 0 2px; }
.tl-nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: 13px; }
.tl-lab button { background: none; border: 0; min-width: 26px; min-height: 26px; color: var(--grau); border-radius: 4px; padding: 0; } .tl-lab button:hover { background: var(--bg); color: var(--dunkel); }
.tl-cv { width: 100%; display: block; }
.tl-axisrow { flex: none; display: grid; grid-template-columns: 190px minmax(0, 1fr); border-top: 1px solid var(--rand); } .tl-axisrow canvas { width: 100%; }
.tl-empty { padding: 10px 12px; }

.itab { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; margin: 2px 0 6px; }
.itab th, .itab td { border: 1px solid var(--rand); padding: 2px 5px; text-align: center; } .itab th { background: var(--bg); font-weight: 600; }
.itab tr.act td { background: #cdeefc; font-weight: 700; color: var(--dunkel); }
.itab-wrap { max-height: 240px; overflow: auto; border: 1px solid var(--rand); border-radius: 4px; } .itab-wrap .itab { margin: 0; }
.inspector .fn { margin: 0 0 6px; font-size: 14px; }
.sfd { width: 100%; height: auto; max-height: 220px; } .sfd circle { fill: var(--karte); stroke: var(--dunkel); stroke-width: 2; } .sfd path { fill: none; stroke: var(--dunkel); stroke-width: 1.6; }
.sfd text { font: 600 11px var(--font-mono); fill: var(--dunkel); } .sfd g.cur circle { fill: #cdeefc; stroke: var(--blau-text); stroke-width: 3.5; }

/* ---- Statusleiste ---- */
.statusbar { background: var(--dunkel); color: #e7f3f7; display: flex; gap: 6px 18px; flex-wrap: wrap; align-items: center; min-height: 26px; padding: 1px 12px; font-size: 13px; }
.statusbar .mono { color: #fff; }
.statusbar .err { color: #ffb4ac; } .statusbar .ok { color: #8fe0b6; } .statusbar .warn { color: #ffe08a; }
.statusbar .sp { flex: 1; }

/* ---- schwebende Fenster (Oszilloskope) ---- */
#floats { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.fwin { position: absolute; pointer-events: auto; background: var(--karte); border: 1px solid var(--dunkel); border-radius: 8px; box-shadow: 0 10px 30px rgba(15,45,58,.28); display: flex; flex-direction: column; min-width: 300px; min-height: 200px; resize: both; overflow: hidden; }
.fwin .fh { background: var(--dunkel); color: #fff; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; min-height: 40px; cursor: move; user-select: none; touch-action: none; flex: none; }
.fwin .fh b { font-weight: 600; flex: 1; }
.fwin .fh button { background: none; border: 0; color: #fff; min-width: 36px; min-height: 36px; font-size: 18px; border-radius: 6px; }
.fwin .fh button:hover { background: rgba(255,255,255,.18); }
.fwin .fb { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.fwin canvas { flex: 1; min-height: 150px; width: 100%; display: block; background: #fff; touch-action: none; }
.sc-bar { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 4px 8px; border-top: 1px solid var(--rand); background: var(--bg); font-size: 13px; }
.sc-bar select, .sc-bar button { min-height: 36px; border: 1px solid var(--rand); border-radius: 6px; background: var(--karte); padding: 0 8px; }
.sc-bar button.on { background: var(--dunkel); color: #fff; border-color: var(--dunkel); }
.sc-chs { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 4px 8px; border-top: 1px solid var(--rand); font-family: var(--font-mono); font-size: 12px; min-height: 34px; align-items: center; }
.sc-ch { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rand); border-radius: 12px; padding: 0 4px 0 8px; min-height: 28px; background: var(--karte); }
.sc-ch i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.sc-ch button { background: none; border: 0; min-width: 28px; min-height: 28px; color: var(--grau); }
.sc-read { padding: 4px 10px; border-top: 1px solid var(--rand); font-family: var(--font-mono); font-size: 12px; background: #fffdf2; color: var(--dunkel); display: flex; flex-wrap: wrap; gap: 2px 16px; }
.sc-empty { color: var(--grau); font-family: var(--font-ui); }

/* ---- Hilfe / Dialog ---- */
.modal-bg { position: fixed; inset: 0; background: rgba(15,45,58,.45); display: none; align-items: center; justify-content: center; z-index: 90; padding: 12px; }
.modal-bg.open { display: flex; }
.modal { background: var(--karte); border-radius: 12px; max-width: 640px; max-height: 90vh; overflow: auto; padding: 18px 22px; box-shadow: 0 20px 50px rgba(15,45,58,.4); }
.modal h2 { margin: 0 0 8px; } .modal kbd { font-family: var(--font-mono); background: var(--bg); border: 1px solid var(--rand); border-radius: 4px; padding: 0 5px; }
.modal ul { padding-left: 20px; }

/* ---- Telefon: Spalten stapeln ---- */
@media (max-width: 900px) {
  body { display: block; overflow: auto; height: auto; }
  .main { display: block; }
  .palettebar { flex-direction: column; } .ptabs { overflow-x: auto; } .inspfold { display: none; }
  .canvas { height: 62vh; min-height: 360px; }
  .inspector { border-left: 0; border-top: 1px solid var(--rand); }
  .timing { height: 260px; } .tl-row, .tl-axisrow { grid-template-columns: 130px minmax(0, 1fr); }
  .statusbar { position: sticky; bottom: 0; }
  .fwin { min-width: 260px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.forbid { fill: rgba(226,87,76,.12); stroke: var(--schlecht); stroke-width: 3; stroke-dasharray: 6 3; pointer-events: none; } .forbidtxt { fill: var(--sch-text); font: 700 11px var(--font-mono); text-anchor: middle; pointer-events: none; }
.faultmark { fill: rgba(226,87,76,.10); stroke: var(--schlecht); stroke-width: 3; stroke-dasharray: 7 4; pointer-events: none; } .faulttxt { fill: var(--sch-text); font: 700 11px var(--font-mono); text-anchor: middle; pointer-events: none; }
.warnbox { border: 2px solid var(--schlecht); background: #fdeeed; color: var(--sch-text); border-radius: 8px; padding: 6px 10px; margin: 8px 0; font-size: 14px; }
.tl-warn { background: var(--schlecht); color: #fff; border-radius: 6px; padding: 3px 10px; font-weight: 600; font-size: 13px; }
.timing.overdrive { outline: 3px solid var(--schlecht); outline-offset: -3px; }

.sliderbar { display: flex; flex-wrap: wrap; gap: 4px 22px; padding: 4px 12px; background: #eef7fb; border-bottom: 1px solid var(--rand); }
.sliderbar .sl { display: flex; align-items: center; gap: 8px; min-width: 280px; } .sliderbar label { white-space: nowrap; } .sliderbar input[type=range] { flex: 1; min-width: 120px; min-height: 44px; }
.sliderbar output { min-width: 78px; text-align: right; } .sliderbar button { background: none; border: 0; min-width: 32px; min-height: 32px; color: var(--grau); font-size: 18px; }
.slrow { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin: 0 0 8px; font-size: 13px; } .slrow .tin { width: 100%; min-height: 36px; } .slcfg input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; }

#printArea { display: none; }
}

<script>/* ==== engine.js ==== */
/* Digital Quest – Schaltungs-Engine (window.DQEngine)
 * Knotenanalyse (Nodal Analysis) mit Norton-Ersatz fuer alle Quellen, stueckweise-lineare
 * Dioden/LEDs, Logikgatter (5-V-Logik, implizite Versorgung), Kondensator (Backward Euler),
 * Multimeter (V, A, Ohm, V~ mit AVG/TRMS) mit realistischen Fehlbedienungen und Anzeige wie ein 6000-Digit-DMM,
 * Wechselspannungsquelle (Sinus/Rechteck/Dreieck), Rechenschritt-Verlauf fuer die Zeitlupe.
 * Einheiten: V, A, Ohm, F, s, Hz. Kein DOM – laeuft in Node und im Browser.
 */
(function (root) {
  'use strict';

  var GMIN = 1e-9;            // Leitwert jedes Knotens gegen Masse (verhindert singulaere Matrix); fuer die Konformitaetspruefung (tests/kern.js) per setGmin absenkbar
  var G_OPEN = 1e-12;         // offener Schalter, gesperrte Diode, Gattereingang
  var G_CLOSED = 1e3;         // geschlossener Schalter (1 mOhm)
  var LOGIC = { vcc: 5, vth: 2.5, rout: 25 };
  var METER = { rV: 1e7, rA: 0.1, fuseA: 10, iOhm: 1e-3, olOhm: 40e6, cal: 0.002 }; // cal: Verstaerkungsfehler des Geraets (+0,2 %)
  var LIMITS = { lampBurn: 2, ledReverse: 5 }; // Lampe brennt ab lampBurn · Nennleistung durch; LED meldet Sperrspannung ab ledReverse Volt
  var TRACE_MAX = 200;        // Zeitlupe: hoechstens so viele Rechenschritte pro Arbeitspunkt speichern

  var LED_COLORS = {
    rot: { vf: 1.8, rgb: '#ff3b30' }, gelb: { vf: 2.0, rgb: '#ffd60a' },
    gruen: { vf: 2.1, rgb: '#32d74b', label: 'grün' }, blau: { vf: 3.0, rgb: '#0a84ff' }, weiss: { vf: 3.1, rgb: '#f5f5f7' } // Schlüssel bleiben ASCII (Spielstand), label nur für die Anzeige
  };

  /* Bauteilkatalog: Pins, Standardwerte, Namenspraefix. Geometrie liegt im Editor. */
  var PARTS = {
    ground:    { label: 'Masse', prefix: 'GND', pins: ['g'], props: {} },
    node:      { label: 'Knoten', studio: true, prefix: 'K', pins: ['p'], props: {} }, // Verbindungspunkt auf einer Leitung (Studio): kein Bauteil, verbindet nur seine Leitungen
    battery:   { label: 'Spannungsquelle', prefix: 'B', pins: ['p', 'n'], props: { value: 9, ri: 0.05, imax: 3 }, unit: 'V' },
    resistor:  { label: 'Widerstand', prefix: 'R', pins: ['a', 'b'], props: { value: 1000, pmax: 0.25 }, unit: 'Ω' },
    pot:       { label: 'Potentiometer', prefix: 'P', pins: ['a', 'w', 'b'], props: { value: 10000, pos: 0.5, pmax: 0.25 }, unit: 'Ω' },
    lamp:      { label: 'Lampe', prefix: 'H', pins: ['a', 'b'], props: { value: 60, pnom: 1.35 }, unit: 'Ω' },
    switch:    { label: 'Schalter', prefix: 'S', pins: ['a', 'b'], props: { closed: false } },
    button:    { label: 'Taster', prefix: 'T', pins: ['a', 'b'], props: { closed: false } },
    led:       { label: 'LED', prefix: 'D', pins: ['a', 'k'], props: { color: 'rot', rs: 10, imax: 0.03, inom: 0.02 } },
    diode:     { label: 'Diode', prefix: 'V', pins: ['a', 'k'], props: { vf: 0.7, rs: 1, imax: 1 } },
    capacitor: { label: 'Kondensator', prefix: 'C', pins: ['a', 'b'], props: { value: 100e-6 }, unit: 'F' },
    inductor:  { label: 'Spule', studio: true, prefix: 'L', pins: ['a', 'b'], props: { value: 10e-3 }, unit: 'H' }, // Studio Stufe 2: Rückwärts-Euler wie der Kondensator, im Gleichstrom-Arbeitspunkt ein Kurzschluss
    ammeter:   { label: 'Strommesser', prefix: 'A', pins: ['a', 'b'], props: {} },
    clock:     { label: 'Taktgeber', prefix: 'CLK', pins: ['out'], props: { freq: 1 }, unit: 'Hz' },
    acsource:  { label: 'Wechselspannungsquelle', prefix: 'G', pins: ['p', 'n'], props: { value: 10, freq: 50, shape: 'sine', offset: 0, ri: 0.05, imax: 3 }, unit: 'V' }, // value = Scheitelwert Û
    /* Gatter: props.inputs = Eingangszahl 2…8 (NICHT: 1); pins sind die Pins bei 2 Eingaengen, E.pinsOf(type, props) liefert die tatsaechlichen */
    not:  { label: 'NICHT', prefix: 'U', pins: ['in', 'out'], props: {}, logic: function (i) { return !i[0]; } },
    and:  { label: 'UND', prefix: 'U', pins: ['in1', 'in2', 'out'], multi: true, props: { inputs: 2 }, logic: function (i) { return i.every(Boolean); } },
    or:   { label: 'ODER', prefix: 'U', pins: ['in1', 'in2', 'out'], multi: true, props: { inputs: 2 }, logic: function (i) { return i.some(Boolean); } },
    nand: { label: 'NAND', prefix: 'U', pins: ['in1', 'in2', 'out'], multi: true, props: { inputs: 2 }, logic: function (i) { return !i.every(Boolean); } },
    nor:  { label: 'NOR', prefix: 'U', pins: ['in1', 'in2', 'out'], multi: true, props: { inputs: 2 }, logic: function (i) { return !i.some(Boolean); } },
    xor:  { label: 'XOR', prefix: 'U', pins: ['in1', 'in2', 'out'], multi: true, props: { inputs: 2 }, logic: function (i) { return i.filter(Boolean).length % 2 === 1; } },   // mehr als zwei Eingaenge: ungerade Zahl von Einsen
    xnor: { label: 'XNOR', prefix: 'U', pins: ['in1', 'in2', 'out'], multi: true, props: { inputs: 2 }, logic: function (i) { return i.filter(Boolean).length % 2 === 0; } },
    /* Experimentierboard: Pegelschalter (closed = 1 → 5 V) und Logikanzeige (leuchtet ab 2,5 V); Versorgung implizit wie bei Gattern */
    logicin:  { label: 'Pegelschalter', prefix: 'E', pins: ['out'], props: { closed: false }, digital: true },
    logicled: { label: 'Logikanzeige', prefix: 'L', pins: ['in'], props: { color: 'rot' }, digital: true },
    seg7:     { label: '7-Segment-Anzeige', prefix: 'AZ', pins: ['a', 'b', 'c', 'd', 'e', 'f', 'g'], props: {}, digital: true },
    dec7:     { label: 'BCD-7-Segment-Decoder', prefix: 'IC', pins: ['A', 'B', 'C', 'D', 'a', 'b', 'c', 'd', 'e', 'f', 'g'], ins: ['A', 'B', 'C', 'D'], outs: ['a', 'b', 'c', 'd', 'e', 'f', 'g'], props: {},
      logic: function (i) { var n = (i[0] ? 1 : 0) + (i[1] ? 2 : 0) + (i[2] ? 4 : 0) + (i[3] ? 8 : 0); return (SEG7[n] || '0000000').split('').map(function (c) { return c === '1'; }); } },
    /* Flipflops: Ausgaenge Q und /Q; ffIns = Dateneingaenge; PS (preSet) und PC (preClear) wirken unabhaengig vom Takt (Vorrang vor C, bei beiden gewinnt PC).
     * props.trig = Steuerungsart: 'pos' steigende Flanke (Standard), 'neg' fallende Flanke, 'level' taktzustandsgesteuert (uebernimmt solange C = 1).
     * rsff: taktgesteuertes RS (Standard 'level'); jkms: Master-Slave (Master nimmt J/K bei C = 1, Slave bei fallender Flanke: Ausgang aendert sich bei C 1 → 0).
     * props.tpd = Laufzeit je Flipflop-Stufe (nur fuer den Zeitverlauf des Studios: Flanken laufen k·tpd spaeter ein, siehe step opts.iters). */
    dff:  { label: 'D-Flipflop', prefix: 'FF', pins: ['D', 'C', 'PS', 'PC', 'Q', 'Qn'], ffIns: ['D'], ffAsync: ['PS', 'PC'], props: { trig: 'pos', tpd: 20e-9 }, ff: function (q, i) { return i[0]; } },
    jkff: { label: 'JK-Flipflop', prefix: 'FF', pins: ['J', 'K', 'C', 'PS', 'PC', 'Q', 'Qn'], ffIns: ['J', 'K'], ffAsync: ['PS', 'PC'], props: { trig: 'pos', tpd: 20e-9 }, ff: function (q, i) { return i[0] && i[1] ? !q : i[0] ? true : i[1] ? false : q; } },
    tff:  { label: 'T-Flipflop', prefix: 'FF', pins: ['T', 'C', 'PS', 'PC', 'Q', 'Qn'], ffIns: ['T'], ffAsync: ['PS', 'PC'], props: { trig: 'pos', tpd: 20e-9 }, ff: function (q, i) { return i[0] ? !q : q; } },
    rsff: { label: 'RS-Flipflop', studio: true, prefix: 'FF', pins: ['S', 'R', 'C', 'PS', 'PC', 'Q', 'Qn'], ffIns: ['S', 'R'], ffAsync: ['PS', 'PC'], rs: true, props: { trig: 'level', tpd: 20e-9 }, ff: function (q, i) { return i[0] && !i[1] ? true : i[1] && !i[0] ? false : q; } },
    jkms: { label: 'JK-MS-Flipflop', studio: true, prefix: 'FF', pins: ['J', 'K', 'C', 'PS', 'PC', 'Q', 'Qn'], ffIns: ['J', 'K'], ffAsync: ['PS', 'PC'], ms: true, props: { tpd: 20e-9 }, ff: function (q, i) { return i[0] && i[1] ? !q : i[0] ? true : i[1] ? false : q; } },
    /* Zaehler als fertige Bausteine (Studio Stufe 4, klappen sich im Studio in Flipflops und Gatter auf): C = Takt, R = Rueckstellen (asynchron, aktiv 1), Q0 = niederwertigstes Bit.
     * ctr: 'async' (Ripple: Bit k kippt erst, wenn Bit k−1 ueberlaeuft – eine Laufzeitstufe spaeter), 'sync' (alle Bits gleichzeitig), 'bcd' (0…9), 'johnson' (Schiebekette mit invertierter Rueckkopplung), 'mod' (0 … modn−1).
     * props.trig = Taktflanke 'pos' | 'neg', props.dir = 'up' | 'down' (async, sync), props.bits = Bitzahl 2…8 (async, sync, johnson), props.modn = Modulus 2…256 (mod). */
    ctr_async:   { label: 'Asynchroner Dualzähler', studio: true, prefix: 'Z', pins: ['C', 'R', 'Q0', 'Q1', 'Q2', 'Q3'], ctr: 'async', props: { bits: 4, dir: 'up', trig: 'pos', tpd: 20e-9 } },
    ctr_sync:    { label: 'Synchroner Dualzähler', studio: true, prefix: 'Z', pins: ['C', 'R', 'Q0', 'Q1', 'Q2', 'Q3'], ctr: 'sync', props: { bits: 4, dir: 'up', trig: 'pos', tpd: 20e-9 } },
    ctr_bcd:     { label: 'Dezimalzähler (BCD)', studio: true, prefix: 'Z', pins: ['C', 'R', 'Q0', 'Q1', 'Q2', 'Q3'], ctr: 'bcd', props: { trig: 'pos', tpd: 20e-9 } },
    ctr_johnson: { label: 'Johnson-Zähler', studio: true, prefix: 'Z', pins: ['C', 'R', 'Q0', 'Q1', 'Q2', 'Q3'], ctr: 'johnson', props: { bits: 4, trig: 'pos', tpd: 20e-9 } },
    ctr_mod:     { label: 'Modulo-n-Zähler', studio: true, prefix: 'Z', pins: ['C', 'R', 'Q0', 'Q1', 'Q2'], ctr: 'mod', props: { modn: 6, trig: 'pos', tpd: 20e-9 } },
    /* Halbleiter: NPN-Transistor (sperrt / aktiv: Ic = β·Ib / Saettigung: U_CE ≈ 0,2 V), Z-Diode (Durchbruch bei U_Z in Sperrrichtung) */
    npn:   { label: 'NPN-Transistor', prefix: 'Q', pins: ['b', 'c', 'e'], props: { beta: 100, vbe: 0.7, rbe: 50, vsat: 0.2, pmax: 0.5 } },
    zener: { label: 'Z-Diode', prefix: 'Z', pins: ['a', 'k'], props: { vz: 5.1, vf: 0.7, rs: 5, pmax: 0.5 } },
    motor: { label: 'Motor', prefix: 'M', pins: ['a', 'b'], props: { value: 20, inom: 0.3 }, unit: 'Ω' }
  };
  /* Segmente a…g fuer 0–9 (BCD), darueber dunkel */
  var SEG7 = ['1111110', '0110000', '1101101', '1111001', '0110011', '1011011', '1011111', '1110000', '1111111', '1111011'];
  function dIns(d) { return d.ins || (d.ffIns ? d.ffIns.concat(['C'], d.ffAsync || []) : d.pins.filter(function (p) { return p !== 'out'; })); }
  /* Anschluesse eines Bauteils mit seinen Eigenschaften (Gatter: Eingangszahl props.inputs) */
  function pinsOf(type, q) {
    var d = def(type);
    if (d.ctr) { var nb = ctrBitCount(d, q), a0 = ['C', 'R']; for (var j = 0; j < nb; j++) a0.push('Q' + j); return a0; }
    if (!d.multi) return d.pins;
    var n = Math.max(2, Math.min(8, Math.round((q && q.inputs) || 2))); if (n === 2) return d.pins;
    var a = []; for (var k = 1; k <= n; k++) a.push('in' + k); a.push('out'); return a;
  }
  /* Zaehler: Bitzahl, Folgezustand, Zaehlerstand */
  function ctrBitCount(d, q) {
    q = q || {};
    if (d.ctr === 'bcd') return 4;
    if (d.ctr === 'mod') { var m = Math.max(2, Math.min(256, Math.round(q.modn || 6))); return Math.max(1, Math.ceil(Math.log(m) / Math.LN2 - 1e-9)); }
    return Math.max(2, Math.min(8, Math.round(q.bits || 4)));
  }
  function bitsToNum(b) { var n = 0; for (var i = 0; i < b.length; i++) if (b[i]) n += Math.pow(2, i); return n; }
  function numToBits(n, nb) { var b = []; for (var i = 0; i < nb; i++) b.push(Math.floor(n / Math.pow(2, i)) % 2 === 1); return b; }
  function ctrCount(p, b) {
    var kind = def(p.type).ctr;
    if (kind !== 'johnson') return bitsToNum(b);
    var ones = b.filter(Boolean).length; return b[b.length - 1] ? b.length + (b.length - ones) : ones;   // Index in der Folge 0000, 0001, 0011, 0111, 1111, 1110, 1100, 1000
  }
  /* naechster Zaehlerstand (nicht asynchron) */
  function ctrNext(p, b) {
    var d = def(p.type), q = p.props, nb = b.length, n = bitsToNum(b);
    switch (d.ctr) {
      case 'bcd': return numToBits((n + 1) % 10, 4);
      case 'mod': return numToBits((n + 1) % Math.max(2, Math.round(q.modn || 6)), nb);
      case 'johnson': return [!b[nb - 1]].concat(b.slice(0, nb - 1));
      default: var m = Math.pow(2, nb); return numToBits(q.dir === 'down' ? (n + m - 1) % m : (n + 1) % m, nb);
    }
  }
  function insOfPart(p) { var d = def(p.type); if (d.ctr) return ['C', 'R']; return d.multi ? Object.keys(p.n).filter(function (k) { return k !== 'out'; }) : dIns(d); }
  function dOuts(d) { return d.outs || (d.ff ? ['Q', 'Qn'] : ['out']); }
  function isDigital(d) { return !!(d.logic || d.digital || d.ff || d.ctr); }
  var SOURCES = { battery: 1, clock: 1, acsource: 1 };
  /* Momentanwert einer Wechselspannungsquelle zur Zeit t (Kurvenform sine | square | triangle, Scheitelwert value, Gleichanteil offset) */
  function wave(q, t) {
    var ph = ((t * q.freq) % 1 + 1) % 1, w;
    if (q.shape === 'square') w = ph < 0.5 ? 1 : -1;
    else if (q.shape === 'triangle') w = ph < 0.25 ? 4 * ph : ph < 0.75 ? 2 - 4 * ph : 4 * ph - 4;
    else w = Math.sin(2 * Math.PI * ph);
    return (q.offset || 0) + q.value * w;
  }

  function def(type) { var d = PARTS[type]; if (!d) throw new Error('Unbekanntes Bauteil: ' + type); return d; }
  function props(p) { var o = {}, d = def(p.type).props, k; for (k in d) o[k] = d[k]; for (k in (p.props || {})) o[k] = p.props[k]; if (p.value !== undefined) o.value = p.value; return o; }

  /* ---------- Netzliste aus Editor-Layout ----------
   * layout = { parts:[{id,type,value?,props?,x,y,rot}], wires:[{from:'R1.a', to:'B1.p'}] } */
  function buildNetlist(layout, extra) {
    var parent = {};
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function add(x) { if (parent[x] === undefined) parent[x] = x; }
    function union(a, b) { add(a); add(b); var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
    var parts = [], byId = {};
    (layout.parts || []).forEach(function (p) {
      var d = def(p.type);
      if (byId[p.id]) throw new Error('Doppelte Bauteil-ID: ' + p.id);
      var q = { id: p.id, type: p.type, props: props(p), n: {} };
      pinsOf(p.type, q.props).forEach(function (pin) { add(p.id + '.' + pin); });
      parts.push(q); byId[p.id] = q;
    });
    var wires = (layout.wires || []).concat(extra || []);
    wires.forEach(function (w) {
      [w.from, w.to].forEach(function (pid) { if (parent[pid] === undefined) throw new Error('Unbekannter Anschluss: ' + pid); });
      union(w.from, w.to);
    });
    var groundRoots = {}, autoGround = false, refPin = null; // refPin: der Anschluss, der als Bezugspunkt 0 V dient (Masse-Symbol oder Minuspol der ersten Quelle)
    parts.forEach(function (p) { if (p.type === 'ground') { groundRoots[find(p.id + '.g')] = true; if (!refPin) refPin = p.id + '.g'; } });
    if (!Object.keys(groundRoots).length) { // ohne Masse-Symbol: Minuspol der ersten Quelle ist Bezugspunkt 0 V
      var src = parts.filter(function (p) { return p.type === 'battery' || p.type === 'acsource'; })[0];
      if (src) { groundRoots[find(src.id + '.n')] = true; autoGround = true; refPin = src.id + '.n'; }
    }
    var names = {}, count = 0, pinNode = {};
    Object.keys(parent).forEach(function (pid) {
      var r = find(pid);
      if (!names[r]) names[r] = groundRoots[r] ? '0' : 'N' + (++count);
      pinNode[pid] = names[r];
    });
    parts.forEach(function (p) { pinsOf(p.type, p.props).forEach(function (pin) { p.n[pin] = pinNode[p.id + '.' + pin]; }); });
    var nodes = [];
    Object.keys(names).forEach(function (r) { if (names[r] !== '0') nodes.push(names[r]); });
    nodes.sort(function (a, b) { return +a.slice(1) - +b.slice(1); });
    return { parts: parts, byId: byId, nodes: nodes, pinNode: pinNode, hasGround: Object.keys(groundRoots).length > 0 && !autoGround, autoGround: autoGround, refPin: refPin };
  }

  /* ---------- Lineares Gleichungssystem (Gauss mit Pivotsuche) ---------- */
  function solveLinear(A, z) {
    var n = z.length, i, j, k;
    for (i = 0; i < n; i++) {
      var max = i;
      for (k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[max][i])) max = k;
      // Pivot (fast) 0: bei schwebenden Gruppen (alle Dioden gesperrt, nur ein Kondensator speist die Last) loescht die Rundung den letzten Pivot
      // (Leitwerte 1e3 gegen Gmin 1e-9). Das System ist dank Gmin mathematisch loesbar: Pivot mit Gmin regularisieren statt abzubrechen (Glaettung 06.10.2026, K0).
      if (Math.abs(A[max][i]) < 1e-18) { if (isNaN(A[max][i])) return null; A[max][i] = (A[max][i] < 0 ? -GMIN : GMIN); }
      var t = A[i]; A[i] = A[max]; A[max] = t; var tz = z[i]; z[i] = z[max]; z[max] = tz;
      for (k = i + 1; k < n; k++) {
        var f = A[k][i] / A[i][i]; if (f === 0) continue;
        for (j = i; j < n; j++) A[k][j] -= f * A[i][j];
        z[k] -= f * z[i];
      }
    }
    var x = new Array(n);
    for (i = n - 1; i >= 0; i--) { var s = z[i]; for (j = i + 1; j < n; j++) s -= A[i][j] * x[j]; x[i] = s / A[i][i]; }
    return x;
  }

  /* burnInfo: Werte im Moment des Durchbrennens (fuer die Diagnose), fuseInfo: Strom beim Ausloesen der Multimeter-Sicherung */
  /* tr: Transistor-Zustand ('off'|'on'|'sat'), zen: Z-Dioden-Zustand ('off'|'f'|'z'), ff: Flipflops {q, c (letzter Taktpegel)} */
  function newState() { return { burnt: {}, vC: {}, iL: {}, ctr: {}, logic: {}, diode: {}, tr: {}, zen: {}, ff: {}, fuse: false, t: 0, burnInfo: {}, fuseInfo: null }; }

  /* ---------- Loeser fuer einen Arbeitspunkt / Zeitschritt ----------
   * opts: { state, dt (null = Gleichstrom-Arbeitspunkt), t, meter:{mode,a,b} (Knoten), zeroSources, inject:{a,b,i},
   *         trace: [] – nimmt jeden Rechenschritt auf: {iter, kind:'diode'|'gate'|'done'|'unstable', changed:[{id,to}], res} (max. TRACE_MAX) } */
  function solve(net, opts) {

/* ==== studio/examples.js ==== */
/* Digital Quest Studio – Beispiele (Stufe 6, Menü «Beispiele»)
 * Mitgelieferte Schaltungen. Jedes Beispiel: {id, name, text, build() → {layout, scopes?, timing?, run?}}.
 * Die Digitaluhr ist das Zielbild des Studios: Taktgeber 1 Hz, Sekundenzähler (Einer 0–9, Zehner 0–5), BCD-Dekoder, zwei Siebensegmentanzeigen. */
(function (root) {
  'use strict';
  var S = root.Studio, E = root.DQEngine;
  var W = function (a, b) { return { from: a, to: b }; };
  function part(id, type, x, y, props, value) { var p = { id: id, type: type, x: x, y: y, rot: 0 }; if (props) p.props = props; if (value !== undefined) p.value = value; return p; }

  /* Digitaluhr: Sekunden 00 … 59. Der Zehnerzähler zählt bei der fallenden Flanke von Q3 des Einerzählers (9 → 0). */
  function digitaluhr() {
    var parts = [
      part('CLK1', 'clock', 200, 300, { freq: 1 }),
      part('Z1', 'ctr_bcd', 460, 300), part('Z2', 'ctr_mod', 460, 560, { modn: 6, trig: 'neg' }),
      part('IC1', 'dec7', 760, 300), part('IC2', 'dec7', 760, 560),
      part('AZ1', 'seg7', 1060, 300), part('AZ2', 'seg7', 1060, 560),
      part('GND1', 'ground', 620, 700)

    ['A', 'B', 'C', 'D'].forEach(function (p, k) { wires.push(W('Z1.Q' + k, 'IC1.' + p)); });
    ['A', 'B', 'C'].forEach(function (p, k) { wires.push(W('Z2.Q' + k, 'IC2.' + p)); });
    'abcdefg'.split('').forEach(function (s) { wires.push(W('IC1.' + s, 'AZ1.' + s)); wires.push(W('IC2.' + s, 'AZ2.' + s)); });
    return { layout: { parts: parts, wires: wires },
      timing: { rows: [{ kind: 'dig', a: 'CLK1.out' }], buses: [{ label: 'Einer', bits: [0, 1, 2, 3].map(function (k) { return { kind: 'dig', a: 'Z1.Q' + k }; }) }, { label: 'Zehner', bits: [0, 1, 2].map(function (k) { return { kind: 'dig', a: 'Z2.Q' + k }; }) }] } };
  }
  /* Asynchroner 4-Bit-Zähler aus Flipflops (aufgeklappt) bei 1 MHz: im Zeitverlauf kommen die Flanken der höheren Stufen später */
  function asyncZaehler() {
    var C = root.DQStudioCounters, ex = C.expansion('ctr_async', { bits: 4 }), parts = [part('CLK1', 'clock', 200, 300, { freq: 1e6 }), part('GND1', 'ground', 200, 460)], wires = [];
    var id = {}; ex.parts.forEach(function (p, i) { id[p.key] = 'FF' + (i + 1); parts.push(part(id[p.key], p.type, 420 + p.x + 280, 300 + p.y + 120, p.props)); });
    var ren = function (pin) { var a = pin.split('.'); return id[a[0]] + '.' + a[1]; };
    ex.wires.forEach(function (w) { wires.push(W(ren(w[0]), ren(w[1]))); });

  }
  function tiefpass() {
    return { layout: { parts: [part('G1', 'acsource', 240, 300, { freq: 1000, shape: 'sine', ri: 0.05 }, 1), part('R1', 'resistor', 520, 200, null, 1000), part('C1', 'capacitor', 800, 300, null, 1e-7), part('GND1', 'ground', 520, 440)],
      wires: [W('G1.p', 'R1.a'), W('R1.b', 'C1.a'), W('C1.b', 'G1.n'), W('G1.n', 'GND1.g')] },
      bode: [{ channels: [{ a: 'C1.a' }] }] };
  }
  function rlc() {
    return { layout: { parts: [part('G1', 'acsource', 240, 300, { freq: 500, shape: 'sine', ri: 0.05 }, 1), part('L1', 'inductor', 480, 200, null, 10e-3), part('C1', 'capacitor', 720, 200, null, 10e-6), part('R1', 'resistor', 900, 300, null, 10), part('GND1', 'ground', 520, 440)],
      wires: [W('G1.p', 'L1.a'), W('L1.b', 'C1.a'), W('C1.b', 'R1.a'), W('R1.b', 'G1.n'), W('G1.n', 'GND1.g')] },
      bode: [{ channels: [{ a: 'R1.a' }] }] };
  }
  /* Gruppen wie die Bauteilleiste (studio.js PALETTE): Logik · Flip-Flops · Zähler · Anzeigen · Analog · Anwendungen */
  var CATS = ['Logik', 'Flip-Flops', 'Zähler', 'Anzeigen', 'Analog', 'Anwendungen'];
  var OLD = [
    { cat: 'Zähler', id: 'zaehler', name: 'Asynchroner Zähler aus Flipflops (1 MHz)', text: '4 Bit aus Flipflops bei 1 MHz: Die höheren Stufen schalten mit Laufzeit später.', build: asyncZaehler },
    { cat: 'Analog', id: 'tiefpass', name: 'RC-Tiefpass: Bode-Diagramm', text: '−3 dB bei fg = 1/(2π·R·C) = 1,59 kHz, −20 dB je Dekade, Phase −45° bei fg.', build: tiefpass },
    { cat: 'Analog', id: 'rlc', name: 'Reihenschwingkreis: Resonanzkurve', text: 'Resonanz bei 503 Hz, Güte Q ≈ 3,1 (Bandpass über R).', build: rlc },
    { cat: 'Anwendungen', id: 'uhr', name: 'Digitaluhr (Sekunden 00 – 59)', text: 'Taktgeber 1 Hz, Einer (0–9) und Zehner (0–5), BCD-Dekoder, zwei Siebensegmentanzeigen.', build: digitaluhr }
  ];
  var LIST = [];
  CATS.forEach(function (c) { LIST = LIST.concat((S.exampleDefs || []).concat(OLD).filter(function (e) { return e.cat === c; })); });
  S.examples = LIST; S.exampleCats = CATS;

  /* ---------- Vorführung: Eingänge laufen reihum durch, bis jemand selbst etwas anfasst ---------- */
  var demo = null;
  function applyState(st) {
    var core = S.core;
    Object.keys(st).forEach(function (k) {
      var v = st[k], a = k.split('.'), p = core.part(a[0]); if (!p) return; p.props = p.props || {};

  S.stopDemo = function () { if (demo) { clearInterval(demo.timer); demo = null; } var b = document.getElementById('exDemo'); if (b) b.hidden = true; };
  S.startDemo = function (d) {
    S.stopDemo(); if (!d || !d.seq || !d.seq.length) return;

  /* ---------- Beispiel laden ---------- */
  /* Der erklärende Satz steht als Textelement im Schaltplan (Zeichenebene), über der Schaltung */
  function wrap(t, n) { var out = [], line = ''; t.split(' ').forEach(function (w) { if (line && (line + ' ' + w).length > n) { out.push(line); line = w; } else line = line ? line + ' ' + w : w; }); if (line) out.push(line); return out.join('\n'); }

    layout.draw = [{ id: 'z1', kind: 'text', x: Math.max(20, Math.min.apply(null, xs) - 60), y: Math.max(20, Math.min.apply(null, ys) - 80 - lines * 20), text: wrap(text, 66), size: 16, color: '#5b6b73', bold: false }];
  }

    S.name = ex.name; if (S.updateTitle) S.updateTitle();
    showBanner(ex); if (ex.demo) S.startDemo(ex.demo);
    return true;
  };
  function showBanner(ex) {
    var el = document.getElementById('exBanner'); if (!el) return;
    el.querySelector('b').textContent = ex.name; el.querySelector('.exbody').textContent = 'Die Erklärung steht über der Schaltung.'; el.hidden = false;
    if (S.ed) requestAnimationFrame(function () { S.ed.fit(); });
  }
  S.initExamples = function () {
    var items = [];
    CATS.forEach(function (c) {
      var list = LIST.filter(function (e) { return e.cat === c; }); if (!list.length) return;
      items.push({ head: c });
      list.forEach(function (e) { items.push({ label: e.name, act: function () { S.loadExample(e.id); } }); });
    });
    S.setMenu('bsp', items);
    var cv = document.getElementById('canvasWrap');
    if (cv && !document.getElementById('exBanner')) {
      var el = document.createElement('div'); el.id = 'exBanner'; el.className = 'exbanner'; el.hidden = true;
      el.innerHTML = '<b></b><span class="exbody"></span><span class="exdemo" id="exDemo" hidden>Die Eingänge schalten von selbst durch – ein Klick auf einen Schalter übernimmt.</span><button aria-label="Hinweis schliessen" title="Hinweis schliessen">×</button>';
      cv.insertBefore(el, cv.firstChild); el.querySelector('button').addEventListener('click', function () { el.hidden = true; if (S.ed) S.ed.fit(); });
    }
  };
  /* Fenster eines Beispiels (Oszilloskop, Bode) an den rechten Rand legen und die Schaltung links davon einpassen, damit nichts verdeckt wird */
  function placeWindows() {
    var wins = (S.scopes || []).concat(S.bodes || []), inset = 0;
    wins.forEach(function (w, k) { var W = w.el.offsetWidth; w.el.style.left = Math.max(8, root.innerWidth - W - 8 - 26 * k) + 'px'; w.el.style.top = (120 + 28 * k) + 'px'; inset = Math.max(inset, W - 300 + 16 + 26 * k); });
    if (S.ed) S.ed.insetRight = root.innerWidth > 900 ? inset : 0;
  }
  S.onLoad = (function (prev) { return function (o) { if (prev) prev(o); S.stopDemo(); if (o && o.example) placeWindows(); else if (S.ed) S.ed.insetRight = 0; if (!o || !o.example) { var el = document.getElementById('exBanner'); if (el && !el.hidden) { el.hidden = true; if (S.ed) requestAnimationFrame(function () { S.ed.fit(); }); } } }; })(S.onLoad);
  S.digitaluhr = digitaluhr;
})(window);
