<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Quest</title>
<meta name="description" content="Digital Quest – Schaltungen bauen, messen, verstehen.">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%23121212%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%2236%22%20width%3D%22440%22%20height%3D%22440%22%20rx%3D%2272%22%20fill%3D%22none%22%20stroke%3D%22%232c2c2c%22%20stroke-width%3D%228%22%2F%3E%3Cpath%20d%3D%22M70%20270h90l40-120%2080%20240%2040-120h122%22%20fill%3D%22none%22%20stroke%3D%22%23ffb000%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%22270%22%20r%3D%2222%22%20fill%3D%22%23ffb000%22%2F%3E%3Ccircle%20cx%3D%22442%22%20cy%3D%22270%22%20r%3D%2222%22%20fill%3D%22%23ffb000%22%2F%3E%3C%2Fsvg%3E%0D%0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap">
<style>/* Digital Quest – Stil. Token-Namen wie SCL Quest; Leitfarbe Bernstein (--accent-lead). */
:root {
  --bg-primary: #121212; --bg-secondary: #1a1a1a; --bg-tertiary: #1e1e1e; --bg-panel: #1c1c1c; --bg-editor: #0c0d0a;
  --text-primary: #e0e0e0; --text-dim: #8a8a8a; --text-faint: #5a5a5a; --line: #2c2c2c;
  --accent-lead: #ffb000; --accent-lead-dim: #8a6000;
  --accent-green: #39ff14; --accent-cyan: #1ec8e0; --accent-orange: #ff8c00; --accent-red: #ff3333; --accent-blue: #5b9bff;
  --wire: #d9a441; --sym: #d8d8d8;
  --font-ui: 'Inter', -apple-system, 'Segoe UI', sans-serif; --font-code: 'Fira Code', 'Consolas', 'Courier New', monospace;
  --radius: 8px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg-primary: #eef0e8; --bg-secondary: #ffffff; --bg-tertiary: #e7e9e0; --bg-panel: #ffffff;
  --text-primary: #1f2219; --text-dim: #51564a; --text-faint: #83887a; --line: #d4d6cc;
  --accent-lead: #a86a00; --accent-green: #1d7f08; --accent-cyan: #07788c; --accent-orange: #b35f00; --accent-red: #c41d1d;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font: 15px/1.5 var(--font-ui); }
button, input, select { font: inherit; color: inherit; }
code, kbd, .lcd, .mono { font-family: var(--font-code); }
kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
.dim { color: var(--text-dim); } .small { font-size: 13px; } .tiny { font-size: 11px; }

/* Kopfzeile */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: linear-gradient(#0a0a0a, #141414); border-bottom: 1px solid #2a2a2a; }
:root[data-theme="light"] .top { background: #1b1d17; }
.brand { font-weight: 800; letter-spacing: 3px; color: #eee; display: flex; align-items: center; gap: 10px; }
.brand b { color: var(--accent-lead); font-weight: 800; }
.brand svg { width: 26px; height: 26px; stroke: var(--accent-lead); fill: none; stroke-width: 2; filter: drop-shadow(0 0 6px rgba(255,176,0,.6)); }
.top nav { display: flex; gap: 4px; margin-left: auto; }
.top nav button { background: none; border: 1px solid transparent; color: #bbb; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.top nav button.active, .top nav button:hover { border-color: #333; color: var(--accent-lead); background: #1c1c1c; }
#saveInd { font-size: 12px; color: #777; min-width: 90px; text-align: right; } #saveInd.ok { color: var(--accent-green); } #saveInd.err { color: var(--accent-red); }

.screen { display: none; } .screen.active { display: block; }
.btn { background: var(--bg-tertiary); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; cursor: pointer; display: inline-block; }
.btn:hover { border-color: var(--accent-lead); }
.btn.primary { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); font-weight: 700; }
.btn.danger { border-color: var(--accent-red); color: var(--accent-red); }
.btn.small { padding: 4px 10px; font-size: 13px; } .btn.big { width: 100%; padding: 12px; font-size: 16px; margin-top: 12px; }

/* Karte */
#scr-map { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; }
/* ---- Laborkarte ---- */
.map-head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px 24px; margin-bottom: 22px; padding: 20px 22px; border: 1px solid var(--line); border-radius: 16px;
  background: radial-gradient(120% 140% at 0% 0%, rgba(255,176,0,.10), transparent 55%), linear-gradient(180deg, var(--bg-secondary), var(--bg-primary)); }
.map-head h1 { margin: 0; font-size: 32px; letter-spacing: .5px; } .map-title p { margin: 4px 0 0; }
.map-stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.stat { display: grid; gap: 2px; min-width: 92px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-tertiary); }
.stat b { font-size: 20px; color: var(--text-primary); } .stat b small { font-size: 12px; color: var(--text-dim); font-weight: 400; }
.stat span { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); } .stat b span { font-size: 18px; letter-spacing: 0; }
.stat.wide { min-width: 200px; gap: 8px; } .stat .bar { height: 8px; background: var(--bg-primary); border-radius: 4px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent-lead-dim), var(--accent-lead)); box-shadow: 0 0 10px var(--accent-lead); }
.map-head .map-actions, .map-head .teacher-bar, .map-head .vg-box { grid-column: 1 / -1; }
.map-actions a.btn { text-decoration: none; color: var(--text-primary); }
.progress { display: flex; align-items: center; gap: 10px; font-family: var(--font-code); }
.chapter { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 20px; margin-bottom: 18px; }
.chapter.complete { border-color: rgba(57,255,20,.28); } .chapter.closed { opacity: .72; }
.ch-head { display: grid; grid-template-columns: 64px 1fr auto; gap: 4px 16px; align-items: center; margin-bottom: 14px; }
.ch-sym { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--accent-lead-dim); color: var(--accent-lead); --sym: var(--accent-lead);
  background: radial-gradient(circle at 30% 25%, rgba(255,176,0,.18), rgba(255,176,0,.03) 70%); }
.ch-sym svg { width: 50px; height: 44px; }
.ch-txt h2 { margin: 2px 0 2px; font-size: 21px; } .ch-txt p { margin: 0; color: var(--text-dim); font-size: 14px; }
.chno { font-family: var(--font-code); color: var(--accent-lead); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.ch-prog { position: relative; width: 58px; height: 58px; display: grid; place-items: center; }
.ch-prog .ring { position: absolute; inset: 0; width: 100%; height: 100%; } .ch-prog .mono { font-size: 13px; font-weight: 700; } .ch-prog small { color: var(--text-dim); font-weight: 400; }
.ring circle { fill: none; stroke-width: 4; } .ring-bg { stroke: var(--bg-tertiary); } .ring-fg { stroke: var(--accent-lead); stroke-linecap: round; } .ring.full .ring-fg { stroke: var(--accent-green); }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.node { position: relative; text-align: left; color: var(--text-primary); font: inherit; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 12px; padding: 0 0 10px; cursor: pointer; overflow: hidden;
  display: grid; grid-template-rows: 78px auto 1fr auto; min-height: 176px; transition: transform .12s, border-color .12s, box-shadow .12s; }
.node > span { padding: 0 12px; }
.node .nsym { position: relative; padding: 0; display: grid; place-items: center; color: var(--accent-lead); --sym: var(--accent-lead); border-bottom: 1px solid var(--line);
  background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 100% 13px, linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 13px 100%, radial-gradient(circle at 50% 40%, rgba(255,176,0,.10), transparent 70%), var(--bg-editor); }
.node .nsym > svg { width: 84px; height: 58px; } .node .nsym > svg.symicon { width: 120px; height: 84px; } .ch-sym svg.symicon { width: 70px; height: 62px; }
.ch-sym, .node .nsym { overflow: hidden; }
.pic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pic .pic-a { stroke: var(--accent-cyan); } .pic .pic-d { stroke-width: 1.2; opacity: .55; } .pic .pic-f { fill: currentColor; fill-opacity: .25; }
.pic .pic-t { fill: currentColor; stroke: none; font-family: var(--font-code); font-weight: 700; }
.node .nid { margin-top: 9px; font: 700 12px var(--font-code); letter-spacing: 1px; color: var(--accent-lead); }
.node .nt { margin-top: 2px; font-weight: 600; font-size: 14px; line-height: 1.25; }
.node .nfoot { margin-top: 8px; font-size: 12px; color: var(--text-dim); display: flex; align-items: center; min-height: 18px; }
.nstate { display: inline-flex; align-items: center; gap: 5px; } .nstate svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.nstate.ok { color: var(--accent-green); } .nstate.go { color: var(--accent-lead); font-weight: 700; } .nstate.draft { color: var(--accent-cyan); }
.nstars { font-size: 15px; letter-spacing: 3px; }
.node i { position: absolute; font-style: normal; }
.node .nok { top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-green); color: #0b1a06; box-shadow: 0 0 10px rgba(57,255,20,.5); }
.node .nok svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.node .nboss, .node .nkind { top: 7px; left: 7px; font: 700 9px var(--font-code); letter-spacing: 1.5px; padding: 2px 6px; border-radius: 4px; }
.node .nboss { background: var(--accent-red); color: #fff; } .node .nkind { background: rgba(30,200,224,.16); color: var(--accent-cyan); border: 1px solid rgba(30,200,224,.4); text-transform: uppercase; }
.node:hover:not(:disabled), .node:focus-visible { transform: translateY(-3px); border-color: var(--accent-lead); box-shadow: 0 10px 24px rgba(0,0,0,.35), 0 0 0 1px var(--accent-lead-dim); outline: none; }
.node.k-theory .nsym { color: var(--accent-cyan); --sym: var(--accent-cyan); background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 100% 13px, linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 13px 100%, radial-gradient(circle at 50% 40%, rgba(30,200,224,.12), transparent 70%), var(--bg-editor); }
.node.k-theory .pic .pic-a { stroke: var(--accent-lead); } .node.k-theory .nid { color: var(--accent-cyan); }
.node.done { border-color: rgba(57,255,20,.35); } .node.done .nsym { color: var(--accent-green); --sym: var(--accent-green); }
.node.next { border-color: var(--accent-lead); box-shadow: 0 0 0 1px var(--accent-lead), 0 0 22px rgba(255,176,0,.22); }
.node.boss { border-color: rgba(255,51,51,.6); } .node.boss .nsym { background: radial-gradient(circle at 50% 40%, rgba(255,51,51,.18), transparent 70%), var(--bg-editor); }
.node.locked { cursor: not-allowed; } .node.locked .nsym, .node.locked .nid, .node.locked .nt { filter: grayscale(1); opacity: .38; }
:root[data-theme="light"] .node .nsym, :root[data-theme="light"] .node.k-theory .nsym { background-color: #fbfbf7; }
@media (max-width: 760px) {
  .map-head { grid-template-columns: 1fr; padding: 16px; } .map-stats { justify-content: flex-start; } .stat.wide { flex: 1; }
  .ch-head { grid-template-columns: 48px 1fr auto; gap: 4px 12px; } .ch-sym { width: 48px; height: 48px; border-radius: 10px; } .ch-sym svg { width: 38px; height: 34px; } .ch-txt p { display: none; }
  .nodes { grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; } .node { grid-template-rows: 66px auto 1fr auto; } .node .nsym > svg { width: 70px; height: 48px; } .node .nsym > svg.symicon { width: 100px; height: 70px; }
}
@media (prefers-reduced-motion: reduce) { .node { transition: none; } .node:hover:not(:disabled) { transform: none; } }

/* Aufgabe */
#scr-task.active { display: grid; grid-template-columns: 320px 1fr 280px; gap: 12px; padding: 12px; min-height: calc(100vh - 56px); }
.panel { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; }
.crumb { font-family: var(--font-code); font-size: 12px; color: var(--accent-lead); letter-spacing: 1px; }
#taskInfo h2 { margin: 4px 0 8px; }
.story { font-style: italic; color: var(--text-dim); border-left: 3px solid var(--accent-lead-dim); padding-left: 10px; }
.brief { margin: 10px 0; } .learn { background: var(--bg-tertiary); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.hints { display: flex; gap: 6px; margin: 10px 0 6px; } .hint { background: rgba(255,176,0,.08); border: 1px solid var(--accent-lead-dim); border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 14px; }
.protocol { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.protocol h3, .panel h3 { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin: 6px 0 8px; }
.protocol label, .fld { display: grid; grid-template-columns: 1fr 100px 26px; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 14px; }
.protocol input, .fld input, .fld select { background: var(--bg-editor); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-family: var(--font-code); color: #f0f0f0; width: 100%; }
:root[data-theme="light"] .fld input, :root[data-theme="light"] .protocol input, :root[data-theme="light"] .fld select { background: #fff; color: #111; }
.fld input.bad { border-color: var(--accent-red); } .fld em, .protocol em { font-style: normal; color: var(--text-dim); font-family: var(--font-code); }
.fld input[type=range] { grid-column: span 2; }
.res { list-style: none; padding: 0; margin: 12px 0; font-size: 14px; } .res li { padding: 3px 0; } .res .ok { color: var(--accent-green); } .res .bad { color: var(--accent-red); }
.st { padding: 6px 10px; border-radius: 6px; margin: 4px 0; font-size: 13px; }
.st.ok { color: var(--accent-green); background: rgba(57,255,20,.06); } .st.err { color: #ff8080; background: rgba(255,51,51,.10); border: 1px solid rgba(255,51,51,.35); } .st.info { color: var(--accent-cyan); background: rgba(30,200,224,.08); }

.center { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
#palette { display: flex; gap: 6px; flex-wrap: wrap; }
.palbtn { display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px 3px 4px; cursor: pointer; font-size: 13px; }
.palbtn:hover { border-color: var(--accent-lead); } .palbtn svg { width: 38px; height: 38px; }
.palbtn .sym { stroke-width: 4; }
.toolbar .sep { flex: 1; } .tb { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.tb:hover, .tb.on { border-color: var(--accent-lead); color: var(--accent-lead); }
.boardwrap { background: var(--bg-editor); border: 1px solid #262626; border-radius: 12px; overflow: hidden; flex: 1; min-height: 380px; }
#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; }
/* Werkbank (bench.js) – feste Laborfarben, unabhaengig vom Thema */
#bench { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; outline: none; background: #1b1612; }
/* Die Zeichenfläche wächst nicht mit einer langen Seitenleiste über den Bildschirm hinaus (Einstellungs-Box, Lösung, Protokoll) */
#board, #bench { max-height: calc(100vh - 170px); }
#board.off, #bench.off { display: none; }
/*CIRCUIT-START*/
.bblock { stroke: rgba(0,0,0,.45); stroke-width: 1.5; } .bbevel { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.2; }
.bpart { cursor: grab; } .bsel { fill: none; stroke: #ffb000; stroke-width: 2.5; stroke-dasharray: 7 5; }
.blead { fill: none; stroke: #9ea3a6; stroke-width: 2.8; stroke-linecap: round; } .bleadhi { fill: none; stroke: rgba(255,255,255,.55); stroke-width: .9; stroke-linecap: round; }
.bprint { font: 700 12px var(--font-code); fill: #2b2b2b; text-anchor: middle; pointer-events: none; } .bprint.red { fill: #c62828; } .bprint.dark { fill: #222; font-size: 11px; }
.bbig { font: 800 22px var(--font-ui); fill: #fff; text-anchor: middle; pointer-events: none; }
.bchip { font: 600 11px var(--font-code); fill: #cfcfcf; text-anchor: middle; pointer-events: none; }
.blbl { font: 600 13px var(--font-code); fill: #e8f0ec; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 3px; pointer-events: none; }
.bpart.locked .blbl { fill: #9fe0b8; }
.bwirehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.bwire.pending { fill: none; stroke: #ffb000; stroke-width: 5; stroke-dasharray: 8 6; stroke-linecap: round; opacity: .85; pointer-events: none; }
.bpinhit { fill: transparent; cursor: crosshair; }
.bpin { fill: none; stroke: transparent; stroke-width: 3; pointer-events: none; }
[data-pin]:hover .bpin { stroke: #ffb000; } .bpin.active { stroke: #ffb000; stroke-width: 4; filter: drop-shadow(0 0 4px #ffb000); }
.bprobe { pointer-events: none; }
.bprobe.grab { pointer-events: auto; cursor: grab; } .bprobehit { fill: transparent; } .bprobe.grab:hover .bprobehit { fill: rgba(255,176,0,.14); }
.bprobe.grab.parked path:nth-of-type(3) { filter: drop-shadow(0 0 5px rgba(255,176,0,.7)); }
#bench.probing { cursor: grabbing; } #bench.probing .bprobe.grab { cursor: grabbing; }
.bgen { font: 700 10px var(--font-code); fill: #39ff14; text-anchor: middle; pointer-events: none; }
.bdev { cursor: default; } .bdevtxt { font: 700 9px var(--font-code); fill: #d8d8d8; text-anchor: middle; pointer-events: none; }
.bmlcd { font: 700 21px var(--font-code); fill: #1b2413; text-anchor: end; pointer-events: none; } .bmsub { font: 700 8px var(--font-code); fill: #2f3a24; pointer-events: none; }
.bdevwarn { font: 800 11px var(--font-ui); fill: #ff5a3c; text-anchor: middle; pointer-events: none; }
.bdial { cursor: pointer; } .bdial text { font: 700 10px var(--font-code); fill: #e0e0e0; text-anchor: middle; pointer-events: none; }
.bdial.on text { fill: #ffb000; } .bdialhit { fill: transparent; } .bdial:hover .bdialhit { fill: rgba(255,176,0,.18); }
.brange { cursor: pointer; } .brange rect { fill: #1c1d20; stroke: #4a4c52; stroke-width: .8; } .brange:hover rect { fill: #33352c; }
.brange text { font: 700 6.5px var(--font-code); fill: #cfcfcf; text-anchor: middle; pointer-events: none; } .brange.on rect { fill: #ffb000; stroke: #ffb000; } .brange.on text { fill: #111; }
.bscgrid { stroke: rgba(57,255,20,.13); stroke-width: 1; } .bsctrace { fill: none; stroke: #ffb000; stroke-width: 2; filter: drop-shadow(0 0 3px #ffb000); }
.bscinfo { font: 8px var(--font-code); fill: #7fd98a; pointer-events: none; }
.bscrun { cursor: pointer; } .bscrun rect { fill: #2e7d32; stroke: #0f3a12; } .bscrun:hover rect { fill: #43a047; } .bscrun text { font: 700 11px var(--font-code); fill: #fff; text-anchor: middle; pointer-events: none; }
/* Touch: groessere Klickflaechen fuer Buchsen/Anschluesse */
@media (pointer: coarse) { .bpinhit { r: 22px; } .pinhit { r: 17px; } .bdialhit { r: 17px; } }
.bvlabel { font: 600 12px var(--font-code); fill: #7fe6ff; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: 3px; pointer-events: none; }
.blcd { font: 700 10px var(--font-code); fill: #1d2416; text-anchor: middle; pointer-events: none; }
.bsmoke path { fill: none; stroke: rgba(200,200,200,.55); stroke-width: 4; stroke-linecap: round; pointer-events: none; animation: bsmoke 1.6s ease-in-out infinite; }
.bsmoke path + path { animation-delay: .8s; }
@keyframes bsmoke { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-14px); } }
/*CIRCUIT-END*/
#statusbar { min-height: 36px; }

/* Schaltplan-Symbole (Arbeitsflaeche bleibt immer dunkel) */
/*CIRCUIT-START*/
.griddot { fill: #2b2d27; }
.sym { fill: none; stroke: var(--sym); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sym.fillsym { fill: var(--sym); } .sym.thin { stroke-width: 1.5; } .sym.thick { stroke-width: 4; } .sym.thick2 { stroke-width: 7; }
.sym.lever { stroke: var(--accent-lead); stroke-width: 3; } .sym.ledbody { stroke: var(--sym); }
.symtxt { fill: var(--sym); font: 700 16px var(--font-code); text-anchor: middle; } .plus { fill: var(--accent-red); font: 700 16px var(--font-code); }
.lbl { fill: #9aa; font: 600 12px var(--font-code); text-anchor: middle; } .val { fill: var(--accent-lead); font: 12px var(--font-code); text-anchor: middle; }
.hit { fill: transparent; stroke: none; } .part { cursor: grab; } .part.selected .sym { stroke: var(--accent-lead); } .part.selected .hit { fill: rgba(255,176,0,.05); stroke: rgba(255,176,0,.4); stroke-dasharray: 4 4; }
.part.locked .lbl { fill: #6c8; }
.wire { fill: none; stroke: var(--wire); stroke-width: 2.6; stroke-linejoin: round; pointer-events: none; }
.wire.selected { stroke: var(--accent-cyan); stroke-width: 4; } .wire.pending { stroke-dasharray: 6 5; opacity: .8; }
.wirehit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.pin { fill: #111; stroke: #9a9a9a; stroke-width: 1.5; } .pin.used { fill: var(--wire); stroke: var(--wire); } .pin.active { fill: var(--accent-lead); stroke: #fff; }
.pinhit { fill: transparent; cursor: crosshair; } [data-pin]:hover .pin { stroke: var(--accent-lead); stroke-width: 3; }
.vlabel { fill: var(--accent-cyan); font: 11px var(--font-code); pointer-events: none; }
.burnt { stroke: var(--accent-red); stroke-width: 3.5; fill: none; }
.lamp-on { fill: var(--accent-green); filter: drop-shadow(0 0 4px var(--accent-green)); } .lamp-off { fill: #333; }
.probe path { stroke-width: 3; fill: none; } .probe text { font: 700 11px var(--font-code); text-anchor: middle; fill: #fff; pointer-events: none; }
.probe-red path { stroke: #ff3b30; } .probe-red circle { fill: #ff3b30; } .probe-black path { stroke: #bbb; } .probe-black circle { fill: #222; stroke: #bbb; }

/*CIRCUIT-END*/
/* Messgeraete */
.meter { background: linear-gradient(#2b2a22, #1e1d17); border: 2px solid #3a3625; border-radius: 14px; padding: 10px; margin-bottom: 12px; }
.lcd { background: #9fb28a; color: #1b2413; font-size: 28px; font-weight: 700; text-align: right; padding: 6px 10px; border-radius: 6px; box-shadow: inset 0 2px 6px rgba(0,0,0,.4); min-height: 48px; letter-spacing: 1px; }
.mm-modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; }
.mm-modes button { background: #111; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 5px 0; cursor: pointer; font-family: var(--font-code); }
.mm-modes button.on { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); }
#mmProbes { display: flex; justify-content: space-between; font-family: var(--font-code); font-size: 12px; } .pr.red { color: #ff6b61; } .pr.black { color: #bbb; }
#mmHelp { font-size: 12px; color: #aaa; margin: 4px 0 0; } #mmWarn { color: #ff8080; font-size: 12px; }
#inspector { margin-bottom: 12px; } .insp-head { margin-bottom: 8px; } .tag { font-size: 11px; background: #234; color: #8cf; padding: 1px 6px; border-radius: 4px; }
.readout { display: grid; grid-template-columns: 24px 1fr; font-family: var(--font-code); font-size: 13px; margin: 8px 0 2px; } .readout dt { color: var(--text-dim); } .readout dd { margin: 0; } .err { color: var(--accent-red); }
.scopebox canvas { width: 100%; height: 150px; border-radius: 8px; border: 1px solid #333; display: block; }
.scope-ctl { display: flex; gap: 6px; margin: 6px 0; } .scope-ctl select { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--line); border-radius: 6px; }
#scopeInfo { font-size: 11px; color: var(--text-dim); font-family: var(--font-code); }

/* Theorie / Handbuch / Einstellungen */
.theory, .settings { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
.lesson { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin: 12px 0 16px; }
.formula { font-family: var(--font-code); font-size: 22px; text-align: center; color: var(--accent-lead); padding: 10px; }
.th-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; } .th-head h2 { margin: 0; } .th-head .btn.on { border-color: var(--accent-red); color: var(--accent-red); }
.merksatz { margin: 0 0 16px; padding: 14px 18px; border: 1px solid var(--accent-lead); border-left-width: 6px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,176,0,.12), rgba(255,176,0,.03)); }
.merksatz h3 { margin: 0 0 6px; font: 700 12px var(--font-code); letter-spacing: 2px; text-transform: uppercase; color: var(--accent-lead); } .merksatz p { margin: 0; font-size: 15px; line-height: 1.5; }
.q { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; padding: 10px 14px; background: var(--bg-secondary); }
.q legend { font-weight: 600; padding: 0 6px; } .q label { display: block; padding: 3px 0; cursor: pointer; }
.q.ok { border-color: var(--accent-green); } .q.bad { border-color: var(--accent-red); } .expl { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
.manual { display: grid; grid-template-columns: 220px 1fr; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 24px 18px; }
.manual nav { display: flex; flex-direction: column; gap: 4px; } .manual nav button { text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.manual nav button.on { border-color: var(--accent-lead); color: var(--accent-lead); } .manual article { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
.settings section { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
.settings .fld { grid-template-columns: 140px 1fr; }

/* Modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modal.open { display: flex; } .modal-box { background: var(--bg-secondary); border: 1px solid var(--accent-lead-dim); border-radius: 14px; padding: 20px 24px; max-width: 460px; width: 100%; box-shadow: 0 0 40px rgba(255,176,0,.15); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; } .win { color: var(--accent-lead); margin-top: 0; }

/* Handy / Tablet */
@media (max-width: 1100px) { #scr-task.active { grid-template-columns: 1fr 280px; } #taskInfo { grid-column: 1 / -1; } }
@media (max-width: 760px) {
  #scr-task.active { grid-template-columns: 1fr; padding: 8px; } .boardwrap { min-height: 300px; aspect-ratio: 1000 / 620; flex: none; }
  .top { padding: 8px 10px; gap: 6px; } .brand span { display: none; } .top nav { gap: 2px; } .top nav button { padding: 6px 6px; font-size: 12px; } .top nav .long { display: none; } #saveInd { display: none; }
  .manual { grid-template-columns: 1fr; } .progress .bar { width: 140px; }
}

/* Multimeter-Verfahren, Zeitlupe, Ansichtswechsel */
.mm-type { display: flex; gap: 4px; align-items: center; margin: 0 0 8px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; }
.mm-range { display: flex; gap: 3px; align-items: center; margin: 0 0 8px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; }
.mm-range button { background: #111; border: 1px solid #444; color: #ddd; border-radius: 5px; padding: 2px 6px; cursor: pointer; font: 11px var(--font-code); }
.mm-range button.on { background: var(--accent-lead); color: #111; border-color: var(--accent-lead); }
.mm-type button { background: #111; border: 1px solid #444; color: #ccc; border-radius: 6px; padding: 3px 6px; cursor: pointer; font: 11px var(--font-code); }
.mm-type button.on { border-color: var(--accent-cyan); color: var(--accent-cyan); }
#replay { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--bg-secondary); border: 1px solid var(--accent-lead-dim); border-radius: 12px; padding: 6px 8px; }

#rpLabel { font: 12px var(--font-code); color: var(--accent-lead); flex-basis: 100%; }
.tb.view { border-color: var(--accent-lead-dim); }
.map-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Werkbank-Details */
/*CIRCUIT-START*/
.bside { stroke: rgba(0,0,0,.45); stroke-width: 1.2; }
.bgloss { fill: rgba(255,255,255,.28); pointer-events: none; }
.bsym .sym { stroke: #46505a; stroke-width: 5; } .bsym .sym.fillsym, .bsym .fillsym { fill: #46505a; } .bsym .symtxt, .bsym .plus { fill: #46505a; font-size: 26px; }
.bsym .hit, .bsym .lamp-on, .bsym .lamp-off { display: none; } .bsym { pointer-events: none; }
.bpart-tiny { font: 700 5.5px var(--font-code); fill: #9a9a9a; text-anchor: middle; pointer-events: none; } .bpart-tiny.w { fill: #f0f0f0; } .bpart-tiny.g { fill: #555; }
.bmatprint { font: 800 14px var(--font-ui); letter-spacing: 3px; fill: rgba(255,255,255,.14); pointer-events: none; }
.bdevtxt.small { font-size: 6.5px; fill: #b9b9b9; }

.symtxt.small { font-size: 10px; }
.seg { fill: none; stroke: #3a1d1d; stroke-width: 4; stroke-linecap: round; } .seg.on { stroke: #ff3b30; filter: drop-shadow(0 0 3px #ff3b30); }

.bdot { fill: #fff6c2; stroke: rgba(120,80,0,.8); stroke-width: 1; filter: drop-shadow(0 0 2px #ffd54a); pointer-events: none; }
.bilabel { font: 700 11px var(--font-code); fill: #ffe9a8; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.8); stroke-width: 3px; pointer-events: none; }
.bprint.w { fill: #e8e8e8; }
/*CIRCUIT-END*/
/* Wahrheitstabellen in Auftraegen und Lektionen */
table.tt { border-collapse: collapse; margin: 8px 0; font: 13px var(--font-code); }
table.tt th, table.tt td { border: 1px solid var(--line); padding: 3px 10px; text-align: center; }
table.tt th { background: var(--bg-tertiary); color: var(--text-dim); } table.tt .o { color: var(--accent-lead); font-weight: 700; }
p.limit { border-left: 3px solid var(--accent-orange); padding: 4px 10px; background: var(--bg-tertiary); border-radius: 0 6px 6px 0; }

/* Karte: Teile I–IV, Stufen, Auszeichnungen */
.part-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
.map-head + .part-head { margin-top: 8px; }
.part-head h2 { margin: 0; font-size: 22px; }

.part-prog { margin-left: auto; color: var(--text-dim); font-size: 13px; }
.stage-tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
.stage-tag.grund { color: var(--accent-cyan); border-color: var(--accent-cyan); }
.stage-tag.profi { color: var(--accent-red); border-color: var(--accent-red); }
.award-card { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--bg-secondary); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; }

.award-card.earned { border: 1px solid var(--accent-lead); box-shadow: 0 0 24px rgba(255,176,0,.12); }
.award-lock svg { width: 26px; height: 26px; fill: none; stroke: var(--text-faint); stroke-width: 2; }
.award-note { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; border: 1px solid var(--accent-lead-dim); border-radius: 10px; }
.award-note p { margin: 0; }

/* Zertifikat / Abzeichen (druckbar) */
#scr-award { max-width: 900px; margin: 0 auto; padding: 24px 18px 60px; }
.award-tools { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.award-tools .fld { flex: 1; min-width: 220px; margin: 0; grid-template-columns: auto 1fr; font-family: var(--font-ui); }
.certificate { --ink: #1f2219; --gold: #a86a00; position: relative; background: #fffdf6; color: var(--ink); border: 10px double var(--gold); border-radius: 6px; padding: 40px 48px 28px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.certificate.grund { --gold: #4d6275; }

@media (max-width: 760px) {

}

}

.teacher-bar b { color: var(--accent-cyan); }
.teacher-bar .fld { margin: 0 0 0 auto; grid-template-columns: auto minmax(220px, 360px); }
.small.err { color: var(--accent-red); }
@media (max-width: 760px) { .teacher-bar .fld { margin-left: 0; grid-template-columns: 1fr; width: 100%; } }

/* Bauteil-Datenblatt */
.ds-pop { position: fixed; z-index: 60; width: 380px; max-width: calc(100vw - 20px); max-height: calc(100vh - 20px); overflow: auto; background: var(--bg-panel); border: 1px solid var(--accent-lead-dim); border-radius: 12px; padding: 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); font-size: 13px; }

.symicon .hit, .symicon .lamp-on { display: none; }

.ds-fn { margin: 6px 0 8px; line-height: 1.45; }
.ds-pop h4, .ds-card h4 { margin: 10px 0 4px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
.ds-t { width: 100%; border-collapse: collapse; }
.ds-t th, .ds-t td { text-align: left; vertical-align: top; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); font-weight: 400; }
.ds-t th { color: var(--text-dim); white-space: nowrap; }
.ds-t th.mono { color: var(--accent-lead); font-weight: 700; width: 40px; }
.ds-lim td.mono { color: var(--accent-orange); font-weight: 700; white-space: nowrap; }
.ds-t td.mono { white-space: nowrap; }
.ds-f { margin-top: 10px; font-size: 13px; }
.insp-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; } .ds-btn { margin-left: auto; }
.ds-card { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; max-width: 560px; }
.ds-card .ds-pics svg { height: 120px; }
.ds-lim tr:not(.ds-note) th, .ds-lim tr:not(.ds-note) td { border-bottom: 0; padding-bottom: 0; }
.ds-note td { color: var(--text-dim); font-size: 12px; padding-top: 1px; }

/* Konto: Anmeldung, Admin, Dozent */
#scr-account { max-width: 1000px; margin: 0 auto; padding: 24px 18px 60px; }
.account h2 { margin-top: 0; }
.acc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.acc-card { background: var(--bg-secondary); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.acc-card h3 { margin: 0 0 10px; } .acc-card h4 { margin: 14px 0 6px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); }
.acc-fld { grid-template-columns: 1fr; gap: 2px; margin-bottom: 8px; } .acc-fld input { font-family: var(--font-ui); }
.acc-inline { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 12px; margin-top: 12px; }
.acc-inline h4 { flex-basis: 100%; margin: 0; } .acc-inline .acc-fld { flex: 1; min-width: 150px; margin: 0; }
.acc-who { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--bg-secondary); border: 1px solid var(--accent-lead-dim); border-radius: 12px; padding: 12px 18px; margin-bottom: 16px; }
.acc-who h3 { margin: 0; }
.acc-t { width: 100%; border-collapse: collapse; font-size: 14px; }
.acc-t th, .acc-t td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.acc-t th { color: var(--text-dim); font-weight: 400; font-size: 12px; }

.acc-tabs { display: flex; flex-wrap: wrap; gap: 6px; } .acc-tabs .btn.on { border-color: var(--accent-lead); color: var(--accent-lead); }

/* Konto: Vorgaben (Zuweisungen) */
.due-over { color: var(--accent-red); font-weight: 600; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; margin: 1px 2px; border-radius: 8px; border: 1px solid var(--line); color: var(--text-dim); }
.chip.ok { border-color: var(--accent-green); color: var(--accent-green); }
.zuw-new { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 4px; }

/* ---- Taschenrechner (Overlay ueber dem aktuellen Bildschirm) ---- */
.calc-btn { background: none; border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 30px; display: inline-grid; place-items: center; color: var(--text-dim); cursor: pointer; margin-left: 6px; }

#calc { position: fixed; inset: 0; z-index: 600; } #calc[hidden] { display: none; }
.calc-back { position: absolute; inset: 0; background: rgba(0,0,0,.25); }

.calc-box { position: absolute; right: 16px; bottom: 16px; width: 320px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; background: #1a1a1a; color: #e0e0e0; border: 1px solid #8a6000; border-radius: 14px; padding: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.6); display: grid; gap: 8px; color-scheme: dark; }

.calc-head { display: flex; align-items: center; gap: 8px; } .calc-head b { color: #ffb000; } .calc-head .small { flex: 1; } .calc-x { background: none; border: 0; color: #8a8a8a; font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; } .calc-x:hover { color: #e0e0e0; }
.calc-hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font: 12px var(--font-code); color: #8a8a8a; max-height: 96px; overflow: auto; } .calc-hist:empty { display: none; }
.calc-hist li { display: flex; justify-content: space-between; gap: 8px; } .calc-hist button { background: none; border: 0; color: #8a8a8a; font: inherit; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0; } .calc-hist button:hover { color: #e0e0e0; } .calc-hist b { color: #e0e0e0; white-space: nowrap; }
.calc-in { width: 100%; box-sizing: border-box; background: #111; color: #ddd; border: 1px solid #444; border-radius: 8px; padding: 10px 12px; font: 18px var(--font-code); text-align: right; } .calc-in:focus { border-color: #ffb000; outline: none; } .calc-in::placeholder { color: #666; }
.calc-out { min-height: 22px; text-align: right; font: 700 18px var(--font-code); color: #8a8a8a; } .calc-out.ok { color: #39ff14; } .calc-out.err { color: #ff3333; font-size: 13px; font-weight: 400; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .calc-keys button { background: #1e1e1e; border: 1px solid #3a3a3a; color: #e0e0e0; border-radius: 8px; padding: 10px 0; font: 600 16px var(--font-code); cursor: pointer; }

@media print { #calc, .calc-btn { display: none !important; } }

/* Digital Quest – Schaltungs-Engine (window.DQEngine)
 * Knotenanalyse (Nodal Analysis) mit Norton-Ersatz fuer alle Quellen, stueckweise-lineare
 * Dioden/LEDs, Logikgatter (5-V-Logik, implizite Versorgung), Kondensator (Backward Euler),
 * Multimeter (V, A, Ohm, V~ mit AVG/TRMS) mit realistischen Fehlbedienungen und Anzeige wie ein 6000-Digit-DMM,
 * Wechselspannungsquelle (Sinus/Rechteck/Dreieck), Rechenschritt-Verlauf fuer die Zeitlupe.
 * Einheiten: V, A, Ohm, F, s, Hz. Kein DOM – laeuft in Node und im Browser.
 */
(function (root) {
  'use strict';

  var GMIN = 1e-9;            // Leitwert jedes Knotens gegen Masse (verhindert singulaere Matrix)
  var G_OPEN = 1e-12;         // offener Schalter, gesperrte Diode, Gattereingang
  var G_CLOSED = 1e3;         // geschlossener Schalter (1 mOhm)
  var LOGIC = { vcc: 5, vth: 2.5, rout: 25 };
  var METER = { rV: 1e7, rA: 0.1, fuseA: 10, iOhm: 1e-3, olOhm: 40e6, cal: 0.002 }; // cal: Verstaerkungsfehler des Geraets (+0,2 %)
  var LIMITS = { lampBurn: 2, ledReverse: 5 }; // Lampe brennt ab lampBurn · Nennleistung durch; LED meldet Sperrspannung ab ledReverse Volt
  var TRACE_MAX = 200;        // Zeitlupe: hoechstens so viele Rechenschritte pro Arbeitspunkt speichern

  var LED_COLORS = {
    rot: { vf: 1.8, rgb: '#ff3b30' }, gelb: { vf: 2.0, rgb: '#ffd60a' },
    gruen: { vf: 2.1, rgb: '#32d74b', label: 'grün' }, blau: { vf: 3.0, rgb: '#0a84ff' }, weiss: { vf: 3.1, rgb: '#f5f5f7' } // Schlüssel bleiben ASCII (Spielstand), label nur für die Anzeige
  };

  /* Bauteilkatalog: Pins, Standardwerte, Namenspraefix. Geometrie liegt im Editor. */
  var PARTS = {
    ground:    { label: 'Masse', prefix: 'GND', pins: ['g'], props: {} },
    battery:   { label: 'Spannungsquelle', prefix: 'B', pins: ['p', 'n'], props: { value: 9, ri: 0.05, imax: 3 }, unit: 'V' },
    resistor:  { label: 'Widerstand', prefix: 'R', pins: ['a', 'b'], props: { value: 1000, pmax: 0.25 }, unit: 'Ω' },
    pot:       { label: 'Potentiometer', prefix: 'P', pins: ['a', 'w', 'b'], props: { value: 10000, pos: 0.5, pmax: 0.25 }, unit: 'Ω' },
    lamp:      { label: 'Lampe', prefix: 'H', pins: ['a', 'b'], props: { value: 60, pnom: 1.35 }, unit: 'Ω' },
    switch:    { label: 'Schalter', prefix: 'S', pins: ['a', 'b'], props: { closed: false } },
    button:    { label: 'Taster', prefix: 'T', pins: ['a', 'b'], props: { closed: false } },
    led:       { label: 'LED', prefix: 'D', pins: ['a', 'k'], props: { color: 'rot', rs: 10, imax: 0.03, inom: 0.02 } },
    diode:     { label: 'Diode', prefix: 'V', pins: ['a', 'k'], props: { vf: 0.7, rs: 1, imax: 1 } },
    capacitor: { label: 'Kondensator', prefix: 'C', pins: ['a', 'b'], props: { value: 100e-6 }, unit: 'F' },
    ammeter:   { label: 'Strommesser', prefix: 'A', pins: ['a', 'b'], props: {} },
    clock:     { label: 'Taktgeber', prefix: 'CLK', pins: ['out'], props: { freq: 1 }, unit: 'Hz' },
    acsource:  { label: 'Wechselspannungsquelle', prefix: 'G', pins: ['p', 'n'], props: { value: 10, freq: 50, shape: 'sine', offset: 0, ri: 0.05, imax: 3 }, unit: 'V' }, // value = Scheitelwert Û
    not:  { label: 'NICHT', prefix: 'U', pins: ['in', 'out'], props: {}, logic: function (i) { return !i[0]; } },
    and:  { label: 'UND', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] && i[1]; } },
    or:   { label: 'ODER', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] || i[1]; } },
    nand: { label: 'NAND', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return !(i[0] && i[1]); } },
    nor:  { label: 'NOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return !(i[0] || i[1]); } },
    xor:  { label: 'XOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] !== i[1]; } },
    xnor: { label: 'XNOR', prefix: 'U', pins: ['in1', 'in2', 'out'], props: {}, logic: function (i) { return i[0] === i[1]; } },

    logicled: { label: 'Logikanzeige', prefix: 'L', pins: ['in'], props: { color: 'rot' }, digital: true },
    seg7:     { label: '7-Segment-Anzeige', prefix: 'AZ', pins: ['a', 'b', 'c', 'd', 'e', 'f', 'g'], props: {}, digital: true },

  /* ---------- Multimeter ----------
   * probe: { mode:'V'|'A'|'R', a:'R1.a' (rote Spitze), b:'R1.b' (schwarze Spitze) } */

    'Ω': [[600, 1, 'Ω', 1], [6e3, 1e3, 'kΩ', 3], [60e3, 1e3, 'kΩ', 2], [600e3, 1e3, 'kΩ', 1], [6e6, 1e6, 'MΩ', 3], [40e6, 1e6, 'MΩ', 2]]

  /* ---------- Zeitsimulation (Oszilloskop) ----------

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  defTheory({
    id: 'T1B', ch: 1, title: 'Ohmsches Gesetz und Vorwiderstand', tags: ['elektro.ohm', 'bauteil.led', 'elektro.leistung'],
    merksatz: 'U = R · I: Doppelte Spannung, doppelter Strom; doppelter Widerstand, halber Strom. Eine LED braucht einen Vorwiderstand R = (U_B − U_F) / I, sonst brennt sie durch.',
    visual: { type: 'circuit', caption: 'Den Vorwiderstand verkleinern: Der Strom steigt, die LED wird heller – unter etwa 240 Ω fliessen mehr als 30 mA und sie brennt durch. „Neu starten“ setzt eine neue LED ein.',
      layout: { parts: [{ id: 'B1', type: 'battery', value: 9, x: 160, y: 300 }, { id: 'R1', type: 'resistor', value: 470, x: 320, y: 200 }, { id: 'D1', type: 'led', x: 480, y: 300, rot: 90 }], wires: [W('B1.p', 'R1.a'), W('R1.b', 'D1.a'), W('D1.k', 'B1.n')] },
      bench: { parts: [{ id: 'B1', x: 240, y: 460 }, { id: 'R1', x: 500, y: 290 }, { id: 'D1', x: 740, y: 460, rot: 90 }] },
      sliders: [{ part: 'R1', prop: 'value', label: 'Vorwiderstand R1', min: 150, max: 4700, log: true, unit: 'Ω', round: 2 }],
      readouts: [{ label: 'I', sel: 'D1', q: 'i' }, { label: 'U an R1', sel: 'R1', q: 'v' }, { label: 'Helligkeit', sel: 'D1', q: 'brightness' }] },
    lesson:
      '<p>Der <b>Widerstand R</b> (Ohm, Ω) bremst den Strom. Spannung, Strom und Widerstand hängen fest zusammen – das <b>Ohmsche Gesetz</b>:</p>' +
      '<div class="formula">U = R · I &nbsp;&nbsp; I = U / R &nbsp;&nbsp; R = U / I</div>' +
      '<p>Doppelte Spannung am gleichen Widerstand → doppelter Strom. Doppelter Widerstand bei gleicher Spannung → halber Strom.</p>' +
      '<p><b>Leistung:</b> P = U · I (Watt, W). Ein Widerstand wird warm; überschreitet P seine Belastbarkeit (hier 0,25 W), wird er zu heiss.</p>' +
      '<p><b>LED und Vorwiderstand:</b> Eine LED leitet ab ihrer Flussspannung U<sub>F</sub> (rot ≈ 1,8 V, grün ≈ 2,1 V, blau ≈ 3 V) und begrenzt den Strom selbst kaum. Deshalb braucht sie einen <b>Vorwiderstand</b>, der die restliche Spannung „aufnimmt“:</p>' +
      '<div class="formula">R<sub>V</sub> = (U<sub>B</sub> − U<sub>F</sub>) / I<sub>LED</sub></div>' +
      '<p>Üblich sind 10–20 mA. Die LED hat eine Richtung: Strom nur von der <b>Anode</b> (+, langes Bein) zur <b>Kathode</b> (−, abgeflachte Seite).</p>',
    questions: [
      { q: 'An 10 V liegt ein Widerstand von 470 Ω. Welcher Strom fliesst?', options: ['2,13 mA', '21,3 mA', '47 mA', '4,7 A'], correct: 1,
        explain: 'I = 10 V / 470 Ω ≈ 0,0213 A = 21,3 mA.', verifyTruth: { layout: ohm(10, 470), sel: 'R1', q: 'i' } },
      { q: 'Bei 10 V sollen genau 10 mA fliessen. Wie gross muss R sein?', options: ['100 Ω', '1 kΩ', '10 kΩ', '0,1 Ω'], correct: 1, explain: 'R = U / I = 10 V / 0,01 A = 1000 Ω.' },
      { q: 'Rote LED (U_F = 1,8 V) an 9 V, gewünscht 20 mA. Welcher Vorwiderstand?', options: ['90 Ω', '360 Ω', '450 Ω', '1,8 kΩ'], correct: 1, explain: 'R = (9 V − 1,8 V) / 0,02 A = 360 Ω.' },
      { q: 'Was passiert, wenn du eine LED ohne Vorwiderstand direkt an 9 V anschliesst?', options: ['Sie leuchtet besonders schön', 'Nichts, sie sperrt', 'Der Strom wird sehr gross – sie brennt durch', 'Die Batterie lädt sich auf'], correct: 2, explain: 'Oberhalb von U_F begrenzt fast nur der kleine Bahnwiderstand den Strom.' },
      { q: 'Welche Leistung setzt ein 1-kΩ-Widerstand an 10 V um?', options: ['0,01 W', '0,1 W', '1 W', '10 W'], correct: 1, explain: 'P = U² / R = 100 V² / 1000 Ω = 0,1 W.' }
    ]
  });

      '<p>Der <b>Effektivwert</b> (RMS, root mean square) ist die Gleichspannung, die an einem Widerstand <i>dieselbe Leistung</i> umsetzt. Die 230 V im Haushalt sind ein Effektivwert.</p>' +

      { q: 'Welches Messgerät zeigt bei einer beliebigen Kurvenform den richtigen Effektivwert?', options: ['Drehspulgerät', 'AVG-Multimeter', 'TRMS-Multimeter', 'Jedes Multimeter auf V⎓'], correct: 2, explain: 'Nur TRMS berechnet den echten quadratischen Mittelwert.' },

/* Kapitel 5 – Zahlensysteme
 * Quelle: Zahlensysteme Umrechnung (Stellenwertsystem, Dezimal→Binaer per Division mit Rest, Fremdsystem→Dezimal, verwandte
 * Systeme 2/8/16, Horner-Schema), Digitaltechnik stationaere Vorgaenge Kap. 2 (Bin – Hex – Dez, Bitbreite, MSB/LSB),
 * Kap. 7.1 (BCD-Code). Umgesetzt am Experimentierboard: Pegelschalter = Bits, Logikanzeigen = Bitreihe. */
(function () {
  'use strict';

  defChapter({
    id: 5, title: 'Zahlensysteme',
    intro: 'Computer kennen nur 0 und 1. Am Experimentierboard stellst du Zahlen mit Pegelschaltern ein, liest Bitmuster an Logikanzeigen ab und bringst eine 7-Segment-Anzeige zum Zählen.',
    sequence: ['T5A', '5.1', '5.2', '5.3', '5.4', '5.5', 'T5B', '5.6', '5.7', '5.8', '5.9', '5.10']
  });

  /* Bitreihe: n Pegelschalter (E1 = Bit 0, rechts) mit n Logikanzeigen darueber, MSB links. value = eingestellte Zahl, wired = verdrahtet */
  function row(n, value, wired, ledsWired) {
    var parts = [{ id: 'GND1', type: 'ground', x: 120 + 100 * n, y: 440, rot: 0 }], wires = [];
    for (var b = 0; b < n; b++) {
      var x = 120 + 100 * (n - 1 - b);
      var e = { id: 'E' + (b + 1), type: 'logicin', x: x, y: 420, rot: 270 };
      if (value >> b & 1) e.props = { closed: true };
      parts.push(e, { id: 'L' + (b + 1), type: 'logicled', x: x, y: 200, rot: 270 });
      if (wired !== false && (ledsWired === undefined || ledsWired)) wires.push(W('E' + (b + 1) + '.out', 'L' + (b + 1) + '.in'));
    }
    return { parts: parts, wires: wires };
  }
  function benchRow(n) {
    var p = [{ id: 'GND1', x: 170 + 120 * n, y: 640, rot: 0 }], s = n > 6 ? 105 : 120;
    for (var b = 0; b < n; b++) { var x = 180 + s * (n - 1 - b); p.push({ id: 'E' + (b + 1), x: x, y: 470, rot: 270 }, { id: 'L' + (b + 1), x: x, y: 230, rot: 270 }); }
    return { parts: p };
  }
  function ledsShow(n, value) { var e = []; for (var b = 0; b < n; b++) e.push({ sel: 'L' + (b + 1), on: !!(value >> b & 1) }); return e; }

    lesson:

(function () {

  defTheory({
    id: 'T6A', ch: 6, title: 'UND, ODER, NICHT', tags: ['digital.gatter', 'digital.und', 'digital.oder', 'digital.nicht'],
    merksatz: 'UND liefert 1 nur bei lauter Einsen, ODER bei mindestens einer 1, NICHT kehrt um; unbenutzte Eingänge festlegen und nie Ausgang gegen Ausgang schalten.',
    visual: { type: 'circuit', toggleView: false, caption: 'Pegelschalter E1 und E2 anklicken: L1 = E1 UND E2, L2 = E1 ODER E2, L3 = NICHT E1. Probiere alle vier Kombinationen.',
      layout: LG.net(2, [['U1', 'and', ['E1', 'E2']], ['U2', 'or', ['E1', 'E2']], ['U3', 'not', ['E1']]], { L1: 'U1', L2: 'U2', L3: 'U3' }) },
    lesson:
      '<p>Ein <b>Gatter</b> verknüpft logische Eingänge (0/1) zu einem Ausgang. Seine Funktion beschreibt die <b>Wahrheitstabelle</b>: jede Eingangskombination mit dem zugehörigen Ausgang.</p>' +
      '<table class="tt"><tr><th>Gatter</th><th>Symbol (DIN)</th><th>Ausdruck</th><th>Ausgang = 1, wenn …</th></tr>' +
      '<tr><td>UND (AND)</td><td>&amp;</td><td>a = e1 ∧ e2 = e1·e2</td><td>alle Eingänge 1</td></tr>' +
      '<tr><td>ODER (OR)</td><td>≥1</td><td>a = e1 ∨ e2 = e1 + e2</td><td>mindestens ein Eingang 1</td></tr>' +
      '<tr><td>NICHT (NOT)</td><td>1 mit Kreis</td><td>a = ē</td><td>der Eingang 0 ist</td></tr></table>' +
      '<p><b>Postulate:</b> 1 ∧ e = e · 0 ∧ e = 0 · e ∧ e = e · e ∧ ē = 0 · 1 ∨ e = 1 · 0 ∨ e = e · e ∨ ē = 1.</p>' +
      '<p><b>Beschaltungsregeln:</b> Keine offenen Eingänge (undefinierter Pegel) – unbenutzte Eingänge fest auf 0 oder 1 legen. Und <b>nie Ausgang gegen Ausgang</b>: Treiben zwei Ausgänge verschiedene Pegel auf dieselbe Leitung, fliesst ein grosser Ausgleichsstrom und die Bausteine gehen kaputt.</p>',
    questions: [
      { q: 'Wann liefert ein UND-Gatter mit zwei Eingängen eine 1?', options: ['Wenn ein Eingang 1 ist', 'Wenn beide Eingänge 1 sind', 'Wenn beide 0 sind', 'Wenn die Eingänge verschieden sind'], correct: 1, explain: 'UND: alle Eingänge müssen 1 sein.' },
      { q: 'Welches Symbol steht im DIN-Kasten des ODER-Gatters?', options: ['&', '≥1', '=1', '1'], correct: 1, explain: '≥1: mindestens ein Eingang muss 1 sein.' },
      { q: 'Was ergibt e ∧ ē?', options: ['e', 'ē', '0', '1'], correct: 2, explain: 'Etwas kann nicht gleichzeitig 1 und 0 sein – das UND ist immer 0.' },
      { q: 'Was ergibt 0 ∨ e?', options: ['0', '1', 'e', 'ē'], correct: 2, explain: 'Eine 0 am ODER ändert nichts – der Ausgang folgt e.' },
      { q: 'Warum darf man zwei Gatter-Ausgänge nicht direkt verbinden?', options: ['Weil dann nichts leuchtet', 'Weil bei verschiedenen Pegeln ein grosser Ausgleichsstrom fliesst', 'Weil das Signal zu schwach wird', 'Das ist erlaubt'], correct: 1, explain: 'Ein Ausgang zieht nach 5 V, der andere nach 0 V – Kurzschluss zwischen den Ausgangsstufen.' }
    ]
  });

  gateTask({ id: '6.1', n: 2, title: 'Das UND-Gatter', tags: ['digital.und', 'digital.gatter'], f: function (b) { return b[0] & b[1]; },
    story: 'Die Stanzmaschine darf nur stanzen, wenn beide Hände auf den Zweihandtastern liegen.',
    brief: 'Baue mit einem <b>UND-Gatter</b> die Zweihandsicherung: L1 soll nur leuchten, wenn E1 <b>und</b> E2 auf 1 stehen. Prüfe alle vier Kombinationen.',
    learn: 'UND: nur wenn alle Eingänge 1 sind, ist der Ausgang 1.', take: 'a = e1 ∧ e2 – die Zweihandsicherung ist ein UND.',
    hint: 'E1.out → U1.in1, E2.out → U1.in2, U1.out → L1.in.', hint2: 'Das UND-Gatter liegt als Chip 74HC08 auf dem Board.',
    palette: ['and'], need: { and: 1 }, gates: [['U1', 'and', ['E1', 'E2']]], wrong: [['ODER statt UND', [['U1', 'or', ['E1', 'E2']]]]] });

  gateTask({ id: '6.2', n: 2, title: 'Das ODER-Gatter', tags: ['digital.oder', 'digital.gatter'], f: function (b) { return b[0] | b[1]; },
    story: 'Die Hupe soll ertönen, wenn die Tür offen ist oder das Fenster.',
    brief: 'Baue mit einem <b>ODER-Gatter</b> die Warnung: L1 leuchtet, sobald E1 <b>oder</b> E2 (oder beide) auf 1 stehen.',
    learn: 'ODER: mindestens ein Eingang 1 → Ausgang 1.', take: 'a = e1 ∨ e2.',
    hint: 'Gleiche Verdrahtung wie beim UND, nur mit dem ODER-Chip (74HC32).', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['or'], need: { or: 1 }, gates: [['U1', 'or', ['E1', 'E2']]], wrong: [['UND statt ODER', [['U1', 'and', ['E1', 'E2']]]]] });

  gateTask({ id: '6.3', n: 1, title: 'Das NICHT-Gatter', tags: ['digital.nicht', 'digital.gatter'], f: function (b) { return 1 - b[0]; },
    story: 'Die Kontrolllampe „Band steht“ soll leuchten, solange der Motor-Schalter aus ist.',
    brief: 'Baue mit einem <b>NICHT-Gatter</b> (Inverter) die Anzeige: L1 leuchtet, wenn E1 = 0.',
    learn: 'NICHT kehrt um: aus 0 wird 1 und umgekehrt.', take: 'a = ē – der Kreis am Symbol bedeutet Negation.',
    hint: 'E1.out → U1.in, U1.out → L1.in.', hint2: 'Der Inverter-Chip heisst 74HC04.',
    palette: ['not'], need: { not: 1 }, gates: [['U1', 'not', ['E1']]] });

  var inhib = LG.net(2, [['U1', 'not', ['E2']], ['U2', 'and', ['E1', 'U1']]], { L1: 'U2' });
  var fInh = function (b) { return b[0] & (1 - b[1]); };
  defTask({
    id: '6.4', ch: 6, title: 'Wahrheitstabelle aufnehmen', tags: ['digital.wahrheitstabelle', 'digital.gatter'],
    story: 'Eine fremde Schaltung auf dem Board. Was macht sie? Die Werkmeisterin: „Nicht raten – alle Kombinationen durchschalten.“',
    brief: 'Schalte E1 und E2 durch alle vier Kombinationen und notiere den Ausgang L1 (0 oder 1) im Protokoll.',
    learn: 'Die Wahrheitstabelle beschreibt eine Schaltung vollständig.', take: 'Diese Schaltung ist eine Sperre (Inhibition): a = e1 ∧ ē2 – E2 verbietet E1.',
    hint: 'Pegelschalter anklicken, Anzeige ablesen, nächste Kombination.', hint2: 'Nur bei E1 = 1 und E2 = 0 leuchtet L1.',
    palette: [], start: inhib, ref: inhib, bench: LG.bench(inhib),
    tests: [{ name: 'Schaltung', expect: [{ noFault: true }] }],
    measure: [[0, 0], [0, 1], [1, 0], [1, 1]].map(function (c) { return { id: 'a' + c[0] + c[1], ask: 'L1 bei E2 = ' + c[0] + ', E1 = ' + c[1], unit: '', value: fInh([c[1], c[0]]), tol: 0, abs: 0.1 }; })
  });

  var clash = LG.io(2); clash.wires = [W('E1.out', 'L1.in'), W('E2.out', 'L1.in')];
  var orFix = LG.net(2, [['U1', 'or', ['E1', 'E2']]], { L1: 'U1' });
  defTask({
    id: '6.5', ch: 6, title: 'Nie Ausgang gegen Ausgang', tags: ['digital.beschaltung', 'digital.oder', 'elektro.fehlersuche'],
    story: 'Ein Kollege hat zwei Pegelschalter direkt auf die Anzeige gelegt. Bei E1 = 1 und E2 = 0 wird der Baustein heiss.',
    brief: 'Schalte einmal E1 = 1, E2 = 0 und beobachte die Diagnose. Behebe den Fehler: Die Anzeige soll leuchten, wenn E1 <b>oder</b> E2 auf 1 steht – ohne dass je zwei Ausgänge gegeneinander arbeiten.',
    learn: 'Signale verknüpft man mit Gattern, nicht durch Zusammenschalten.', take: 'Direkt verbunden kämpfen zwei Ausgänge gegeneinander: ~100 mA Ausgleichsstrom. Ein ODER-Gatter löst das sauber.',
    hint: 'Lösche die beiden Leitungen zu L1 und setze ein ODER dazwischen.', hint2: 'E1 → U1.in1, E2 → U1.in2, U1.out → L1.',
    palette: ['or'], need: { or: 1 }, start: clash, ref: orFix, bench: LG.bench(orFix),
    wrong: [named('Ausgänge noch verbunden', clash)],
    tests: LG.truth(2, function (b) { return b[0] | b[1]; }).map(function (t) { t.expect.push({ noFault: true }); return t; })
  });

  defTheory({
    id: 'T6B', ch: 6, title: 'NAND, NOR, XOR, XNOR', tags: ['digital.nand', 'digital.nor', 'digital.xor', 'digital.gatter'],
    merksatz: 'NAND und NOR sind die negierten Grundgatter und als Universalgatter Basis für alles; XOR ist 1 bei verschiedenen, XNOR bei gleichen Eingängen (1-Bit-Vergleicher).',
    visual: { type: 'circuit', toggleView: false, caption: 'Dieselben Eingänge an vier Gattern: L1 NAND, L2 NOR, L3 XOR, L4 XNOR. XOR leuchtet nur, wenn E1 und E2 verschieden sind, XNOR nur, wenn sie gleich sind.',
      layout: LG.net(2, [['U1', 'nand', ['E1', 'E2']], ['U2', 'nor', ['E1', 'E2']], ['U3', 'xor', ['E1', 'E2']], ['U4', 'xnor', ['E1', 'E2']]], { L1: 'U1', L2: 'U2', L3: 'U3', L4: 'U4' }) },
    lesson:
      '<p><b>NAND</b> = NICHT-UND: a = ¬(e1 ∧ e2) – nur bei 1/1 ist der Ausgang 0. <b>NOR</b> = NICHT-ODER: a = ¬(e1 ∨ e2) – nur bei 0/0 ist der Ausgang 1. Im Symbol steht der Negationskreis am Ausgang.</p>' +
      '<p><b>XOR</b> (Antivalenz, =1): a = e1·ē2 ∨ ē1·e2 – Ausgang 1, wenn die Eingänge <i>verschieden</i> sind. <b>XNOR</b> (Äquivalenz): Ausgang 1, wenn die Eingänge <i>gleich</i> sind – ein 1-Bit-Vergleicher.</p>' +
      '<p>Postulate XOR: 0 ⊕ e = e · 1 ⊕ e = ē · e ⊕ e = 0 · e ⊕ ē = 1. Mit XOR lässt sich also ein Signal wahlweise durchlassen oder invertieren.</p>' +
      '<p>NAND und NOR heissen <b>Universalgatter</b>: Aus ihnen allein lässt sich jede andere Funktion aufbauen (Kapitel 7).</p>' +
      '<p><b>Positive Logik</b>: High = 1. Bei negativer Logik wäre Low = 1 – ein UND wird dann zum ODER. In diesem Kurs gilt positive Logik.</p>',
    questions: [
      { q: 'Wann ist der Ausgang eines NAND-Gatters 0?', options: ['Wenn ein Eingang 0 ist', 'Nur wenn beide Eingänge 1 sind', 'Wenn beide 0 sind', 'Nie'], correct: 1, explain: 'NAND ist das invertierte UND.' },
      { q: 'Wann ist der Ausgang eines NOR-Gatters 1?', options: ['Nur wenn beide Eingänge 0 sind', 'Wenn ein Eingang 1 ist', 'Wenn beide 1 sind', 'Immer'], correct: 0, explain: 'NOR ist das invertierte ODER.' },
      { q: 'Welches Gatter liefert 1, wenn die beiden Eingänge verschieden sind?', options: ['UND', 'ODER', 'XOR', 'XNOR'], correct: 2, explain: 'XOR = Antivalenz: verschieden → 1.' },
      { q: 'Was ergibt 1 ⊕ e (XOR mit 1)?', options: ['0', '1', 'e', 'ē'], correct: 3, explain: 'XOR mit 1 invertiert das Signal.' },
      { q: 'Warum heissen NAND und NOR Universalgatter?', options: ['Sie sind am billigsten', 'Aus ihnen allein lässt sich jede Logikfunktion bauen', 'Sie haben mehr Eingänge', 'Sie funktionieren mit jeder Spannung'], correct: 1, explain: 'NICHT, UND und ODER lassen sich nur aus NAND (oder nur aus NOR) zusammensetzen.' }
    ]
  });

  gateTask({ id: '6.6', n: 2, title: 'Das NAND-Gatter', tags: ['digital.nand', 'digital.gatter'], f: function (b) { return 1 - (b[0] & b[1]); },
    story: 'Die Störmeldung „Nicht beide Pumpen bereit“ soll leuchten, ausser beide sind bereit.',
    brief: 'Baue die Meldung mit einem <b>NAND-Gatter</b>: L1 leuchtet, ausser E1 und E2 sind beide 1.',
    learn: 'NAND = NICHT-UND.', take: 'a = ¬(e1 ∧ e2): nur 1/1 ergibt 0.',
    hint: 'NAND-Chip 74HC00.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['nand'], need: { nand: 1 }, gates: [['U1', 'nand', ['E1', 'E2']]], wrong: [['UND statt NAND', [['U1', 'and', ['E1', 'E2']]]]] });
  gateTask({ id: '6.7', n: 2, title: 'Das NOR-Gatter', tags: ['digital.nor', 'digital.gatter'], f: function (b) { return 1 - (b[0] | b[1]); },
    story: 'Die Anzeige „Alles ruhig“ leuchtet nur, wenn weder Sensor 1 noch Sensor 2 anspricht.',
    brief: 'Baue die Ruhe-Anzeige mit einem <b>NOR-Gatter</b>.',
    learn: 'NOR = NICHT-ODER.', take: 'a = ¬(e1 ∨ e2): nur 0/0 ergibt 1.',
    hint: 'NOR-Chip 74HC02.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['nor'], need: { nor: 1 }, gates: [['U1', 'nor', ['E1', 'E2']]], wrong: [['ODER statt NOR', [['U1', 'or', ['E1', 'E2']]]]] });
  gateTask({ id: '6.8', n: 2, title: 'Die Treppenhausschaltung', tags: ['digital.xor', 'digital.gatter'], f: function (b) { return b[0] ^ b[1]; },
    story: 'Unten und oben an der Treppe ein Schalter. Jeder soll das Licht umschalten können – egal, wie der andere steht.',
    brief: 'Baue die Wechselschaltung mit einem <b>XOR-Gatter</b>. Prüfe: Jedes Umlegen eines Schalters wechselt den Zustand von L1.',
    learn: 'XOR: verschiedene Eingänge → 1.', take: 'Jede Änderung eines Eingangs kehrt den XOR-Ausgang um – genau die Wechselschaltung.',
    hint: 'XOR-Chip 74HC86.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['xor'], need: { xor: 1 }, gates: [['U1', 'xor', ['E1', 'E2']]], wrong: [['ODER statt XOR', [['U1', 'or', ['E1', 'E2']]]]] });
  gateTask({ id: '6.9', n: 2, title: 'Sind beide gleich?', tags: ['digital.xnor', 'digital.vergleicher'], f: function (b) { return b[0] === b[1] ? 1 : 0; },
    story: 'Zwei Endschalter müssen immer gleich stehen. Stimmt etwas nicht, soll die Gut-Anzeige erlöschen.',
    brief: 'Baue einen <b>1-Bit-Vergleicher</b> mit dem XNOR-Gatter: L1 leuchtet, wenn E1 und E2 gleich sind.',
    learn: 'XNOR (Äquivalenz): gleiche Eingänge → 1.', take: 'Das XNOR ist der einfachste Vergleicher.',
    hint: 'XNOR-Chip 74HC7266.', hint2: 'E1 → in1, E2 → in2, out → L1.',
    palette: ['xnor', 'xor'], need: {}, gates: [['U1', 'xnor', ['E1', 'E2']]], wrong: [['XOR statt XNOR', [['U1', 'xor', ['E1', 'E2']]]]] });
  gateTask({ id: '6.10', n: 3, title: 'Die Alarmanlage', tags: ['digital.gatter', 'digital.entwurf'], f: function (b) { return (b[0] | b[1]) & b[2]; },
    story: 'Die Alarmanlage: Türkontakt (E1) oder Fensterkontakt (E2) lösen aus – aber nur, wenn die Anlage scharf geschaltet ist (E3).',
    brief: 'Baue die Alarmanlage aus Grundgattern: <b>A = (E1 ∨ E2) ∧ E3</b>.',
    learn: 'Mehrere Gatter hintereinander ergeben zusammengesetzte Funktionen.', take: 'Klammern zuerst: erst ODER, dann UND.',
    hint: 'U1 = ODER aus E1 und E2, U2 = UND aus U1 und E3.', hint2: 'U1.out → U2.in1, E3.out → U2.in2, U2.out → L1.',
    palette: ['and', 'or', 'not'], need: {}, gates: [['U1', 'or', ['E1', 'E2']], ['U2', 'and', ['U1', 'E3']]],
    wrong: [['ohne Scharfschaltung', [['U1', 'or', ['E1', 'E2']]]]] });
})();

/* Kapitel 7 – Boolesche Algebra
 * Quelle: Digitaltechnik stationaere Vorgaenge Kap. 5 (Kommutativ-, Assoziativ-, Distributivgesetze, De Morgan, Uebungsserie,
 * normierte Schaltungen), Zusammenfassung Gesetze der Booleschen Algebra (inkl. Bindungsregel, Absorption). */
(function () {
  'use strict';
  defChapter({
    id: 7, title: 'Boolesche Algebra',
    intro: 'Rechnen mit 0 und 1: Mit den Gesetzen der Booleschen Algebra machst du Schaltungen kleiner – und baust aus einem einzigen Gattertyp jede beliebige Funktion.',
    sequence: ['T7A', '7.1', '7.2', '7.3', '7.4', '7.5', 'T7B', '7.6', '7.7', '7.8', '7.9', '7.10']
  });
  var named = function (name, l) { l.name = name; return l; };
  function algTask(o) {
    var ref = LG.net(o.n, o.gates, { L1: o.gates.length ? o.gates[o.gates.length - 1][0] : o.src });
    defTask({
      id: o.id, ch: 7, title: o.title, tags: o.tags, story: o.story,
      brief: o.brief + (o.limit ? '<p class="limit">Erlaubt: höchstens <b>' + o.limit.gates + '</b> Gatter' + (o.only ? ' – nur ' + o.only : '') + '.</p>' : '') + LG.table(o.n, o.f),
      learn: o.learn, take: o.take, hint: o.hint, hint2: o.hint2,
      palette: o.palette, need: o.need || {}, limit: o.limit,
      start: LG.io(o.n), ref: ref, bench: LG.bench(ref),
      wrong: (o.wrong || []).map(function (w) { return named(w[0], LG.net(o.n, w[1], { L1: w[1].length ? w[1][w[1].length - 1][0] : w[2] })); }),
      tests: LG.truth(o.n, o.f)
    });
  }

  defTheory({
    id: 'T7A', ch: 7, title: 'Gesetze der Booleschen Algebra', tags: ['digital.boolesche_algebra'],
    merksatz: 'Kommutativ-, Assoziativ-, Distributiv- und Absorptionsgesetz plus die Postulate erlauben es, Schaltfunktionen so umzuformen, dass dieselbe Wahrheitstabelle mit weniger Gattern auskommt.',
    visual: { type: 'circuit', toggleView: false, caption: 'Absorptionsgesetz live bewiesen: L1 = E1 ∧ (E1 ∨ E2) mit zwei Gattern, L2 = E1 ganz ohne Gatter. Bei jeder Eingangskombination leuchten beide gleich.',
      layout: LG.net(2, [['U1', 'or', ['E1', 'E2']], ['U2', 'and', ['E1', 'U1']]], { L1: 'U2', L2: 'E1' }) },
    lesson:
      '<p>Mit 0 und 1 lässt sich rechnen wie mit Zahlen – nach eigenen Gesetzen. <b>Bindungsregel:</b> UND bindet stärker als ODER (wie · vor +).</p>' +
      '<table class="tt"><tr><th>Gesetz</th><th>ODER</th><th>UND</th></tr>' +
      '<tr><td>Kommutativ (vertauschen)</td><td>e1 ∨ e2 = e2 ∨ e1</td><td>e1·e2 = e2·e1</td></tr>' +
      '<tr><td>Assoziativ (verbinden)</td><td>(e1 ∨ e2) ∨ e3 = e1 ∨ (e2 ∨ e3)</td><td>(e1·e2)·e3 = e1·(e2·e3)</td></tr>' +
      '<tr><td>Distributiv (ausklammern)</td><td>e1 ∨ e2·e3 = (e1 ∨ e2)(e1 ∨ e3)</td><td>e1(e2 ∨ e3) = e1·e2 ∨ e1·e3</td></tr></table>' +
      '<p>Dazu die <b>Postulate</b> aus Kapitel 6 (e ∨ ē = 1, e·ē = 0, e ∨ 1 = 1, e·0 = 0 …) und die <b>Absorption</b>: e1 ∨ e1·e2 = e1 · e1(e1 ∨ e2) = e1 · e1 ∨ ē1·e2 = e1 ∨ e2.</p>' +
      '<p><b>Vereinfachen</b> heisst: dieselbe Wahrheitstabelle mit weniger Gattern. Beispiel: e1·e2 ∨ e1·ē2 = e1·(e2 ∨ ē2) = e1·1 = e1 – kein einziges Gatter nötig.</p>' +
      '<p>Assoziativ bedeutet praktisch: Ein UND mit drei Eingängen baust du aus zwei UND mit je zwei Eingängen.</p>',
    questions: [
      { q: 'Was ist nach der Bindungsregel mit e1 ∨ e2·e3 gemeint?', options: ['(e1 ∨ e2)·e3', 'e1 ∨ (e2·e3)', 'e1·e2 ∨ e3', 'Das ist nicht eindeutig'], correct: 1, explain: 'UND bindet stärker – zuerst e2·e3, dann ODER.' },
      { q: 'Vereinfache e1·e2 ∨ e1·e3.', options: ['e1 ∨ e2·e3', 'e1·(e2 ∨ e3)', 'e2·e3', 'e1'], correct: 1, explain: 'e1 ausklammern (Distributivgesetz).' },
      { q: 'Was ergibt e1 ∨ e1·e2 (Absorption)?', options: ['e1', 'e2', 'e1·e2', '1'], correct: 0, explain: 'Ist e1 = 1, ist alles 1; ist e1 = 0, ist auch e1·e2 = 0 – also bleibt e1.' },
      { q: 'Vereinfache e1·e2 ∨ e1·ē2.', options: ['e2', 'e1', '1', 'e1·e2'], correct: 1, explain: 'e1·(e2 ∨ ē2) = e1·1 = e1.' },
      { q: 'Wie viele UND-Gatter mit zwei Eingängen brauchst du für e1·e2·e3·e4?', options: ['1', '2', '3', '4'], correct: 2, explain: 'Assoziativ: ((e1·e2)·e3)·e4 – drei Gatter.' }
    ]
  });

  algTask({ id: '7.1', n: 3, title: 'Drei Bedingungen', tags: ['digital.boolesche_algebra', 'digital.und'], f: function (b) { return b[0] & b[1] & b[2]; },
    story: 'Die Presse startet nur, wenn Schutztür zu (E1), Werkstück eingelegt (E2) und Start gedrückt (E3).',
    brief: 'Baue <b>A = E1 · E2 · E3</b>. Es gibt nur UND-Gatter mit zwei Eingängen.',
    learn: 'Assoziativgesetz: (e1·e2)·e3 = e1·(e2·e3).', take: 'Zwei Zweier-UND ergeben ein Dreier-UND – egal, welche beiden zuerst.',
    hint: 'Erst E1 und E2 verunden, das Ergebnis mit E3.', hint2: 'U1 = E1·E2, U2 = U1·E3.',
    palette: ['and'], limit: { gates: 2 }, gates: [['U1', 'and', ['E1', 'E2']], ['U2', 'and', ['U1', 'E3']]], wrong: [['E3 vergessen', [['U1', 'and', ['E1', 'E2']]]]] });

  algTask({ id: '7.2', n: 3, title: 'Ausklammern spart Gatter', tags: ['digital.boolesche_algebra', 'digital.vereinfachen'], f: function (b) { return (b[0] & b[1]) | (b[0] & b[2]); },
    story: 'Der Entwurf aus dem Büro: A = E1·E2 ∨ E1·E3 – drei Gatter. Der Einkauf fragt, ob es billiger geht.',
    brief: 'Baue <b>A = E1·E2 ∨ E1·E3</b> mit nur zwei Gattern.', limit: { gates: 2 },
    learn: 'Distributivgesetz: e1·e2 ∨ e1·e3 = e1·(e2 ∨ e3).', take: 'Ausklammern spart ein Gatter – gleiche Wahrheitstabelle, weniger Bauteile.',
    hint: 'Was haben beide Terme gemeinsam?', hint2: 'U1 = E2 ∨ E3, U2 = E1 · U1.',
    palette: ['and', 'or'], gates: [['U1', 'or', ['E2', 'E3']], ['U2', 'and', ['E1', 'U1']]] });

  algTask({ id: '7.3', n: 2, title: 'De Morgan I', tags: ['digital.demorgan', 'digital.boolesche_algebra'], f: function (b) { return 1 - (b[0] & b[1]); },
    story: 'Kein NAND-Chip mehr im Lager. Es gibt nur ODER- und NICHT-Gatter.',
    brief: 'Baue <b>A = ¬(E1 · E2)</b> nur mit <b>ODER und NICHT</b>.', limit: { gates: 3 }, only: 'ODER und NICHT',
    learn: 'De Morgan: ¬(e1·e2) = ē1 ∨ ē2.', take: 'Negation über den ganzen Term: UND wird zu ODER, jede Variable wird negiert.',
    hint: 'Beide Eingänge einzeln invertieren, dann verodern.', hint2: 'U1 = ¬E1, U2 = ¬E2, U3 = U1 ∨ U2.',
    palette: ['or', 'not'], gates: [['U1', 'not', ['E1']], ['U2', 'not', ['E2']], ['U3', 'or', ['U1', 'U2']]],
    wrong: [['nur ein Eingang invertiert', [['U1', 'not', ['E1']], ['U3', 'or', ['U1', 'E2']]]]] });

  algTask({ id: '7.4', n: 2, title: 'De Morgan II', tags: ['digital.demorgan', 'digital.boolesche_algebra'], f: function (b) { return 1 - (b[0] | b[1]); },
    story: 'Jetzt fehlt der NOR-Chip. Im Lager: UND und NICHT.',

    visual: { type: 'kmap', vars: 3, minterms: [1, 3, 5, 7], caption: 'Das Beispiel aus dem Text: alle Einsen haben e1 = 1 → ein Päckchen aus vier Feldern, A = e1. Klicke eigene Einsen und X ein und lass die Päckchen bilden.' },
    lesson:
      '<p>Das <b>KV-Diagramm</b> (Karnaugh-Veitch) ist die Wahrheitstabelle als Feld, so angeordnet, dass sich <b>benachbarte Felder in genau einer Variablen unterscheiden</b> (Gray-Code-Reihenfolge 0, 1, 3, 2). Auch der gegenüberliegende Rand ist benachbart.</p>' +
      '<table class="tt"><tr><th></th><th>ē2 ē1</th><th>ē2 e1</th><th>e2 e1</th><th>e2 ē1</th></tr><tr><th>ē3</th><td>0</td><td>1</td><td>3</td><td>2</td></tr><tr><th>e3</th><td>4</td><td>5</td><td>7</td><td>6</td></tr></table>' +

    merksatz: 'Codes ordnen Zahlen Bitmuster zu: BCD je Ziffer, 3-Exzess = BCD + 3, Gray ändert pro Schritt genau ein Bit (Drehgeber); ein Paritätsbit macht die Zahl der Einsen gerade oder ungerade.',

    lesson:
      '<p>Ein <b>Code</b> ordnet Zeichen oder Zahlen Bitmuster zu. <b>BCD</b> codiert jede Dezimalziffer mit 4 Bit. Der <b>3-Exzess-Code</b> ist BCD + 3 (0 → 0011) – praktisch für Rechenwerke, weil das Neunerkomplement einfach durch Invertieren entsteht. Beim <b>Gray-Code</b> ändert sich von einer Zahl zur nächsten <b>genau ein Bit</b> – wichtig für Drehgeber, damit beim Übergang keine falschen Zwischenwerte entstehen.</p>' +

    lesson:

      '<p><b>Glättung:</b> Ein grosser Kondensator parallel zur Last nach dem Gleichrichter (Ladekondensator) wird in den Spannungsspitzen geladen und versorgt die Last dazwischen. Übrig bleibt eine kleine <b>Brummspannung</b> – je grösser C, desto kleiner.</p>' +
      '<p><b>Tiefpass</b> (R in Reihe, C gegen Masse): lässt tiefe Frequenzen durch, dämpft hohe. <b>Hochpass</b> (C in Reihe, R gegen Masse): umgekehrt. Grenzfrequenz:</p>' +
      '<div class="formula">f<sub>g</sub> = 1 / (2·π·R·C)</div>' +
      '<p>Bei f<sub>g</sub> ist die Ausgangsspannung auf 70,7 % gesunken (−3 dB).</p>' +
      '<p><b>Taktgeber</b> liefern Rechteckspannung mit Frequenz f und Periodendauer T = 1/f. Mit einem Inverter erhält man das Gegentaktsignal – zwei LEDs blinken abwechselnd.</p>',
    questions: [
      { q: 'Nach welcher Zeit schaltet ein Logikeingang hinter einem RC-Glied (τ = 1 s) auf 1?', options: ['0,1 s', '0,69 s', '1 s', '5 s'], correct: 1, explain: 'Die Schwelle 2,5 V ist bei 50 % erreicht: t = τ · ln 2 ≈ 0,69 s.' },
      { q: 'Wie verkleinert man die Brummspannung eines Gleichrichters?', options: ['Kleineren Ladekondensator', 'Grösseren Ladekondensator', 'Kleineren Lastwiderstand', 'Gar nicht'], correct: 1, explain: 'Ein grösserer Kondensator verliert zwischen den Spitzen weniger Spannung.' },
      { q: 'Grenzfrequenz bei R = 1 kΩ, C = 10 µF?', options: ['1,6 Hz', '15,9 Hz', '159 Hz', '1,59 kHz'], correct: 1, explain: 'f_g = 1 / (2π · 1000 · 0,00001) ≈ 15,9 Hz.' },
      { q: 'Welches Filter lässt tiefe Frequenzen durch?', options: ['Hochpass', 'Tiefpass', 'Bandsperre', 'Keines'], correct: 1, explain: 'Tiefpass: tiefe Frequenzen passieren.' },
      { q: 'Auf wie viel Prozent ist die Ausgangsspannung bei der Grenzfrequenz gesunken?', options: ['50 %', '63 %', '70,7 %', '90 %'], correct: 2, explain: '1/√2 ≈ 0,707 – das sind −3 dB.' }
    ]
  });

  var delay = function (withC) {
    var l = { parts: [{ id: 'E1', type: 'logicin', x: 160, y: 200, rot: 0 }, GND(160, 460), R('R1', 10000, 360, 200), { id: 'L1', type: 'logicled', x: 700, y: 200, rot: 0 }], wires: [W('E1.out', 'R1.a'), W('R1.b', 'L1.in')] };
    if (withC) { l.parts.push(C('C1', 100e-6, 520, 300)); l.wires.push(W('R1.b', 'C1.a'), W('C1.b', 'GND1.g')); }
    return l;
  };
  var delayStart = { parts: delay(false).parts.filter(function (p) { return p.id !== 'R1'; }), wires: [] };
  defTask({
    id: '11.6', ch: 11, title: 'Einschaltverzögerung', tags: ['elektro.rc', 'digital.pegel', 'elektro.zeitkonstante'],
    story: 'Die Anzeige „Anlage bereit“ soll erst leuchten, wenn nach dem Einschalten alles eingeschwungen ist – etwa 0,7 s später.',
    brief: 'Baue ein <b>RC-Glied</b> (R = 10 kΩ, C = 100 µF gegen Masse) zwischen Pegelschalter E1 und Logikanzeige L1. Nach dem Umschalten auf 1 soll L1 erst nach etwa 0,7 s leuchten.',
    learn: 'RC-Glied als Verzögerung: Schaltschwelle bei 0,69 τ.', take: 'Die Logikanzeige schaltet bei 2,5 V – der Kondensator braucht dafür 0,69 · 1 s.',
    hint: 'E1 → R1 → Knoten → L1; vom Knoten C1 gegen Masse.', hint2: 'E1.out → R1.a, R1.b → L1.in und C1.a, C1.b → GND1.g.',
    palette: ['resistor', 'capacitor'], need: { resistor: 1, capacitor: 1 }, start: delayStart, ref: delay(true),
    bench: { parts: [{ id: 'E1', x: 200, y: 300, rot: 0 }, { id: 'R1', x: 440, y: 300, rot: 0 }, { id: 'C1', x: 640, y: 480, rot: 90 }, { id: 'L1', x: 820, y: 300, rot: 0 }, { id: 'GND1', x: 640, y: 680, rot: 0 }] },
    wrong: [named('ohne Kondensator (sofort)', delay(false))],
    tests: [{ name: 'Verzögerung', steps: [
      { name: '0,4 s nach Ein', set: { E1: { closed: true } }, run: 0.4, expect: [{ sel: 'L1', on: false }] },

  var gen = function (props) { return { id: 'G1', type: 'acsource', value: 10, props: Object.assign({ freq: 50, shape: 'sine', offset: 0 }, props || {}), x: 160, y: 300, rot: 0 }; };
  var smooth = function (withC) {
    var l = { parts: [gen(), { id: 'V1', type: 'diode', x: 300, y: 200, rot: 0 }, R('R1', 1000, 480, 300, 90)], wires: [W('G1.p', 'V1.a'), W('V1.k', 'R1.a'), W('R1.b', 'G1.n')] };
    if (withC) { l.parts.push(C('C1', 470e-6, 620, 300)); l.wires.push(W('C1.a', 'R1.a'), W('C1.b', 'R1.b')); }
    return l;

  defTask({
    id: '11.7', ch: 11, title: 'Der Ladekondensator', tags: ['elektro.gleichrichter', 'elektro.kondensator', 'messen.oszilloskop'],
    story: 'Der Einweggleichrichter liefert nur Buckel. Die Elektronik dahinter braucht aber eine ruhige Gleichspannung.',
    brief: 'Setze einen <b>Ladekondensator 470 µF</b> parallel zu R1. Prüfe am Oszilloskop: Die Spannung soll nahe am Scheitelwert liegen und nur wenig schwanken (Brummspannung unter 1,2 V).',
    learn: 'Der Kondensator überbrückt die Lücken zwischen den Halbwellen.', take: 'Aus 2,8 V Mittelwert werden fast 9 V – mit kleiner Brummspannung.',
    hint: 'C1 oben an R1.a, unten an R1.b.', hint2: 'Oszilloskop mit Zeitbasis 50 ms: fast gerade Linie mit kleinen Zacken.',
    palette: ['capacitor'], need: { capacitor: 1 }, start: smooth(false), ref: smooth(true),
    bench: { parts: [{ id: 'G1', x: 250, y: 460, rot: 0 }, { id: 'V1', x: 480, y: 290, rot: 0 }, { id: 'R1', x: 660, y: 460, rot: 90 }, { id: 'C1', x: 820, y: 460, rot: 90 }] },
    tests: [{ name: 'geglaettet', expect: [{ a: 'R1.a', b: 'R1.b', ac: 'dc', range: [8.2, 9.4] }, { a: 'R1.a', b: 'R1.b', ac: 'pp', range: [0, 1.2] }, { noFault: true }] }],
    measure: [{ id: 'udc', ask: 'Gleichanteil an R1 (V⎓)', unit: 'V', mode: 'AC', q: 'dc', a: 'R1.a', b: 'R1.b', tol: 0.04 }, { id: 'upp', ask: 'Brummspannung (Spitze-Spitze)', unit: 'V', mode: 'AC', q: 'pp', a: 'R1.a', b: 'R1.b', tol: 0.15 }]

  var lowpass = function (hp) {
    return hp ? { parts: [gen(), C('C1', 10e-6, 320, 200, 0), R('R1', 1000, 480, 300, 90)], wires: [W('G1.p', 'C1.a'), W('C1.b', 'R1.a'), W('R1.b', 'G1.n')] }
      : { parts: [gen(), R('R1', 1000, 320, 200), C('C1', 10e-6, 480, 300)], wires: [W('G1.p', 'R1.a'), W('R1.b', 'C1.a'), W('C1.b', 'G1.n')] };
  };
  defTask({
    id: '11.8', ch: 11, title: 'Der Tiefpass', tags: ['elektro.filter', 'elektro.rc', 'messen.wechselspannung'],
    story: 'Ein Sensorsignal ist von 50-Hz-Brumm überlagert. Ein RC-Tiefpass soll dämpfen.',
    brief: 'Baue einen <b>RC-Tiefpass</b>: R1 = 1 kΩ in Reihe, C1 = 10 µF gegen den Rückleiter. Miss die Ausgangsspannung am Knoten zwischen R1 und C1 gegen den Rückleiter G1.– (V~ TRMS).',
    learn: 'Tiefpass: f_g = 1/(2πRC) = 15,9 Hz – 50 Hz liegen weit darüber.', take: 'Bei 50 Hz bleiben nur rund 30 % übrig (7,07 V → 2,1 V).',
    hint: 'G1.+ → R1 → Knoten → C1 → G1.–. Gemessen wird an C1.', hint2: 'U_a/U_e = 1/√(1 + (f/f_g)²) = 1/√(1 + 9,9) ≈ 0,30.',
    palette: ['resistor', 'capacitor'], need: { resistor: 1, capacitor: 1 }, start: { parts: [gen()], wires: [] }, ref: lowpass(false),
    bench: { parts: [{ id: 'G1', x: 250, y: 460, rot: 0 }, { id: 'R1', x: 520, y: 290, rot: 0 }, { id: 'C1', x: 760, y: 460, rot: 90 }] },
