    measure: [{ id: 'ua', ask: 'Ausgangsspannung (C1.a gegen G1.–, V~)', unit: 'V', mode: 'VAC', meterType: 'trms', a: 'C1.a', b: 'G1.n', tol: 0.04 }]
  });
  defTask({
    id: '11.9', ch: 11, title: 'Der Hochpass', tags: ['elektro.filter', 'elektro.rc', 'messen.wechselspannung'],
    story: 'Jetzt umgekehrt: Ein Gleichanteil soll weg, das 50-Hz-Signal soll bleiben.',
    brief: 'Baue einen <b>RC-Hochpass</b>: C1 = 10 µF in Reihe, R1 = 1 kΩ gegen den Rückleiter. Miss die Ausgangsspannung am Knoten zwischen C1 und R1 gegen den Rückleiter G1.– (V~ TRMS).',
    learn: 'Hochpass: lässt Frequenzen weit über f_g fast ungedämpft durch.', take: 'Bei 50 Hz (≈ 3 · f_g) kommen 95 % durch: 7,07 V → 6,7 V.',
    hint: 'Nur die Reihenfolge von R und C tauschen.', hint2: 'G1.+ → C1 → Knoten → R1 → G1.–. Gemessen an R1.',
    palette: ['resistor', 'capacitor'], need: { resistor: 1, capacitor: 1 }, start: { parts: [gen()], wires: [] }, ref: lowpass(true),
    bench: { parts: [{ id: 'G1', x: 250, y: 460, rot: 0 }, { id: 'C1', x: 520, y: 290, rot: 0 }, { id: 'R1', x: 760, y: 460, rot: 90 }] },
    wrong: [named('Tiefpass statt Hochpass', lowpass(false))],
    tests: [{ name: '50 Hz', expect: [{ a: 'R1.a', b: 'G1.n', ac: 'rms', range: [6.4, 7.0] }] }],
    measure: [{ id: 'ua', ask: 'Ausgangsspannung (R1.a gegen G1.–, V~)', unit: 'V', mode: 'VAC', meterType: 'trms', a: 'R1.a', b: 'G1.n', tol: 0.04 }]
  });

  var alt = function (withNot) {
    var l = { parts: [{ id: 'CLK1', type: 'clock', props: { freq: 1 }, x: 160, y: 200, rot: 0 }, GND(160, 460), R('R1', 150, 400, 160), R('R2', 150, 400, 320),
      { id: 'D1', type: 'led', props: { color: 'rot' }, x: 560, y: 160, rot: 0 }, { id: 'D2', type: 'led', props: { color: 'gelb' }, x: 560, y: 320, rot: 0 }],
      wires: [W('CLK1.out', 'R1.a'), W('R1.b', 'D1.a'), W('D1.k', 'GND1.g'), W('R2.b', 'D2.a'), W('D2.k', 'GND1.g')] };
    if (withNot) { l.parts.push({ id: 'U1', type: 'not', x: 280, y: 320, rot: 0 }); l.wires.push(W('CLK1.out', 'U1.in'), W('U1.out', 'R2.a')); }
    else l.wires.push(W('CLK1.out', 'R2.a'));
    return l;
  };
  var altStart = { parts: alt(true).parts.filter(function (p) { return p.id !== 'U1'; }), wires: [W('CLK1.out', 'R1.a'), W('R1.b', 'D1.a'), W('D1.k', 'GND1.g'), W('R2.b', 'D2.a'), W('D2.k', 'GND1.g')] };
  defTask({
    id: '11.10', ch: 11, title: 'Der Wechselblinker', tags: ['digital.takt', 'digital.nicht'],
    story: 'Am Bahnübergang blinken zwei Lampen abwechselnd. Rot ist angeschlossen – Gelb soll genau dann leuchten, wenn Rot aus ist.',
    brief: 'Steuere D2 (gelb) über R2 so an, dass sie im <b>Gegentakt</b> zu D1 blinkt.',
    learn: 'Ein Inverter erzeugt das Gegentaktsignal.', take: 'CLK und ¬CLK: immer genau eine LED an.',
    hint: 'Zwischen Taktgeber und R2 gehört ein NICHT-Gatter.', hint2: 'CLK1.out → U1.in, U1.out → R2.a.',
    palette: ['not', 'and', 'or'], need: { not: 1 }, start: altStart, ref: alt(true),
    bench: { parts: [{ id: 'CLK1', x: 240, y: 260, rot: 0 }, { id: 'GND1', x: 240, y: 680, rot: 0 }, { id: 'R1', x: 560, y: 200, rot: 0 }, { id: 'R2', x: 560, y: 440, rot: 0 }, { id: 'D1', x: 790, y: 200, rot: 0 }, { id: 'D2', x: 790, y: 440, rot: 0 }, { id: 'U1', x: 380, y: 440, rot: 0 }] },
    wrong: [named('beide im Gleichtakt', alt(false))],
    tests: [{ name: 'Gegentakt', steps: [
      { name: '0,2 s', run: 0.2, expect: [{ sel: 'D1', on: true }, { sel: 'D2', on: false }] },

  });

/* Kapitel 12 – Flipflops und Zaehler
 * Quelle: Digitaltechnik zeitabhaengige Vorgaenge (NOR-Flip-Flop mit Analyse-/Ansteuertabelle, NOR-AND-Flip-Flop,
 * Steuerungsarten, T-, D-, R-S-, J-K-Flip-Flop, asynchrone Zaehler, synchrone Zaehler, Johnson-Zaehler). */
(function () {
  'use strict';
  defChapter({
    id: 12, title: 'Flipflops und Zähler',
    intro: 'Schaltungen mit Gedächtnis: Ein Flipflop merkt sich ein Bit, mehrere Flipflops zählen. Den Takt gibst du selbst mit einem Pegelschalter – Schritt für Schritt, wie im Praktikum.',
    sequence: ['T12A', '12.1', '12.2', '12.3', '12.4', '12.5', 'T12B', '12.6', '12.7', '12.8', '12.9', '12.10']
  });
  var named = function (name, l) { l.name = name; return l; };
  var G = { id: 'GND1', type: 'ground', x: 120, y: 560, rot: 0 };
  var E = function (i, x, y, on) { var e = { id: 'E' + i, type: 'logicin', x: x || 160, y: y, rot: 0 }; if (on) e.props = { closed: true }; return e; };
  var L = function (i, x, y) { return { id: 'L' + i, type: 'logicled', x: x || 860, y: y, rot: 0 }; };
  var P = function (id, type, x, y) { return { id: id, type: type, x: x, y: y, rot: 0 }; };
  /* Takt per Pegelschalter: n Pulse (0 → 1 → 0), optional mit Erwartung nach dem letzten Puls */
  function pulses(key, n, expect) { var s = []; for (var k = 0; k < n; k++) s.push({ set: (function () { var o = {}; o[key] = { closed: true }; return o; })() }, { set: (function () { var o = {}; o[key] = { closed: false }; return o; })() }); if (expect) s[s.length - 1].expect = expect; return s; }
  var on = function (id, v) { return { sel: id, on: !!v }; };

  defTheory({
    id: 'T12A', ch: 12, title: 'Das Flipflop – ein Bit Gedächtnis', tags: ['digital.flipflop', 'digital.speicher'],
    merksatz: 'Zwei rückgekoppelte NOR bilden das RS-Flipflop – ein Bit Gedächtnis; zustandsgesteuert übernimmt es solange C = 1 ist, flankengesteuert nur bei der steigenden Flanke (D-, JK-, T-Flipflop).',
    visual: { type: 'circuit', toggleView: false, caption: 'RS-Flipflop aus zwei NOR: E2 = S (Setzen), E1 = R (Rücksetzen), L1 = Q, L2 = Q̄. Kurz S auf 1 und wieder 0 – Q bleibt 1; kurz R – Q bleibt 0. Das ist ein gespeichertes Bit.',
      layout: (function () { var l = LG.io(2, ['L1', 'L2']); l.parts.push({ id: 'U1', type: 'nor', x: 480, y: 170, rot: 0 }, { id: 'U2', type: 'nor', x: 480, y: 280, rot: 0 });
        l.wires.push(W('E1.out', 'U1.in1'), W('U2.out', 'U1.in2'), W('E2.out', 'U2.in2'), W('U1.out', 'U2.in1'), W('U1.out', 'L1.in'), W('U2.out', 'L2.in')); return l; })() },
    lesson:
      '<p>Zwei <b>NOR-Gatter</b>, deren Ausgänge jeweils auf einen Eingang des anderen zurückgeführt sind, bilden das <b>RS-Flipflop</b>. S = 1 <b>setzt</b> (Q = 1), R = 1 <b>setzt zurück</b> (Q = 0), S = R = 0 <b>speichert</b> den letzten Zustand. S = R = 1 ist der <b>verbotene Zustand</b> (Q und Q̄ beide 0).</p>' +
      '<p>Die <b>Analysetabelle</b> zeigt den neuen Zustand A abhängig vom alten Zustand A<sub>V</sub>; die <b>Ansteuertabelle</b> sagt, welche Eingänge nötig sind, um von A<sub>V</sub> nach A zu kommen (X = egal).</p>' +
      '<p><b>Steuerungsarten:</b> <i>Zustandsgesteuert</i> – der Takteingang C gibt die Eingänge frei, solange C = 1 ist (getaktetes RS mit UND-Gattern davor). <i>Flankengesteuert</i> – nur im Moment der steigenden Taktflanke (0 → 1) wird übernommen.</p>' +
      '<p><b>D-Flipflop:</b> übernimmt D bei der Taktflanke. <b>T-Flipflop:</b> kippt bei jeder Flanke, wenn T = 1 (Frequenzteiler durch 2). <b>JK-Flipflop:</b> J = 1 setzt, K = 1 setzt zurück, J = K = 1 kippt, J = K = 0 speichert.</p>',
    questions: [
      { q: 'RS-Flipflop: Was passiert bei S = 0 und R = 0?', options: ['Q = 0', 'Q = 1', 'Q behält seinen Zustand', 'verbotener Zustand'], correct: 2, explain: 'Keine Ansteuerung – das Flipflop speichert.' },
      { q: 'Welche Kombination ist beim NOR-RS-Flipflop verboten?', options: ['S = 0, R = 0', 'S = 1, R = 0', 'S = 0, R = 1', 'S = 1, R = 1'], correct: 3, explain: 'Beide Ausgänge werden 0 – Q und Q̄ sind nicht mehr invers.' },
      { q: 'Wann übernimmt ein flankengesteuertes D-Flipflop den Eingang D?', options: ['Solange C = 1', 'Bei der steigenden Flanke an C', 'Wenn D sich ändert', 'Immer'], correct: 1, explain: 'Nur im Moment 0 → 1 am Takteingang.' },
      { q: 'Was macht ein T-Flipflop mit T = 1 bei jeder Taktflanke?', options: ['Nichts', 'Es kippt', 'Es setzt', 'Es setzt zurück'], correct: 1, explain: 'Toggle – dadurch halbiert es die Taktfrequenz.' },
      { q: 'JK-Flipflop, J = 1, K = 1, Taktflanke. Was passiert?', options: ['Q = 1', 'Q = 0', 'Q kippt', 'verboten'], correct: 2, explain: 'Beim JK-Flipflop ist 1/1 nicht verboten, sondern kippt.' }
    ]
  });

  /* 12.1 RS aus NOR: E1 = S, E2 = R, L1 = Q, L2 = /Q */
  var rsStart = { parts: [E(1, 160, 200), E(2, 160, 400), G, L(1, 700, 220), L(2, 700, 380)], wires: [] };
  var rs = { parts: rsStart.parts.concat([P('U1', 'nor', 420, 220), P('U2', 'nor', 420, 380)]),
    wires: [W('E2.out', 'U1.in1'), W('U2.out', 'U1.in2'), W('E1.out', 'U2.in2'), W('U1.out', 'U2.in1'), W('U1.out', 'L1.in'), W('U2.out', 'L2.in')] };
  var rsBench = { parts: [{ id: 'E1', x: 190, y: 250, rot: 0 }, { id: 'E2', x: 190, y: 520, rot: 0 }, { id: 'GND1', x: 190, y: 690, rot: 0 }, { id: 'U1', x: 500, y: 260, rot: 0 }, { id: 'U2', x: 500, y: 500, rot: 0 }, { id: 'L1', x: 840, y: 260, rot: 0 }, { id: 'L2', x: 840, y: 500, rot: 0 }] };
  defTask({
    id: '12.1', ch: 12, title: 'Das NOR-Flipflop', tags: ['digital.flipflop', 'digital.nor', 'digital.speicher'],
    story: 'Ein Störmelder soll sich merken, dass eine Störung da war – auch wenn sie wieder verschwindet. Erst die Quittierung löscht die Meldung.',
    brief: 'Baue aus <b>zwei NOR-Gattern</b> ein RS-Flipflop: E1 = S (Setzen), E2 = R (Rücksetzen), L1 = Q, L2 = Q̄. Die Rückkopplung: U1 = NOR(R, Q̄), U2 = NOR(S, Q).',
    learn: 'Rückkopplung erzeugt Gedächtnis.', take: 'S kurz auf 1: Q = 1 – und es bleibt 1, bis R kommt. Mit der Zeitlupe siehst du, wie die Gatter nacheinander umschalten.',
    hint: 'Jeder NOR-Ausgang geht auf einen Eingang des anderen NOR.', hint2: 'E2 → U1.in1, U2.out → U1.in2, U1.out → U2.in1, E1 → U2.in2; U1 → L1, U2 → L2.',
    palette: ['nor', 'nand', 'and', 'or', 'not'], need: { nor: 2 }, start: rsStart, ref: rs, bench: rsBench,
    tests: [{ name: 'Speichern', steps: [
      { name: 'Setzen', set: { E1: { closed: true } }, expect: [on('L1', 1), on('L2', 0)] },
      { name: 'Speichern (S wieder 0)', set: { E1: { closed: false } }, expect: [on('L1', 1), on('L2', 0)] },
      { name: 'Rücksetzen', set: { E2: { closed: true } }, expect: [on('L1', 0), on('L2', 1)] },
      { name: 'Speichern (R wieder 0)', set: { E2: { closed: false } }, expect: [on('L1', 0), on('L2', 1), { noFault: true }] }] }]
  });

  var dStart = { parts: [E(1, 160, 200), E(2, 160, 360), G, L(1, 700, 220)], wires: [] };
  var dRef = { parts: dStart.parts.concat([P('FF1', 'dff', 420, 240)]), wires: [W('E1.out', 'FF1.D'), W('E2.out', 'FF1.C'), W('FF1.Q', 'L1.in')] };
  var bFF = function (ids) { var p = [{ id: 'E1', x: 190, y: 250, rot: 0 }, { id: 'E2', x: 190, y: 420, rot: 0 }, { id: 'E3', x: 190, y: 590, rot: 0 }, { id: 'GND1', x: 190, y: 700, rot: 0 }, { id: 'L1', x: 850, y: 260, rot: 0 }, { id: 'L2', x: 850, y: 420, rot: 0 }, { id: 'L3', x: 850, y: 580, rot: 0 }];
    (ids || ['FF1']).forEach(function (id, i) { p.push({ id: id, x: 480, y: 260 + 170 * i, rot: 0 }); });
    return function (layout) { var have = {}; layout.parts.forEach(function (q) { have[q.id] = 1; }); return { parts: p.filter(function (q) { return have[q.id]; }) }; }; };
  defTask({
    id: '12.2', ch: 12, title: 'Das D-Flipflop', tags: ['digital.flipflop', 'digital.flanke'],

  defTask({

  /* 12.5 getaktetes RS (zustandsgesteuert): U3 = S·C, U4 = R·C vor dem NOR-Latch */

  defTheory({
    id: 'T12B', ch: 12, title: 'Zähler', tags: ['digital.zaehler', 'digital.flipflop'],
    merksatz: 'T-Flipflops hintereinander teilen die Frequenz je durch 2 und zählen dual; asynchron getaktet schalten die Stufen nacheinander (kurze Zwischenwerte), synchron alle gleichzeitig über eine Logik an J/K.',
    visual: { type: 'circuit', toggleView: false, slow: true, caption: 'Asynchroner 3-Bit-Zähler aus T-Flipflops am Takt (1 Hz): L1 = Wert 1, L2 = Wert 2, L3 = Wert 4. Jede Stufe halbiert die Frequenz – so zählt die Kette von 0 bis 7 und beginnt von vorn.',
      layout: { parts: [{ id: 'CLK1', type: 'clock', props: { freq: 1 }, x: 160, y: 300, rot: 0 }, { id: 'E2', type: 'logicin', props: { closed: true }, x: 160, y: 120, rot: 0 }, { id: 'GND1', type: 'ground', x: 120, y: 480, rot: 0 },
        { id: 'FF1', type: 'tff', x: 320, y: 280, rot: 0 }, { id: 'FF2', type: 'tff', x: 520, y: 280, rot: 0 }, { id: 'FF3', type: 'tff', x: 720, y: 280, rot: 0 },
        { id: 'L1', type: 'logicled', x: 420, y: 440, rot: 0 }, { id: 'L2', type: 'logicled', x: 620, y: 440, rot: 0 }, { id: 'L3', type: 'logicled', x: 820, y: 440, rot: 0 }],
        wires: [W('CLK1.out', 'FF1.C'), W('FF1.Qn', 'FF2.C'), W('FF2.Qn', 'FF3.C'), W('E2.out', 'FF1.T'), W('E2.out', 'FF2.T'), W('E2.out', 'FF3.T'), W('FF1.Q', 'L1.in'), W('FF2.Q', 'L2.in'), W('FF3.Q', 'L3.in')] } },
    lesson:
      '<p>Mehrere T-Flipflops (T = 1) hintereinander bilden einen <b>Dualzähler</b>: Jede Stufe teilt die Frequenz durch 2 und stellt ein Bit dar (FF1 = Bit 0 = Wert 1, FF2 = Bit 1 = Wert 2 …).</p>' +
      '<p><b>Asynchroner Zähler</b> (Ripple Counter): Nur FF1 bekommt den Takt, jede weitere Stufe wird vom <b>Q̄-Ausgang</b> der vorherigen getaktet (steigende Flanke an Q̄ = fallende an Q → Aufwärtszähler). Einfach, aber die Stufen schalten nacheinander – kurze falsche Zwischenwerte.</p>' +
      '<p><b>Synchroner Zähler:</b> Alle Flipflops hängen am <b>selben Takt</b>. Die Logik an J/K bestimmt, wer kippt: FF1 immer (J = K = 1), FF2 wenn Q1 = 1, FF3 wenn Q1·Q2 = 1 … Alle Stufen schalten gleichzeitig.</p>' +
      '<p>Ein n-Bit-Zähler zählt von 0 bis 2ⁿ − 1 und beginnt dann von vorn. Ein <b>BCD-Zähler</b> springt nach 9 auf 0 zurück.</p>' +
      '<p><b>Johnson-Zähler:</b> Schieberegister, dessen invertierter letzter Ausgang auf den Eingang zurückgeführt ist. 2 Stufen: 00 → 10 → 11 → 01 → 00 – pro Takt ändert sich genau ein Bit.</p>',
    questions: [
      { q: 'Bis zu welcher Zahl zählt ein 3-Bit-Dualzähler?', options: ['3', '6', '7', '8'], correct: 2, explain: '2³ − 1 = 7, dann wieder 0.' },
      { q: 'Woher bekommt beim asynchronen Aufwärtszähler das zweite Flipflop seinen Takt?', options: ['Vom gemeinsamen Takt', 'Vom Q̄-Ausgang der ersten Stufe', 'Von J', 'Gar nicht'], correct: 1, explain: 'Die Stufen takten sich nacheinander – daher „asynchron“.' },
      { q: 'Was ist der Vorteil des synchronen Zählers?', options: ['Weniger Flipflops', 'Alle Stufen schalten gleichzeitig', 'Er braucht keinen Takt', 'Er zählt rückwärts'], correct: 1, explain: 'Kein Durchlaufen der Stufen – keine falschen Zwischenwerte.' },
      { q: 'Wann kippt beim synchronen 2-Bit-Zähler das zweite JK-Flipflop?', options: ['Bei jedem Takt', 'Wenn Q1 = 1', 'Wenn Q1 = 0', 'Nie'], correct: 1, explain: 'J2 = K2 = Q1.' },
      { q: 'Wie viele Zustände durchläuft ein 2-stufiger Johnson-Zähler?', options: ['2', '3', '4', '8'], correct: 2, explain: '00, 10, 11, 01 – vier Zustände (2·n).' }
    ]
  });

    learn: 'n Stufen → 2ⁿ Zustände.', take: '3 Bit: 0 … 7. Nach 8 Takten steht der Zähler wieder auf 0.',
    hint: 'Die dritte Stufe wird von FF2.Qn getaktet.', hint2: 'E1 → FF1.C, FF1.Qn → FF2.C, FF2.Qn → FF3.C; alle T an E2.',
    palette: ['tff', 'jkff', 'dff'], need: { tff: 3 }, start: c3s, ref: c3, bench: cntBench(3),
    tests: [5, 8].map(function (k) { return { name: k + ' Takte', steps: pulses('E1', k, cntExpect(3, k % 8)) }; })
  });

  var disp = function (wired) {
    var l = counter(3, false); asyncWires(3, l);
    l.parts.push({ id: 'IC1', type: 'dec7', x: 700, y: 330, rot: 0 }, { id: 'AZ1', type: 'seg7', x: 880, y: 330, rot: 0 });
    l.wires.push(W('IC1.D', 'GND1.g'));

    if (wired) l.wires.push(W('FF1.Q', 'IC1.A'), W('FF2.Q', 'IC1.B'), W('FF3.Q', 'IC1.C'));
    return l;
  };
  var dispBench = { parts: [{ id: 'E1', x: 190, y: 250, rot: 0 }, { id: 'E2', x: 190, y: 450, rot: 0 }, { id: 'GND1', x: 190, y: 690, rot: 0 },

  defTask({

  defTask({

    brief: 'Baue einen <b>synchronen 2-Bit-Zähler</b> mit zwei JK-Flipflops: Beide C am selben Takt E1. FF1: J = K = 1 (E2). FF2: J = K = Q1. L1 = Q1, L2 = Q2.',

    hint: 'E1 an beide C, E2 an J und K von FF1, FF1.Q an J und K von FF2.', hint2: 'Dieselbe Zählfolge wie asynchron: 00, 01, 10, 11, 00.',
    palette: ['jkff', 'tff', 'dff', 'and'], need: { jkff: 2 }, start: counter(2, true, true), ref: syncRef, bench: cntBench(2),

  });

  var johnStart = { parts: [E(1, 160, 200), G, L(1, 860, 220), L(2, 860, 380)], wires: [] };

  var jSeq = [[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]];
  defTask({

(function () {
  'use strict';
  defChapter({
    id: 13, title: 'Diode, Z-Diode und Transistor',
    intro: 'Halbleiter in der Praxis: Dioden lassen Strom nur in eine Richtung, Z-Dioden halten Spannungen fest, Transistoren schalten grosse Lasten mit kleinen Steuerströmen – die Brücke von der Logik zur Leistung.',

  var bB1 = { id: 'B1', x: 240, y: 460, rot: 0 };

  defTheory({
    id: 'T13A', ch: 13, title: 'Diode und Z-Diode', tags: ['bauteil.diode', 'bauteil.zdiode'],
    merksatz: 'Die Diode leitet ab etwa 0,7 V in Durchlassrichtung und sperrt umgekehrt; die Z-Diode wird in Sperrrichtung betrieben, hält ab U_Z die Spannung fest und braucht dafür immer einen Vorwiderstand.',
    visual: { type: 'circuit', caption: 'Z-Diode in Sperrrichtung mit Vorwiderstand: Unter 5,1 V sperrt sie – die ganze Spannung liegt an ihr. Darüber bricht sie durch und hält ihre Spannung fest, der Rest fällt an R1 ab.',
      layout: { parts: [{ id: 'B1', type: 'battery', value: 8, x: 160, y: 300 }, { id: 'R1', type: 'resistor', value: 470, x: 320, y: 200 }, { id: 'Z1', type: 'zener', x: 480, y: 300, rot: 270 }], wires: [W('B1.p', 'R1.a'), W('R1.b', 'Z1.k'), W('Z1.a', 'B1.n')] },
      bench: { parts: [{ id: 'B1', x: 240, y: 460 }, { id: 'R1', x: 500, y: 290 }, { id: 'Z1', x: 740, y: 460, rot: 270 }] },
      sliders: [{ part: 'B1', prop: 'value', label: 'Speisespannung', min: 1, max: 12, step: 0.5, unit: 'V' }],
      readouts: [{ label: 'U an Z1', sel: 'Z1', q: 'v' }, { label: 'I', sel: 'R1', q: 'i' }, { label: 'U an R1', sel: 'R1', q: 'v' }] },
    lesson:
      '<p>Eine <b>Diode</b> leitet in <b>Durchlassrichtung</b> (Anode + , Kathode −, am Ring erkennbar) ab ihrer Schleusenspannung: Silizium ca. <b>0,7 V</b>, Germanium ca. 0,3 V. Darüber steigt der Strom steil an, die Spannung an der Diode bleibt fast gleich. In <b>Sperrrichtung</b> fliesst praktisch kein Strom – die ganze Spannung liegt an der Diode.</p>' +
      '<p>Die <b>Z-Diode</b> wird in Sperrrichtung betrieben. Ab der <b>Z-Spannung U<sub>Z</sub></b> bricht sie gezielt durch und hält die Spannung fast konstant – egal, wie viel Strom fliesst. Sie braucht immer einen <b>Vorwiderstand R<sub>V</sub></b>, der den Strom begrenzt.</p>' +
      '<p><b>Stabilisierung:</b> R<sub>V</sub> muss so klein sein, dass bei kleinster Eingangsspannung und grösster Last noch ein Z-Strom fliesst: R<sub>V</sub> ≤ (U<sub>e,min</sub> − U<sub>Z</sub>) / (I<sub>L,max</sub> + I<sub>Z,min</sub>). Und so gross, dass bei höchster Spannung die Z-Diode nicht überlastet wird.</p>' +
      '<p>Nachteile der einfachen Z-Stabilisierung: höhere Speisespannung nötig, nur Standardwerte für U<sub>Z</sub>, geringe Belastbarkeit, nicht ganz ideal (U<sub>Z</sub> steigt leicht mit dem Strom).</p>',
    questions: [

      { q: 'Woran erkennt man die Kathode einer Diode?', options: ['Am längeren Bein', 'Am Ring auf dem Gehäuse', 'An der Farbe', 'Gar nicht'], correct: 1, explain: 'Der Ring markiert die Kathode.' },
      { q: 'In welcher Richtung wird eine Z-Diode zur Stabilisierung betrieben?', options: ['Durchlassrichtung', 'Sperrrichtung', 'Egal', 'Wechselnd'], correct: 1, explain: 'Im Durchbruch in Sperrrichtung hält sie U_Z.' },
      { q: 'Warum braucht eine Z-Diode einen Vorwiderstand?', options: ['Damit sie leuchtet', 'Damit der Strom begrenzt wird', 'Damit sie sperrt', 'Braucht sie nicht'], correct: 1, explain: 'Ohne R_V würde der Strom im Durchbruch unbegrenzt steigen.' },
      { q: '12 V, R_V = 470 Ω, U_Z = 5,1 V, keine Last. Wie gross ist I_Z (ungefähr)?', options: ['5 mA', '15 mA', '25 mA', '50 mA'], correct: 1, explain: 'I = (12 V − 5,1 V) / 470 Ω ≈ 14,7 mA.' }
    ]
  });

  defTheory({
    id: 'T13B', ch: 13, title: 'Der Transistor', tags: ['bauteil.transistor', 'elektro.schalten'],
    merksatz: 'Ein kleiner Basisstrom steuert einen grossen Kollektorstrom (I_C = β · I_B); als Schalter wird der Transistor übersteuert, bis er in Sättigung geht (U_CE ≈ 0,2 V) – Emitter und Logik-Masse verbinden.',
    visual: { type: 'circuit', caption: 'Der Basiswiderstand bestimmt den Basisstrom: Gross → wenig Basisstrom, der Transistor sperrt oder arbeitet aktiv (I_C = β · I_B, LED schwach). Klein → Sättigung, die LED leuchtet voll – der Transistor als Schalter.',
      layout: { parts: [{ id: 'B1', type: 'battery', value: 9, x: 700, y: 320 }, { id: 'R1', type: 'resistor', value: 220000, x: 320, y: 380 }, { id: 'Q1', type: 'npn', x: 480, y: 380 }, { id: 'R2', type: 'resistor', value: 390, x: 580, y: 160, rot: 90 }, { id: 'D1', type: 'led', props: { color: 'gruen' }, x: 580, y: 260, rot: 90 }],
        wires: [W('B1.p', 'R1.a'), W('R1.b', 'Q1.b'), W('B1.p', 'R2.a'), W('R2.b', 'D1.a'), W('D1.k', 'Q1.c'), W('Q1.e', 'B1.n')] },
      bench: { parts: [{ id: 'B1', x: 830, y: 540 }, { id: 'R1', x: 360, y: 420 }, { id: 'Q1', x: 580, y: 460 }, { id: 'R2', x: 620, y: 170, rot: 90 }, { id: 'D1', x: 760, y: 300, rot: 90 }] },
      sliders: [{ part: 'R1', prop: 'value', label: 'Basiswiderstand R1', min: 4700, max: 2200000, log: true, unit: 'Ω', round: 2 }],
      readouts: [{ label: 'I_B', sel: 'R1', q: 'i' }, { label: 'I_C', sel: 'D1', q: 'i' }, { label: 'Arbeitsbereich', sel: 'Q1', q: 'state' }] },
    lesson:
      '<p>Der <b>NPN-Transistor</b> hat drei Anschlüsse: <b>Basis</b>, <b>Kollektor</b>, <b>Emitter</b>. Ein kleiner <b>Basisstrom I<sub>B</sub></b> steuert einen grossen <b>Kollektorstrom I<sub>C</sub></b>. Die Basis-Emitter-Strecke verhält sich wie eine Diode (U<sub>BE</sub> ≈ 0,7 V).</p>' +
      '<p>Drei Arbeitsbereiche: <b>gesperrt</b> (I<sub>B</sub> = 0 → I<sub>C</sub> = 0), <b>aktiv</b> (I<sub>C</sub> = β · I<sub>B</sub>, Verstärker), <b>Sättigung</b> (der Transistor ist voll durchgeschaltet, U<sub>CE</sub> ≈ 0,2 V, I<sub>C</sub> bestimmt nur noch die Last).</p>' +
      '<p><b>Transistor als Schalter:</b> Basis über einen <b>Basiswiderstand R<sub>B</sub></b> ansteuern und <b>übersteuern</b> – I<sub>B</sub> deutlich grösser als I<sub>C</sub> / β, damit er sicher in Sättigung geht:</p>' +
      '<div class="formula">R<sub>B</sub> ≤ (U<sub>st</sub> − 0,7 V) / (ü · I<sub>C</sub> / β)</div>' +
      '<p>Emitter und Logik-Masse müssen verbunden sein – sonst hat die Steuerspannung keinen Bezug. So schaltet ein Logikausgang (wenige mA) eine Lampe, einen Motor oder ein Relais.</p>',
    questions: [
      { q: 'Wie heissen die Anschlüsse eines Bipolartransistors?', options: ['Anode, Kathode, Gate', 'Basis, Kollektor, Emitter', 'Source, Drain, Gate', 'Plus, Minus, Mitte'], correct: 1, explain: 'B, C, E.' },
      { q: 'β = 100, I_B = 0,1 mA, aktiver Bereich. I_C = ?', options: ['0,1 mA', '1 mA', '10 mA', '100 mA'], correct: 2, explain: 'I_C = β · I_B = 100 · 0,1 mA = 10 mA.' },
      { q: 'Wie gross ist U_CE in der Sättigung?', options: ['ca. 0,2 V', 'ca. 0,7 V', 'halbe Speisung', 'volle Speisung'], correct: 0, explain: 'Voll durchgeschaltet bleibt nur die Sättigungsspannung.' },
      { q: 'Warum steuert man einen Schalttransistor mit mehr Basisstrom als nötig an?', options: ['Damit er schneller altert', 'Damit er sicher in Sättigung geht', 'Damit er sperrt', 'Damit β steigt'], correct: 1, explain: 'Übersteuern sichert den voll durchgeschalteten Zustand trotz Exemplarstreuung.' },
      { q: 'Die Lampe am Kollektor braucht 150 mA, β = 100. Mindestbasisstrom?', options: ['0,15 mA', '1,5 mA', '15 mA', '150 mA'], correct: 1, explain: 'I_B = I_C / β = 1,5 mA – zur Sicherheit etwa doppelt so viel.' }
    ]
  });

  function sw(o) {
    var parts = [{ id: 'E1', type: 'logicin', x: 160, y: 380, rot: 0 }, { id: 'GND1', type: 'ground', x: 480, y: 540, rot: 0 }, B(9, 700, 300)].concat(o.load), wires = o.loadWires.concat([W('B1.n', 'GND1.g')]);
    if (o.q) { parts.push({ id: 'Q1', type: 'npn', x: 480, y: 380, rot: 0 }); wires.push(W('Q1.e', 'GND1.g')); wires = wires.concat(o.qWires); }
    if (o.rb) { parts.push(R('R1', o.rb, 320, 380)); wires.push(W(o.not ? 'U1.out' : 'E1.out', 'R1.a'), W('R1.b', 'Q1.b')); }
    if (o.not) { parts.push({ id: 'U1', type: 'not', x: 240, y: 460, rot: 0 }); wires.push(W('E1.out', 'U1.in')); }
    return { parts: parts, wires: wires };
  }

  var mk = function (base, extra) { var o = {}; Object.keys(base).forEach(function (k) { o[k] = base[k]; }); Object.keys(extra).forEach(function (k) { o[k] = extra[k]; }); return sw(o); };

(function () {

  defTheory({
    id: 'T14A', ch: 14, title: 'Frequenzgang und Dezibel', tags: ['elektro.filter', 'elektro.frequenzgang', 'elektro.db'],
    merksatz: 'Der Frequenzgang zeigt U_a/U_e über der logarithmischen Frequenz in Dezibel (20 · log); ein RC-Tiefpass 1. Ordnung hat bei f_g −3 dB und fällt darüber mit 20 dB pro Dekade.',
    visual: { type: 'bode', stages: [{ kind: 'lp', r: 1000, c: 1e-6 }], caption: 'Frequenzgang des RC-Tiefpasses (1 kΩ, 1 µF): bis zur Grenzfrequenz fast 0 dB, bei f_g −3 dB, darüber −20 dB pro Dekade. Fahr mit dem Regler die Kurve ab.' },
    lesson:
      '<p>Der <b>Frequenzgang</b> zeigt, wie stark eine Schaltung ein Signal abhängig von der Frequenz durchlässt. Man misst Eingang U<sub>e</sub> und Ausgang U<sub>a</sub> bei vielen Frequenzen (z. B. 1 Hz … 10 kHz) und trägt das Verhältnis auf – die Frequenzachse logarithmisch.</p>' +
      '<p>Die <b>Verstärkung</b> gibt man in <b>Dezibel</b> an:</p><div class="formula">A = 20 · log<sub>10</sub>(U<sub>a</sub> / U<sub>e</sub>) dB</div>' +
      '<p>0 dB = unverändert, −3 dB ≈ 70,7 %, −6 dB ≈ 50 %, −20 dB = 10 %, −40 dB = 1 %.</p>' +
      '<p><b>RC-Tiefpass 1. Ordnung</b> (R in Reihe, C gegen Masse): Unterhalb der Grenzfrequenz f<sub>g</sub> = 1/(2πRC) lässt er fast alles durch, bei f<sub>g</sub> −3 dB, darüber fällt er mit <b>20 dB pro Dekade</b> (zehnfache Frequenz → ein Zehntel der Spannung). Der <b>CR-Hochpass</b> verhält sich spiegelbildlich.</p>' +

    questions: [
      { q: 'U_a / U_e = 0,1. Wie viel dB sind das?', options: ['−1 dB', '−10 dB', '−20 dB', '−40 dB'], correct: 2, explain: '20 · log(0,1) = −20 dB.' },
      { q: 'Was bedeutet −3 dB?', options: ['Halbe Spannung', 'Etwa 70,7 % der Spannung', 'Ein Zehntel', 'Doppelte Spannung'], correct: 1, explain: '20 · log(0,707) ≈ −3 dB – die Grenzfrequenz.' },
      { q: 'Grenzfrequenz bei R = 1 kΩ, C = 1 µF?', options: ['15,9 Hz', '159 Hz', '1,59 kHz', '15,9 kHz'], correct: 1, explain: 'f_g = 1/(2π · 1000 Ω · 1 µF) ≈ 159 Hz.' },

      { q: 'Welche Achse ist beim Frequenzgang logarithmisch?', options: ['Keine', 'Die Frequenzachse', 'Nur die Spannungsachse', 'Die Zeitachse'], correct: 1, explain: 'Frequenzen von 1 Hz bis 10 kHz passen nur logarithmisch sinnvoll auf ein Blatt (die Verstärkung in dB ist ebenfalls logarithmisch).' }
    ]
  });

  defTask({

    id: '14.2', ch: 14, title: 'Die Grenzfrequenz finden', tags: ['elektro.filter', 'elektro.grenzfrequenz'],

    learn: 'Grenzfrequenz = Frequenz bei −3 dB.', take: 'Mit 2,2 kΩ und 470 nF: f_g ≈ 154 Hz.',

    brief: 'Miss die Ausgangsspannung (R1.a gegen G1.–, V~) bei <b>15,9 Hz</b>, <b>159 Hz</b> und <b>1590 Hz</b>.',

  defTheory({
    id: 'T14B', ch: 14, title: 'Bandpass, Bandsperre, Signalformung', tags: ['elektro.filter', 'elektro.rc'],
    merksatz: 'Hoch- und Tiefpass hintereinander ergeben einen Bandpass; je nach τ gegenüber der Periodendauer formt ein RC-Glied Rechteck zu Nadelimpulsen (Differenzierglied) oder Dreieck bis Gleichspannung (Integrierglied).',

        layout: { parts: [{ id: 'G1', type: 'acsource', value: 10, props: { freq: 500, shape: 'sine', offset: 0 }, x: 160, y: 300 }, { id: 'C1', type: 'capacitor', value: 1e-6, x: 320, y: 200, rot: 0 }, { id: 'R1', type: 'resistor', value: 1000, x: 480, y: 300, rot: 90 }, { id: 'R2', type: 'resistor', value: 10000, x: 600, y: 200 }, { id: 'C2', type: 'capacitor', value: 10e-9, x: 720, y: 300, rot: 90 }],

      '<p>Ein <b>Bandpass</b> entsteht aus Hochpass und Tiefpass hintereinander: Er lässt nur einen Frequenzbereich um die <b>Mittenfrequenz</b> durch. Eine <b>Bandsperre</b> unterdrückt einen Bereich. Ein RC-Bandpass aus je einer Stufe ist ein Filter 1. Ordnung auf beiden Seiten.</p>' +

    ]

  defTheory({
    id: 'T15B', ch: 15, title: 'Steuerung und Sicherheit', tags: ['steuerung.selbsthaltung', 'sicherheit.nothalt', 'messen.drehzahl'],
    merksatz: 'Selbsthaltung Q = (Start ∨ Q) ∧ Stopp mit Öffnern für Stopp und Not-Halt ist drahtbruchsicher und stoppdominant; der Not-Halt löscht die Selbsthaltung, ein Wiederanlauf braucht einen neuen Start.',

    lesson:
      '<p><b>Start/Stopp mit Selbsthaltung:</b> Der Start-Taster wird nur kurz gedrückt. Damit der Motor weiterläuft, führt man den Ausgang zurück auf den Eingang – er <b>hält sich selbst</b>:</p>' +
      '<div class="formula">Q = (Start ∨ Q) ∧ Stopp</div>' +
      '<p>Der <b>Stopp-Taster ist ein Öffner</b> (im Ruhezustand 1). Das ist <b>drahtbruchsicher</b>: Reisst die Leitung, ist das Signal 0 – die Anlage stoppt, statt unkontrollierbar weiterzulaufen. Werden Start und Stopp gleichzeitig gedrückt, gewinnt Stopp (<b>stoppdominant</b>).</p>' +
      '<p>Der <b>Not-Halt</b> ist ebenfalls ein Öffner und <b>übersteuert alles</b>. Wichtig: Nach dem Entriegeln darf die Anlage <b>nicht von selbst wieder anlaufen</b> – der Not-Halt muss deshalb die Selbsthaltung löschen, nicht nur den Ausgang sperren. Erst ein neuer Start setzt die Anlage wieder in Gang.</p>' +
      '<p><b>Drehzahlmessung:</b> Ein Impulsgeber (Lochscheibe + Lichtschranke) liefert pro Umdrehung eine feste Zahl Impulse. Ein Zähler zählt nur während der <b>Torzeit</b> (UND-Verknüpfung von Impulsen und Tor). Drehzahl = Impulse / (Torzeit · Impulse pro Umdrehung), mal 60 für 1/min.</p>' +
      '<p><b>Fehlersuche an der Anlage:</b> Den Signalweg vom Taster bis zum Motor Block für Block verfolgen und an jedem Übergang messen. Liegt an einem Bauteil die volle Spannung, aber es fliesst kein Strom, ist es unterbrochen.</p>',
    questions: [
      { q: 'Warum ist der Stopp-Taster ein Öffner?', options: ['Weil er billiger ist', 'Drahtbruchsicher: Leitungsbruch wirkt wie Stopp', 'Damit der Motor schneller startet', 'Das ist egal'], correct: 1, explain: 'Ein Bruch der Leitung ergibt 0 = Stopp.' },
      { q: 'Was bewirkt die Selbsthaltung?', options: ['Der Motor läuft nur, solange Start gedrückt ist', 'Der Motor läuft nach dem Loslassen von Start weiter', 'Der Motor läuft rückwärts', 'Sie ersetzt den Not-Halt'], correct: 1, explain: 'Der Ausgang hält sich über die Rückführung selbst.' },
      { q: 'Der Not-Halt wird entriegelt. Was darf NICHT passieren?', options: ['Die Anlage bleibt stehen', 'Die Anlage läuft von selbst wieder an', 'Man muss Start drücken', 'Die Betriebs-LED bleibt aus'], correct: 1, explain: 'Kein selbsttätiger Wiederanlauf – erst ein neuer Start.' },
      { q: 'Ein Impulsgeber liefert 1 Impuls pro Umdrehung. In 0,5 s Torzeit werden 5 Impulse gezählt. Drehzahl?', options: ['5 1/min', '10 1/min', '300 1/min', '600 1/min'], correct: 3, explain: '5 / 0,5 s = 10 1/s = 600 1/min.' },
      { q: 'Start und Stopp werden gleichzeitig gedrückt. Was macht Q = (Start ∨ Q) ∧ Stopp?', options: ['Motor läuft', 'Motor steht (stoppdominant)', 'Motor wechselt die Richtung', 'Unbestimmt'], correct: 1, explain: 'Gedrückter Öffner = 0, das UND sperrt.' }
    ]

    lesson:
      '<p>Vor dem Digitalmultimeter gab es das <b>Zeigerinstrument</b> – in Schaltschränken und an Netzgeräten hängt es noch heute. Zwei Messwerke musst du kennen, weil sie bei Wechselgrössen <i>Verschiedenes</i> anzeigen.</p>' +
      '{{visual}}' +
      '<p><b>Drehspulmesswerk.</b> Ein Dauermagnet steht fest, eine Spule dreht sich darin gegen eine Spiralfeder. Das Antriebsmoment ist <b>proportional zum Strom</b> (M = k₁ · I), das Federmoment proportional zum Winkel (M = D · φ). Wo beide gleich sind, steht der Zeiger: φ = (k₁/D) · I – <b>lineare Skala</b>. Bei Wechselstrom wechselt das Moment mit der Stromrichtung, der Zeiger zeigt den <b>Mittelwert</b> (reiner Wechselstrom: 0). Erst ein eingebauter <b>Gleichrichter</b> macht ein Wechselstrominstrument daraus: Es zeigt den Gleichrichtwert, die Skala ist mit dem Formfaktor 1,11 auf den Sinus umgerechnet – das AVG-Prinzip aus Theorie 3B.</p>' +
      '{{visual:2}}' +
      '<p><b>Dreheisenmesswerk.</b> Die Spule steht fest, zwei <b>Weicheisenplättchen</b> werden vom Strom gleichsinnig magnetisiert und stossen sich ab. Beide Magnetisierungen wachsen mit I, die Kraft also mit <b>I²</b> (M = k₂ · I²): φ = (k₂/D) · I² – <b>unten gestauchte Skala</b>. Weil I² nie negativ wird, ist die Stromrichtung egal, und der Mittelwert von I² ist das Quadrat des Effektivwerts: Das Dreheisenwerk zeigt bei Gleich- und Wechselstrom den <b>Effektivwert</b>, bei jeder Kurvenform – wie ein TRMS-Gerät. Robust, aber weniger empfindlich.</p>' +
      '{{visual:3}}' +
      '<p><b>Dämpfung.</b> Feder und träge Masse bilden einen Schwinger – ohne Bremse würde der Zeiger überschwingen und pendeln. Drehspulwerke bremsen mit Wirbelströmen im Aluminiumrahmen der Spule, Dreheisenwerke mit einer Luft- oder Ölkammer. Probier in der Animation „ohne Dämpfung“ und „Sprung“.</p>' +
      '<p><b>Merke die Zuordnung</b> – sie erklärt die Tabelle „Messfehler nach Instrumentenwahl“: <b>Drehspul + Gleichrichter = AVG-Verhalten</b> (Sinus richtig, Rechteck ≈ 11 % zu viel, Dreieck ≈ 4 % zu wenig, Mischspannung falsch), <b>Dreheisen = Effektivwert</b> (immer richtig, auch mit Gleichanteil).</p>' +
      '{{visual:4}}' +
      '<p><b>Strommesszange.</b> Sie misst Strom, <i>ohne den Kreis aufzutrennen</i>: Das Magnetfeld des umschlossenen Leiters induziert in der Zangenspule einen proportionalen Strom (Gleichstrom: Hall-Sensor). Nur <b>einen</b> Leiter umschliessen – bei Hin- und Rückleiter zusammen heben sich die Felder auf, die Zange zeigt 0.</p>' +
      '{{visual:5}}' +
      '<details class="zusatz"><summary>Zusatz: Frequenzgrenzen</summary>' +
      '<p>Das Drehspul-Gleichrichterinstrument begrenzt der <b>Gleichrichter</b>: Die Dioden werden mit steigender Frequenz träge, und die Skalenkorrektur mit dem Formfaktor stimmt nur für den Sinus – brauchbar bis einige hundert Hertz, höchstens wenige Kilohertz. Das Dreheisenwerk verliert bei höherer Frequenz durch <b>Wirbelströme im Eisen</b> und die Induktivität der Spule an Anzeige – ein Instrument für 16⅔ bis einige hundert Hertz (Netzfrequenz). Genau das untersuchst du in <b>Aufgabe 16.5 „Frequenz erhöhen“</b>: Multimeter (AVG/TRMS) laufen mit der Frequenz aus dem spezifizierten Bereich, das Oszilloskop zeigt weiter richtig.</p></details>' +
      '<details class="zusatz"><summary>Zusatz: Vergleichstabelle (Eigenverbrauch, Frequenzbereich, Einsatz)</summary>' +
      '<table class="tt"><tr><th></th><th>Drehspulmesswerk</th><th>Dreheisenmesswerk</th></tr>' +
      '<tr><td>Skala</td><td>linear (φ ~ I)</td><td>quadratisch, unten gestaucht (φ ~ I²)</td></tr>' +
      '<tr><td>Anzeige bei AC</td><td>Mittelwert; mit Gleichrichter Gleichrichtwert × 1,11 (nur Sinus richtig)</td><td>Effektivwert, jede Kurvenform</td></tr>' +

      '<p><b>Messkategorien (CAT).</b> Sie sagen, <i>wo im Niederspannungsnetz</i> (AC bis 1000 V, DC bis 1500 V) ein Messgerät eingesetzt werden darf. Je näher an der Einspeisung, desto höher die mögliche Kurzschlussenergie und desto gefährlicher ein Fehler – Stossspannungen aus dem Netz sind dort am grössten. Das Gerät muss für die Kategorie des Messorts ausgelegt sein.</p>' +

  /* ================= Aufgaben 4–5 ================= */
  var mixL = { parts: [gen({ offset: 3 }, 5), R('R1', 1000, 440, 300, 90)], wires: [W('G1.p', 'R1.a'), W('R1.b', 'G1.n')] };
  var rmsSine = 5 / Math.SQRT2, rmsSq = 5;
  defTask({
    id: '16.4', ch: 16, title: 'Wechselgrösse mit Gleichanteil', tags: ['messen.trms', 'elektro.mittelwert', 'elektro.effektivwert'], measureUX: DRAG, rangeUX: 'manual',
    story: 'Aus einem Sensorverstärker kommt ein Sinus, der auf einem Gleichanteil reitet. Welches Gerät zeigt hier was?',
    brief: 'Der Generator liefert Û = 5 V mit <b>3 V Gleichanteil</b>. Miss an R1 mit <b>V⎓</b> (zeigt den Gleichanteil), <b>V~ AVG</b> und <b>V~ TRMS</b> (Wechselanteil) und lies am Oszilloskop den <b>höchsten Wert</b> ab. Berechne den <b>gesamten Effektivwert</b> √(U<sub>DC</sub>² + U<sub>AC</sub>²) – das zeigt nur ein TRMS-Gerät mit AC+DC-Kopplung. Stell danach auf <b>Rechteck</b> um und miss den TRMS-Wechselanteil erneut.',

    hint2: 'Höchster Wert = 3 V + 5 V = 8 V. U_ges = √(3² + 3,54²) V = 4,64 V. Rechteck TRMS = 5 V (Û).',

    tests: [{ name: 'Anlage', expect: [{ a: 'R1.a', b: 'R1.b', ac: 'dc', range: [2.9, 3.1] }, { noFault: true }] }],

  var lp = { parts: [gen(), R('R1', 10000, 320, 200, 0), { id: 'C1', type: 'capacitor', value: 100e-9, x: 480, y: 300, rot: 90 }], wires: [W('G1.p', 'R1.a'), W('R1.b', 'C1.a'), W('C1.b', 'G1.n')] };
  var F = function (id, f) { return { id: id, ask: 'U_a TRMS bei ' + (f >= 1000 ? f / 1000 + ' kHz' : f + ' Hz'), unit: 'V', mode: 'VAC', meterType: 'trms', a: 'C1.a', b: 'C1.b', tol: 0.05, set: { G1: { freq: f } } }; };
  defTask({
    id: '16.5', ch: 16, title: 'Frequenz erhöhen', tags: ['elektro.frequenz', 'elektro.filter', 'messen.oszilloskop'], measureUX: DRAG, rangeUX: 'manual',
    story: 'Wie weit kannst du die Frequenz drehen, bis die Geräte nichts Sinnvolles mehr zeigen?',
    brief: 'Am RC-Glied (R1 = 10 kΩ, C1 = 100 nF, f<sub>g</sub> ≈ 159 Hz) miss die Ausgangsspannung an C1 mit <b>V~ TRMS</b> bei <b>50 Hz, 159 Hz, 1 kHz und 10 kHz</b> (Frequenz am Generator umstellen). Lies bei 1 kHz zusätzlich den <b>Scheitelwert</b> am Oszilloskop ab (Zeitbasis 5 ms). Was zeigt <b>V⎓</b> bei jeder Frequenz?',
    learn: 'Ein Multimeter mittelt über viele Perioden – der Gleichanteil bleibt 0, der Wechselanteil folgt dem Frequenzgang. Das Oszilloskop zeigt den Verlauf bis in den MHz-Bereich.',
    take: 'Mit steigender Frequenz sinkt U_a am Tiefpass: 50 Hz ≈ 6,7 V, f_g ≈ 5 V, 1 kHz ≈ 1,1 V, 10 kHz ≈ 0,11 V. Reale Multimeter sind meist nur bis 1 kHz (AVG) bzw. einige kHz (TRMS) spezifiziert – darüber hilft nur das Oszilloskop.',
    hint: 'Frequenz im Eigenschaften-Panel von G1 eintippen (z. B. 1k). Spitzen an C1.a und C1.b, Bereich 20 V; bei 10 kHz auf 2 V wechseln.',
    hint2: 'U_a = U_e / √(1 + (f/f_g)²) mit U_e = 7,07 V. Bei 10 kHz sind es rund 112 mV – im 20-V-Bereich nur noch 0,11 V, im 2-V-Bereich 0,112 V.',

    measure: [F('f50', 50), F('f159', 159), F('f1k', 1000), F('f10k', 10000),

      { id: 'dc', ask: 'V⎓ bei 1 kHz (Gleichanteil)', unit: 'V', mode: 'AC', q: 'dc', a: 'C1.a', b: 'C1.b', tol: 0.5, abs: 0.05, set: { G1: { freq: 1000 } } }]
  });

  /* ================= Theorie C – Genauigkeit vertieft ================= */
  var pMeas = { parts: [{ id: 'B1', type: 'battery', value: 12, x: 160, y: 300 }, { id: 'A1', type: 'ammeter', x: 320, y: 200 }, R('R1', 1000, 480, 300, 90)], wires: [W('B1.p', 'A1.a'), W('A1.b', 'R1.a'), W('R1.b', 'B1.n')] };
  defTheory({
    id: 'T16C', ch: 16, title: 'Genauigkeit vertieft', tags: ['messen.genauigkeit', 'messen.systemfehler'],
    merksatz: 'Analog: Fehler = Klasse · Endwert (oben ablesen!); digital: Prozent vom Anzeigewert plus Digit, deshalb kleinsten passenden Bereich wählen; Eigenverbrauch der Geräte ist ein Systemfehler.',
    visual: [
      { type: 'numberSteps', caption: 'Rechenweg für analoge und digitale Genauigkeit – Schritt für Schritt.', steps: [
        { text: 'Analog: Klasse 0,5, Skalenendwert 20 V, Zeiger bei 15 V. Der Fehler bezieht sich auf den Endwert.', rows: [{ label: 'Endwert', cells: ['20', 'V'] }, { label: 'Klasse', cells: ['0,5', '%'] }] },
        { text: 'Fehler = 20 V · 0,5 / 100 = ±0,1 V – gleich gross, egal wo der Zeiger steht.', rows: [{ label: 'Fehler', cells: ['±0,1', 'V'], hl: [0] }, { label: 'Bereich', cells: ['14,9', '…', '15,1', 'V'] }] },

        { text: 'Zweiter Anteil: 1 Digit = eine Stelle der letzten Anzeigeziffer, hier 0,1 V.', rows: [{ label: '1 Digit', cells: ['0,1', 'V'], hl: [0] }] },
        { text: 'Beide Anteile addieren: ±0,175 V. Der wahre Wert liegt zwischen 14,825 V und 15,175 V.', rows: [{ label: 'Fehler gesamt', cells: ['±0,175', 'V'], hl: [0] }, { label: 'Bereich', cells: ['14,825', '…', '15,175', 'V'] }] }
      ] },
      { type: 'worked', caption: 'Drei Musterbeispiele: Das erste ist vollständig vorgerechnet, im zweiten rechnest du einen Schritt selbst, im dritten zwei. Komma oder Punkt, Toleranz 2 %.', examples: [
        { title: 'Analog, Klasse', given: [{ label: 'Instrument', value: 'Klasse 1,5' }, { label: 'Endwert', value: '300 V' }, { label: 'Zeiger', value: '230 V' }],

            { text: 'Der Klassenfehler bezieht sich auf den <b>Endwert</b>, nicht auf den Zeigerstand.', label: 'absoluter Fehler', expr: '1,5 % · 300 V', value: 4.5, digits: 1, unit: 'V' },
            { text: 'Wie viel ist das vom abgelesenen Wert? Absoluten Fehler durch den Anzeigewert teilen.', label: 'relativer Fehler', expr: '4,5 V / 230 V', value: 1.96, unit: '%' },
            { text: 'Unteres und oberes Ende des Bereichs, in dem der wahre Wert liegt.', label: 'Bereich', expr: '230 V ∓ 4,5 V', value: 225.5, digits: 1, unit: 'V … 234,5 V' }
          ] },
        { title: 'Digital, % + Digit', given: [{ label: 'Anzeige', value: '12,50 V' }, { label: 'Angabe', value: '±(0,8 % + 2 Digit)' }, { label: 'Bereich', value: '20 V (Auflösung 0,01 V)' }],
          result: 'Gesamtfehler ±0,12 V, das sind 0,96 % vom Anzeigewert.',
          steps: [
            { text: 'Erster Anteil: Prozent <b>vom Anzeigewert</b>.', label: 'Prozentanteil', expr: '0,8 % · 12,50 V', value: 0.1, unit: 'V' },
            { text: 'Zweiter Anteil: 2 Digit. Ein Digit ist der Wert der letzten Anzeigestelle – hier 0,01 V.', label: 'Digitanteil', expr: '2 · 0,01 V', value: 0.02, unit: 'V' },
            { text: 'Jetzt du: Beide Anteile addieren.', label: 'Fehler gesamt', expr: '0,1 V + 0,02 V', value: 0.12, unit: 'V', input: true, help: 'Prozentanteil und Digitanteil zusammenzählen.', solution: 'beide Anteile addiert' }
          ] },
        { title: 'Systemfehler, stromrichtig', given: [{ label: 'Verbraucher', value: 'R = 10 Ω, I = 1 A' }, { label: 'Amperemeter-Shunt', value: '0,1 Ω' }, { label: 'Voltmeter', value: 'über Verbraucher UND Amperemeter' }],

          ] }
      ] },
      { type: 'circuit', view: 'bench', caption: 'Werkstatt-Aufbau zum Systemfehler: Das Amperemeter A1 liegt in Reihe; wird die Spannung parallel zu R1 gemessen, fliesst der Voltmeterstrom zusätzlich durch A1. Zieh an R1 – je grösser R1, desto grösser der Anteil des Voltmeterstroms (10 MΩ).',
        layout: pMeas, bench: { parts: [{ id: 'B1', x: 240, y: 470 }, { id: 'A1', x: 480, y: 280 }, { id: 'R1', x: 720, y: 460, rot: 90 }] },

        readouts: [{ label: 'A1 (Strom durch R1 + Voltmeter)', sel: 'A1', q: 'i' }, { label: 'Strom durch R1 allein', sel: 'R1', q: 'i' }, { label: 'U an R1 (Voltmeter parallel)', a: 'R1.a', b: 'R1.b' }] }
    ],
    lesson:
      '<p>Jede Messung hat einen Fehler. In Theorie 4B hast du die Arten kennengelernt – hier rechnen wir sie <b>genau</b> aus, so wie es Datenblätter verlangen.</p>' +
      '<p><b>Analoge Geräte</b> geben eine <b>Genauigkeitsklasse</b> in Prozent an. Sie bezieht sich auf den <b>Skalenendwert</b>, nicht auf den Anzeigewert:</p>' +
      '<div class="formula">Fehler = Klasse (%) · Endwert / 100</div>' +
      '<p>Beispiel: Klasse 0,5, Endwert 20 V → ±0,1 V. Bei 15 V Anzeige sind das 0,67 %, bei 2 V Anzeige aber schon 5 %! Darum den Messbereich so wählen, dass der Zeiger <b>im oberen Drittel</b> steht.</p>' +
      '{{visual}}' +
      '<p><b>Digitale Geräte</b> haben zwei Fehleranteile: einen Anteil in Prozent <b>vom Anzeigewert</b> und den <b>Digit-Fehler</b> – die letzte Stelle kann um eins daneben liegen, weil das Gerät runden muss:</p>' +
      '<div class="formula">Fehler = Anzeige · p / 100 + n · (Wert der letzten Stelle)</div>' +
      '<p>Beispiel: 15,0 V bei ±(0,5 % + 1 Digit) → 0,075 V + 0,1 V = <b>±0,175 V</b>. Der Digit-Fehler hängt vom <b>Messbereich</b> ab: im 20-V-Bereich (Anzeige 15,00 V) ist 1 Digit nur 0,01 V, im 600-V-Bereich (Anzeige 15,0 V) 0,1 V. Auch beim Digitalgerät lohnt sich also der <b>kleinste passende Bereich</b> – genau das übst du mit der Bereichswahl auf der Werkbank. Zu klein gewählt zeigt das Gerät <b>OL</b>.</p>' +
      '<p><b>Systemfehler durch Eigenverbrauch.</b> Das Voltmeter hat einen Innenwiderstand (unser Multimeter 10 MΩ), das Amperemeter einen Shunt (0,1 Ω). Soll die <b>Leistung</b> P = U·I an einem Verbraucher bestimmt werden, liegen beide gleichzeitig in der Schaltung:</p>' +
      '<ul><li><b>Spannungsrichtig</b> (Voltmeter direkt am Verbraucher, Amperemeter davor): U stimmt, aber das Amperemeter misst den Voltmeterstrom U/10 MΩ mit. Bei 12 V sind das 1,2 µA – bei einem 1-kΩ-Verbraucher (12 mA) egal, bei 10 MΩ (1,2 µA) ein Fehler von 100 %.</li>' +
      '<li><b>Stromrichtig</b> (Amperemeter direkt am Verbraucher, Voltmeter über beide): I stimmt, aber das Voltmeter misst den Spannungsabfall am Shunt mit (I · 0,1 Ω). Bei 1 A sind das 0,1 V – bei 10 Ω Verbraucher 1 % Fehler.</li></ul>' +
      '<p>Faustregel: <b>kleine Widerstände spannungsrichtig, grosse Widerstände stromrichtig</b> messen – oder den Eigenverbrauch herausrechnen.</p>' +
      '<h3>Rechne mit</h3><p>Drei Beispiele in steigender Selbstständigkeit: Zuerst schaust du zu, dann rechnest du einen Schritt, dann zwei. Das Rechenfeld akzeptiert Komma oder Punkt; der Taschenrechner in der Kopfzeile hilft.</p>' +
      '{{visual:2}}' +
      '<p><b>Grenzfall unten an der Skala.</b> Der absolute Klassenfehler bleibt über die ganze Skala gleich – am unteren Skalenende wird er deshalb relativ riesig: Ein Amperemeter der Klasse 2,5 mit Endwert 100 mA hat immer ±2,5 mA Fehler. Zeigt es 4 mA, sind das ±62,5 % – der Messwert ist praktisch wertlos. Bei 80 mA sind es nur ±3,1 %. Darum: Messbereich wechseln, sobald der Zeiger im unteren Drittel steht.</p>' +
      '{{visual:3}}',
    questions: [
      { q: 'Analoges Voltmeter, Klasse 1,5, Endwert 300 V, Zeiger bei 230 V. Grösster Fehler?', options: ['±1,15 V', '±3,45 V', '±4,5 V', '±15 V'], correct: 2, explain: '1,5 % vom Endwert 300 V = 4,5 V – unabhängig vom Anzeigewert.' },
      { q: 'Digitales Voltmeter, Anzeige 230,0 V, ±(0,5 % + 1 Digit). Grösster Fehler?', options: ['±1,15 V', '±1,25 V', '±2,3 V', '±0,1 V'], correct: 1, explain: '0,5 % von 230 V = 1,15 V, dazu 1 Digit = 0,1 V → 1,25 V.' },
      { q: 'Warum soll der Zeiger eines analogen Instruments im oberen Drittel stehen?', options: ['Weil die Skala dort feiner ist', 'Weil der Klassenfehler absolut gleich bleibt und relativ kleiner wird', 'Weil das Messwerk sonst zu warm wird', 'Weil unten der Gleichrichter nicht arbeitet'], correct: 1, explain: '±0,1 V sind bei 15 V nur 0,67 %, bei 2 V aber 5 %.' },
      { q: 'Welche Rolle spielt der Messbereich beim Digit-Fehler?', options: ['Keine', 'Im kleineren Bereich ist 1 Digit weniger wert – der Fehler sinkt', 'Im kleineren Bereich ist der Fehler grösser', 'Der Digit-Fehler gilt nur bei AUTO'], correct: 1, explain: '20-V-Bereich: 1 Digit = 0,01 V; 600-V-Bereich: 1 Digit = 0,1 V.' },
      { q: 'Analoges Amperemeter, Klasse 2,5, Endwert 100 mA, Zeiger bei 4 mA. Wie gross ist der relative Fehler der Ablesung?', options: ['±2,5 %', '±6,25 %', '±62,5 %', '±0,1 %'], correct: 2, explain: 'Absoluter Fehler 2,5 % · 100 mA = ±2,5 mA, bezogen auf 4 mA sind das ±62,5 %. Am unteren Skalenende ist ein analoges Instrument fast unbrauchbar – Bereich wechseln.' },
      { q: 'Spannungsrichtige Leistungsmessung an 10 MΩ mit einem 10-MΩ-Voltmeter: Was misst das Amperemeter?', options: ['Nur den Verbraucherstrom', 'Den doppelten Verbraucherstrom (Voltmeterstrom kommt dazu)', 'Nichts', 'Den Strom des Shunts'], correct: 1, explain: 'Voltmeter und Verbraucher sind gleich gross – beide Ströme sind gleich, das Amperemeter zeigt das Doppelte.' }
    ]
  });

  /* ================= Aufgaben 6–8 ================= */
  var half = { parts: [gen(), d('V1', 280, 200, 0), R('R1', 1000, 460, 300, 90)], wires: [W('G1.p', 'V1.a'), W('V1.k', 'R1.a'), W('R1.b', 'G1.n')] };

      { id: 'avg', ask: 'Wechselanteil AVG-Gerät (V~ AVG)', unit: 'V', mode: 'VAC', meterType: 'avg', a: 'R1.a', b: 'R1.b', tol: 0.04 },
      { id: 'rms', ask: 'Wechselanteil TRMS-Gerät (V~ TRMS)', unit: 'V', mode: 'VAC', meterType: 'trms', a: 'R1.a', b: 'R1.b', tol: 0.04 },
      { id: 'pk', ask: 'Scheitelwert (Oszilloskop)', unit: 'V', mode: 'AC', q: 'peak', a: 'R1.a', b: 'R1.b', tol: 0.03 },

  });

/* Handbuch – Seiten {id, title, html}. Wird mit den Themen erweitert. */
(function (root) {
  'use strict';
  root.DQ.manual = [
    { id: 'bedienung', title: 'Bedienung', html:
      '<p><b>Bauteil hinzufügen:</b> Klick in der Palette. <b>Verschieben:</b> ziehen. <b>Drehen:</b> <kbd>R</kbd>. <b>Löschen:</b> <kbd>Entf</kbd>.</p>' +
      '<p><b>Leitung ziehen:</b> Anschluss anklicken, dann den Ziel-Anschluss. Leitung anklicken und <kbd>Entf</kbd> entfernt sie.</p>' +
      '<p><b>Schalter</b> schaltest du per Klick, <b>Taster</b> sind nur gedrückt, solange du sie hältst.</p>' +
      '<p>Die Schaltung wird <b>laufend simuliert</b>. „U anzeigen“ färbt alle Knoten nach ihrer Spannung (blau = 0 V, rot = höchste Spannung). Fährst du über ein Bauteil, siehst du U, I und P.</p>' +
      '<p><b>Messen auf der Werkbank:</b> Messspitzen (rot = +, schwarz = COM) und den Tastkopf des Oszilloskops mit der Maus an die Buchsen <b>ziehen</b>; daneben loslassen legt sie zurück. Im Schaltplan setzt ein Klick die Spitze. In den Messtechnik-Aufgaben (Kapitel 16) wählst du zusätzlich den <b>Messbereich</b> am Gerät – zu klein zeigt OL. Jede Messaufgabe hat oben die Box „So stellst du das Gerät ein“. Zoom auf der Werkbank: <kbd>Strg</kbd> + Mausrad, Verschieben durch Ziehen auf der leeren Tischfläche; das Mausrad allein scrollt die Seite.</p>' +
      '<p><b>Schaltplan oder Werkbank:</b> Der Knopf „Werkbank“ / „Schaltplan“ wechselt die Darstellung. Es ist dieselbe Schaltung – auf der Werkbank stecken die Bauteile auf Steckbausteinen und werden mit Laborkabeln verbunden. Bauen, Messen und Prüfen funktionieren in beiden Ansichten gleich. Auf der Werkbank zoomst du mit dem Mausrad (Handy: zwei Finger) und verschiebst den Tisch, indem du auf einer freien Stelle ziehst; „Einpassen“ zeigt wieder alles.</p>' +
      '<p><b>Zeitlupe:</b> zeigt Schritt für Schritt, wie die Simulation zum Ergebnis kommt – welche LED leitend wird, welches Gatter umschaltet, wie sich ein Kondensator über die Zeit lädt. Mit dem Schieberegler oder den Pfeiltasten blättern, „Live“ kehrt zurück.</p>' +
      '<p><b>Strom zeigen</b> („⇢ Strom“ in der Werkzeugleiste): Punkte wandern entlang der Leitungen in <b>technischer Stromrichtung</b> (von + nach −) – je schneller, desto mehr Strom. An jedem Kabel steht der Stromwert. So siehst du, wo sich der Strom aufteilt und wo gar keiner fliesst.</p>' +
      '<p><b>Freie Werkbank:</b> auf der Karte. Bauen und messen ohne Auftrag, mit allen bisher freigeschalteten Bauteilen.</p>' +
      '<p><b>Limits:</b> Manche Aufgaben erlauben nur eine bestimmte Anzahl Gatter („Erlaubt: höchstens 3 Logikgatter“). Die Prüfung zählt mit.</p>' },
    { id: 'konto', title: 'Konto, Portal und Vorgaben', html:
      '<p>Ein <b>Konto ist freiwillig</b>. Ohne Konto spielst du ganz normal, der Fortschritt bleibt auf diesem Gerät (auch offline). Angemeldet wird im <b>Portal</b> (Startseite): mit Benutzername und Passwort oder – beim ersten Mal – mit dem <b>Klassencode</b> deiner Lehrperson. Oben rechts im Labor zeigt der <b>Konto-Knopf</b>, wer angemeldet ist; ein Klick führt ins Portal.</p>' +
      '<p>Mit Konto wird dein Spielstand im Konto gespeichert und ist auf jedem Gerät da. Warst du auf einem anderen Gerät schon weiter, gilt der weitere Stand. An einem geteilten PC werden die Stände verschiedener Konten nie gemischt. Verwende ein <b>Pseudonym</b> – dein echter Name bleibt auf dem Gerät.</p>' +
      '<p>Oben auf der Karte stehen die <b>Vorgaben vom Dozent</b>, mit Frist; ist die Frist vorbei und noch etwas offen, wird sie rot. Gesperrt wird nichts – vorgegebene Stationen sind immer offen.</p>' +
      '<p><b>Sterne:</b> Jede gelöste Aufgabe gibt 1 bis 3 Sterne – 3 ohne Fehlversuch und ohne Tipp, 2 mit höchstens zwei Fehlversuchen und einem Tipp, 1 sobald du einen Sollwert aufgedeckt oder die Lösung angesehen hast. Wer eine Aufgabe nochmals sauber löst, verbessert seine Sterne.</p>' +
      '<p><b>Messwerte einzeln:</b> Im Messprotokoll wird jeder Wert für sich geprüft (✓ richtig, ✗ falsch, ○ offen). Richtige Werte bleiben stehen. Nach zwei falschen Eingaben an einem Wert kannst du seinen <b>Sollwert aufdecken</b> (mit Rechenweg) – er zählt dann als erledigt. Die Aufgabe ist gelöst, sobald die Schaltung alle Tests besteht und jeder Wert richtig oder aufgedeckt ist.</p>' +
      '<p><b>Vorführen:</b> In Messaufgaben zeigt der Knopf „Vorführen“ auf der Werkbank an einem Beispiel, wie gemessen wird: Messart und Bereich, die Spitzen gleiten zu den Buchsen, Anzeige, dann der Rechenweg Schritt für Schritt – mit Tempo, Pause, Einzelschritt und Abbrechen. Dein Aufbau bleibt unverändert; die Vorführung zählt wie ein Tipp. In Prüfung und Live-Challenge gibt es sie nicht.</p>' +
      '<p><b>Lösung ansehen:</b> Nach zwei gescheiterten Prüfungen erscheint der Knopf „Lösung ansehen“: Referenzschaltung, alle Sollwerte und der Rechenweg. Ansehen schaltet nichts frei – bauen und messen musst du selbst; die Station zählt dann mit höchstens 1 Stern. In Prüfung und Live-Challenge gibt es keine Lösung.</p>' +
      '<p><b>Für Lehrpersonen:</b> Das Dozenten-Konto legt der Admin an. Im Portal unter <b>Leitstand</b>: Klassen anlegen, Klassencode weitergeben oder Konten erzeugen (Zugangszettel drucken), Passwörter zurücksetzen, Fortschritt und Schaltungen der Lernenden ansehen und <b>Vorgaben</b> machen. Wer mit einem Dozenten-Konto angemeldet ist, hat im Labor automatisch den <b>Dozentenmodus</b>: alle Stationen offen, Sprungliste auf der Karte, Freie Werkbank mit allen Bauteilen.</p>' },
    { id: 'live', title: 'Live-Challenge', html:
      '<p>Die Lehrperson startet im Portal eine <b>Live-Challenge</b> und zeigt den vierstelligen Code am Beamer. Du trittst im Portal unter <b>Live-Challenge</b> bei; die Aufgabe erscheint bei allen gleichzeitig, sobald die Lehrperson startet.</p>' +
      '<ul><li><b>Sprint:</b> alle lösen dieselbe Aufgabe vom Startaufbau aus.</li><li><b>Störungsjagd:</b> auf dem Tisch liegt ein fehlerhafter Aufbau. Finde die Ursache – mit Messgerät, Strom-Anzeige und Zeitlupe – und behebe sie.</li></ul>' +
      '<p>Punkte gibt es fürs Lösen; schnelle Lösungen bekommen mehr, jeder Fehlversuch und jeder Tipp kostet etwas. Die Challenge verändert deinen Spielstand nicht.</p>' },
    { id: 'pruefung', title: 'Prüfung und Zertifikat', html:
      '<p>Im Portal unter <b>Zertifikate</b> legst du eine echte <b>Prüfung</b> ab: <b>Grundstufe</b> (Kapitel 1–10) und <b>Profi-Stufe</b> (Kapitel 11–15). Voraussetzung: mindestens 80 % der Aufgaben der Stufe gelöst und die Boss-Aufgabe bestanden – oder die Lehrperson öffnet eine <b>Prüfung unter Aufsicht</b> und nennt dir den Code.</p>' +
      '<p>Die Prüfung besteht aus Schaltungsaufgaben (70 %) und Theoriefragen (30 %). Die Aufgaben sind neu und für jede Person anders. Die Zeit läuft auf dem Server. Mit <b>Testen</b> prüfst du die sichtbaren Tests im Browser, mit <b>Abgeben</b> bewertet der Server Schaltung und Messwerte – auch mit verdeckten Tests. Du darfst mehrfach abgeben, es zählt die letzte Abgabe. Tipps gibt es keine; Handbuch, Datenblätter und Messgeräte sind erlaubt.</p>' +
      '<p>Bestanden ist ab 70 %, ab 90 % mit Auszeichnung. Danach stellst du das <b>Zertifikat</b> aus: mit deinem Namen, Prüfcode und QR-Code. Unter der Adresse auf dem Zertifikat kann jede Person die Echtheit prüfen. Du kannst das Zertifikat jederzeit zurückziehen – dann wird der Name gelöscht.</p>' },
    { id: 'karte', title: 'Karte und Abzeichen', html:
      '<p>Die Karte ist in <b>vier Teile</b> gegliedert: <b>I</b> Elektrotechnische Grundlagen (Kapitel 1–4), <b>II</b> Digitaltechnik Grundlagen (5–8), <b>III</b> Kombinatorik und Anzeigen (9–10) – zusammen die <b>Grundstufe</b> – und <b>IV</b> Zeitverhalten und Praxis (11–15), die <b>Profi-Stufe</b>. Dazu <b>Teil V – Vertiefung Messtechnik</b> (Kapitel 16): eine Ergänzung zu Teil I, offen sobald Kapitel 4 abgeschlossen ist; sie zählt nicht zu Abzeichen oder Zertifikat. Dort ziehst du die Messspitzen auf der Werkbank selbst, schliesst den Tastkopf des Oszilloskops an und wählst den Messbereich von Hand (siehe „Multimeter“ und „Oszilloskop“).</p>' +
      '<p>Jede Kachel zeigt ein <b>Symbol zum Inhalt</b> – das prägende Bauteil oder ein Bild zum Thema –, darunter Nummer und Titel und unten die Sterne bzw. den Zustand. Die Kachel mit „hier weiter“ ist deine nächste Station. Theorien bestehst du ab 80 % richtigen Antworten, Aufgaben mit „Prüfen“. Rot umrandet sind die <b>Boss-Aufgaben</b>.</p>' +
      '<p><b>Abzeichen Grundstufe:</b> nach der Boss-Aufgabe 10.10 „Das Codeschloss“. <b>Abzeichen Profi-Stufe:</b> nach der Boss-Aufgabe 15.10 „Die Antriebsstation“. Beide erscheinen auf der Karte am Ende ihres Teils; mit „Anzeigen“ trägst du deinen Namen ein und kannst sie drucken (A4 quer). Das geprüfte <b>Zertifikat</b> gibt es im Portal – siehe „Prüfung und Zertifikat“.</p>' },
    { id: 'multimeter', title: 'Multimeter', html:
      '<p>Wähle einen Messbereich (V, A, Ω). Danach setzen Klicks auf Anschlüsse die Messspitzen: zuerst <b style="color:#ff6b61">rot (+)</b>, dann <b>schwarz (COM)</b>.</p>' +
      '<p>Auf der Werkbank steht dasselbe Gerät: Drehschalter anklicken, die Messkabel führen zu den Prüfspitzen.</p>' +
      '<ul><li><b>V⎓</b> – Gleichspannung, parallel zum Bauteil. Innenwiderstand 10 MΩ. Bei schneller Wechselspannung zeigt das Gerät den Mittelwert (beim Sinus 0 V).</li>' +
      '<li><b>V~</b> – Wechselspannung (nur der Wechselanteil). Zwei Messverfahren: <b>Mittelwert (AVG)</b> misst den Gleichrichtwert und rechnet ihn auf den Sinus-Effektivwert um – bei Rechteck oder Dreieck zeigt es falsch. <b>Echt-Effektivwert (TRMS)</b> stimmt für jede Kurvenform.</li><li><b>A</b> – in Reihe: Leitung lösen, Spitzen in die Lücke. Innenwiderstand 0,1 Ω, Sicherung 10 A.</li><li><b>Ω</b> – nur spannungsfrei. „0L“ = Unterbrechung.</li></ul>' +
      '<p>Wie ein echtes Gerät zeigt es 4 Stellen mit automatischer Bereichswahl, hat eine kleine Messabweichung (+0,2 %) und die letzte Stelle kann um 1 Digit schwanken.</p>' +
      '<p><b>Neue Bedienung in der Vertiefung Messtechnik (Kapitel 16):</b> Auf der Werkbank liegen die Messspitzen vor dem Gerät. Du <b>ziehst</b> sie mit der Maus (oder dem Finger) an die Buchse – loslassen daneben legt sie zurück. Ein Klick auf eine Buchse verbindet dort immer Leitungen. Unter dem Drehschalter wählst du den <b>Messbereich</b> von Hand (AUTO oder z. B. 200mV, 2V, 20V …): Ist der Messwert grösser als der Bereich, zeigt das Gerät <b>OL</b>; ein zu grosser Bereich verschenkt Stellen. Das LCD zeigt „MAN 20V“ statt AUTO. Ausgeschaltet bleiben die Spitzen stecken.</p>' },
    { id: 'oszi', title: 'Oszilloskop', html:

    { id: 'bauteile', title: 'Bauteile', html:

  var current = { screen: 'map' };
  /* ---------- Zurueck-Navigation: jeder Bildschirm hat eine Adresse (#/karte, #/aufgabe/1.1, #/theorie/T1A …), damit die

  var ROUTE = { map: 'karte', task: 'aufgabe', theory: 'theorie', manual: 'handbuch', tutorial: 'tutorial', settings: 'einstellungen', award: 'auszeichnung' };
  var routing = { silent: false };
  function hashFor(name) {

    return '#/' + (ROUTE[name] || name) + (id ? '/' + id : '');
  }
  function syncHash(name) {
    if (routing.silent || current.exam || current.live || !ROUTE[name]) return;

    try { history.pushState({ dq: name }, '', h); } catch (e) { location.hash = h; }
  }
  function routeHash() {
    var m = /^#\/([a-z]+)(?:\/(.+))?$/.exec(location.hash || ''); if (!m) return false;

  /* Pruefung: Auftrag, Messprotokoll, „Testen“ (sichtbare Tests im Browser) und „Abgeben“ (Bewertung auf dem Server). Keine Tipps. */

  /* ================= Bauteil-Datenblatt =================

  function sheetHtml(type, p, opt) {

    return '<div class="ds-head"><div><span class="ds-kind">Datenblatt</span><h3>' + esc(d.label) + '</h3>' +
      (p ? '<span class="dim small mono">' + esc(p.id) + (vt ? ' · ' + esc(vt) : '') + '</span>' : '<span class="dim small">Kurzzeichen ' + esc(d.prefix) + '</span>') + '</div>' +
      (opt && opt.close ? '<button class="ds-x" aria-label="Schliessen" title="Schliessen">×</button>' : '') + '</div>' +

      '<figure>' + Bench.icon(type, props, p ? p.value : undefined) + '<figcaption>Werkbank</figcaption></figure></div>' +
      '<p class="ds-fn">' + d.funktion + '</p>' +
      (d.pins.length ? '<h4>Anschlüsse</h4><table class="ds-t">' + d.pins.map(function (x) { return '<tr><th class="mono">' + esc(x.pin) + '</th><td>' + x.text + '</td></tr>'; }).join('') + '</table>' : '') +
      (d.grenzen.length ? '<h4>Grenzen</h4><table class="ds-t ds-lim">' + rows(d.grenzen, true) + '</table>' : '') +
      (d.kennwerte.length ? '<h4>Kennwerte</h4><table class="ds-t">' + rows(d.kennwerte) + '</table>' : '') +
      (d.formel ? '<div class="formula ds-f">' + d.formel + '</div>' : '');
  }
  var sheet = { timer: 0, hideTimer: 0, key: null, pinned: false, hover: null };
  function sheetEl() {

  /* anchor: DOMRect, neben dem das Blatt erscheint; opt.pinned: bleibt offen bis Schliessen/Klick daneben */
  function showSheet(type, p, anchor, opt) {
    opt = opt || {};

      el.innerHTML = sheetHtml(type, p, { close: true });

      log('datasheet', { type: type, from: opt.from || '' });
    }
    sheet.key = key; sheet.pinned = !!opt.pinned; el.hidden = false; el.dataset.type = type;
    var vw = innerWidth, vh = innerHeight, w = el.offsetWidth, h = el.offsetHeight, m = 10;
    if (vw < 700) { el.style.left = ''; el.style.top = ''; el.classList.add('sheet-bottom'); return; } // Handy: als Blatt von unten
    el.classList.remove('sheet-bottom');
    var left = anchor.right + m; if (left + w > vw - m) left = anchor.left - w - m; if (left < m) left = Math.max(m, Math.min(vw - w - m, anchor.left));
    var top = Math.max(m, Math.min(vh - h - m, anchor.top + anchor.height / 2 - h / 2));
    el.style.left = left + 'px'; el.style.top = top + 'px';
  }
  /* Platziertes Bauteil: Maus verweilt ~0,7 s auf demselben Bauteil (ohne Taste, ohne Ziehen) → Datenblatt neben dem Bauteil */
  function bindSheetHover(svg) {
    svg.addEventListener('pointermove', function (ev) {
      if (ev.pointerType !== 'mouse') return;
      var g = ev.buttons ? null : ev.target.closest && ev.target.closest('[data-part]'), id = g ? g.getAttribute('data-part') : null;
      if (id === sheet.hover) return;
      sheet.hover = id;

      sheetSoon(function () {
        var p = ed && ed.part(id), el = svg.querySelector('[data-part="' + id + '"]');

    svg.addEventListener('pointerdown', function () { sheet.hover = null; hideSheet(true); });
  }

  function answers() { var a = {}; $$('[data-ans]').forEach(function (i) { a[i.dataset.ans] = i.value; }); return a; }
  function persistDraft() {
    if (!current.task || !ed || current.live) return;

    var d = S.drafts[current.task.id] || {}; d.layout = ed.layout; d.answers = answers(); d.t = Date.now(); S.drafts[current.task.id] = d; save();
  }
  /* Teilwertung und Lösung: Zustand je Aufgabe im Entwurf – meas[id] = {ok, tries, revealed}, fails (gescheiterte Prüfungen), sol (Lösung angesehen) */
  function draftOf(t) { var d = S.drafts[t.id] || (S.drafts[t.id] = { layout: ed ? ed.layout : t.start, answers: {}, t: Date.now() }); d.meas = d.meas || {}; return d; }

  function rebuild() {
    closeReplay(true);

    catch (e) { live.net = null; live.err = e.message; }
    live.dynamic = !!live.net && live.net.parts.some(function (p) { return p.type === 'capacitor' || p.type === 'clock' || p.type === 'acsource'; });
    live.hist = [];

  }
  function startLoop() {
    if (live.raf) return;

    var f = function (now) {
      var dt = Math.min(0.05, (now - live.last) / 1000); live.last = now;
      tick(dt); live.raf = requestAnimationFrame(f);
    };
    live.raf = requestAnimationFrame(f);
  }
  function stopLoop() { if (live.raf) cancelAnimationFrame(live.raf); live.raf = 0; }

  function meterNodes() {
    if (!live.net || !meter.a || !meter.b) return null;
    var a = live.net.pinNode[meter.a], b = live.net.pinNode[meter.b];

  }
  function tick(dt, withTrace) {

    var mn = meterNodes(), mm = meter.mode === 'VAC' ? 'V' : meter.mode, mopt = mn && (mm === 'V' || mm === 'A') ? { mode: mm, a: mn.a, b: mn.b } : null;

    }
    var r = E.step(live.net, live.state, { dt: live.dynamic && dt > 0 ? dt : null, meter: mopt });
    live.res = r;
    if (live.dynamic) { live.hist.push(r); if (live.hist.length > HIST_MAX) live.hist.shift(); }
    updateMeter(r, mn);

    status(diagnose(r.faults, r));
  }

  function setSim(sim) { ed.setSim(sim); bench.setSim(sim); }
  function view() { return viewMode === 'bench' ? bench : ed; }
  /* Darstellung wechseln – Schaltung, Auswahl und Messspitzen bleiben (gemeinsamer Kern). temp: Wahl nicht speichern (Sandbox) */
  function setView(mode, temp) {

    var b = $('#btnView'); if (b) { b.textContent = viewMode === 'bench' ? '⊞ Schaltplan' : '▣ Werkbank'; b.title = viewMode === 'bench' ? 'Zur Schaltplan-Ansicht wechseln' : 'Zur Werkbank-Ansicht wechseln'; }

  /* ---------- Zeitlupe ----------
   * Statische Schaltung: Rechenschritte des Arbeitspunkts (Dioden schalten, Gatter werden einzeln nachgefuehrt).
   * Schaltung mit Kondensator/Takt/Wechselquelle: die letzten Zeitschritte (Backward Euler). */
  function replaySteps() {
    if (live.dynamic) return live.hist.map(function (r) {
      var caps = live.net.parts.filter(function (p) { return p.type === 'capacitor'; }).map(function (p) { return 'U(' + p.id + ') = ' + E.fmt(r.parts[p.id].v, 'V'); });
      return { res: r, label: 't = ' + E.fmt(r.t, 's') + (caps.length ? ' · ' + caps.join(' · ') : '') };
    });
    var tr = live.trace || [];
    return tr.map(function (x, i) {
      var what = x.kind === 'done' ? 'Ruhelage erreicht – so bleibt die Schaltung.' : x.kind === 'unstable' ? 'Keine Ruhelage – die Gatter schalten sich immer wieder um.' :
        'Knotenspannungen berechnet → ' + x.changed.map(function (c) {
          if (typeof c.to === 'string') return c.id + ' ' + ({ on: 'leitet (aktiver Bereich)', sat: 'geht in Sättigung', off: 'sperrt', f: 'leitet', z: 'bricht durch (Z-Betrieb)' }[c.to] || c.to);
          if (Array.isArray(c.to)) return c.id + ' Ausgänge ' + c.to.map(function (b) { return b ? 1 : 0; }).join('');
          return x.kind === 'diode' ? c.id + (c.to ? ' wird leitend' : ' sperrt') : c.id + ' schaltet auf ' + (c.to ? '1' : '0');
        }).join(', ');

    });
  }
  function openReplay() {

    stopLoop();
    live.replay = { steps: steps, i: steps.length - 1, timer: 0 };
    $('#replay').hidden = false; $('#btnReplay').classList.add('on');
    var sl = $('#rpSlider'); sl.max = steps.length - 1; sl.value = steps.length - 1;
    showStep(live.dynamic ? steps.length - 1 : 0); // Zeitverlauf: beim Jetzt beginnen; Rechenschritte: von vorne

  }
  function showStep(i) {

  }
  function playReplay() {

    if (R.i >= R.steps.length - 1) showStep(0);
    $('#rpPlay').textContent = '⏸';
    R.timer = setInterval(function () { if (R.i >= R.steps.length - 1) { playReplay(); return; } showStep(R.i + 1); }, live.dynamic ? 60 : 700);
  }
  function closeReplay(quiet) {

    live.replay = null; $('#replay').hidden = true; $('#btnReplay').classList.remove('on'); $('#rpPlay').textContent = '▶';
    if (!quiet) { tick(0); if (live.dynamic) startLoop(); }
  }

  /* Diagnose aus den Werten des aktuellen Versuchs (Istwert, Grenzwert, Vorschlag) statt festem Text pro Stoerungscode */
  function srcVoltage() { // hoechste Quellenspannung im Aufbau (Gleich- oder Scheitelwert)
    var u = 0; (live.net ? live.net.parts : []).forEach(function (p) { if (p.type === 'battery' || p.type === 'acsource') u = Math.max(u, Math.abs(p.props.value)); }); return u;
  }
  function ohm(r) { return E.fmt(r, 'Ω').replace('.000 ', ' ').replace(/(\.\d*?)0+ /, '$1 ').replace('. ', ' '); }
  var FAULT_TEXT = {
    SHORT: function (f) {
      return 'Kurzschluss an ' + f.part + ': Die Quelle liefert ' + E.fmt(Math.abs(f.i), 'A') + ' (zulässig ' + E.fmt(f.imax, 'A') + '). Zwischen Plus und Minus liegt kein Verbraucher – ' +
        'der Strom wird nur vom Innenwiderstand begrenzt: I ≈ ' + E.fmt(f.u, 'V') + ' / ' + ohm(f.ri) + '.';
    },
    LED_BURNT: function (f) {
      if (!(f.i > 0)) return 'LED ' + f.part + ' ist durchgebrannt – Strom zu gross. Vorwiderstand prüfen, dann „Reparieren“.';
      var ub = srcVoltage(), t = 'LED ' + f.part + ' ist durchgebrannt: Es flossen ' + E.fmt(f.i, 'A') + ', erlaubt sind ' + E.fmt(f.imax, 'A') + '.';
      if (ub > f.vf) {
        var rNow = Math.max(0, (ub - f.vf) / f.i - 10), rMin = (ub - f.vf) / f.imax, rGood = (ub - f.vf) / 0.02;
        t += ' Bei ' + E.fmt(ub, 'V') + ' und U_F ≈ ' + E.fmt(f.vf, 'V') + ' braucht es mindestens R = (' + E.fmt(ub, 'V') + ' − ' + E.fmt(f.vf, 'V') + ') / ' + E.fmt(f.imax, 'A') + ' = ' + ohm(rMin) +
          ' Vorwiderstand, für 20 mA etwa ' + ohm(rGood) + '. Im Kreis waren nur rund ' + ohm(rNow) + '.';
      }

    },
    LED_REVERSE: function (f) { return 'LED ' + f.part + ' liegt mit ' + E.fmt(Math.abs(f.v), 'V') + ' in Sperrrichtung (verkraftet ca. ' + E.fmt(f.vmax, 'V') + '). Anode (+, langes Bein) gehört Richtung Pluspol.'; },
    OVERLOAD: function (f) {
      var rMin = f.v * f.v / f.pmax;
      return (live.net && live.net.byId[f.part] ? E.PARTS[live.net.byId[f.part].type].label : 'Bauteil') + ' ' + f.part + ' wird zu heiss: P = U · I = ' + E.fmt(Math.abs(f.v), 'V') + ' · ' + E.fmt(Math.abs(f.i), 'A') + ' = ' + E.fmt(Math.abs(f.p), 'W') +
        ', belastbar ist er mit ' + E.fmt(f.pmax, 'W') + '. Bei dieser Spannung braucht es mindestens ' + ohm(rMin) + ' (P = U² / R).';
    },
    LAMP_BURNT: function (f) { return f.p ? 'Lampe ' + f.part + ' ist durchgebrannt: Sie nahm ' + E.fmt(Math.abs(f.p), 'W') + ' auf bei ' + E.fmt(Math.abs(f.v), 'V') + ' – ausgelegt ist sie für ' + E.fmt(f.pnom, 'W') + '. Spannung zu hoch.' : 'Lampe ' + f.part + ' ist durchgebrannt – Überspannung.'; },
    AMMETER_OVERLOAD: function (f) { return 'Strommesser ' + f.part + ' misst ' + E.fmt(Math.abs(f.i), 'A') + ' (Grenze ' + E.fmt(f.imax, 'A') + ') – er liegt wohl parallel zur Quelle statt in Reihe.'; },
    UNSTABLE: function () {

      var ids = Object.keys(g);
      return 'Die Logikschaltung kommt nicht zur Ruhe' + (ids.length ? ': ' + ids.join(' und ') + ' schalten sich gegenseitig immer wieder um' : '') + ' (Rückkopplung ohne Ruhelage). Die Zeitlupe zeigt die einzelnen Schritte.';
    },
    NO_GROUND: function () { return 'Logikbausteine und Taktgeber brauchen eine Masse-Verbindung (⏚).'; },
    OUTPUT_CLASH: function (f) { return 'Ausgang gegen Ausgang: ' + f.parts.join(' und ') + ' treiben denselben Knoten mit unterschiedlichem Pegel (1 gegen 0). Es fliessen rund ' + E.fmt(f.i, 'A') + ' Ausgleichsstrom – die Ausgangsstufen werden heiss und gehen kaputt. Zwei Signale verknüpft man mit einem Gatter (z. B. ODER), nie durch direktes Zusammenschalten.'; }
  };
  function diagnose(faults) { return (faults || []).map(function (f) { return { cls: 'err', text: (FAULT_TEXT[f.code] || function () { return f.code; })(f) }; }); }
  function status(items) {
    var el = $('#statusbar'); if (!el) return;

      : '<div class="st ok">Schaltung läuft – keine Störung.</div>';
  }

  /* ---------- Multimeter ---------- */
  function setMeterMode(mode) {
    if (mode !== meter.mode) meter.range = 'AUTO';
    meter.mode = mode; renderRangeRow();
    $$('[data-mm]').forEach(function (b) { b.classList.toggle('on', b.dataset.mm === mode); });
    // Werkbank (Ziehen): die Spitzen bleiben stecken, auch wenn das Gerät aus ist (wie am echten Gerät); im Schaltplan (Klick) räumt OFF die Spitzen weg – sonst bleibt beim nächsten A⎓ ein Parallelzweig zur Quelle (FUSE)
    if (ed) { ed.tool = mode === 'OFF' ? 'wire' : 'probe'; if (mode === 'OFF' && !(dragUX() && viewMode === 'bench')) { ed.probes = { a: null, b: null }; meter.a = meter.b = null; meter.next = 'a'; } core.redraw(); }

      mode === 'OFF' ? 'Messgerät aus. Klick auf Anschlüsse verbindet Leitungen.' :

  }
  /* Messbereich von Hand (nur measureUX 'drag'): 'AUTO' oder Endwert aus E.DMM_MANUAL; Wechsel des Modus setzt auf AUTO */
  function rangeUnit() { return meter.mode === 'A' ? 'A' : meter.mode === 'R' ? 'Ω' : 'V'; }
  function setMeterRange(r) {

    renderRangeRow(); if (ed) tick(0);
  }

  }
  function renderRangeRow() {
    var el = $('#mmRange'), rs = rangeList(); if (!el) return;
    el.hidden = !rs;
    el.innerHTML = rs ? '<span>Bereich</span>' + rs.map(function (r) { return '<button data-rg="' + r.value + '"' + (r.on ? ' class="on"' : '') + '>' + esc(r.label) + '</button>'; }).join('') : '';
    $$('[data-rg]', el).forEach(function (b) { b.onclick = function () { setMeterRange(b.dataset.rg); }; });

  /* Kurve fuers Oszilloskop (Aufgabe und Tutorial): Abtastung ueber T Sekunden, Skala, Punkte fuer den Werkbank-Schirm */
  /* Oszilloskop-Kurve (Paket O, 05.10.2026): Abtastung mindestens 100 Punkte je Periode der schnellsten Quelle, vorher Einschwingen

  /* ---------- Oszilloskop ----------

  }

      ctx.fillStyle = '#07090a'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = 'rgba(255,176,0,0.15)'; ctx.lineWidth = 1;
      for (var i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(w * i / 10, 0); ctx.lineTo(w * i / 10, h); ctx.stroke(); }
      for (i = 1; i < 8; i++) { ctx.beginPath(); ctx.moveTo(0, h * i / 8); ctx.lineTo(w, h * i / 8); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = (12 * dpr) + 'px ' + 'monospace'; ctx.fillText(c.top + ' V', 6 * dpr, 14 * dpr); ctx.fillText(c.bot + ' V', 6 * dpr, h - 6 * dpr);

    if (location.hash && !q0.get('live') && !q0.get('exam') && !q0.get('frei') && !q0.get('werkstatt')) setTimeout(routeHash, 0);

    var qs = new URLSearchParams(location.search);
